tyle>\n*{margin:0;padding:0;box-sizing:border-box}\nbody{font-family:-apple-system,BlinkMacSystemFont,\"PingFang SC\",\"Microsoft YaHei\",sans-serif;background:#EFF2F7;color:#1F2937;font-size:14px}\n.app{display:flex;min-height:100vh}\n/* ---------- 侧边栏 ---------- */\n.sidebar{width:170px;background:linear-gradient(180deg,#0D2C55,#0A2143);color:#fff;flex-shrink:0;position:sticky;top:0;height:100vh;display:flex;flex-direction:column}\n.brand{display:flex;align-items:center;gap:8px;padding:14px 12px}\n.brand-logo{width:30px;height:30px;border:1.5px solid rgba(255,255,255,.8);border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0}\n.brand-logo svg{display:block}\n.brand-name{font-weight:700;font-size:14px;line-height:1.3}\n.menu{flex:1;padding:4px 8px;overflow-y:auto}\n.menu a{display:flex;align-items:center;gap:8px;color:rgba(255,255,255,.82);text-decoration:none;font-size:13px;padding:10px 10px;border-radius:6px;margin-bottom:2px}\n.menu a:hover{color:#fff}\n.menu .dia{width:5px;height:5px;border:1.2px solid currentColor;transform:rotate(45deg);opacity:.7;flex-shrink:0}\n.menu a.active{background:#1C5BD4;color:#fff}\n.menu a.sub{padding-left:30px;font-size:12.5px}\n/* ---------- 顶栏 ---------- */\n.right{flex:1;min-width:0;display:flex;flex-direction:column}\n.topbar{height:48px;background:#1C5BD4;display:flex;align-items:center;justify-content:flex-end;gap:26px;padding:0 24px;color:#fff;position:sticky;top:0;z-index:5;font-size:13px}\n.topbar .t-item{display:flex;align-items:center;gap:6px;cursor:pointer;opacity:.95}\n.topbar .caret{width:0;height:0;border-left:4px solid transparent;border-right:4px solid transparent;border-top:4px solid rgba(255,255,255,.9)}\n/* ---------- 主体 ---------- */\n.main{flex:1;padding:14px 18px 24px}\n.crumb{font-size:12px;color:#9AA3B2}\n.crumb b{color:#4B5563;font-weight:500}\n.page-head{display:flex;align-items:baseline;gap:12px;margin:10px 0 16px}\n.page-head h1{font-size:22px;font-weight:700;color:#111827}\n.page-head .desc{font-size:12px;color:#8A93A3}\n/* 统计卡 */\n.stat-card{background:#fff;border-radius:10px;display:flex;flex-wrap:wrap;padding:18px 8px;margin-bottom:14px}\n.stat{flex:1;min-width:110px;display:flex;align-items:center;gap:8px;padding:4px 10px;border-right:1px solid #EEF1F5}\n.stat:last-child{border-right:none}\n.stat .ic{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0}\n.stat .num{font-size:20px;font-weight:700;color:#111827;line-height:1}\n.stat .lbl{font-size:12px;color:#8A93A3;margin-bottom:4px;white-space:nowrap}\n/* ---------- 角色切换（顶栏） ---------- */\n.role-select{background:transparent;border:none;color:#fff;font-size:13px;font-family:inherit;outline:none;cursor:pointer;-webkit-appearance:none;appearance:none;padding:0}\n.role-select option{color:#1F2937;background:#fff}\n/* 筛选 */\n.filter-card{background:#fff;border-radius:10px;padding:16px;margin-bottom:14px}\n.f-row{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px}\n.f-input,.f-select{height:34px;border:1px solid #D9DFE8;border-radius:6px;background:#fff;font-size:13px;color:#1F2937;padding:0 10px;font-family:inherit;outline:none}\n.f-input{width:190px}\n.f-select{min-width:96px}\n.date-wrap{display:flex;align-items:center;gap:8px;border:1px solid #D9DFE8;border-radius:6px;background:#fff;padding:0 10px;height:34px}\n.date-wrap input{border:none;outline:none;font-size:13px;color:#6B7280;width:70px;font-family:inherit;background:transparent}\n.date-wrap .dash{color:#9CA3AF}\n.f-row .f-select::-ms-expand{display:none}\n/* 列表 */\n.list-head{display:flex;align-items:center;justify-content:space-between;margin:6px 0 12px}\n.list-head h2{font-size:16px;font-weight:700;color:#111827}\n.btn-export{height:32px;background:#fff;border:1px solid #D9DFE8;border-radius:6px;font-size:13px;color:#4B5563;padding:0 12px;display:inline-flex;align-items:center;gap:6px;cursor:pointer;font-family:inherit}\n.table-card{background:#fff;border-radius:10px;padding:0 0 16px;overflow:hidden}\n.table-scroll{overflow-x:auto}\ntable{width:100%;border-collapse:collapse;min-width:840px}\nthead th{background:#F5F7FA;font-size:12px;font-weight:500;color:#6B7280;text-align:left;padding:10px 6px;white-space:nowrap}\ntbody td{font-size:12px;color:#1F2937;padding:12px 5px;border-bottom:1px solid #F2F4F7;white-space:nowrap;vertical-align:middle}\ntd .name{display:block;font-weight:500}\ntd .phone{display:block;font-size:12px;color:#9AA3B2;margin-top:2px}\n.badge{display:inline-block;font-size:12px;padding:3px 6px;border-radius:4px}\n.b-orange{background:#FDF1DE;color:#C97A06}\n.b-green{background:#E4F6EB;color:#18A058}\n.b-red{background:#FDEBEB;color:#E5484D}\n.b-blue{background:#E8F0FE;color:#1C5BD4}\n.b-gray{background:#F2F4F7;color:#8A93A3}\n.b-purple{background:#F0EAFE;color:#6C4BD8}\n.link-danger{color:#E5484D}\n.link[hidden]{display:none}\n/* ---------- 遮罩与弹窗 ---------- */\n.overlay{position:fixed;inset:0;background:rgba(11,31,59,.55);z-index:20;display:none}\n.overlay.show{display:block}\n.modal{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);width:420px;max-width:calc(100vw - 32px);background:#fff;border-radius:12px;z-index:21;box-shadow:0 20px 50px rgba(9,30,66,.25);display:none}\n.modal.show{display:block}\n.m-head{padding:18px 20px 0;display:flex;align-items:flex-start;justify-content:space-between}\n.m-head h2{font-size:16px;font-weight:700;color:#111827}\n.m-head .sub{font-size:12px;color:#8A93A3;margin-top:6px}\n.m-close{border:none;background:none;cursor:pointer;color:#9AA3B3;font-size:16px;line-height:1;padding:2px}\n.m-body{padding:14px 20px 18px;font-size:13px;color:#4B5563;line-height:1.7}\n.m-field{margin-top:12px}\n.m-label{font-size:12px;color:#6B7280;margin-bottom:6px}\n.req{color:#E5484D;margin-right:3px}\n.m-select,.m-input{width:100%;height:34px;border:1px solid #D9DFE8;border-radius:6px;padding:0 10px;font-size:13px;color:#1F2937;font-family:inherit;outline:none;background:#fff}\n.m-textarea{width:100%;min-height:76px;border:1px solid #D9DFE8;border-radius:6px;padding:8px 10px;font-size:13px;line-height:1.6;color:#1F2937;font-family:inherit;resize:vertical;outline:none}\n.m-textarea::placeholder{color:#B3BAC6}\n.m-textarea.error{border-color:#E5484D;background:#FFFAFA}\n.m-select.error{border-color:#E5484D;background:#FFFAFA}\n.m-tip{margin-top:10px;font-size:12px;color:#8A93A3}\n.m-foot{border-top:1px solid #EEF1F5;padding:14px 20px;display:flex;justify-content:flex-end;gap:10px}\n.btn{height:34px;border-radius:6px;font-size:13px;padding:0 16px;cursor:pointer;font-family:inherit;border:1px solid transparent}\n.btn-cancel{border-color:#D9DFE8;background:#fff;color:#4B5563}\n.btn-blue{background:#1C5BD4;color:#fff;border-color:#1C5BD4}\n.btn-red{background:#E5484D;color:#fff;border-color:#E5484D}\n/* ---------- 申请审核队列说明条 ---------- */\n.audit-bar{background:#F4F1FE;border:1px solid #E2DAFB;border-radius:10px;padding:12px 14px;margin-bottom:14px;display:flex;gap:10px;align-items:flex-start}\n.audit-bar .ab-dot{width:8px;height:8px;border-radius:50%;background:#6C4BD8;margin-top:6px;flex-shrink:0}\n.audit-bar b{font-size:13px;color:#4B2FA8}\n.audit-bar .ab-txt{font-size:12px;color:#7A6BA8;margin-left:6px;line-height:1.6}\n/* ---------- 审核弹窗：项目多选 / 归属链 / 奖励单选 ---------- */\n.chips{display:flex;flex-wrap:wrap;gap:8px}\n.chip{border:1px solid #D9DFE8;background:#fff;border-radius:6px;padding:6px 10px;font-size:12.5px;color:#4B5563;cursor:pointer;font-family:inherit}\n.chip.on{border-color:#1C5BD4;background:#EEF4FF;color:#1C5BD4;font-weight:500}\n.chain{border:1px solid #E4E9F0;border-radius:8px;background:#FAFBFD;padding:10px 12px;font-size:12px;color:#6B7280;line-height:1.9;margin-top:10px}\n.chain .node{display:inline-block;padding:1px 7px;background:#fff;border:1px solid #E4E9F0;border-radius:4px;color:#1F2937}\n.chain .arrow{color:#B3BAC6;margin:0 6px}\n.chain .hd{color:#8A93A3;margin-bottom:2px}\n.radio-row{display:flex;gap:18px;font-size:13px;color:#4B5563;margin-top:2px}\n.radio-row label{display:flex;align-items:center;gap:6px;cursor:pointer}\n.err-txt{color:#E5484D;font-size:12px;margin-top:6px;display:none}\n.err-txt.show{display:block}\n/* ---------- 审核弹窗：分组卡片（方案 B：浅底 + 左侧主题蓝竖条） ---------- */\n.g-group{background:#F7F9FC;border-left:3px solid #1C5BD4;border-radius:6px;padding:10px 12px 12px;margin-top:12px}\n.g-label{font-size:13px;font-weight:600;color:#1F2329;margin-bottom:8px;line-height:1.5}\n.g-label .paren{font-weight:400;font-size:12px;color:#9AA3AF;margin-left:2px}\n.g-group .m-field{margin-top:10px}\n.g-group .chain{margin-top:10px}\n.g-group .m-tip{margin-top:8px}\n.g-group .chip{background:#fff}\n/* ---------- 轻提示 ---------- */\n.toast{position:fixed;left:50%;top:22px;transform:translateX(-50%);background:#111827;color:#fff;font-size:13px;padding:8px 16px;border-radius:6px;z-index:30;opacity:0;transition:opacity .2s;pointer-events:none}\n.toast.show{opacity:1}\n.link{color:#1C5BD4;font-size:12px;text-decoration:none;margin-right:4px}\n.link:last-child{margin-right:0}\n.table-foot{display:flex;align-items:center;justify-content:space-between;padding:16px 12px 0;font-size:12px;color:#8A93A3}\n.pager{display:flex;align-items:center;gap:8px}\n.pg{min-width:30px;height:30px;border:1px solid #DDE3EB;background:#fff;border-radius:6px;display:inline-flex;align-items:center;justify-content:center;font-size:12.5px;color:#4B5563;text-decoration:none;padding:0 8px}\n.pg.active{background:#1C5BD4;border-color:#1C5BD4;color:#fff}\n.pg-select{height:30px;border:1px solid #DDE3EB;border-radius:6px;background:#fff;font-size:12.5px;color:#4B5563;padding:0 6px;font-family:inherit}\n@media (max-width:768px){\n  .app{flex-direction:column}\n  .sidebar{width:100%;height:auto;position:static;flex-direction:row;align-items:center;overflow-x:auto}\n  .menu{display:flex;padding:4px}\n  .menu a{white-space:nowrap;margin-bottom:0}\n  .menu a.sub{padding-left:10px}\n  .brand{padding:10px}\n  .stat-card{flex-wrap:w " data-goto=\"7\">查看详情<\/a><a class=\"link\" href=\"#\" data-act=\"启用\">启用<\/a><\/td>\n              <\/tr>\n            <\/tbody>\n          <\/table>\n        <\/div>\n        <div class=\"table-foot\">\n          <span id=\"listCount\">共36条<\/span>\n          <div class=\"pager\">\n            <a class=\"pg active\" href=\"#\">1<\/a>\n            <a class=\"pg\" href=\"#\">2<\/a>\n            <a class=\"pg\" href=\"#\">3<\/a>\n            <a class=\"pg\" href=\"#\">4<\/a>\n            <a class=\"pg\" href=\"#\">下一页<\/a>\n            <select class=\"pg-select\"><option>10条 / 页<\/option><option>20条 / 页<\/option><option>50条 / 页<\/option><\/select>\n          <\/div>\n        <\/div>\n      <\/div>\n    <\/main>\n  <\/div>\n<\/div>\n\n<!-- 遮罩与弹窗 -->\n<div class=\"overlay\" id=\"overlay\"><\/div>\n<div class=\"modal\" id=\"modal\">\n  <div class=\"m-head\">\n    <div>\n      <h2 id=\"mTitle\">操作确认<\/h2>\n      <div class=\"sub\" id=\"mSub\"><\/div>\n    <\/div>\n    <button class=\"m-close\" id=\"mClose\" type=\"button\">✕<\/button>\n  <\/div>\n  <div class=\"m-body\" id=\"mBody\"><\/div>\n  <div class=\"m-foot\">\n    <button class=\"btn btn-cancel\" id=\"mCancel\" type=\"button\">取消<\/button>\n    <button class=\"btn btn-blue\" id=\"mOk\" type=\"button\">确认<\/button>\n  <\/div>\n<\/div>\n<div class=\"toast\" id=\"toast\"><\/div>\n\n<script>\n/* ===== 审核状态枚举（与筛选下拉、状态标签、示例数据保持一致）\n   PC 端仅保留一个审核节点：城市管理员审核 → 审核通过即「已认证」 ===== */\nvar STATUS = ['待审核','已认证','未通过','已停用'];\nvar BADGE = {'待审核':'b-purple','已认证':'b-green','未通过':'b-red','已停用':'b-gray'};\nvar COUNTS = {'待审核':6,'已认证':24,'未通过':4,'已停用':2};\nvar TOTAL = 36;\n\n/* 项目 → 所属城市公司 → 城市：绑定项目时建立归属链 */\nvar PROJECTS = [\n  {name:'招商玺 · 蛇口', company:'蛇口城市公司', city:'深圳'},\n  {name:'海上世界',      company:'蛇口城市公司', city:'深圳'},\n  {name:'南海玫瑰园',    company:'南山城市公司', city:'深圳'},\n  {name:'太子湾',        company:'蛇口城市公司', city:'深圳'}\n];\n\n/* ===== 操作权限：状态 + 角色 双重控制 =====\n   待审核→城市管理员「审核」（同节点完成绑定项目/荟豆账号/是否发放认证奖励）\n   已认证→全部角色可「停用」 | 已停用→全部角色可「启用」 | 未通过→仅查看 */\nvar ALL_ROLES = ['城市管理员','项目管理员','平台管理员'];\nvar ACTIONS = {\n  '审核': {status:['待审核'], roles:['城市管理员'], okText:'提交审核结果', okClass:'btn-blue'},\n  '停用': {status:['已认证'], roles:ALL_ROLES, next:'已停用', okText:'确认停用', okClass:'btn-red'},\n  '启用': {status:['已停用'], roles:ALL_ROLES, next:'已认证', okText:'确认启用', okClass:'btn-blue'}\n};\n\nvar roleSel = document.getElementById('roleSelect');\nvar statusSel = document.getElementById('statusFilter');\nvar body = document.getElementById('listBody');\nvar overlay = document.getElementById('overlay');\nvar modal = document.getElementById('modal');\nvar toastEl = document.getElementById('toast');\nvar curRow = null, curAct = null;\nvar view = 'list';   /* list = 主理人列表 | audit = 申请审核（仅待审核） */\n\n/* 按「当前登录角色 + 行审核状态」渲染操作按钮 */\nfunction renderActions(){\n  var role = roleSel.value;\n  var rows = body.querySelectorAll('tr');\n  for (var i=0;i<rows.length;i++){\n    var tr = rows[i], st = tr.getAttribute('data-status');\n    var btns = tr.querySelectorAll('[data-act]');\n    for (var j=0;j<btns.length;j++){\n      var cfg = ACTIONS[btns[j].getAttribute('data-act')];\n      var ok = cfg && cfg.status.indexOf(st)>-1 && cfg.roles.indexOf(role)>-1;\n      btns[j].hidden = !ok;\n    }\n  }\n}\n\n/* 状态筛选（申请审核视图下固定为「待审核」） */\nfunction applyFilter(){\n  var v = view === 'audit' ? '待审核' : statusSel.value;\n  var rows = body.querySelectorAll('tr');\n  for (var i=0;i<rows.length;i++){\n    rows[i].style.display = (v==='全部状态' || rows[i].getAttribute('data-status')===v) ? '' : 'none';\n  }\n  var n = TOTAL;\n  if (v !== '全部状态'){\n    n = 0;\n    for (var k=0;k<rows.length;k++){ if(rows[k].getAttribute('data-status')===v) n++; }\n  }\n  var base = view === 'audit' ? '申请审核' : '主理人列表';\n  document.getElementById('listTitle').textContent = base + '（' + n + '）';\n  document.getElementById('listCount').textContent = '共' + n + '条';\n}\n\n/* 列表 / 申请审核 视图切换 */\nfunction switchView(v){\n  view = v;\n  var isAudit = v === 'audit';\n  document.getElementById('navList').classList.toggle('active', !isAudit);\n  document.getElementById('navAudit').classList.toggle('active', isAudit);\n  document.getElementById('statCard').style.display = isAudit ? 'none' : '';\n  document.getElementById('auditBar').style.display = isAudit ? 'flex' : 'none';\n  document.getElementById('pageCrumb').innerHTML = isAudit\n    ? '主理人管理&ensp;/&ensp;申请审核&ensp;/&ensp;<b>待审核<\/b>'\n    : '主理人管理&ensp;/&ensp;<b>主理人列表<\/b>';\n  document.getElementById('pageTitle').textContent = isAudit ? '申请审核' : '主理人管理';\n  document.getElementById('pageDesc').textContent = isAudit\n    ? '仅展示小程序端提交的待审核主理人申请，由城市管理员完成审核'\n    : '统一管理主理人申请、城市审核与认证状态';\n  statusSel.disabled = isAudit;\n  statusSel.value = isAudit ? '待审核' : '全部状态';\n  applyFilter();\n}\n\n/* 轻提示 */\nfunction toast(msg){\n  toastEl.textContent = msg;\n  toastEl.classList.add('show');\n  clearTimeout(toastEl._t);\n  toastEl._t = setTimeout(function(){ toastEl.classList.remove('show'); }, 2600);\n}\n\n/* 归属链渲染：主理人 → 绑定项目 → 项目所属城市公司 → 城市 */\nfunction chainHtml(name, idxs){\n  if (!idxs.length){\n    return '<div class=\"chain\"><div class=\"hd\">归属链：主理人 → 绑定项目 → 项目所属城市公司 → 城市<\/div>'\n      + '<div style=\"color:#9AA3B2\">尚未绑定项目，请至少选择一个项目<\/div><\/div>';\n  }\n  var proj = idxs.map(function(i){ return '<span class=\"node\">'+PROJECTS[i].name+'<\/span>'; }).join('');\n  var comp = [], city = [];\n  idxs.forEach(function(i){\n    if (comp.indexOf(PROJECTS[i].company)<0) comp.push(PROJECTS[i].company);\n    if (city.indexOf(PROJECTS[i].city)<0)    city.push(PROJECTS[i].city);\n  });\n  var line = '<div><span class=\"node\">'+name+'<\/span><span class=\"arrow\">→<\/span>'+proj\n    + '<span class=\"arrow\">→<\/span>' + comp.map(function(c){return '<span class=\"node\">'+c+'<\/span>';}).join('<span style=\"color:#D5DBE4\">/<\/span>')\n    + '<span class=\"arrow\">→<\/span>' + city.map(function(c){return '<span class=\"node\">'+c+'<\/span>';}).join('<span style=\"color:#D5DBE4\">/<\/span>') + '<\/div>';\n  var detail = idxs.map(function(i){\n    return '<div style=\"color:#8A93A3\">· '+PROJECTS[i].name+' &nbsp;·&nbsp; '+PROJECTS[i].company+' &nbsp;·&nbsp; '+PROJECTS[i].city+'<\/div>';\n  }).join('');\n  return '<div class=\"chain\"><div class=\"hd\">归属链：主理人 → 绑定项目 → 项目所属城市公司 → 城市<\/div>' + line + detail + '<\/div>';\n}\n\n/* 项目多选 chip */\nfunction chipHtml(idx){\n  return '<button type=\"button\" class=\"chip\" data-i=\"'+idx+'\">'+PROJECTS[idx].name+'<\/button>';\n}\nfunction toggleChip(btn){\n  btn.classList.toggle('on');\n  document.getElementById('errProj').classList.remove('show');\n  refreshChain();\n}\nfunction selectedProjects(){\n  var out = [];\n  var on = document.querySelectorAll('#projChips .chip.on');\n  for (var i=0;i<on.length;i++) out.push(+on[i].getAttribute('data-i'));\n  return out;\n}\nfunction refreshChain(){\n  var name = curRow ? curRow.querySelector('.name').textContent : '主理人';\n  document.getElementById('chainBox').innerHTML = chainHtml(name, selectedProjects());\n}\nfunction toggleReward(){\n  var y = document.getElementById('mRewardY').checked;\n  document.getElementById('fBean').style.display = y ? '' : 'none';\n}\n/* 审核结果：不通过时隐藏通过项、显示驳回原因 */\nfunction toggleAudit(v){\n  var pass = v !== '未通过';\n  var f = document.getElementById('fPass'), r = document.getElementById('fReason');\n  if (f) f.style.display = pass ? '' : 'none';\n  if (r) r.style.display = pass ? 'none' : '';\n}\nfunction reasonField(){\n  return '<div class=\"m-field\" id=\"fReason\" style=\"display:none\"><div class=\"m-label\">驳回原因（必填，将同步至 C 端主理人）<\/div>'\n    + '<textarea class=\"m-textarea\" id=\"mReason\" placeholder=\"请填写驳回原因\" oninput=\"this.classList.remove(\\'error\\')\"><\/textarea><\/div>';\n}\n\n/* 打开弹窗 */\nfunction openModal(tr, act){\n  curRow = tr; curAct = act;\n  var cfg = ACTIONS[act];\n  var code = tr.children[0].textContent;\n  var name = tr.querySelector('.name').textContent;\n  var st = tr.getAttribute('data-status');\n  var title = act, sub = code + ' · ' + name + ' · ' + st, html = '';\n\n  if (act === '审核'){\n    title = '主理人审核（城市管理员）';\n    var chips = PROJECTS.map(function(p,i){ return chipHtml(i); }).join('');\n    html = '<div>PC 端仅一个审核节点：城市管理员审核。通过即完成认证，以下三项操作在同一弹窗内完成。<\/div>'\n      + '<div class=\"m-field\"><div class=\"m-label\">审核结果<\/div>'\n      + '<select class=\"m-select\" id=\"mResult\" onchange=\"toggleAudit(this.value)\"><option value=\"已认证\">通过，完成认证<\/option><option value=\"未通过\">不通过，退回申请人<\/option><\/select><\/div>'\n      + '<div id=\"fPass\">'\n      +   '<div class=\"g-group\"><div class=\"g-label\"><span class=\"req\">*<\/span>绑定项目<span class=\"paren\">（可多选，一个主理人可绑定多个项目）<\/span><\/div>'\n      +     '<div class=\"chips\" id=\"projChips\">' + chips + '<\/div>'\n      +     '<div id=\"chainBox\"><\/div>'\n      +     '<div class=\"err-txt\" id=\"errProj\">请至少绑定一个项目（绑定项目为审核关键动作）<\/div>'\n      +   '<\/div>'\n      +   '<div class=\"g-group\"><div class=\"g-label\"><span class=\"req\">*<\/span>是否发放认证奖励（荟豆）<\/div>'\n      +     '<div class=\"radio-row\">'\n      +       '<label><input type=\"radio\" name=\"mReward\" id=\"mRewardY\" value=\"发放\" checked onchange=\"toggleReward()\">发放认证奖励<\/label>'\n      +       '<label><input type=\"radio\" name=\"mReward\" id=\"mRewardN\" value=\"不发放\" onchange=\"toggleReward()\">不发放<\/label>'\n      +     '<\/div>'\n      +     '<div class=\"m-field\" id=\"fBean\" style=\"margin-top:10px\"><div class=\"m-label\">认证奖励荟豆数<\/div>'\n      +       '<input class=\"m-input\" id=\"mBean\" type=\"text\" value=\"500\">'\n      +     '<\/div>'\n      +   '<\/div>'\n      +   '<div class=\"g-group\"><div class=\"g-label\"><span class=\"req\">*<\/span>选择发放奖励（荟豆）的账号<\/div>'\n      +     '<select class=\"m-select\" id=\"mAcc\" onchange=\"this.classList.remove(\\'error\\')\"><option value=\"\">请选择发放奖励（荟豆）的账号<\/option><option value=\"FKW_Recharge_sz\">FKW_Recharge_sz<\/option><option value=\"FKW_Recharge_sh\">FKW_Recharge_sh<\/option><\/select>'\n      +     '<div class=\"m-tip\">奖励将发放至该主理人的荟豆账户<\/div>'\n      +   '<\/div>'\n      + '<\/div>'\n      + reasonField()\n      + '<div class=\"m-tip\">归属关系：主理人 → 绑定项目 → 项目所属城市公司 → 城市；审核通过后状态更新为「已认证」。<\/div>';\n  } else if (act === '停用'){\n    title = '停用主理人';\n    html = '<div>停用后该主理人将无法创建社群、发布活动，C 端主页展示为「已停用」。<\/div>'\n      + '<div class=\"m-field\"><div class=\"m-label\">停用原因<\/div>'\n      + '<select class=\"m-select\"><option>长期无运营动作<\/option><option>主理人主动申请关闭<\/option><option>违反社群运营规范<\/option><option>其他<\/option><\/select><\/div>'\n      + '<div class=\"m-tip\">停用后可在列表中重新启用，历史社群与活动数据保留。<\/div>';\n  } else {\n    title = '启用主理人';\n    html = '<div>启用后该主理人恢复「已认证」状态，可继续创建社群并发布活动。<\/div>'\n      + '<div class=\"m-tip\">已停用账号支持任意管理员角色重新启用。<\/div>';\n  }\n\n  document.getElementById('mTitle').textContent = title;\n  document.getElementById('mSub').textContent = sub;\n  document.getElementById('mBody').innerHTML = html;\n  var ok = document.getElementById('mOk');\n  ok.textContent = cfg.okText;\n  ok.className = 'btn ' + cfg.okClass;\n  if (act === '审核'){ refreshChain(); }\n  overlay.classList.add('show');\n  modal.classList.add('show');\n}\n\nfunction closeModal(){\n  overlay.classList.remove('show');\n  modal.classList.remove('show');\n  curRow = null; curAct = null;\n}\n\n/* 行状态变更 */\nfunction setStatus(tr, st){\n  tr.setAttribute('data-status', st);\n  var badge = tr.querySelector('.badge');\n  badge.className = 'badge ' + BADGE[st];\n  badge.textContent = st;\n  renderActions();\n  applyFilter();\n}\n\n/* 事件绑定（文档级委托：兼容列表行内按钮与弹窗内项目多选） */\ndocument.addEventListener('click', function(e){\n  var chip = e.target.closest ? e.target.closest('.chip') : null;\n  if (chip && modal.classList.contains('show')){ e.preventDefault(); toggleChip(chip); return; }\n  var a = e.target.closest ? e.target.closest('[data-act]') : null;\n  if (!a) return;\n  e.preventDefault();\n  openModal(a.closest('tr'), a.getAttribute('data-act'));\n});\n\ndocument.getElementById('mOk').addEventListener('click', function(){\n  var cfg = ACTIONS[curAct];\n  if (!curRow || !cfg) return;\n  var name = curRow.querySelector('.name').textContent;\n\n  if (curAct === '审核'){\n    var pass = document.getElementById('mResult').value === '已认证';\n    if (pass){\n      var idxs = selectedProjects();\n      if (!idxs.length){ document.getElementById('errProj').classList.add('show'); return; }\n      var giveBeans = document.getElementById('mRewardY').checked;\n      var beans = document.getElementById('mBean').value.trim();\n      if (giveBeans && !(Number(beans) > 0)){ toast('请填写有效的认证奖励荟豆数'); return; }\n      var acc = document.getElementById('mAcc').value.trim();\n      if (!acc){ var accEl = document.getElementById('mAcc'); accEl.classList.add('error'); accEl.focus(); toast('请选择发放奖励（荟豆）的账号'); return; }\n      var names = idxs.map(function(i){ return PROJECTS[i].name; });\n      curRow.setAttribute('data-projects', names.join('、'));\n      setStatus(curRow, '已认证');\n      closeModal();\n      toast('已审核通过「'+name+'」：绑定项目 '+names.join('、')\n        + (giveBeans ? '；发放认证奖励 '+beans+' 荟豆至 '+acc : '；不发放认证奖励'));\n      return;\n    }\n    var r = document.getElementById('mReason');\n    if (!r.value.trim()){ r.classList.add('error'); r.focus(); return; }\n    setStatus(curRow, '未通过');\n    closeModal();\n    toast('已驳回「'+name+'」的申请，状态更新为「未通过」');\n    return;\n  }\n\n  var next = cfg.next;\n  setStatus(curRow, next);\n  closeModal();\n  toast('已为「'+name+'」'+curAct+'，状态更新为「'+next+'」');\n});\n\ndocument.getElementById('mCancel').addEventListener('click', closeModal);\ndocument.getElementById('mClose').addEventListener('click', closeModal);\noverlay.addEventListener('click', closeModal);\ndocument.getElementById('navList').addEventListener('click', function(e){ e.preventDefault(); switchView('list'); });\ndocument.getElementById('navAudit').addEventListener('click', function(e){ e.preventDefault(); switchView('audit'); });\nroleSel.addEventListener('change', function(){\n  renderActions();\n  toast('当前登录角色：' + roleSel.value);\n});\nstatusSel.addEventListener('change', applyFilter);\n\nrenderActions();\napplyFilter();\n<\/script>\n<script>\n(function(){\ndocument.addEventListener('click',function(e){\n  var t=e.target;\n  while(t&&t.nodeType===1&&t.tagName!=='A'){t=t.parentNode;}\n  if(t&&t.getAttribute&&t.getAttribute('data-goto')){\n    e.preventDefault();e.stopPropagation();\n    parent.postMessage({__navGo:parseInt(t.getAttribute('data-goto'),10)},'*');\n  }\n},true);\n})();\n<\/script><\/body>\n<\/html>\n"}, {"no": "2", "title": "查看主理人申请详情（待审核）", "html": "<!DOCTYPE html>\n<html lang=\"zh-CN\">\n<head>\n<meta charset=\"UTF-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n<title>管理后台-查看主理人申请详情<\/title>\n<style>\n*{margin:0;padding:0;box-sizing:border-box}\nbody{font-family:-apple-system,BlinkMacSystemFont,\"PingFang SC\",\"Microsoft YaHei\",sans-serif;background:#EFF2F7;color:#1F2937;font-size:14px}\n.app{display:flex;min-height:100vh}\n/* ---------- 侧边栏 ---------- */\n.sidebar{width:170px;background:linear-gradient(180deg,#0D2C55,#0A2143);color:#fff;flex-shrink:0;position:sticky;top:0;height:100vh;display:flex;flex-direction:column}\n.brand{display:flex;align-items:center;gap:8px;padding:14px 12px}\n.brand-logo{width:30px;height:30px;border:1.5px solid rgba(255,255,255,.8);border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0}\n.brand-logo svg{display:block}\n.brand-name{font-weight:700;font-size:14px;line-height:1.3}\n.menu{flex:1;padding:4px 8px;overflow-y:auto}\n.menu a{display:flex;align-items:center;gap:8px;color:rgba(255,255,255,.82);text-decoration:none;font-size:13px;padding:10px 10px;border-radius:6px;margin-bottom:2px}\n.menu .dia{width:5px;height:5px;border:1.2px solid currentColor;transform:rotate(45deg);opacity:.7;flex-shrink:0}\n.menu a.active{background:#1C5BD4;color:#fff}\n.menu a.sub{padding-left:30px;font-size:12.5px}\n/* ---------- 顶栏 ---------- */\n.right{flex:1;min-width:0;display:flex;flex-direction:column}\n.topbar{height:48px;background:#1C5BD4;display:flex;align-items:center;justify-content:flex-end;gap:26px;padding:0 24px;color:#fff;position:sticky;top:0;z-index:5;font-size:13px}\n.topbar .t-item{display:flex;align-items:center;gap:6px;cursor:pointer;opacity:.95}\n.topbar .caret{width:0;height:0;border-left:4px solid transparent;border-right:4px solid transparent;border-top:4px solid rgba(255,255,255,.9)}\n/* ---------- 主体 ---------- */\n.main{flex:1;padding:14px 18px 28px}\n.crumb{font-size:12px;color:#9AA3B2}\n.crumb b{color:#4B5563;font-weight:500}\n.head-row{display:flex;align-items:flex-start;justify-content:space-between;margin:12px 0 16px}\n.head-left{display:flex;gap:14px}\n.back{font-size:20px;color:#374151;text-decoration:none;line-height:1.2;margin-top:2px}\n.h-name{display:flex;align-items:center;gap:10px}\n.h-name h1{font-size:22px;font-weight:700;color:#111827}\n.tag-y{font-size:12px;color:#C07A00;background:#FCF3DC;border-radius:4px;padding:3px 8px}\n.h-meta{font-size:12px;color:#8A93A3;margin-top:6px}\n.head-btns{display:flex;gap:10px}\n.btn{height:34px;border-radius:6px;font-size:13px;padding:0 16px;cursor:pointer;font-family:inherit;border:1px solid transparent}\n.btn-red{background:#fff;border-color:#F1B7B9;color:#E5484D}\n.btn-blue{background:#1C5BD4;color:#fff;border-color:#1C5BD4}\n/* 卡片 */\n.card{background:#fff;border-radius:10px;padding:16px 18px;margin-bottom:12px}\n.card h3{font-size:15px;font-weight:700;color:#111827;margin-bottom:14px}\n.card h3 .num{margin-right:6px}\n.card h3 .opt{font-size:12px;color:#9AA3B2;font-weight:400;margin-left:6px}\n/* 步骤条 */\n.steps{display:flex;align-items:flex-start;padding:6px 30px 2px}\n.step{width:150px;text-align:center;flex-shrink:0}\n.step .dot{width:26px;height:26px;border-radius:50%;margin:0 auto 8px;display:flex;align-items:center;justify-content:center;font-size:13px}\n.dot-done{background:#18A058;color:#fff}\n.dot-cur{background:#1C5BD4;color:#fff}\n.do        <\/div>\n          <div class=\"seg\"><\/div>\n          <div class=\"step\">\n            <div class=\"dot dot-cur\">2<\/div>\n            <div class=\"s-t\">城市管理员审核<\/div>\n            <div class=\"s-s\">当前阶段<\/div>\n          <\/div>\n          <div class=\"seg\"><\/div>\n          <div class=\"step todo\">\n            <div class=\"dot dot-todo\">3<\/div>\n            <div class=\"s-t\">认证开通<\/div>\n            <div class=\"s-s\">待审核通过<\/div>\n          <\/div>\n        <\/div>\n      <\/div>\n\n      <div class=\"cols\">\n        <!-- 左列 -->\n        <div class=\"col-l\">\n          <div class=\"card\">\n            <h3><span class=\"num\">01<\/span>基础信息<\/h3>\n            <div class=\"info-grid\">\n              <div class=\"ig-cell\"><div class=\"k\">申请来源<\/div><div class=\"v\">微信小程序申请<\/div><\/div>\n              <div class=\"ig-cell\"><div class=\"k\">姓名<\/div><div class=\"v\">林晓霞<\/div><\/div>\n              <div class=\"ig-cell\"><div class=\"k\">联系方式<\/div><div class=\"v\">138****6606<\/div><\/div>\n              <div class=\"ig-cell\"><div class=\"k\">所在城市<\/div><div class=\"v\">深圳<\/div><\/div>\n              <div class=\"ig-cell\"><div class=\"k\">年龄区间<\/div><div class=\"v\">26–35岁<\/div><\/div>\n              <div class=\"ig-cell\"><div class=\"k\">性别<\/div><div class=\"v\">女<\/div><\/div>\n              <div class=\"ig-cell\"><div class=\"k\">当前身份<\/div><div class=\"v\">招商业主<\/div><\/div>\n              <div class=\"ig-cell\"><\/div>\n            <\/div>\n          <\/div>\n\n          <div class=\"card\">\n            <h3><span class=\"num\">02<\/span>主理方向<\/h3>\n            <div class=\"dir-sub\">计划运营的社群方向<\/div>\n            <div class=\"pills\">\n              <span class=\"pill\"><span class=\"ck\">✓<\/span>滨海运动<\/span>\n              <span class=\"pill\"><span class=\"ck\">✓<\/span>城市申创<\/span>\n            <\/div>\n            <div class=\"f-lbl\">申请理由<\/div>\n            <div class=\"gray-box\">希望连接更多热爱运动与城市生活的人，让好点子在蛇口真正发生。<\/div>\n            <div class=\"f-lbl\">资源优势<\/div>\n            <div class=\"gray-box\" style=\"margin-bottom:0\">有社群组织经验，可链接运动教练、公共空间及社区志愿者资源。<\/div>\n          <\/div>\n\n          <div class=\"card\" style=\"margin-bottom:0\">\n            <h3><span class=\"num\">03<\/span>能力证明<span class=\"opt\">选填<\/span><\/h3>\n            <div class=\"file-box\">\n              <div class=\"file-thumb\">活动照片<\/div>\n              <div>\n                <div class=\"file-name\">蛇口滨海飞盘活动.jpg<\/div>\n                <div class=\"file-meta\">JPG · 2.8MB<a href=\"#\">预览<\/a><\/div>\n              <\/div>\n            <\/div>\n          <\/div>\n        <\/div>\n\n        <!-- 右列 -->\n        <div class=\"col-r\">\n          <div class=\"card\">\n            <h3><span class=\"num\">04<\/span>社群资料<\/h3>\n            <div class=\"cover\">蛇口滨海运动社 · 封面预览<\/div>\n            <div class=\"dl\">\n              <div class=\"dl-row\"><div class=\"k\">社群名称<\/div><div class=\"v\">蛇口滨海运动社<\/div><\/div>\n              <div class=\"dl-row\"><div class=\"k\">社群分类<\/div><div class=\"v\">运动与户外<\/div><\/div>\n              <div class=\"dl-row\"><div class=\"k\">运营城市<\/div><div class=\"v\">深圳<\/div><\/div>\n              <div class=\"dl-row\"><div class=\"k\">所属片区<\/div><div class=\"v\">蛇口<\/div><\/div>\n              <div class=\"dl-row\"><div class=\"k\">社群简介<\/div><div class=\"v\">连接热爱滨海运动与城市生活的邻里，共同发起飞盘、路跑与城市共创活动。<\/div><\/div>\n              <div class=\"dl-row\"><div class=\"k\">社群标签<\/div><div class=\"v\"><span class=\"tag-b\">飞盘<\/span><span class=\"tag-b\">滨海运动<\/span><span class=\"tag-b\">社区共创<\/span><\/div><\/div>\n            <\/div>\n          <\/div>\n\n          <div class=\"card\">\n            <h3>归属信息<\/h3>\n            <div class=\"chain\" id=\"ownChain\">\n              <div class=\"hd\">归属链：主理人 → 绑定项目 → 项目所属城市公司 → 城市<\/div>\n              <div><span class=\"node\">林晓霞<\/span><span class=\"arrow\">→<\/span><span class=\"node\" style=\"color:#9AA3B2\">待绑定项目（审核时确定，可绑定多个）<\/span><span class=\"arrow\">→<\/span><span class=\"node\" style=\"color:#9AA3B2\">项目所属城市公司<\/span><span class=\"arrow\">→<\/span><span class=\"node\">深圳<\/span><\/div>\n              <div style=\"color:#8A93A3\">· 城市管理员审核通过时绑定项目并建立归属链，一个主理人可绑定多个项目<\/div>\n            <\/div>\n          <\/div>\n\n          <div class=\"card\" style=\"margin-bottom:0\">\n            <h3>审核记录<\/h3>\n            <ul class=\"tl\">\n              <li><div class=\"t\">提交资料<\/div><div class=\"s\">林晓霞 · 2026-07-18 10:26<\/div><\/li>\n              <li><div class=\"t\">进入城市管理员审核<\/div><div class=\"s\">系统 · 2026-07-18 10:26<\/div><\/li>\n              <li><div class=\"t\">当前待审核<\/div><div class=\"s\">由城市管理员处理<\/div><\/li>\n            <\/ul>\n          <\/div>\n        <\/div>\n      <\/div>\n    <\/main>\n  <\/div>\n<\/div>\n\n<!-- 遮罩与审核弹窗 -->\n<div class=\"overlay\" id=\"overlay\"><\/div>\n<div class=\"modal\" id=\"modal\">\n  <div class=\"m-head\">\n    <div>\n      <h2 id=\"mTitle\">主理人审核（城市管理员）<\/h2>\n      <div class=\"sub\" id=\"mSub\"><\/div>\n    <\/div>\n    <button class=\"m-close\" id=\"mClose\" type=\"button\">✕<\/button>\n  <\/div>\n  <div class=\"m-body\" id=\"mBody\"><\/div>\n  <div class=\"m-foot\">\n    <button class=\"btn btn-cancel\" id=\"mCancel\" type=\"button\">取消<\/button>\n    <button class=\"btn btn-blue\" id=\"mOk\" type=\"button\">提交审核结果<\/button>\n  <\/div>\n<\/div>\n<div class=\"toast\" id=\"toast\"><\/div>\n\n<script>\n/* PC 端仅一个审核节点：城市管理员审核；同一弹窗完成 绑定项目 / 荟豆账号 / 是否发放认证奖励 */\nvar PROJECTS = [\n  {name:'招商玺 · 蛇口', company:'蛇口城市公司', city:'深圳'},\n  {name:'海上世界',      company:'蛇口城市公司', city:'深圳'},\n  {name:'南海玫瑰园',    company:'南山城市公司', city:'深圳'},\n  {name:'太子湾',        company:'蛇口城市公司', city:'深圳'}\n];\nvar AUD_NAME = '林晓霞';\n\nfunction toast(msg){\n  var t = document.getElementById('toast');\n  t.textContent = msg; t.classList.add('show');\n  clearTimeout(t._t); t._t = setTimeout(function(){ t.classList.remove('show'); }, 2600);\n}\nfunction selectedProjects(){\n  var out = [], on = document.querySelectorAll('#projChips .chip.on');\n  for (var i=0;i<on.length;i++) out.push(+on[i].getAttribute('data-i'));\n  return out;\n}\nfunction refreshChain(){\n  var idxs = selectedProjects();\n  var box = document.getElementById('chainBox');\n  if (!idxs.length){\n    box.innerHTML = '<div class=\"chain\"><div class=\"hd\">归属链：主理人 → 绑定项目 → 项目所属城市公司 → 城市<\/div><div style=\"color:#9AA3B2\">尚未绑定项目，请至少选择一个项目<\/div><\/div>';\n    return;\n  }\n  var proj = idxs.map(function(i){ return '<span class=\"node\">'+PROJECTS[i].name+'<\/span>'; }).join('');\n  var comp = [], city = [];\n  idxs.forEach(function(i){\n    if (comp.indexOf(PROJECTS[i].company)<0) comp.push(PROJECTS[i].company);\n    if (city.indexOf(PROJECTS[i].city)<0)    city.push(PROJECTS[i].city);\n  });\n  var line = '<div><span class=\"node\">'+AUD_NAME+'<\/span><span class=\"arrow\">→<\/span>'+proj\n    + '<span class=\"arrow\">→<\/span>' + comp.map(function(c){return '<span class=\"node\">'+c+'<\/span>';}).join('<span style=\"color:#D5DBE4\">/<\/span>')\n    + '<span class=\"arrow\">→<\/span>' + city.map(function(c){return '<span class=\"node\">'+c+'<\/span>';}).join('<span style=\"color:#D5DBE4\">/<\/span>') + '<\/div>';\n  var detail = idxs.map(function(i){\n    return '<div style=\"color:#8A93A3\">· '+PROJECTS[i].name+' &nbsp;·&nbsp; '+PROJECTS[i].company+' &nbsp;·&nbsp; '+PROJECTS[i].city+'<\/div>';\n  }).join('');\n  box.innerHTML = '<div class=\"chain\"><div class=\"hd\">归属链：主理人 → 绑定项目 → 项目所属城市公司 → 城市<\/div>' + line + detail + '<\/div>';\n}\nfunction toggleChip(btn){\n  btn.classList.toggle('on');\n  document.getElementById('errProj').classList.remove('show');\n  refreshChain();\n}\nfunction toggleReward(){\n  document.getElementById('fBean').style.display = document.getElementById('mRewardY').checked ? '' : 'none';\n}\nfunction toggleAudit(v){\n  var pass = v !== '未通过';\n  document.getElementById('fPass').style.display = pass ? '' : 'none';\n  document.getElementById('fReason').style.display = pass ? 'none' : '';\n}\nfunction openAudit(){\n  var chips = PROJECTS.map(function(p,i){ return '<button type=\"button\" class=\"chip\" data-i=\"'+i+'\">'+p.name+'<\/button>'; }).join('');\n  document.getElementById('mSub').textContent = 'APL20260718001 · ' + AUD_NAME + ' · 待审核';\n  document.getElementById('mBody').innerHTML =\n      '<div>PC 端仅一个审核节点：城市管理员审核。通过即完成认证，以下三项操作在同一弹窗内完成。<\/div>'\n    + '<div class=\"m-field\"><div class=\"m-label\">审核结果<\/div>'\n    + '<select class=\"m-select\" id=\"mResult\" onchange=\"toggleAudit(this.value)\"><option value=\"已认证\">通过，完成认证<\/option><option value=\"未通过\">不通过，退回申请人<\/option><\/select><\/div>'\n    + '<div id=\"fPass\">'\n    +   '<div class=\"g-group\"><div class=\"g-label\"><span class=\"req\">*<\/span>绑定项目<span class=\"paren\">（可多选，一个主理人可绑定多个项目）<\/span><\/div>'\n    +     '<div class=\"chips\" id=\"projChips\">' + chips + '<\/div>'\n    +     '<div id=\"chainBox\"><\/div>'\n    +     '<div class=\"err-txt\" id=\"errProj\">请至少绑定一个项目（绑定项目为审核关键动作）<\/div>'\n    +   '<\/div>'\n    +   '<div class=\"g-group\"><div class=\"g-label\"><span class=\"req\">*<\/span>是否发放认证奖励（荟豆）<\/div>'\n    +     '<div class=\"radio-row\">'\n    +       '<label><input type=\"radio\" name=\"mReward\" id=\"mRewardY\" value=\"发放\" checked onchange=\"toggleReward()\">发放认证奖励<\/label>'\n    +       '<label><input type=\"radio\" name=\"mReward\" id=\"mRewardN\" value=\"不发放\" onchange=\"toggleReward()\">不发放<\/label>'\n    +     '<\/div>'\n    +     '<div class=\"m-field\" id=\"fBean\" style=\"margin-top:10px\"><div class=\"m-label\">认证奖励荟豆数<\/div>'\n    +       '<input class=\"m-input\" id=\"mBean\" type=\"text\" value=\"500\">'\n    +     '<\/div>'\n    +   '<\/div>'\n    +   '<div class=\"g-group\"><div class=\"g-label\"><span class=\"req\">*<\/span>选择发放奖励（荟豆）的账号<\/div>'\n    +     '<select class=\"m-select\" id=\"mAcc\" onchange=\"this.classList.remove(\\'error\\')\"><option value=\"\">请选择发放奖励（荟豆）的账号<\/option><option value=\"FKW_Recharge_sz\">FKW_Recharge_sz<\/option><option value=\"FKW_Recharge_sh\">FKW_Recharge_sh<\/option><\/select>'\n    +     '<div class=\"m-tip\">奖励将发放至该主理人的荟豆账户<\/div>'\n    +   '<\/div>'\n    + '<\/div>'\n    + '<div class=\"m-field\" id=\"fReason\" style=\"display:none\"><div class=\"m-label\">驳回原因（必填，将同步至 C 端主理人）<\/div>'\n    + '<textarea class=\"m-textarea\" id=\"mReason\" placeholder=\"请填写驳回原因\" oninput=\"this.classList.remove(\\'error\\')\"><\/textarea><\/div>'\n    + '<div class=\"m-tip\">归属关系：主理人 → 绑定项目 → 项目所属城市公司 → 城市；审核通过后状态更新为「已认证」。<\/div>';\n  refreshChain();\n  document.getElementById('overlay').classList.add('show');\n  document.getElementById('modal').classList.add('show');\n}\nfunction closeModal(){\n  document.getElementById('overlay').classList.remove('show');\n  document.getElementById('modal').classList.remove('show');\n}\ndocument.getElementById('btnAudit').addEventListener('click', openAudit);\ndocument.getElementById('mCancel').addEventListener('click', closeModal);\ndocument.getElementById('mClose').addEventListener('click', closeModal);\ndocument.getElementById('overlay').addEventListener('click', closeModal);\ndocument.addEventListener('click', function(e){\n  var chip = e.target.closest ? e.target.closest('.chip') : null;\n  if (chip && document.getElementById('modal').classList.contains('show')){ e.preventDefault(); toggleChip(chip); return; }\n});\ndocument.getElementById('mOk').addEventListener('click', function(){\n  var pass = document.getElementById('mResult').value === '已认证';\n  var tag = document.getElementById('headTag');\n  if (pass){\n    var idxs = selectedProjects();\n    if (!idxs.length){ document.getElementById('errProj').classList.add('show'); return; }\n    var giveBeans = document.getElementById('mRewardY').checked;\n    var beans = document.getElementById('mBean').value.trim();\n    if (giveBeans && !(Number(beans) > 0)){ toast('请填写有效的认证奖励荟豆数'); return; }\n    var acc = document.getElementById('mAcc').value.trim();\n    if (!acc){ var accEl = document.getElementById('mAcc'); accEl.classList.add('error'); accEl.focus(); toast('请选择发放奖励（荟豆）的账号'); return; }\n    var names = idxs.map(function(i){ return PROJECTS[i].name; });\n    var comp = [], city = [];\n    idxs.forEach(function(i){\n      if (comp.indexOf(PROJECTS[i].company)<0) comp.push(PROJECTS[i].company);\n      if (city.indexOf(PROJECTS[i].city)<0)    city.push(PROJECTS[i].city);\n    });\n    var proj = names.map(function(n){ return '<span class=\"node\">'+n+'<\/span>'; }).join('');\n    document.getElementById('ownChain').innerHTML =\n        '<div class=\"hd\">归属链：主理人 → 绑定项目 → 项目所属城市公司 → 城市<\/div>'\n      + '<div><span class=\"node\">'+AUD_NAME+'<\/span><span class=\"arrow\">→<\/span>'+proj\n      + '<span class=\"arrow\">→<\/span>' + comp.map(function(c){return '<span class=\"node\">'+c+'<\/span>';}).join('<span style=\"color:#D5DBE4\">/<\/span>')\n      + '<span class=\"arrow\">→<\/span>' + city.map(function(c){return '<span class=\"node\">'+c+'<\/span>';}).join('<span style=\"color:#D5DBE4\">/<\/span>') + '<\/div>'\n      + '<div style=\"color:#8A93A3\">· 审核通过时绑定并建立归属链，一个主理人可绑定多个项目<\/div>';\n    tag.textContent = '已通过';\n    tag.style.background = '#E4F6EB'; tag.style.color = '#18A058';\n    document.getElementById('btnAudit').style.display = 'none';\n    closeModal();\n    toast('已审核通过「'+AUD_NAME+'」：绑定项目 '+names.join('、')\n      + (giveBeans ? '；发放认证奖励 '+beans+' 荟豆至 '+acc : '；不发放认证奖励'));\n  } else {\n    var r = document.getElementById('mReason');\n    if (!r.value.trim()){ r.classList.add('error'); r.focus(); return; }\n    tag.textContent = '未通过';\n    tag.style.background = '#FDEBEB'; tag.style.color = '#E5484D';\n    document.getElementById('btnAudit').style.display = 'none';\n    closeModal();\n    toast('已驳回「'+AUD_NAME+'」的申请，状态更新为「未通过」');\n  }\n});\n<\/script>\n<script>\n(function(){\ndocument.addEventListener('click',function(e){\n  var t=e.target;\n  while(t&&t.nodeType===1&&t.tagName!=='A'){t=t.parentNode;}\n  if(t&&t.getAttribu >\n    <\/div>\n  <\/div>\n<\/div>\n\n<script>\n(function(){\n  var MAX=200, MIN=5;\n  var ta=document.getElementById('reasonTa');\n  var count=document.getElementById('reasonCount');\n  var err=document.getElementById('reasonErr');\n  var remark=document.getElementById('remarkTa');\n  var formView=document.getElementById('rejectForm');\n  var flowView=document.getElementById('rejectFlow');\n  var ceReason=document.getElementById('ceReason');\n  var ceNext=document.getElementById('ceNext');\n  var ceBtn=document.getElementById('ceBtn');\n  var step2=document.getElementById('step2');\n  var step3=document.getElementById('step3');\n  var step4=document.getElementById('step4');\n\n  function showErr(msg){\n    err.textContent=msg;\n    err.classList.add('show');\n    ta.classList.add('error');\n  }\n  function clearErr(){\n    err.classList.remove('show');\n    ta.classList.remove('error');\n  }\n\n  ta.addEventListener('input', function(){\n    var len=ta.value.length;\n    count.textContent=len+' / '+MAX;\n    if(len>MAX){\n      count.classList.add('over');\n      showErr('驳回原因不能超过 '+MAX+' 字，当前 '+len+' 字');\n    }else{\n      count.classList.remove('over');\n      clearErr();\n    }\n  });\n\n  document.getElementById('btnSubmit').addEventListener('click', function(){\n    var v=ta.value.trim();\n    if(v.length===0){ showErr('请填写驳回原因'); ta.focus(); return; }\n    if(v.length<MIN){ showErr('驳回原因不少于 '+MIN+' 个字，当前 '+v.length+' 个字'); ta.focus(); return; }\n    if(v.length>MAX){ showErr('驳回原因不能超过 '+MAX+' 字'); ta.focus(); return; }\n    clearErr();\n    ceReason.textContent=v;\n    formView.style.display='none';\n    flowView.style.display='block';\n    resetFlow();\n  });\n\n  function resetFlow(){\n    step2.className='cur'; step3.className=''; step4.className='';\n    ceNext.classList.remove('show');\n    ceBtn.style.display='block';\n    ceBtn.textContent='修改资料并重新提交';\n  }\n\n  // 模拟主理人在 C 端完成：查看 → 修改 → 重新提交\n  ceBtn.addEventListener('click', function(){\n    if(step2.className==='cur'){\n      step2.className='done';\n      step3.className='cur';\n      ceBtn.textContent='提交修改后的申请资料';\n      return;\n    }\n    if(step3.className==='cur'){\n      step3.className='done';\n      step4.className='cur';\n      ceBtn.style.display='none';\n      ceNext.classList.add('show');\n      return;\n    }\n  });\n\n  document.getElementById('btnCancel').addEventListener('click', function(){\n    ta.value=''; remark.value=''; count.textContent='0 / '+MAX; clearErr(); count.classList.remove('over');\n  });\n  document.getElementById('btnReplay').addEventListener('click', function(){\n    formView.style.display='block';\n    flowView.style.display='none';\n    ta.value=''; remark.value=''; count.textContent='0 / '+MAX; clearErr(); count.classList.remove('over');\n  });\n  document.getElementById('btnDone').addEventListener('click', function(){\n    formView.style.display='block';\n    flowView.style.display='none';\n    ta.value=''; remark.value=''; count.textContent='0 / '+MAX; clearErr(); count.classList.remove('over');\n  });\n  var closers=document.querySelectorAll('.m-close');\n  for(var i=0;i<closers.length;i++){\n    closers[i].addEventListener('click', function(){\n      formView.style.display='block';\n      flowView.style.display='none';\n      ta.value=''; remark.value=''; count.textContent='0 / '+MAX; clearErr(); count.classList.remove('over');\n    });\n  }\n})();\n<\/script>\n<script>\n(function(){\ndocument.addEventListener('click',function(e){\n  var t=e.target;\n  while(t&&t.nodeType===1&&t.tagName!=='A'){t=t.parentNode;}\n  if(t&&t.getAttribute&&t.getAttribute('data-goto')){\n    e.preventDefault();e.stopPropagation();\n    parent.postMessage({__navGo:parseInt(t.getAttribute('data-goto'),10)},'*');\n  }\n},true);\n})();\n<\/script><\/body>\n<\/html>\n"}, {"no": "6", "title": "未通过详情 · 重新审核", "html": "<!DOCTYPE html>\n<html lang=\"zh-CN\">\n<head>\n<meta charset=\"UTF-8\">\n<meta name=\"viewport\" content=\"width=device-width, 成为日常。<\/div><\/div>\n              <div class=\"dl-row\"><div class=\"k\">社群标签<\/div><div class=\"v\"><span class=\"tag-b\">志愿服务<\/span><span class=\"tag-b\">助老<\/span><span class=\"tag-b\">环保<\/span><\/div><\/div>\n            <\/div>\n          <\/div>\n\n          <div class=\"card\">\n            <h3>归属信息<\/h3>\n            <div class=\"chain\" id=\"ownChain\">\n              <div class=\"hd\">归属链：主理人 → 绑定项目 → 项目所属城市公司 → 城市<\/div>\n              <div><span class=\"node\">刘文博<\/span><span class=\"arrow\">→<\/span><span class=\"node\" style=\"color:#9AA3B2\">未绑定项目（未通过，未进入绑定环节）<\/span><span class=\"arrow\">→<\/span><span class=\"node\" style=\"color:#9AA3B2\">项目所属城市公司<\/span><span class=\"arrow\">→<\/span><span class=\"node\">深圳<\/span><\/div>\n              <div style=\"color:#8A93A3\">· 城市管理员审核通过时绑定项目并建立归属链，一个主理人可绑定多个项目<\/div>\n            <\/div>\n          <\/div>\n\n          <div class=\"card\" style=\"margin-bottom:0\">\n            <h3>审核记录<\/h3>\n            <ul class=\"tl\" id=\"recList\">\n              <li><div class=\"t\">提交资料<\/div><div class=\"s\">刘文博 · 2026-07-05 11:06<\/div><\/li>\n              <li><div class=\"t\">进入城市管理员审核<\/div><div class=\"s\">系统 · 2026-07-05 11:06<\/div><\/li>\n              <li class=\"fail\"><div class=\"t\">审核未通过<\/div><div class=\"s\">城市管理员（张敏）· 2026-07-06 14:32<\/div><\/li>\n              <li><div class=\"t\">驳回原因已同步 C 端<\/div><div class=\"s\">系统 · 2026-07-06 14:33　主理人可在「主理人中心」查看并重新提交<\/div><\/li>\n            <\/ul>\n          <\/div>\n        <\/div>\n      <\/div>\n    <\/main>\n  <\/div>\n<\/div>\n\n<!-- 遮罩与审核弹窗 -->\n<div class=\"overlay\" id=\"overlay\"><\/div>\n<div class=\"modal\" id=\"modal\">\n  <div class=\"m-head\">\n    <div>\n      <h2 id=\"mTitle\">主理人审核（城市管理员）<\/h2>\n      <div class=\"sub\" id=\"mSub\"><\/div>\n    <\/div>\n    <button class=\"m-close\" id=\"mClose\" type=\"button\">✕<\/button>\n  <\/div>\n  <div class=\"m-body\" id=\"mBody\"><\/div>\n  <div class=\"m-foot\">\n    <button class=\"btn btn-cancel\" id=\"mCancel\" type=\"button\">取消<\/button>\n    <button class=\"btn btn-blue\" id=\"mOk\" type=\"button\">提交审核结果<\/button>\n  <\/div>\n<\/div>\n<div class=\"toast\" id=\"toast\"><\/div>\n\n<script>\n/* PC 端仅一个审核节点：城市管理员审核；同一弹窗完成 绑定项目 / 荟豆账号 / 是否发放认证奖励 */\nvar PROJECTS = [\n  {name:'招商玺 · 蛇口', company:'蛇口城市公司', city:'深圳'},\n  {name:'海上世界',      company:'蛇口城市公司', city:'深圳'},\n  {name:'南海玫瑰园',    company:'南山城市公司', city:'深圳'},\n  {name:'太子湾',        company:'蛇口城市公司', city:'深圳'}\n];\nvar AUD_NAME = '刘文博';\nvar AUD_CODE = 'APL20260705027';\nvar AUD_SUBMIT = '2026-07-05 11:06';\nvar PASS_TIME = '2026-07-08 10:15';\nvar OPEN_TIME = '2026-07-08 10:16';\nvar DONE_DOT = '<svg width=\"13\" height=\"13\" viewBox=\"0 0 14 14\" fill=\"none\"><path d=\"M3 7.4 5.8 10 11 4.4\" stroke=\"#fff\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><\/svg>';\n\nfunction toast(msg){\n  var t = document.getElementById('toast');\n  t.textContent = msg; t.classList.add('show');\n  clearTimeout(t._t); t._t = setTimeout(function(){ t.classList.remove('show'); }, 2600);\n}\nfunction selectedProjects(){\n  var out = [], on = document.querySelectorAll('#projChips .chip.on');\n  for (var i=0;i<on.length;i++) out.push(+on[i].getAttribute('data-i'));\n  return out;\n}\nfunction chainLine(idxs, note){\n  var proj = idxs.map(function(i){ return '<span class=\"node\">'+PROJECTS[i].name+'<\/span>'; }).join('');\n  var comp = [], city = [];\n  idxs.forEach(function(i){\n    if (comp.indexOf(PROJECTS[i].company)<0) comp.push(PROJECTS[i].company);\n    if (city.indexOf(PROJECTS[i].city)<0)    city.push(PROJECTS[i].city);\n  });\n  return '<div class=\"hd\">归属链：主理人 → 绑定项目 → 项目所属城市公司 → 城市<\/div>'\n    + '<div><span class=\"node\">'+AUD_NAME+'<\/span><span class=\"arrow\">→<\/span>' + proj\n    + '<span class=\"arrow\">→<\/span>' + comp.map(function(c){return '<span class=\"node\">'+c+'<\/span>';}).join('<span style=\"color:#D5DBE4\">/<\/span>')\n    + '<span class=\"arrow\">→<\/span>' + city.map(function(c){return '<span class=\"node\">'+c+'<\/span>';}).join('<span style=\"color:#D5DBE4\">/<\/span>') + '<\/div>'\n    + '<div style=\"color:#8A93A3\">' + note + '<\/div>';\n}\nfunction refreshChain(){\n  var idxs = selectedProjects(), box = document.getElementById('chainBox');\n  if (!idxs.length){\n    box.innerHTML = '<div class=\"chain\"><div class=\"hd\">归属链：主理人 → 绑定项目 → 项目所属城市公司 → 城市<\/div><div style=\"color:#9AA3B2\">尚未绑定项目，请至少选择一个项目<\/div><\/div>';\n    return;\n  }\n  var detail = idxs.map(function(i){ return '<div style=\"color:#8A93A3\">· '+PROJECTS[i].name+' &nbsp;·&nbsp; '+PROJECTS[i].company+' &nbsp;·&nbsp; '+PROJECTS[i].city+'<\/div>'; }).join('');\n  box.innerHTML = '<div class=\"chain\">' + chainLine(idxs, '· 审核通过后按此归属链建立关系，一个主理人可绑定多个项目') + detail + '<\/div>';\n}\nfunction toggleChip(btn){\n  btn.classList.toggle('on');\n  document.getElementById('errProj').classList.remove('show');\n  refreshChain();\n}\nfunction toggleReward(){\n  document.getElementById('fBean').style.display = document.getElementById('mRewardY').checked ? '' : 'none';\n}\nfunction toggleAudit(v){\n  var pass = v !== '未通过';\n  document.getElementById('fPass').style.display = pass ? '' : 'none';\n  document.getElementById('fReason').style.display = pass ? 'none' : '';\n}\nfunction clr(el){ el.classList.remove('error'); }\n\nfunction openAudit(){\n  var chips = PROJECTS.map(function(p,i){ return '<button type=\"button\" class=\"chip\" data-i=\"'+i+'\">'+p.name+'<\/button>'; }).join('');\n  document.getElementById('mSub').textContent = AUD_CODE + ' · ' + AUD_NAME + ' · 未通过（重新审核）';\n  document.getElementById('mBody').innerHTML =\n      '<div>主理人已补充资料，城市管理员可重新审核。PC 端仅一个审核节点，以下三项操作在同一弹窗内完成。<\/div>'\n    + '<div class=\"m-field\"><div class=\"m-label\">审核结果<\/div>'\n    + '<select class=\"m-select\" id=\"mResult\" onchange=\"toggleAudit(this.value)\"><option value=\"已认证\">通过，完成认证<\/option><option value=\"未通过\">不通过，维持原驳回结果<\/option><\/select><\/div>'\n    + '<div id=\"fPass\">'\n    +   '<div class=\"g-group\"><div class=\"g-label\"><span class=\"req\">*<\/span>绑定项目<span class=\"paren\">（可多选，一个主理人可绑定多个项目）<\/span><\/div>'\n    +     '<div class=\"chips\" id=\"projChips\">' + chips + '<\/div>'\n    +     '<div id=\"chainBox\"><\/div>'\n    +     '<div class=\"err-txt\" id=\"errProj\">请至少绑定一个项目（绑定项目为审核关键动作）<\/div>'\n    +   '<\/div>'\n    +   '<div class=\"g-group\"><div class=\"g-label\"><span class=\"req\">*<\/span>是否发放认证奖励（荟豆）<\/div>'\n    +     '<div class=\"radio-row\">'\n    +       '<label><input type=\"radio\" name=\"mReward\" id=\"mRewardY\" value=\"发放\" checked onchange=\"toggleReward()\">发放认证奖励<\/label>'\n    +       '<label><input type=\"radio\" name=\"mReward\" id=\"mRewardN\" value=\"不发放\" onchange=\"toggleReward()\">不发放<\/label>'\n    +     '<\/div>'\n    +     '<div class=\"m-field\" id=\"fBean\" style=\"margin-top:10px\"><div class=\"m-label\">认证奖励荟豆数<\/div>'\n    +       '<input class=\"m-input\" id=\"mBean\" type=\"text\" value=\"500\">'\n    +     '<\/div>'\n    +   '<\/div>'\n    +   '<div class=\"g-group\"><div class=\"g-label\"><span class=\"req\">*<\/span>选择发放奖励（荟豆）的账号<\/div>'\n    +     '<select class=\"m-select\" id=\"mAcc\" onchange=\"clr(this)\"><option value=\"\">请选择发放奖励（荟豆）的账号<\/option><option value=\"FKW_Recharge_sz\">FKW_Recharge_sz<\/option><option value=\"FKW_Recharge_sh\">FKW_Recharge_sh<\/option><\/select>'\n    +     '<div class=\"m-tip\">奖励将发放至该主理人的荟豆账户<\/div>'\n    +   '<\/div>'\n    + '<\/div>'\n    + '<div class=\"m-field\" id=\"fReason\" style=\"display:none\"><div class=\"m-label\">驳回原因（必填，将同步至 C 端主理人）<\/div>'\n    + '<textarea class=\"m-textarea\" id=\"mReason\" placeholder=\"请填写驳回原因\" oninput=\"clr(this)\"><\/textarea><\/div>'\n    + '<div class=\"m-tip\">归属关系：主理人 → 绑定项目 → 项目所属城市公司 → 城市；审核通过后状态更新为「已认证」。<\/div>';\n  refreshChain();\n  document.getElementById('overlay').classList.add('show');\n  document.getElementById('modal').classList.add('show');\n}\nfunction closeModal(){\n  document.getElementById('overlay').classList.remove('show');\n  document.getElementById('modal').classList.remove('show');\n}\n\n/* 审核通过后，整页由「未通过」流转为「已通过」 */\nfunction flowToPassed(idxs, acc, giveBeans, beans){\n  var names = idxs.map(function(i){ return PROJECTS[i].name; });\n  var comp = [], city = [];\n  idxs.forEach(function(i){\n    if (comp.indexOf(PROJECTS[i].company)<0) comp.push(PROJECTS[i].company);\n    if (city.indexOf(PROJECTS[i].city)<0)    city.push(PROJECTS[i].city);\n  });\n  // 头部\n  var tag = document.getElementById('headTag');\n  tag.className = 'tag-pass'; tag.textContent = '已通过';\n  document.getElementById('headMeta').innerHTML = '申请编号：' + AUD_CODE + '&emsp;·&emsp;申请时间：' + AUD_SUBMIT + '&emsp;·&emsp;通过时间：' + PASS_TIME;\n  // 步骤条\n  document.getElementById('stepBar').innerHTML =\n      '<div class=\"step done\"><div class=\"dot dot-done\">'+DONE_DOT+'<\/div><div class=\"s-t\">提交资料<\/div><div class=\"s-s\">'+AUD_SUBMIT+'<\/div><\/div>'\n    + '<div class=\"seg\"><\/div>'\n    + '<div class=\"step done\"><div class=\"dot dot-done\">'+DONE_DOT+'<\/div><div class=\"s-t\">城市管理员审核<\/div><div class=\"s-s\">已通过 · '+PASS_TIME+'<\/div><\/div>'\n    + '<div class=\"seg\"><\/div>'\n    + '<div class=\"step done\"><div class=\"dot dot-done\">'+DONE_DOT+'<\/div><div class=\"s-t\">认证开通<\/div><div class=\"s-s\">'+OPEN_TIME+'<\/div><\/div>';\n  // 审核结果卡\n  document.getElementById('resBody').innerHTML =\n      '<div class=\"res-grid\">'\n    +   '<div class=\"res-cell\"><div class=\"k\">审核结果<\/div><div class=\"v pass\">已通过<\/div><\/div>'\n    +   '<div class=\"res-cell\"><div class=\"k\">通过时间<\/div><div class=\"v\">'+PASS_TIME+'<\/div><\/div>'\n    +   '<div class=\"res-cell\"><div class=\"k\">操作人<\/div><div class=\"v\">城市管理员（张敏）<\/div><\/div>'\n    +   '<div class=\"res-cell\"><div class=\"k\">认证开通时间<\/div><div class=\"v\">'+OPEN_TIME+'<\/div><\/div>'\n    +   '<div class=\"res-cell\"><div class=\"k\">绑定项目<\/div><div class=\"v\">'+names.join('、')+'<\/div><\/div>'\n    +   '<div class=\"res-cell\"><div class=\"k\">发放奖励（荟豆）账号<\/div><div class=\"v\">'+acc+'<\/div><\/div>'\n    +   '<div class=\"res-cell\"><div class=\"k\">认证奖励（荟豆）<\/div><div class=\"v\">'+(giveBeans ? beans+' 荟豆' : '不发放')+'<\/div><\/div>'\n    +   '<div class=\"res-cell\"><div class=\"k\">当前状态<\/div><div class=\"v\">主理人已开通，可创建社群并发布活动<\/div><\/div>'\n    + '<\/div>'\n    + '<div class=\"note-block\" style=\"margin-bottom:0\"><div class=\"k\">运营备注（内部可见，不展示给主理人）<\/div>'\n    + '<div class=\"bx\">主理人已补充义工联服务证明，重新审核通过，归属关系按绑定项目生效。<\/div><\/div>';\n  // 归属链\n  document.getElementById('ownChain').innerHTML = chainLine(idxs,\n    '· ' + PASS_TIME.slice(0,10) + ' 城市管理员重新审核时绑定并建立归属链，一个主理人可绑定多个项目');\n  // 审核记录\n  document.getElementById('recList').innerHTML =\n      '<li><div class=\"t\">提交资料<\/div><div class=\"s\">'+AUD_NAME+' · '+AUD_SUBMIT+'<\/div><\/li>'\n    + '<li class=\"fail\"><div class=\"t\">审核未通过<\/div><div class=\"s\">城市管理员（张敏）· 2026-07-06 14:32<\/div><\/li>'\n    + '<li><div class=\"t\">主理人补充资料并重新提交<\/div><div class=\"s\">'+AUD_NAME+' · 2026-07-08 09:40<\/div><\/li>'\n    + '<li class=\"pass\"><div class=\"t\">重新审核通过<\/div><div class=\"s\">城市管理员（张敏）· '+PASS_TIME+'　绑定项目 '+names.join('、')+'<\/div><\/li>'\n    + '<li class=\"pass\"><div class=\"t\">认证已开通<\/div><div class=\"s\">系统 · '+OPEN_TIME+'　主理人权益已生效<\/div><\/li>';\n  // 操作区\n  var hb = document.getElementById('headBtns');\n  hb.innerHTML = '<button class=\"btn btn-outline\" id=\"btnCommunity\" title=\"查看该主理人的社群与活动\">查看主理社群<\/button>'\n    + '<button class=\"btn btn-disabled\" disabled title=\"该申请已通过，不可驳回\">驳回申请<\/button>';\n  document.getElementById('btnCommunity').addEventListener('click', function(){\n    toast('已跳转该主理人的社群与活动列表（原型示意）');\n  });\n  closeModal();\n  toast('已重新审核通过「'+AUD_NAME+'」：绑定项目 '+names.join('、')\n    + (giveBeans ? '；发放认证奖励 '+beans+' 荟豆至 '+acc : '；不发放认证奖励'));\n}\n\ndocument.getElementById('btnReaudit').addEventListener('click', openAudit);\ndocument.getElementById('mCancel').addEventListener('click', closeModal);\ndocument.getElementById('mClose').addEventListener('click', closeModal);\ndocument.getElementById('overlay').addEventListener('click', closeModal);\ndocument.addEventListener('click', function(e){\n  var chip = e.target.closest ? e.target.closest('.chip') : null;\n  if (chip && document.getElementById('modal').classList.contains('show')){ e.preventDefault(); toggleChip(chip); return; }\n});\ndocument.getElementById('mOk').addEventListener('click', function(){\n  var pass = document.getElementById('mResult').value === '已认证';\n  if (pass){\n    var idxs = selectedProjects();\n    if (!idxs.length){ document.getElementById('errProj').classList.add('show'); return; }\n    var giveBeans = document.getElementById('mRewardY').checked;\n    var beans = document.getElementById('mBean').value.trim();\n    if (giveBeans && !(Number(beans) > 0)){ toast('请填写有效的认证奖励荟豆数'); return; }\n    var acc = document.getElementById('mAcc').value.trim();\n    if (!acc){ var a = document.getElementById('mAcc'); a.classList.add('error'); a.focus(); toast('请选择发放奖励（荟豆）的账号'); return; }\n    flowToPassed(idxs, acc, giveBeans, beans);\n    return;\n  }\n  var r = document.getElementById('mReason');\n  if (!r.value.trim()){ r.classList.add('error'); r.focus(); return; }\n  closeModal();\n  toast('已维持驳回结果「'+AUD_NAME+'」，驳回原因已同步至 C 端');\n});\n<\/script>\n<script>\n(function(){\ndocument.addEventListener('click',function(e){\n  var t=e.target;\n  while(t&&t.nodeType===1&&t.tagName!=='A'){t=t.parentNode;}\n  if(t&&t.getAttribute&&t.getAttribute('data-goto')){\n    e.preventDefault();e.stopPropagation();\n    parent.postMessage({__navGo:parseInt(t.getAttribute('data-goto'),10)},'*');\n  }\n},true);\n})();\n<\/script><\/body>\n<\/html>\n"}, {"no": "7", "title": "通过审核详情（终态）", "html": "<!DOCTYPE html>\n<html lang=\"zh-CN\">\n<head>\n<meta charset=\"UTF-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n<title>管理后台-通过审核的申请详情<\/title>\n<style>\n*{margin:0;padding:0;box-sizing:border-box}\nbody{font-family:-apple-system,BlinkMacSystemFont,\"PingFang SC\",\"Microsoft YaHei\",sans-serif;background:#EFF2F7;color:#1F2937;font-size:14px}\n.app{display:flex;min-height:100vh}\n/* ---------- 侧边栏 ---------- */\n.sidebar{width:170px;background:linear-gradient(180deg,#0D2C55,#0A2143);color:#fff;flex-shrink:0;position:sticky;top:0;height:100vh;display:flex;flex-direction:column}\n.brand{display:flex;align-items:center;gap:8px;padding:14px 12px}\n.brand-logo{width:30px;height:30px;border:1.5px solid rgba(255,255,255,.8);border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0}\n.brand-logo svg{display:block}\n.brand-name{font-weight:700;font-size:14px;line-height:1.3}\n.menu{flex:1;padding:4px 8px;overflow-y:auto}\n.menu a{display:flex;align-items:center;gap:8px;color:rgba(255,255,255,.82);text-decoration:none;font-size:13px;padding:10px 10px;border-radius:6px;margin-bottom:2px}\n.menu .dia{width:5px;height:5px;border:1.2px solid currentColor;transform:rotate(45deg);opacity:.7;flex-shrink:0}\n.menu a.active{background:#1C5BD4;color:#fff}\n.menu a.sub{padding-left:30px;font-size:12.5px}\n/* ---------- 顶栏 ---------- */\n.right{flex:1;min-width:0;display:flex;flex-direction:column}\n.topbar{height:48px;background:#1C5BD4;display:flex;align-items:center;justify-content:flex-end;gap:26px;padding:0 24px;color:#fff;position:sticky;top:0;z-index:5;font-size:13px}\n.topbar .t-item{display:flex;align-items:center;gap:6px;cursor:pointer;opacity:.95}\n.topbar .caret{width:0;height:0;border-left:4px solid transparent;border-right:4px solid transparent;border-top:4px solid rgba(255,255,255,.9)}\n/* ---------- 主体 ---------- */\n.main{flex:1;padding:14px 18px 28px}\n.crumb{font-size:12px;color:#9AA3B2}\n.crumb b{color:#4B5563;font-weight:500}\n.head-row{display:flex;align-items:flex-start;justify-content:space-between;margin:12px 0 16px}\n.head-left{display:flex;gap:14px}\n.back{font-size:20px;color:#374151;text-decoration:none;line-height:1.2;margin-top:2px}\n.h-name{display:flex;align-items:center;gap:10px}\n.h-name h1{font-size:22px;font-weight:700;color:#111827}\n.tag-fail{font-size:12px;color:#E5484D;background:#FDECEC;border:1px solid #F7C9CB;border-radius:4px;padding:3px 8px;font-weight:500}\n.tag-pass{font-size:12px;color:#18A058;background:#E4F6EB;border:1px solid #B7E7CB;border-radius:4px;padding:3px 8px;font-weight:500}\n.tag-y{font-size:12px;color:#C07A00;background:#FCF3DC;border-radius:4px;padding:3px 8px}\n.h-meta{font-size:12px;color:#8A93A3;margin-top:6px}\n.head-btns{display:flex;gap:10px}\n.btn{height:34px;border-radius:6px;font-size:13px;padding:0 16px;cursor:pointer;font-family:inherit;border:1px solid transparent}\n.btn-blue{background:#1C5BD4;color:#fff}\n.btn-outline{background:#fff;border-color:#D9DFE8;color:#4B5563}\n.btn-red{background:#fff;border-color:#F1B7B9;color:#E5484D}\n.btn-disabled{background:#F5F7FA;border-color:#E5E9F0;color:#B3BAC6;cursor:not-allowed}\n/* 卡片 */\n.card{background:#fff;border-radius:10px;padding:16px 18px;margin-bottom:12px}\n.card h3{font-size:15px;font-weight:700;color:#111827;margin-bottom:14px}\n.card h3 .num{margin-right:6px}\n.card h3 .opt{font-size:12px;color:#9AA3B2;font-weight:400;margin-left:6px}\n/* 步骤条 */\n.steps{display:flex;align-items:flex-start;padding:6px 30px 2px}\n.step{width:150px;text-align:center;flex-shrink:0}\n.step .dot{width:26px;height:26px;border-radius:50%;margin:0 auto 8px;display:flex;align-items:center;justify-content:center;font-size:13px}\n.dot-done{background:#18A058;color:#fff}\n.dot-cur{background:#1C5BD4;color:#fff}\n.dot-todo{background:#E5E9F0;color:#9AA3B2}\n.dot-fail{background:#E5484D;color:#fff;font-size:12px}\n.step .s-t{font-size:13px;font-weight:600;color:#1C5BD4}\n.step .s-s{font-size:11px;color:#1C5BD4;margin-top:4px}\n.step.todo .s-t{color:#9AA3B2;font-weight:500}\n.step.todo .s-s{color:#B3BAC6}\n.step.fail .s-t{color:#E5484D}\n.step.fail .s-s{color:#C9757A}\n.step.done .s-t{ s=\"node\">招商玺 · 蛇口<\/span><span class=\"node\">海上世界<\/span><span class=\"arrow\">→<\/span><span class=\"node\">蛇口城市公司<\/span><span class=\"arrow\">→<\/span><span class=\"node\">深圳<\/span><\/div>\n              <div style=\"color:#8A93A3\">· 2026-07-12 城市管理员审核时绑定并建立归属链，一个主理人可绑定多个项目<\/div>\n            <\/div>\n          <\/div>\n\n          <div class=\"card\" style=\"margin-bottom:0\">\n            <h3>审核记录<\/h3>\n            <ul class=\"tl\">\n              <li><div class=\"t\">提交资料<\/div><div class=\"s\">陈静曦 · 2026-07-12 09:18<\/div><\/li>\n              <li><div class=\"t\">进入城市管理员审核<\/div><div class=\"s\">系统 · 2026-07-12 09:18<\/div><\/li>\n              <li class=\"pass\"><div class=\"t\">审核通过<\/div><div class=\"s\">城市管理员（张敏）· 2026-07-12 15:40　绑定项目 招商玺 · 蛇口、海上世界<\/div><\/li>\n              <li class=\"pass\"><div class=\"t\">认证奖励已发放<\/div><div class=\"s\">系统 · 2026-07-12 15:41　500 荟豆 → FKW_Recharge_sz<\/div><\/li>\n              <li class=\"pass\"><div class=\"t\">认证已开通<\/div><div class=\"s\">系统 · 2026-07-12 15:41　主理人权益已生效<\/div><\/li>\n            <\/ul>\n          <\/div>\n        <\/div>\n      <\/div>\n    <\/main>\n  <\/div>\n<\/div>\n\n<div class=\"toast\" id=\"toast\"><\/div>\n\n<script>\nfunction toast(msg){\n  var t = document.getElementById('toast');\n  t.textContent = msg; t.classList.add('show');\n  clearTimeout(t._t); t._t = setTimeout(function(){ t.classList.remove('show'); }, 2600);\n}\ndocument.getElementById('btnCommunity').addEventListener('click', function(){\n  toast('已跳转该主理人的社群与活动列表（原型示意）');\n});\n<\/script>\n<script>\n(function(){\ndocument.addEventListener('click',function(e){\n  var t=e.target;\n  while(t&&t.nodeType===1&&t.tagName!=='A'){t=t.parentNode;}\n  if(t&&t.getAttribute&&t.getAttribute('data-goto')){\n    e.preventDefault();e.stopPropagation();\n    parent.postMessage({__navGo:parseInt(t.getAttribute('data-goto'),10)},'*');\n  }\n},true);\n})();\n<\/script><\/body>\n<\/html>\n"}];
const tabs = document.getElementById('tabs');
const frame = document.getElementById('frame');
const pager = document.getElementById('pager');
const btnPrev = document.getElementById('btnPrev');
const btnNext = document.getElementById('btnNext');
const toast = document.getElementById('toast');
let toastTimer = null;
let cur = -1;

function showToast(msg){
  toast.textContent = msg;
  toast.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function(){ toast.classList.remove('show'); }, 2200);
}

PAGES.forEach(function(p, i){
  const b = document.createElement('div');
  b.className = 'tab' + (['0','3','4'].indexOf(p.no) >= 0 ? ' old' : '');
  b.innerHTML = '<span class="n">' + p.no + '</span>' + p.title;
  b.addEventListener('click', function(){ go(i); });
  tabs.appendChild(b);
});

function go(i){
  if(i < 0 || i >= PAGES.length || i === cur) return;
  cur = i;
  frame.srcdoc = PAGES[i].html;
  Array.prototype.forEach.call(tabs.children, function(el, j){
    el.classList.toggle('on', j === i);
    if(j === i) el.scrollIntoView({block:'nearest', inline:'center', behavior:'smooth'});
  });
  pager.textContent = (i + 1) + ' / ' + PAGES.length;
  btnPrev.disabled = (i === 0);
  btnNext.disabled = (i === PAGES.length - 1);
}

btnPrev.addEventListener('click', function(){ go(cur - 1); });
btnNext.addEventListener('click', function(){ go(cur + 1); });

document.addEventListener('keydown', function(e){
  if(e.key === 'ArrowLeft') go(cur - 1);
  else if(e.key === 'ArrowRight') go(cur + 1);
});

window.addEventListener('message', function(e){
  const d = e.data || {};
  if(d.__navGo !== undefined){
    const idx = PAGES.findIndex(function(p){ return p.no === String(d.__navGo); });
    if(idx >= 0){
      go(idx);
      showToast('已跳转至 ' + PAGES[idx].no + ' 号页面：' + PAGES[idx].title);
    }
  }
});

go(0);
</script>
