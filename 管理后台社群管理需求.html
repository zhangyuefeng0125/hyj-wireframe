s=\"more\"><i><\/i><i><\/i><i><\/i><\/span><\/div><\/td>\n          <\/tr>\n        <\/tbody>\n      <\/table>\n      <div class=\"pgfoot\">\n        <div class=\"pginfo\">共14条<\/div>\n        <div class=\"pgr\">\n          <div class=\"pg arr\"><svg width=\"12\" height=\"12\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.4\"><path d=\"M15 6l-6 6 6 6\"/><\/svg><\/div>\n          <div class=\"pg cur\">1<\/div>\n          <div class=\"pg\">2<\/div>\n          <div class=\"pg arr\"><svg width=\"12\" height=\"12\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.4\"><path d=\"M9 6l6 6-6 6\"/><\/svg><\/div>\n          <div class=\"pgsize\">10条 / 页<\/div>\n        <\/div>\n      <\/div>\n    <\/div>\n  <\/main>\n<\/div>\n\n<!-- 社群审核弹窗 -->\n<div class=\"audit-overlay\" id=\"auditOverlay\"><\/div>\n<div class=\"audit-modal\" id=\"auditModal\" style=\"display:none\">\n  <div class=\"audit-head\">\n    <h3>社群审核<\/h3>\n    <button class=\"audit-x\" id=\"auditClose\" aria-label=\"关闭\">✕<\/button>\n  <\/div>\n  <div class=\"audit-body\">\n    <div class=\"audit-info\" id=\"auditInfo\"><\/div>\n\n    <div class=\"audit-lbl\"><span class=\"req\">*<\/span>审核结果<\/div>\n    <div class=\"seg\">\n      <button type=\"button\" class=\"opt on\" id=\"optPass\">通过<\/button>\n      <button type=\"button\" class=\"opt rej\" id=\"optReject\">打回，退回申请人<\/button>\n    <\/div>\n\n    <div id=\"passNote\" class=\"audit-note\"><\/div>\n\n    <div id=\"rejectBlock\" style=\"display:none\">\n      <div class=\"audit-lbl\" id=\"reasonLbl\"><span class=\"req\">*<\/span>驳回原因（5–200 字，将同步至申请人）<\/div>\n      <div class=\"audit-ta-wrap\">\n        <textarea class=\"audit-ta\" id=\"rejectReason\" maxlength=\"200\" placeholder=\"例如：社群名称与现有社群重合度较高，建议调整后重新提交；或补充可核验的社群运营规划材料。\"><\/textarea>\n        <span class=\"audit-cnt\" id=\"reasonCnt\">0 / 200<\/span>\n      <\/div>\n      <div class=\"audit-err\" id=\"reasonErr\">请填写不少于 5 个字的驳回原因<\/div>\n      <div class=\"audit-note red\" id=\"rejectNote\"><\/div>\n    <\/div>\n  <\/div>\n  <div class=\"audit-foot\">\n    <button class=\"btn btn-default\" id=\"auditCancel\">取消<\/button>\n    <button class=\"btn btn-primary\" id=\"auditSubmit\">提交审核结果<\/button>\n  <\/div>\n<\/div>\n\n<div class=\"pgtoast\" id=\"pgToast\"><\/div>\n\n<script>\n(function(){\n  var overlay=document.getElementById('auditOverlay');\n  var modal=document.getElementById('auditModal');\n  var infoBox=document.getElementById('auditInfo');\n  var optPass=document.getElementById('optPass');\n  var optReject=document.getElementById('optReject');\n  var passNote=document.getElementById('passNote');\n  var rejectNote=document.getElementById('rejectNote');\n  var rejectBlock=document.getElementById('rejectBlock');\n  var reason=document.getElementById('rejectReason');\n  var reasonCnt=document.getElementById('reasonCnt');\n  var reasonErr=document.getElementById('reasonErr');\n  var submitBtn=document.getElementById('auditSubmit');\n  var toast=document.getElementById('pgToast');\n  var mode='pass';\n  var toastTimer=null;\n  var currentRow=null;\n  var ctx=null;\n\n  function showToast(msg){\n    toast.textContent=msg;\n    toast.classList.add('show');\n    clearTimeout(toastTimer);\n    toastTimer=setTimeout(function(){toast.classList.remove('show');},2600);\n  }\n  function nowStr(){\n    var d=new Date();\n    function p(n){return (n<10?'0':'')+n;}\n    return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate())+' '+p(d.getHours())+':'+p(d.getMinutes());\n  }\n\n  function openAudit(row){\n    if(row.getAttribute('data-audited')){showToast('该社群已完成审核');return;}\n    currentRow=row;\n    var cells=row.querySelectorAll('td');\n    var id=cells[0].textContent.trim();\n    var parts=cells[1].textContent.split('/');\n    var name=parts[0].trim();\n    var cat=parts[1]?parts[1].trim():'';\n    var area=cells[2].textContent.trim();\n    var created=cells[7].textContent.trim();\n    var statusTxt=cells[8].textContent.trim();\n    // 场景识别：首次审核（待开通）/ 关闭申请审核（申请关闭）/ 恢复审核（招募暂停等）\n    var scenario='resume';\n    if(statusTxt.indexOf('待开通')>=0){scenario='first';}\n    else if(statusTxt.indexOf('申请关闭')>=0){scenario='close';}\n    ctx={id:id,name:name,scenario:scenario,owner:cells[3].textContent.trim()};\n    var statusTag=(scenario==='close')?'<span class=\"tag tg-y\">申请关闭<\/span>':'<span class=\"tag tg-o\">待审核<\/span>';\n    infoBox.innerHTML='<b>'+name+'<\/b><span>'+id+(cat?' · '+cat:'')+' · '+area+'<\/span><span>创建时间 '+created+'<\/span>'+statusTag;\n    if(scenario==='first'){\n      optPass.textContent='通过，开通社群';\n      optReject.textContent='打回，退回创建人';\n      passNote.textContent='审核通过后：社群正式创建，审核状态更新为「已通过」，社群状态进入「运营中」，在 C 端正常展示并开放成员加入。本条审核记录将写入该社群详情的「变更记录」。';\n      rejectNote.textContent='打回后：审核状态更新为「未通过」，创建人可在 C 端查看驳回原因，修改资料后重新提交审核。本条审核记录将写入该社群详情的「变更记录」。';\n    }else if(scenario==='close'){\n      optPass.textContent='同意关闭，停用社群';\n      optReject.textContent='驳回申请，退回主理人';\n      passNote.textContent='同意关闭后：社群状态变更为「已停用」，C 端停止展示，历史成员与活动数据保留，主理人将收到关闭结果通知。本条审核记录将写入该社群详情的「变更记录」。';\n      rejectNote.textContent='驳回后：关闭申请被驳回，社群保持「运营中」继续运营，主理人可在 C 端查看驳回原因。本条审核记录将写入该社群详情的「变更记录」。';\n    }else{\n      optPass.textContent='通过，恢复运营';\n      optReject.textContent='打回，退回申请人';\n      passNote.textContent='审核通过后：审核状态更新为「已通过」，社群状态由「招募暂停」恢复为「运营中」，社群在 C 端正常展示并开放成员加入。本条审核记录将写入该社群详情的「变更记录」。';\n      rejectNote.textContent='打回后：审核状态更新为「未通过」，申请人可在 C 端查看驳回原因，修改资料后重新提交审核。本条审核记录将写入该社群详情的「变更记录」。';\n    }\n    document.getElementById('reasonLbl').innerHTML='<span class=\"req\">*<\/span>驳回原因（5–200 字，将同步至'+(scenario==='close'?'主理人':(scenario==='first'?'创建人':'申请人'))+'）';\n    setMode('pass');\n    reason.value='';\n    reasonCnt.textContent='0 / 200';\n    reason.classList.remove('bad');\n    reasonErr.classList.remove('show');\n    modal.style.display='block';\n    overlay.classList.add('show');\n  }\n  function closeAudit(){\n    modal.style.display='none';\n    overlay.classList.remove('show');\n  }\n  function setMode(m){\n    mode=m;\n    optPass.classList.toggle('on',m==='pass');\n    optReject.classList.toggle('on',m==='reject');\n    passNote.style.display=(m==='pass')?'block':'none';\n    rejectBlock.style.display=(m==='reject')?'block':'none';\n    submitBtn.textContent=(m==='pass')?'提交审核结果':'确认打回';\n    submitBtn.className='btn '+(m==='pass'?'btn-primary':'btn-danger-solid');\n  }\n\n  document.addEventListener('click',function(e){\n    var t=e.target;\n    if(t.classList&&t.classList.contains('lnk')&&t.textContent.trim()==='审核'){\n      e.stopPropagation();\n      var row=t.closest('tr');\n      if(row){openAudit(row);}\n      return;\n    }\n  });\n\n  optPass.addEventListener('click',function(){setMode('pass');});\n  optReject.addEventListener('click',function(){setMode('reject');});\n  reason.addEventListener('input',function(){\n    var n=reason.value.length;\n    reasonCnt.textContent=n+' / 200';\n    reasonCnt.classList.toggle('over',n>=200);\n    reason.classList.remove('bad');\n    reasonErr.classList.remove('show');\n  });\n\n  function auditRow(cells){\n    var sc=ctx?ctx.scenario:'resume';\n    if(mode==='pass'){\n      if(sc==='close'){\n        cells[8].innerHTML='<span class=\"tag tg-gr\">已停用<\/span>';\n        cells[10].innerHTML='<div class=\"ops\" style=\"justify-content:flex-end\"><span class=\"lnk\">查看详情<\/span><span class=\"lnk\">更多<\/span><span class=\"more\"><i><\/i><i><\/i><i><\/i><\/span><\/div>';\n      }else{\n        cells[9].innerHTML='<span class=\"tag tg-g\">已通过<\/span>';\n        cells[8].innerHTML='<span class=\"tag tg-g\">运营中<\/span>';\n        cells[10].innerHTML='<div class=\"ops\" style=\"justify-content:flex-end\"><span class=\"lnk\">查看详情<\/span><span class=\"lnk\">编辑<\/span><span class=\"lnk\">更多<\/span><span class=\"more\"><i><\/i><i><\/i><i><\/i><\/span><\/div>';\n      }\n    }else{\n      if(sc==='close'){\n        cells[8].innerHTML='<span class=\"tag tg-g\">运营中<\/span>';\n        cells[10].innerHTML='<div class=\"ops\" style=\"justify-content:flex-end\"><span class=\"lnk\">查看详情<\/span><span class=\"lnk\">编辑<\/span><span class=\"lnk\">更多<\/span><span class=\"more\"><i><\/i><i><\/i><i><\/i><\/span><\/div>';\n      }else{\n        cells[9].innerHTML='<span class=\"tag tg-r\">未通过<\/span>';\n        cells[10].innerHTML='<div class=\"ops\" style=\"justify-content:flex-end\"><span class=\"lnk\">查看详情<\/span><span class=\"lnk\">更多<\/span><span class=\"more\"><i><\/i><i><\/i><i><\/i><\/span><\/div>';\n      }\n    }\n    var stats=document.querySelectorAll('.stat .vl');\n    if(stats.length>=4){\n      if(sc==='close'){\n        if(mode==='pass'){\n          stats[1].textContent=Math.max(0,parseInt(stats[1].textContent,10)-1);\n          stats[3].textContent=parseInt(stats[3].textContent,10)+1;\n        }\n      }else{\n        stats[2].textContent=Math.max(0,parseInt(stats[2].textContent,10)-1);\n        if(mode==='pass'){stats[1].textContent=parseInt(stats[1].textContent,10)+1;}\n      }\n    }\n  }\n\n  function pushRecord(type,content){\n    var rec={time:nowStr(),op:'运营管理员',module:'社群审核',type:type,content:content,result:'成功',source:'运营后台'};\n    try{\n      if(window.parent&&window.parent!==window){\n        window.parent.postMessage({__auditRecord:rec},'*');\n      }\n    }catch(err){}\n  }\n\n  submitBtn.addEventListener('click',function(){\n    var text=reason.value.trim();\n    if(mode==='reject'){\n      if(text.length<5){\n        reason.classList.add('bad');\n        reasonErr.textContent='请填写不少于 5 个字的驳回原因，当前 '+text.length+' 个字';\n        reasonErr.classList.add('show');\n        reason.focus();\n        return;\n      }\n    }\n    if(!currentRow){closeAudit();return;}\n    auditRow(currentRow.querySelectorAll('td'));\n    currentRow.setAttribute('data-audited','1');\n    var sc=ctx.scenario;\n    if(mode==='pass'){\n      if(sc==='first'){\n        pushRecord('审核通过','社群'+ctx.id+'首次审核通过，社群正式开通并进入「运营中」');\n        showToast('已审核通过「'+ctx.name+'」：社群正式开通并进入运营中，记录已写入变更记录');\n      }else if(sc==='close'){\n        pushRecord('同意关闭','主理人'+ctx.owner+'申请关闭社群'+ctx.id+'，审核同意关闭，社群状态变更为「已停用」');\n        showToast('已同意关闭「'+ctx.name+'」：社群已停用，记录已写入变更记录');\n      }else{\n        pushRecord('审核通过','社群'+ctx.id+'审核通过，状态由「待审核」变为「已通过」，社群恢复「运营中」');\n        showToast('已审核通过「'+ctx.name+'」：社群进入运营中，记录已写入变更记录');\n      }\n    }else{\n      if(sc==='close'){\n        pushRecord('驳回关闭','主理人'+ctx.owner+'申请关闭社群'+ctx.id+'被驳回：'+text);\n        showToast('已驳回关闭申请「'+ctx.name+'」：社群保持运营中，原因已同步至主理人，记录已写入变更记录');\n      }else if(sc==='first'){\n        pushRecord('审核驳回','社群'+ctx.id+'首次审核驳回：'+text);\n        showToast('已打回「'+ctx.name+'」：驳回原因已同步至创建人，记录已写入变更记录');\n      }else{\n        pushRecord('审核驳回','社群'+ctx.id+'审核驳回：'+text);\n        showToast('已打回「'+ctx.name+'」：驳回原因已同步至申请人，记录已写入变更记录');\n      }\n    }\n    currentRow=null;\n    closeAudit();\n  });\n\n  document.getElementById('auditClose').addEventListener('click',closeAudit);\n  document.getElementById('auditCancel').addEventListener('click',closeAudit);\n  overlay.addEventListener('click',closeAudit);\n})();\n<\/script>\n\n<script>\n(function(){\nfunction txt(el){return (el.textContent||'').replace(/\\s+/g,'');}\nfunction hook(sel, map, exact){\n  var nodes=document.querySelectorAll(sel);\n  for(var i=0;i<nodes.length;i++){\n    var t=txt(nodes[i]);\n    for(var key in map){\n      var hit=exact?(t===key):(t.indexOf(key)===0);\n      if(hit&&!nodes[i].getAttribute('data-goto')){\n        nodes[i].setAttribute('data-goto',map[key]);\n        nodes[i].style.cursor='pointer';\n        break;\n      }\n    }\n  }\n}\nvar NO=document.body.getAttribute('data-page-no');\nvar TABMAP={'社群概览':'3','成员管理':'4','主理人':'5','社群活动':'6','公告管理':'7','变更记录':'8'};\nif(NO==='1'){\n  hook('.btn-primary',{'新建社群':'2'},true);\n  hook('.lnk',{'查看详情':'3','编辑':'2'},true);\n}\nif(NO==='2'){\n  hook('.btn-default',{'取消':'1'},true);\n}\nif(NO==='3'){\n  hook('.tab',TABMAP,false);\n  hook('.btn-primary',{'编辑资料':'2'},true);\n  hook('.cardlink, .lnk, .more-link, .link',{'查看全部活动':'6','管理主理人':'5','查看全部公告':'7'},false);\n}\nif(NO==='4'||NO==='5'||NO==='6'||NO==='7'||NO==='8'){\n  hook('.tab',TABMAP,false);\n}\nhook('.back',{'':'1'},false);\ndocument.addEventListener('click',function(e){\n  var t=e.target;\n  while(t&&t.nodeType===1&&t!==document.body){\n    if(t.getAttribute&&t.getAttribute('data-goto')){\n      e.preventDefault();e.stopPropagation();\n      parent.postMessage({__navGo:parseInt(t.getAttribute('data-goto'),10)},'*');\n      return;\n    }\n    t=t.parentNode;\n  }\n},true);\n})();\n<\/script><\/body>\n<\/html>\n"}, {"no": "2", "title": "新建/编辑社群（表单）", "html": "<!DOCTYPE html>\n<html lang=\"zh-CN\">\n<head>\n<meta charset=\"UTF-8\">\n<title>管理后台-新建:编辑社群<\/title>\n<style>\n*{margin:0;padding:0;box-sizing:border-box}\nbody{font-family:-apple-system,BlinkMacSystemFont,\"PingFang SC\",\"Microsoft YaHei\",sans-serif;background:#F4F6FA;color:#24303F;font-size:15px;min-width:1400px}\n.topbar{height:62px;background:#1B66F2;display:flex;align-items:center;justify-content:space-between;padding:0 26px;color:#fff}\n.brand{display:flex;align-items:center;gap:10px;font-size:17px;font-weight:700;letter-spacing:.5px}\n.brand .logo{width:34px;height:34px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center}\n.brand .logo i{width:16px;height:16px;border-radius:50%;border:5px solid #0B2A5A;display:block}\n.top-right{display:flex;align-items:center;gap:20px;font-size:14px}\n.top-right .sep{width:1px;height:20px;background:rgba(255,255,255,.35)}\n.tr-item{display:flex;align-items:center;gap:6px;opacity:.96}\n.layout{display:flex;align-items:stretch}\n.sidebar{width:228px;background:#0B2A5A;padding:12px 0 30px;flex-shrink:0}\n.mi{display:flex;align-items:center;gap:12px;padding:13px 20px;color:#C2D2EC;font-size:15px;cursor:pointer}\n.mi .cv{margin-left:auto;opacity:.75}\n.mi.sub{padding-left:54px;font-size:14.5px;padding-top:11px;padding-bottom:11px}\n.mi.on{background:#1B66F2;color:#fff;margin:3px 12px;border-radius:8px;padding:12px 10px}\nmain{flex:1;padding:18px 28px;min-width:0}\n.crumb{font-size:13.5px;color:#98A2B3;margin-bottom:14px}\n.crumb b{color:#475467;font-weight:600}\n.btn{display:inline-flex;align-items:center;gap:7px;height:38px;padding:0 18px;border-radius:7px;font-size:14.5px;cursor:pointer;border:1px solid transparent}\n.btn-primary{background:#1B66F2;color:#fff}\n.btn-default{background:#fff;color:#344054;border-color:#D5DCE5}\n.pagehead{display:flex;align-items:flex-start;margin-bottom:16px}\n.pagehead h1{font-size:24px;font-weight:700;color:#101828}\n.pagehead .sub{font-size:14px;color:#98A2B3;margin-top:6px}\n.bodygrid{display:flex;gap:20px;align-items:flex-start}\n.navcard{width:190px;background:#fff;border:1px solid #E9EDF3;border-radius:10px;padding:10px;flex-shrink:0}\n.ni{position:relative;padding:13px 16px;font-size:14.5px;color:#475467;border-radius:8px;cursor:pointer;margin-bottom:2px}\n.ni.on{background:#EAF1FE;color:#1B66F2;font-weight:600}\n.ni.on::before{content:\"\";position:absolute;left:0;top:10px;bottom:10px;width:3px;border-radius:2px;background:#1B66F2}\n.col{flex:1;min-width:0}\n.card{background:#fff;border:1px solid #E9EDF3;border-radius:10px;margin-bottom:16px;padding:18px 24px}\n.card h2{font-size:16.5px;font-weight:700;color:#101828;margin-bottom:14px}\n.frow{display:flex;align-items:flex-start;margin-bottom:14px}\n.frow:last-child{margin-bottom:0}\n.fl{width:110px;font-size:14px;color:#475467;padding-top:9px;flex-shrink:0}\n.fl .req{color:#E5484D;margin-left:2px}\n.fval{flex:1;min-width:0}\n.input{height:38px;border:1px solid #D8DEE8;border-radius:6px;background:#fff;font-size:14px;color:#344054;display:flex;align-items:center;padding:0 12px}\n.input.ok{color:#101828}\ntextarea.ta{width:100%;min-height:60px;border:1px solid #D8DEE8;border-radius:6px;font-size:14px;color:#101828;font-family:inherit;padding:10px 12px;resize:none;line-height:1.6;background:#fff}\n.sel{position:relative;height:38px;bo value=\"\">\n              <span class=\"hint\">仅列出身份为「主理人」的成员<\/span>\n              <div class=\"err\" id=\"owner-error\" role=\"alert\" hidden>请选择主理人<\/div>\n            <\/div>\n          <\/div>\n        <\/div>\n\n        <div class=\"card\">\n          <h2>成员与加入设置<\/h2>\n          <div class=\"grid2\">\n            <div class=\"cell\">\n              <div class=\"fl\">可见范围<span class=\"req\">*<\/span><\/div>\n              <div class=\"fval\">\n                <div class=\"sel sm\">片区可见<\/div>\n                <span class=\"hint\">所有人可见 / 片区可见 / 项目可见 / 仅邀请<\/span>\n              <\/div>\n            <\/div>\n            <div class=\"cell\">\n              <div class=\"fl\">成员上限<span class=\"req\">*<\/span><\/div>\n              <div class=\"fval\">\n                <div class=\"sel sm\">500 人<\/div>\n                <span class=\"hint\">档位：100 / 200 / 500 / 1000 人；达到上限后暂停新申请<\/span>\n              <\/div>\n            <\/div>\n            <div class=\"cell\">\n              <div class=\"fl\">加入方式<span class=\"req\">*<\/span><\/div>\n              <div class=\"fval\" style=\"flex-direction:column;align-items:flex-start;gap:6px\">\n                <div class=\"seg2\" role=\"radiogroup\" aria-label=\"加入方式\">\n                  <button type=\"button\" class=\"sg\" role=\"radio\" aria-checked=\"false\">直接加入<\/button>\n                  <button type=\"button\" class=\"sg is-on\" role=\"radio\" aria-checked=\"true\">申请审核<\/button>\n                <\/div>\n                <span class=\"hint\">用户需经主理人审核后方可成为成员，适合需要筛选的社群<\/span>\n              <\/div>\n            <\/div>\n            <div class=\"cell\">\n              <div class=\"fl\">身份范围<span class=\"req\">*<\/span><\/div>\n              <div class=\"fval\">\n                <div class=\"sel sm\" style=\"width:190px\">业主、居民与企业员工<\/div>\n                <span class=\"hint\">用于入群资格校验<\/span>\n              <\/div>\n            <\/div>\n          <\/div>\n        <\/div>\n\n        <div class=\"card\">\n          <h2>运营规则<\/h2>\n          <div class=\"frow\">\n            <div class=\"fl\">社群公约<span class=\"req\">*<\/span><\/div>\n            <div class=\"fval\">\n              <textarea class=\"ta\">友善交流，尊重他人与隐私；\n禁止广告、推销及任何形式的商业信息。<\/textarea>\n              <div class=\"cnt\">30/200<\/div>\n            <\/div>\n          <\/div>\n          <div class=\"frow\">\n            <div class=\"fl\"><\/div>\n            <div class=\"fval\" style=\"padding-top:2px\">\n              <label class=\"ckrow\"><input type=\"checkbox\" checked> 新成员加入后自动发送公约与欢迎语<\/label>\n            <\/div>\n          <\/div>\n          <div class=\"frow\" style=\"margin-top:8px\">\n            <div class=\"fl\">欢迎语<span class=\"req\">*<\/span><\/div>\n            <div class=\"fval\">\n              <textarea class=\"ta\">欢迎加入蛇口亲子社群，请先阅读社群公约并完善个人信息。<\/textarea>\n              <div class=\"cnt\">26/100<\/div>\n            <\/div>\n          <\/div>\n        <\/div>\n      <\/div>\n    <\/div>\n  <\/main>\n<\/div>\n\n<script>\n/* 主要活动区域 · 两级联动（城市 → 项目）\n   数据为占位示例，接入项目主数据后只需替换 AREA_TREE；\n   回填与提交走 #areaCity / #areaProject 两个隐藏域，新建页留空即默认未选、项目禁用。 */\n(function(){\n  var AREA_TREE = {\n    '深圳': ['蛇口片区','太子湾片区','前海片区','深圳湾片区','后海片区'],\n    '武汉': ['光谷片区','汉口片区','武昌片区'],\n    '上海': ['前滩片区','陆家嘴片区','张江片区']\n  };\n\n  var hidCity = document.getElementById('areaCity');\n  var hidProject = document.getElementById('areaProject');\n  var cityDD = document.getElementById('ddCity');\n  var projDD = document.getElementById('ddProject');\n  var cityBtn = document.getElementById('cityTrigger');\n  var projBtn = document.getElementById('projectTrigger');\n  var cityPanel = document.getElementById('cityPanel');\n  var projPanel = document.getElementById('projectPanel');\n\n  var city = hidCity.value || '';\n  var project = hidProject.value || '';\n\n  function closeAll(){\n    [cityDD, projDD].forEach(function(d){\n      d.classList.remove('open');\n      d.querySelector('.sel').setAttribute('aria-expanded', 'false');\n    });\n  }\n\n  function toggle(d){\n    var willOpen = !d.classList.contains('open');\n    closeAll();\n    if (willOpen){\n      d.classList.add('open');\n      d.querySelector('.sel').setAttribute('aria-expanded', 'true');\n    }\n  }\n\n  function option(text, selected){\n    var b = document.createElement('button');\n    b.type = 'button';\n    b.className = 'ddp-opt' + (selected ? ' on' : '');\n    b.textContent = text;\n    b.setAttribute('role', 'option');\n    b.setAttribute('aria-selected', selected ? 'true' : 'false');\n    return b;\n  }\n\n  function renderCity(){\n    cityPanel.innerHTML = '';\n    Object.keys(AREA_TREE).forEach(function(c){\n      var b = option(c, c === city);\n      b.addEventListener('click', function(){ setCity(c); closeAll(); });\n      cityPanel.appendChild(b);\n    });\n    cityBtn.textContent = city || '请选择城市';\n    cityBtn.classList.toggle('ph', !city);\n  }\n\n  function renderProject(){\n    projPanel.innerHTML = '';\n    if (!city){\n      project = '';\n      hidProject.value = '';\n      projBtn.disabled = true;\n      projBtn.classList.add('dis', 'ph');\n      projBtn.textContent = '请先选择城市';\n      return;\n    }\n    projBtn.disabled = false;\n    projBtn.classList.remove('dis');\n    var list = AREA_TREE[city] || [];\n    if (list.indexOf(project) < 0) project = '';\n    hidProject.value = project;\n    projBtn.textContent = project || '请选择项目';\n    projBtn.classList.toggle('ph', !project);\n    list.forEach(function(p){\n      var b = option(p, p === project);\n      b.addEventListener('click', function(){ setProject(p); closeAll(); });\n      projPanel.appendChild(b);\n    });\n  }\n\n  function setCity(c){\n    city = c;\n    hidCity.value = c;\n    project = '';\n    renderCity();\n    renderProject();\n  }\n\n  function setProject(p){\n    project = p;\n    hidProject.value = p;\n    renderProject();\n  }\n\n  cityBtn.addEventListener('click', function(){ toggle(cityDD); });\n  projBtn.addEventListener('click', function(){ if (!projBtn.disabled) toggle(projDD); });\n  document.addEventListener('click', function(e){\n    if (!cityDD.contains(e.target) && !projDD.contains(e.target)) closeAll();\n  });\n  document.addEventListener('keydown', function(e){ if (e.key === 'Escape') closeAll(); });\n\n  renderCity();\n  renderProject();\n})();\n\n/* 主理人 · 单选下拉（仅列出身份为「主理人」的成员）+ 必填校验\n   与主要活动区域同理：值走隐藏域 #ownerId(name=owner)，新建页留空即显示占位「请选择主理人」；\n   编辑页回填只需给 #ownerId 赋主理人ID（如 ZL20260012）。 */\n(function(){\n  var OWNERS = [\n    { id: 'ZL20260012', name: '林晓雯' },\n    { id: 'ZL20260027', name: '赵敏' },\n    { id: 'ZL20260035', name: '陈雅婷' }\n  ];\n  var PLACEHOLDER = '请选择主理人';\n\n  var hid = document.getElementById('ownerId');\n  var dd = document.getElementById('ddOwner');\n  var btn = document.getElementById('ownerTrigger');\n  var panel = document.getElementById('ownerPanel');\n  var err = document.getElementById('owner-error');\n  var saveBtn = document.getElementById('save-btn');\n\n  var owner = hid.value || '';\n\n  function nameOf(id){\n    for (var i = 0; i < OWNERS.length; i++){\n      if (OWNERS[i].id === id) return OWNERS[i].name;\n    }\n    return '';\n  }\n\n  function clearError(){\n    err.hidden = true;\n    btn.classList.remove('bad');\n    btn.removeAttribute('aria-invalid');\n  }\n\n  function showError(){\n    err.hidden = false;\n    btn.classList.add('bad');\n    btn.setAttribute('aria-invalid', 'true');\n  }\n\n  function close(){\n    dd.classList.remove('open');\n    btn.setAttribute('aria-expanded', 'false');\n  }\n\n  function render(){\n    panel.innerHTML = '';\n    var nm = nameOf(owner);\n    btn.textContent = nm || PLACEHOLDER;\n    btn.classList.toggle('ph', !nm);\n    OWNERS.forEach(function(o){\n      var b = document.createElement('button');\n      b.type = 'button';\n      b.className = 'ddp-opt' + (o.id === owner ? ' on' : '');\n      b.textContent = o.name;\n      b.setAttribute('role', 'option');\n      b.setAttribute('aria-selected', o.id === owner ? 'true' : 'false');\n      b.addEventListener('click', function(){\n        owner = o.id;\n        hid.value = o.id;\n        clearError();\n        render();\n        close();\n      });\n      panel.appendChild(b);\n    });\n  }\n\n  btn.addEventListener('click', function(){\n    var willOpen = !dd.classList.contains('open');\n    close();\n    if (willOpen){\n      dd.classList.add('open');\n      btn.setAttribute('aria-expanded', 'true');\n    }\n  });\n  document.addEventListener('click', function(e){ if (!dd.contains(e.target)) close(); });\n  document.addEventListener('keydown', function(e){ if (e.key === 'Escape') close(); });\n\n  /* 提交拦截：主理人为空时不提交，标红并提示 */\n  if (saveBtn){\n    saveBtn.addEventListener('click', function(){\n      if (!hid.value){\n        showError();\n        btn.focus();\n        btn.scrollIntoView({ block: 'center' });\n        return false;\n      }\n      clearError();\n    });\n  }\n\n  render();\n})();\n<\/script>\n\n<script>\n(function(){\nfunction txt(el){return (el.textContent||'').replace(/\\s+/g,'');}\nfunction hook(sel, map, exact){\n  var nodes=document.querySelectorAll(sel);\n  for(var i=0;i<nodes.length;i++){\n    var t=txt(nodes[i]);\n    for(var key in map){\n      var hit=exact?(t===key):(t.indexOf(key)===0);\n      if(hit&&!nodes[i].getAttribute('data-goto')){\n        nodes[i].setAttribute('data-goto',map[key]);\n        nodes[i].style.cursor='pointer';\n        break;\n      }\n    }\n  }\n}\nvar NO=document.body.getAttribute('data-page-no');\nvar TABMAP={'社群概览':'3','成员管理':'4','主理人':'5','社群活动':'6','公告管理':'7','变更记录':'8'};\nif(NO==='1'){\n  hook('.btn-primary',{'新建社群':'2'},true);\n  hook('.lnk',{'查看详情':'3','编辑':'2'},true);\n}\nif(NO==='2'){\n  hook('.btn-default',{'取消':'1'},true);\n}\nif(NO==='3'){\n  hook('.tab',TABMAP,false);\n  hook('.btn-primary',{'编辑资料':'2'},true);\n  hook('.cardlink, .lnk, .more-link, .link',{'查看全部活动':'6','管理主理人':'5','查看全部公告':'7'},false);\n}\nif(NO==='4'||NO==='5'||NO==='6'||NO==='7'||NO==='8'){\n  hook('.tab',TABMAP,false);\n}\nhook('.back',{'':'1'},false);\ndocument.addEventListener('click',function(e){\n  var t=e.target;\n  while(t&&t.nodeType===1&&t!==document.body){\n    if(t.getAttribute&&t.getAttribute('data-goto')){\n      e.preventDefault();e.stopPropagation();\n      parent.postMessage({__navGo:parseInt(t.getAttribute('data-goto'),10)},'*');\n      return;\n    }\n    t=t.parentNode;\n  }\n},true);\n})();\n<\/script><\/body>\n<\/html>\n"}, {"no": "3", "title": "社群详情 · 社群概览", "html": "<!DOCTYPE html>\n<html lang=\"zh-CN\">\n<head>\n<meta charset=\"UTF-8\">\n<title>管理后台-社群详情-社群概览<\/title>\n<style>\n*{margin:0;padding:0;box-sizing:border-box}\nbody{font-family:-apple-system,BlinkMacSystemFont,\"PingFang SC\",\"Microsoft YaHei\",sans-serif;background:#F4F6FA;color:#24303F;font-size:15px;min-width:1400px}\n.topbar{height:62px;background:#1B66F2;display:flex;align-items:center;justify-content:space-between;padding:0 26px;color:#fff}\n.brand{display:flex;align-items:center;gap:10px;font-size:17px;font-weight:700;letter-spacing:.5px}\n.brand .logo{width:34px;height:34px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center}\n.brand .logo i{width:16px;height:16px;border-radius:50%;border:5px solid #0B2A5A;display:block}\n.top-right{display:flex;align-items:center;gap:20px;font-size:14px}\n.top-right .sep{width:1px;height:20px;background:rgba(255,255,255,.35)}\n.tr-item{display:flex;align-items:center;gap:6px;opacity:.96}\n.layout{display:flex;align-items:stretch}\n.sidebar{width:228px;background:#0B2A5A;padding:12px 0 30px;flex-shrink:0}\n.mi{display:flex;align-items:center;gap:12px;padding:13px 20px;color:#C2D2EC;font-size:15px;cursor:pointer}\n.mi .cv{margin-left:auto;opacity:.75}\n.mi.sub{padding-left:54px;font-size:14.5px;padding-top:11px;padding-bottom:11px}\n.mi.on{background:#1B66F2;color:#fff;margin:3px 12px;border-radius:8px;padding:12px 10px}\nmain{flex:1;padding:16px 28px;min-width:0}\n.crumb{font-size:13.5px;c tems:center;padding:13px 6px;margin-bottom:16px}\n.stat{display:flex;align-items:center;gap:14px;padding:0 30px;border-left:1px solid #F0F2F6;min-width:0}\n.stat:first-child{border-left:none}\n.ib{width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;flex-shrink:0}\n.stat .lb{font-size:13.5px;color:#667085;margin-bottom:3px}\n.stat .vl{font-size:23px;font-weight:700;color:#101828;line-height:1}\n.stat .vl small{font-size:13px;color:#98A2B3;font-weight:400;margin-left:4px}\n.maingrid{display:flex;gap:20px;align-items:flex-start}\n.colL{flex:1.85;min-width:0}\n.colR{flex:1;min-width:0}\n.card{background:#fff;border:1px solid #E9EDF3;border-radius:10px;margin-bottom:16px;padding:16px 20px}\n.card:last-child{margin-bottom:0}\n.card h2{font-size:16px;font-weight:700;color:#101828;margin-bottom:12px}\n.cardhd{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}\n.cardhd h2{margin-bottom:0}\n.lnk{color:#2E7CF6;font-size:13.5px;cursor:pointer;white-space:nowrap}\n.lnk.red{color:#E5484D}\n.kv{display:grid;grid-template-columns:1fr 1fr;column-gap:30px;row-gap:11px}\n.kv .row{display:flex;font-size:14px}\n.kv .k{color:#98A2B3;width:96px;flex-shrink:0}\n.kv .v{color:#24303F}\n.ftags{display:flex;gap:10px;margin-top:14px}\n.ftag{font-size:12.5px;color:#2E7CF6;background:#F0F5FF;border:1px solid #CBDCFB;border-radius:5px;padding:3px 10px}\n.rline{display:flex;font-size:14px;margin-bottom:6px}\n.rline .k{color:#98A2B3;width:56px;flex-shrink:0}\n.rline .v{color:#24303F;line-height:1.7}\ntable{width:100%;border-collapse:collapse}\nth{color:#667085;font-weight:600;font-size:13px;padding:10px 10px;text-align:left;white-space:nowrap;border-bottom:1px solid #F0F2F6}\ntd{padding:10px 10px;font-size:14px;border-bottom:1px solid #F5F6F9;white-space:nowrap;vertical-align:middle}\ntr:last-child td{border-bottom:none}\ntd .al{color:#2E7CF6;cursor:pointer}\n.prog{width:96px}\n.prog .t{font-size:13.5px;color:#4754 btnNext.addEventListener('click', function(){ go(cur + 1); });

document.addEventListener('keydown', function(e){
  if(e.key === 'ArrowLeft') go(cur - 1);
  else if(e.key === 'ArrowRight') go(cur + 1);
});

window.addEventListener('message', function(e){
  const d = e.data || {};
  if(d.__navGo !== undefined){
    const idx = PAGES.findIndex(function(p){ return p.no === String(d.__navGo); });
    if(idx >= 0){
      go(idx);
      showToast('已跳转至 ' + PAGES[idx].no + ' 号页面：' + PAGES[idx].title);
    }
    return;
  }
  if(d.__auditRecord){
    auditRecords.push(d.__auditRecord);
    return;
  }
  if(d.__reqRecords && e.source){
    e.source.postMessage({__records: auditRecords}, '*');
  }
});

go(0);
</script>
</body>
</html>
