  "p4": {
    "title": "发布活动",
    "html": "<!DOCTYPE html>\n<html lang=\"zh-CN\" data-page-node-id=\"bpJRzfpMTT5EOj1t4WUvsU\"><head data-page-node-id=\"j7m2Cyc2sBW4a7mwAQizSW\">\n<meta charset=\"UTF-8\" data-page-node-id=\"MAlDKXGX1kTKVLX3J7RH4c\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\" data-page-node-id=\"7QlPjEUrG6GSbl8n4k2uVA\">\n<meta name=\"theme-color\" content=\"#387DEC\" data-page-node-id=\"KG15EDe2Gy66XVIfVyDGxV\">\n<title>主理人发布活动<\/title>\n<style>\n/* ================================================================\n   设计令牌（与「1.主理人中心.html」完全一致：§1 色彩 / §2 字体 / §3 圆角 / §4 阴影 / §0 4px 栅格）\n   ================================================================ */\n:root{\n  /* §1 色彩 */\n  --brand-01:#387DEC;   /* Brand01 常规 Default */\n  --brand-02:#0855D1;   /* Brand02 点击 Pressed */\n  --brand-03:#9BBEF5;   /* Brand03 一般禁用 Disabled */\n  --brand-04:#E0ECFF;   /* Brand04 文字禁用 / Tag 蓝底 */\n  --text-01:#303133;    /* Text01 强调·正文标题 */\n  --text-02:#909399;    /* Text02 次强调·正文次要·图标描边 */\n  --text-03:#C0C4CC;    /* Text03 置灰·禁用信息 */\n  --text-04:#FFFFFF;    /* Text04 纯白文字 */\n  --line-01:#EBEBEB;    /* Line01 分割线 */\n  --bg-page:#F2F5F7;    /* 页面背景 */\n  --success-01:#10A17C; /* Success01 成功 */\n  --success-02:#E6F7F2; /* Success02 成功浅底 / Tag 绿底 */\n  --huidou-01:#F76346;  /* huidou01 荟豆主题色 */\n  --huidou-02:#FFE7E6;  /* huidou02 荟豆浅底 / Tag 荟豆底 */\n  --danger:#EB4A38;     /* Danger 错误态 */\n  /* §1 派生值 */\n  --brand-01-hover:#2C71DE;\n  --danger-bg:#FDECEA;\n  --row-hover:#FAFBFC;\n  --fill-disabled:#F7F8FA;\n  --focus-ring:0 0 0 2px rgba(56,125,236,.24);\n  --mask:rgba(0,0,0,.45);\n  /* §2 字体 */\n  --font-cn:\"PingFang SC\",\"苹方-简\",-apple-system,BlinkMacSystemFont,\"Helvetica Neue\",sans-serif;\n  --font-num:\"Source Han Sans SC\",\"思源黑体\",\"PingFang SC\",-apple-system,BlinkMacSystemFont,sans-serif;\n  --fs-xl:18px; --fs-lg:16px; --fs-md:14px; --fs-sm:12px; --fs-xs:10px;\n  --lh-title:1.3; --lh-body:1.4; --lh-num:1.2;\n  /* §3 圆角 */\n  --r-pill:22px; --r-sheet:16px; --r-card:12px; --r-ctl:8px; --r-tag:2px;\n  /* §4 阴影 / 分隔 */\n  --sh-card:0 1px 6px rgba(0,0,0,.02);\n  --sh-sheet:0 -2px 16px rgba(0,0,0,.08);\n  /* §0 间距栅格 */\n  --sp-1:4px; --sp-2:8px; --sp-3:12px; --sp-4:16px; --sp-5:20px; --sp-6:24px; --sp-8:32px;\n}\n/* ================================================================\n   基础重置\n   ================================================================ */\n*,*::before,*::after{box-sizing:border-box;}\nhtml{-webkit-text-size-adjust:100%;}\nbody{margin:0;padding:0;background:var(--bg-page);font-family:var(--font-cn);font-size:var(--fs-md);\n  line-height:var(--lh-body);color:var(--text-01);-webkit-font-smoothing:antialiased;\n  -webkit-tap-highlight-color:transparent;}\nh1,h2,h3,h4,h5,h6{margin:0;font-size:inherit;font-weight:600;line-height:var(--lh-title);}\np{margin:0;}\nul,ol{margin:0;padding:0;list-style:none;}\nbutton{font-family:inherit;font-size:inherit;color:inherit;background:none;border:0;margin:0;padding:0;cursor:pointer;}\nimg,svg{display:block;}\nfieldset{margin:0;padding:0;border:0;min-width:0;}\nlegend{padding:0;}\n.nsk-num{font-family:var(--font-num);font-variant-numeric:tabular-nums;line-height:var(--lh-num);}\n.nsk-sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;}\n[hidden]{display:none !important;}\n/* ================================================================\n   通用组件（沿用主理人中心）\n   ================================================================ */\n.nsk-page{position:relative;max-width:390px;margin:0 auto;background:var(--bg-page);}\n.nsk-statusbar{display:flex;align-items:center;justify-content:space-between;padding:var(--sp-2) var(--sp-6) var(--sp-1);color:var(--text-01);}\n.nsk-statusbar__time{font-size:var(--fs-lg);font-weight:600;}\n.nsk-statusbar__icons{display:flex;align-items:center;gap:var(--sp-1);}\n.nsk-icon{color:inherit;}\n.nsk-btn{display:inline-flex;align-items:center;justify-content:center;gap:var(--sp-1);\n  min-height:44px;padding:0 var(--sp-6);border-radius:var(--r-pill);\n  font-size:var(--fs-lg);font-weight:600;line-height:1;border:1px solid transparent;\n  transition:background-color .15s,border-color .15s,color .15s,box-shadow .15s,opacity .15s,transform .12s;}\n.nsk-btn:focus{outline:none;}\n.nsk-btn:focus-visible{box-shadow:var(--focus-ring);}\n.nsk-btn--primary{background:var(--brand-01);color:var(--text-04);}\n.nsk-btn--primary:hover{background:var(--brand-01-hover);}\n.nsk-btn--primary:active{background:var(--brand-02);transform:scale(.98);}\n.nsk-btn--secondary{background:var(--text-04);border-color:var(--brand-01);color:var(--brand-01);}\n.nsk-btn--secondary:hover{background:var(--brand-04);}\n.nsk-btn--secondary:active{background:var(--brand-04);color:var(--brand-02);transform:scale(.98);}\n.nsk-btn--sm{min-height:32px;padding:0 var(--sp-3);font-size:var(--fs-sm);border-radius:var(--r-pill);}\n.nsk-btn--text{min-height:32px;padding:0 var(--sp-2);font-size:var(--fs-sm);font-weight:400;color:var(--text-02);border-radius:var(--r-ctl);}\n.nsk-btn--text:hover{background:var(--row-hover);color:var(--brand-01);}\n.nsk-tag{display:inline-flex;align-items:center;height:20px;padding:0 var(--sp-1);\n  border-radius:var(--r-tag);font-size:var(--fs-sm);font-weight:400;line-height:1;white-space:nowrap;}\n.nsk-tag--blue{background:var(--brand-04);color:var(--brand-01);}\n.nsk-tag--green{background:var(--success-02);color:var(--success-01);}\n.nsk-tag--grey{background:var(--bg-page);color:var(--text-02);}\n.nsk-tag--huidou{background:var(--huidou-02);color:var(--huidou-01);}\n/* ================================================================\n   本页面局部样式\n   ================================================================ */\n/* ---- 顶部固定区：状态栏 / 导航栏 / 完成度 / 锚点条 ---- */\n.nsk-nav{flex:none;background:var(--bg-page);}\n.nsk-navbar{display:flex;align-items:center;gap:var(--sp-2);padding:var(--sp-1) var(--sp-4) var(--sp-2);}\n.nsk-navbar__back{display:flex;align-items:center;justify-co move('is-show'); }, 2200);\n  }\n\n  /* ================= 模块折叠 + 锚点定位 ================= */\n  var scrollBox = $('#pageScroll');\n\n  $$('.nsk-mod').forEach(function(mod){\n    var head = $('.nsk-mod__head', mod);\n    head.addEventListener('click', function(){\n      var open = !mod.classList.contains('is-open');\n      mod.classList.toggle('is-open', open);\n      head.setAttribute('aria-expanded', String(open));\n    });\n  });\n\n  function openMod(id){\n    var mod = document.getElementById(id);\n    if(!mod) return;\n    mod.classList.add('is-open');\n    var head = $('.nsk-mod__head', mod);\n    if(head) head.setAttribute('aria-expanded','true');\n  }\n\n  $$('.nsk-anchor').forEach(function(a){\n    a.addEventListener('click', function(){\n      var id = a.getAttribute('data-goto');\n      openMod(id);\n      var mod = document.getElementById(id);\n      if(!mod) return;\n      // 以滚动容器为参照计算偏移，避免顶部固定区遮挡\n      var top = mod.offsetTop - 4;\n      if(scrollBox) scrollBox.scrollTo({ top: top, behavior: 'smooth' });\n      setAnchor(id);\n    });\n  });\n\n  function setAnchor(id){\n    $$('.nsk-anchor').forEach(function(a){\n      a.classList.toggle('is-on', a.getAttribute('data-goto') === id);\n    });\n  }\n\n  // 滚动时同步锚点高亮\n  var mods = $$('.nsk-mod');\n  var ticking = false;\n  if(scrollBox){\n    scrollBox.addEventListener('scroll', function(){\n      if(ticking) return;\n      ticking = true;\n      requestAnimationFrame(function(){\n        var st = scrollBox.scrollTop + 20;\n        var cur = mods[0];\n        mods.forEach(function(m){ if(m.offsetTop <= st) cur = m; });\n        if(cur) setAnchor(cur.id);\n        ticking = false;\n      });\n    });\n  }\n\n  /* ================= 字数统计 ================= */\n  // 兼容 input/textarea（value）与 contenteditable（innerText）\n  function elText(el){\n    if(!el) return '';\n    return el.value !== undefined ? el.value : (el.innerText || el.textContent || '');\n  }\n\n  function bindCount(input, out, max){\n    if(!input || !out) return;\n    function sync(){\n      var n = elText(input).replace(/\\n$/, '').length;\n      out.textContent = n + '/' + max;\n      out.classList.toggle('is-max', n >= max);\n    }\n    input.addEventListener('input', sync);\n    sync();\n  }\n  bindCount($('#actTitle'), $('#titleCount'), 40);\n  bindCount($('#actBody'), $('#bodyCount'), 1000);\n\n  /* ================= 正文图文编辑器：插图 / 加粗 / 字号 ================= */\n  var actBody = $('#actBody'), sheetImg = $('#sheetImg');\n  var rtImg = $('#rtImg'), rtBold = $('#rtBold'), rtSize = $('#rtSize');\n  var SIZE_OPTS = [\n    { value: '14', label: '正文 14px' },\n    { value: '16', label: '小标题 16px' },\n    { value: '18', label: '大标题 18px' }\n  ];\n  var IMG_HTML = function(cls){\n    return '<div class=\"nsk-rt__fig\" contenteditable=\"false\">' +\n             '<span class=\"nsk-rt__figdel\" role=\"button\" tabindex=\"-1\" aria-label=\"删除图片\">✕<\/span>' +\n             '<span class=\"nsk-rt__img ' + cls + '\"><\/span>' +\n           '<\/div><p><br><\/p>';\n  };\n\n  function selInEditor(){\n    var s = window.getSelection();\n    return !!(s && s.rangeCount && s.anchorNode && actBody.contains(s.anchorNode));\n  }\n  function hasRange(){\n    var s = window.getSelection();\n    return selInEditor() && !s.isCollapsed;\n  }\n  function focusEditorEnd(){\n    actBody.focus();\n    var r = document.createRange();\n    r.selectNodeContents(actBody);\n    r.collapse(false);\n    var s = window.getSelection();\n    s.removeAllRanges();\n    s.addRange(r);\n  }\n  function syncBoldState(){\n    var on = false;\n    try { on = document.queryCommandState('bold'); } catch(e){}\n    rtBold.setAttribute('aria-pressed', String(!!on));\n  }\n  function insertBlock(html){\n    if(!selInEditor()) focusEditorEnd();\n    document.execCommand('insertHTML', false, html);\n    refreshSum(); refreshProgress();\n  }\n  function afterEdit(){\n    refreshSum(); refreshProgress();\n  }\n\n  // 工具栏按钮：mousedown 阻止默认，保住编辑器里的选区\n  [rtImg, rtBold, rtSize].forEach(function(b){\n    if(b) b.addEventListener('mousedown', function(e){ e.preventDefault(); });\n  });\n\n  // 插入图片\n  if(rtImg) rtImg.addEventListener('click', function(){\n    showMask();\n    sheetPick.hidden = true; sheetTime.hidden = true;\n    sheetTag.hidden = true; sheetTicket.hidden = true;\n    sheetImg.hidden = false;\n  });\n\n  var sheetImgGrid = $('#sheetImgGrid');\n  if(sheetImgGrid) sheetImgGrid.addEventListener('click', function(e){\n    var opt = e.target.closest('.nsk-imgopt');\n    if(!opt) return;\n    var cls = opt.getAttribute('data-img-cls') || 'nsk-thumb--frisbee';\n    hideSheets();\n    insertBlock(IMG_HTML(cls));\n    toast('已插入图片');\n  });\n\n  var sheetImgAlbum = $('#sheetImgAlbum');\n  if(sheetImgAlbum) sheetImgAlbum.addEventListener('click', function(){\n    hideSheets();\n    insertBlock(IMG_HTML('nsk-thumb--night'));\n    toast('已添加图片（原型占位）');\n  });\n\n  // 正文内删除图片\n  actBody.addEventListener('click', function(e){\n    var d = e.target.closest('.nsk-rt__figdel');\n    if(!d) return;\n    var fig = d.closest('.nsk-rt__fig');\n    if(fig){ fig.remove(); afterEdit(); toast('已删除图片'); }\n  });\n\n  // 加粗\n  if(rtBold) rtBold.addEventListener('click', function(){\n    if(!selInEditor()) focusEditorEnd();\n    document.execCommand('bold');\n    syncBoldState();\n    afterEdit();\n  });\n\n  // 字号\n  if(rtSize) rtSize.addEventListener('click', function(){\n    openPick('选择字号', SIZE_OPTS, null, function(v){\n      if(!hasRange()){ toast('请先选中要设置的文字'); return; }\n      var txt = String(window.getSelection())\n        .replace(/&/g,'&amp;').replace(/<\/g,'&lt;').replace(/>/g,'&gt;');\n      if(!txt.trim()){ toast('请先选中要设置的文字'); return; }\n      document.execCommand('insertHTML', false, '<span style=\"font-size:' + v + 'px\">' + txt + '<\/span>');\n      toast('字号已设为 ' + v + 'px');\n      afterEdit();\n    });\n  });\n\n  // 选区变化同步加粗态；输入后刷新字数\n  document.addEventListener('selectionchange', function(){\n    if(selInEditor()) syncBoldState();\n  });\n  actBody.addEventListener('keyup', syncBoldState);\n  actBody.addEventListener('mouseup', syncBoldState);\n\n  /* ================= 图集：最多 2 张 ================= */\n  var gallery = $('#gallery'), galleryAdd = $('#galleryAdd'), galleryHint = $('#galleryHint');\n  var IMG_MAX = 2;\n  var thumbs = ['nsk-thumb--frisbee','nsk-thumb--dusk'];\n\n  function syncGallery(){\n    var n = $$('[data-img]', gallery).length;\n    galleryAdd.hidden = n >= IMG_MAX;\n    $$('[data-img]', gallery).forEach(function(item, i){\n      var badge = $('.nsk-gallery__badge', item);\n      if(i > 0 && badge) badge.remove();\n      if(i === 0 && !badge){\n        item.insertAdjacentHTML('afterbegin','<span class=\"nsk-gallery__badge\">头图<\/span>');\n      }\n    });\n    galleryHint.textContent = n >= IMG_MAX\n      ? '已达上限 2 张，删除其中一张后可继续上传'\n      : '支持 JPG、PNG，单张≤50MB，可拖拽排序。首图用于活动列表，建议竖图 3:4；第二张图用于详情顶部，建议横图 4:3/16:9';\n    refreshProgress();\n  }\n\n  gallery.addEventListener('click', function(e){\n    var del = e.target.closest('.nsk-gallery__del');\n    if(del){\n      var item = del.closest('[data-img]');\n      if(item) item.remove();\n      syncGallery();\n      return;\n    }\n    if(e.target.closest('#galleryAdd')){\n      var n = $$('[data-img]', gallery).length;\n      if(n >= IMG_MAX) return;\n      var cls = thumbs[n] || thumbs[0];\n      var div = document.createElement('div');\n      div.className = 'nsk-gallery__item ' + cls;\n      div.setAttribute('data-img','');\n      div.innerHTML = '<button type=\"button\" class=\"nsk-gallery__del\" aria-label=\"删除图片\">✕<\/button>';\n      gallery.insertBefore(div, galleryAdd);\n      syncGallery();\n      toast('已添加图片（原型占位）');\n    }\n  });\n\n  /* ================= 亮点标签：最多 4 个 + 自定义标签弹层 ================= */\n  var TAG_MAX = 4, TAG_LEN = 6;\n  var tagChips = $('#tagChips');\n  var sheetTag = $('#sheetTag'), tagInput = $('#tagInput'),\n      tagInputCnt = $('#tagInputCnt'), tagErr = $('#tagErr'), sheetTagOk = $('#sheetTagOk');\n\n  // 已有标签名（排除「＋自定义」触发按钮）\n  function tagNames(){\n    return $$('.nsk-chip', tagChips)\n      .filter(function(c){ return !c.hasAttribute('data-tag-add'); })\n      .map(function(c){ return c.getAttribute('data-tag-name') || c.textContent.trim(); });\n  }\n  function tagOnCount(){ return $$('.nsk-chip.is-on', tagChips).length; }\n\n  function tagErrMsg(msg){\n    tagErr.textContent = msg || '';\n    tagInput.classList.toggle('is-error', !!msg);\n  }\n\n  function openTagSheet(){\n    tagInput.value = '';\n    tagInputCnt.textContent = '0/' + TAG_LEN;\n    tagErrMsg('');\n    showMask();\n    sheetPick.hidden = true;\n    sheetTime.hidden = true;\n    sheetTicket.hidden = true;\n    sheetImg.hidden = true;\n    sheetTag.hidden = false;\n    setTimeout(function(){ tagInput.focus(); }, 30);\n  }\n\n  function saveTag(){\n    var name = tagInput.value.trim();\n    if(!name){ tagErrMsg('请输入标签内容'); tagInput.focus(); return; }\n    if(name.length > TAG_LEN) name = name.slice(0, TAG_LEN);\n    if(tagNames().indexOf(name) > -1){ tagErrMsg('该标签已存在，请换一个'); tagInput.focus(); return; }\n\n    // 已选满 4 个时，新标签先不选中，避免静默丢选中态\n    var full = tagOnCount() >= TAG_MAX;\n    var b = document.createElement('button');\n    b.type = 'button';\n    b.className = 'nsk-chip nsk-chip--custom' + (full ? '' : ' is-on');\n    b.setAttribute('aria-pressed', String(!full));\n    b.setAttribute('data-tag-name', name);\n    b.innerHTML = '<span class=\"nsk-chip__txt\"><\/span>' +\n      '<span class=\"nsk-chip__del\" role=\"button\" tabindex=\"-1\" aria-label=\"删除标签\">✕<\/span>';\n    $('.nsk-chip__txt', b).textContent = name;\n\n    var addBtn = $('[data-tag-add]', tagChips);\n    if(addBtn) tagChips.insertBefore(b, addBtn); else tagChips.appendChild(b);\n\n    hideSheets();\n    toast(full ? '已添加标签，最多可选 ' + TAG_MAX + ' 个，请先取消一个'\n              : '已添加标签「' + name + '」');\n    refreshProgress();\n  }\n\n  tagInput.addEventListener('input', function(){\n    // 粘贴 / 输入法上屏时 maxlength 不一定生效，这里再兜一层\n    if(tagInput.value.length > TAG_LEN) tagInput.value = tagInput.value.slice(0, TAG_LEN);\n    tagInputCnt.textContent = tagInput.value.length + '/' + TAG_LEN;\n    tagErrMsg('');\n  });\n  tagInput.addEventListener('keydown', function(e){\n    if(e.key === 'Enter'){ e.preventDefault(); saveTag(); }\n  });\n  sheetTagOk.addEventListener('click', saveTag);\n\n  tagChips.addEventListener('click', function(e){\n    // 自定义标签的删除\n    var del = e.target.closest('.nsk-chip__del');\n    if(del){\n      var host = del.closest('.nsk-chip');\n      if(host){ var nm = host.getAttribute('data-tag-name') || ''; host.remove(); refreshProgress(); toast('已删除标签「' + nm + '」'); }\n      return;\n    }\n    var chip = e.target.closest('.nsk-chip');\n    if(!chip) return;\n    if(chip.hasAttribute('data-tag-add')){ openTagSheet(); return; }\n    var on = chip.classList.contains('is-on');\n    if(!on && tagOnCount() >= TAG_MAX){\n      toast('最多选择 ' + TAG_MAX + ' 个标签，请先取消一个');\n      return;\n    }\n    chip.classList.toggle('is-on', !on);\n    chip.setAttribute('aria-pressed', String(!on));\n    refreshProgress();\n  });\n\n  /* ================= 通用底部单选弹层 ================= */\n  var mask = $('#mask');\n  var sheetPick = $('#sheetPick'), sheetPickTitle = $('#sheetPickTitle'),\n      sheetPickGrid = $('#sheetPickGrid'), sheetPickOk = $('#sheetPickOk');\n  var sheetFrow = $('#sheetFrow'), sheetFrowGrid = $('#sheetFrowGrid'), sheetFrowOk = $('#sheetFrowOk');\n  var pickState = { options: [], value: null, onOk: null };\n\n  function showMask(){ mask.hidden = false; }\n  function hideSheets(){\n    mask.hidden = true;\n    sheetPick.hidden = true;\n    sheetTime.hidden = true;\n    sheetTag.hidden = true;\n    sheetTicket.hidden = true;\n    sheetFrow.hidden = true;\n    sheetTk.hidden = true;\n    sheetImg.hidden = true;\n    sheetAdd.hidden = true;\n  }\n\n  function openPick(title, options, current, onOk){\n    pickState.options = options;\n    pickState.value = current;\n    pick ames = $$('.nsk-frow__name', frowList).map(function(i){ return i.value.trim(); });\n    return names.indexOf('姓名') > -1 && names.indexOf('手机号') > -1;\n  }\n  function checkPay(){ return !!refundType(); }\n\n  var CHECKS = {\n    'mod-base': checkBase, 'mod-detail': checkDetail, 'mod-sess': checkSess,\n    'mod-ticket': checkTicket, 'mod-form': checkForm, 'mod-pay': checkPay\n  };\n\n  function refreshProgress(){\n    var done = 0, total = 0;\n    Object.keys(CHECKS).forEach(function(id){\n      total++;\n      var ok = false;\n      try{ ok = CHECKS[id](); }catch(err){ ok = false; }\n      var mod = document.getElementById(id);\n      if(mod) mod.classList.toggle('is-done', ok);\n      var dot = $('[data-dot=\"' + id + '\"]');\n      if(dot) dot.hidden = !ok;\n      if(ok) done++;\n    });\n    var num = $('#progressNum'), fill = $('#progressFill'), bar = $('#progressBar');\n    if(num) num.textContent = done;\n    if(fill) fill.style.width = (total ? (done / total * 100) : 0) + '%';\n    if(bar) bar.setAttribute('aria-valuenow', done);\n    refreshSum();\n  }\n\n  function refreshSum(){\n    // 基础信息\n    var baseSum = $('[data-sum=\"base\"]');\n    if(baseSum){\n      var city = $('#rowCity').textContent.trim();\n      var title = $('#actTitle').value.trim();\n      baseSum.textContent = title ? (city ? city + ' · ' : '') + title : '待填写';\n    }\n    // 活动详情\n    var detailSum = $('[data-sum=\"detail\"]');\n    if(detailSum){\n      var tags = $$('.nsk-chip.is-on', tagChips).length;\n      var len = elText($('#actBody')).trim().length;\n      detailSum.textContent = len ? tags + ' 个标签 · ' + len + ' 字' : '待填写';\n    }\n    // 场次\n    var sessSum = $('[data-sum=\"sess\"]');\n    if(sessSum){\n      var list = $$('[data-sess]', sessList);\n      var first = $('[data-time=\"start\"]', list[0]);\n      var fv = first ? $('[data-val]', first) : null;\n      var day = fv ? (fv.getAttribute('data-val') || '').split('T')[0] : '';\n      sessSum.textContent = list.length + ' x) scrollBox.scrollTo({ top: mod.offsetTop - 4, behavior:'smooth' });\n      setAnchor(err.id);\n      toast(err.msg);\n      var input = $('#actTitle');\n      if(err.id === 'mod-base' && !isFilled(input)){ input.classList.add('is-error'); input.focus(); }\n      return;\n    }\n    toast('已提交，等待项目管理人员审核');\n  });\n\n  $('#actTitle').addEventListener('input', function(e){\n    e.target.classList.remove('is-error');\n  });\n\n  $('#saveDraft').addEventListener('click', function(){\n    refreshProgress();\n    toast('草稿已保存，可在「我发布的活动」中继续编辑');\n  });\n\n  /* ================= 活动地址 · 地图自动定位 ================= */\n  var addrMap = $('#addrMap'), addrInput = $('#actAddr');\n  var addrDebounce = null, addrLocateTimer = null;\n\n  function locateAddr(){\n    clearTimeout(addrLocateTimer);\n    addrMap.hidden = false;\n    addrMap.classList.add('is-locating');\n    addrLocateTimer = setTimeout(function(){ addrMap.classList.remove('is-locating'); }, 900);\n  }\n\n  function clearLocate(){\n    clearTimeout(addrDebounce);\n    clearTimeout(addrLocateTimer);\n    addrMap.hidden = true;\n    addrMap.classList.remove('is-locating');\n  }\n\n  addrInput.addEventListener('input', function(e){\n    clearTimeout(addrDebounce);\n    var v = String(e.target.value).trim();\n    if(!v){ clearLocate(); return; }\n    addrDebounce = setTimeout(locateAddr, 600);\n  });\n\n  $('#mapRedo').addEventListener('click', locateAddr);\n\n  /* ================= 初始化 ================= */\n  if(isFilled(addrInput)) locateAddr();\n  syncGallery();\n  syncSessMode();\n  syncRefund();\n  refreshProgress();\n  refreshSum();\n})();\n<\/script>\n\n<!--\n================================================================\n字段映射：管理后台「新增活动」→ 本页（移动端发布活动）\n================================================================\n【基础信息】\n  活动标题（40 字上限）            → 模块 1 · 单行输入 + 字数计数\n  活动图集（最多 2 张，首图头图）  → 模块 1 · 图集位（首图带「头图」角标，达上限隐藏上传口）\n  城市 *                           → 模块 1 · 行式选择（底部单选弹层）\n  项目 / 片区                      → 模块 1 · 行内联输入\n  主办方 / 关联社群 *              → 模块 1 · 行式选择（底部单选弹层）\n  活动地址                         → 模块 1 · 多行文本 + 地图自动定位卡（输入后延时定位，红标定位点 + 解析地址条 + 重新定位）\n  是否业主专属                     → 模块 1 · 开关 + 状态文案联动\n【活动详情】\n  亮点标签（最多 4 个）            → 模块 2 · chips 多选（超 4 个拦截并提示，支持自定义）\n  正文介绍（后台富文本）           → 模块 2 · 多行文本 + 字数计数（原型阶段不做富文本工具条）\n【场次配置】（后台支持多场次）\n  场次名称 / 开始 * / 结束 * / 报名开始 / 报名截止 * / 签到开始\n                                   → 模块 3 · 场次卡 + 时间选择弹层（日期 21 天 + 整点时段）\n  场次容量（0=不限） / 单账号限购  → 模块 3 · 双列数字（卡片内「开启候补」开关已隐藏）\n【票种规格】（后台为表格，按场次配置）\n  票种名称（字典）                 → 模块 4 · 票种卡标题（点击唤起票种字典弹层）\n  适配场次（多选，默认全部）       → 模块 4 · chips（「全部场次」与具体场次互斥）\n  价格 / 每份含人数 / 库存限额 / 最少购买 / 最多购买 / 允许单独购买\n                                   → 模块 4 · 票种卡 2×3 网格\n【报名表单字段】\n  字段名 / 类型 / 必填 / 适用票种 / 提示文案 / 排序\n                                   → 模块 5 · 字段行（字段名可编辑，类型与适用范围以副行摘要呈现）\n  姓名、手机号为系统预置字段       → 模块 5 · 默认必填（锁定不可改）+ 名称只读 + 无删除按钮\n  紧急联系人（含姓名 / 手机号）    → 模块 5 · 点击说明行打开子字段多选弹层（至少保留一项）\n【支付与退款配置】\n  是否允许荟豆抵扣（200 荟豆 = 1 元） → 模块 6 · 分段选择\n  单笔最多抵扣 %                   → 模块 6 · 数字（选「不允许」时整项隐藏）\n  退款类型 *                       → 模块 6 · 单选卡（三档）\n  可退窗口 N *                     → 模块 6 · 行式选择（2–168 小时），仅「个人原因」显示\n  退款说明文案                     → 模块 6 · 多行文本，随类型与 N 自动生成\n【候补配置】\n  候补容量比例 % / 候补等待支付时长 → 已隐藏（模块、锚点与完成度计数同步移除，完成度改为 6 个模块）\n【提交】\n  保存草稿 / 提交审核              → 底部操作条（sticky）\n  后台无「核销设置」字段           → 本页不设该模块，改为审核说明卡提示「发布后可生成签到码与海报」\n\n【与既有「4.主理人发布活动.html」的差异】\n  1. 字段口径改以「管理后台-活动新增.html」为准：去掉后台不存在的「业主价」，补齐「每份含人数 / 库存限额 / 允许单独购买 / 适配场次 / 候补容量比例 / 候补等待支付时长」。\n  2. 增加顶部完成度（7 个模块的必填齐备度）与横向锚点条，长表单可一键定位。\n  3. 模块头收起态展示内容摘要（如「3 个票种 · ￥59 起」），不展开也能确认已填内容。\n  4. 时间、票种名称、可退窗口统一收敛到同一套底部弹层选择器，避免移动端出现传统下拉框。\n  5. 视觉沿用「1.主理人中心.html」的设计令牌（同色板 / 同字号阶梯 / 同圆角 / 同阴影），未引入新色值。\n\n【交互清单】\n  模块折叠、锚点定位与高亮、字数统计、图集增删（≤2）、标签多选（≤4）、场次增删、\n  时间选择弹层、票种命名 / 增删 / 适配场次互斥、票种价格摘要、报名字段增删（预置保护）、\n  荟豆抵扣联动、退款类型联动与说明自动生成、可退窗口选择、完成度实时计算、\n  提交必填校验（定位到模块 + 轻提示）、保存草稿提示。\n================================================================\n-->\n\n\n\n<script>\n(function(){\n  var ID=\"p4\";\n  var MAP={\"1.主理人中心.html\": \"p1\", \"11.主理人创建社群.html\": \"p11\", \"12.主理人管理社群可基于社群创建活动.html\": \"p12\", \"13.主理人社群成员列表.html\": \"p13\", \"2.申请成为主理人.html\": \"p2\", \"3-1.查看申请记录.html\": \"p31\", \"3.申请提交页面.html\": \"p3\", \"4.主理人发布活动-改版.html\": \"p4\", \"8.主理人查看活动-改版.html\": \"p8\", \"9.活动报名名单-改版.html\": \"p9\"};\n  function go(id){try{parent.postMessage({__demoNav:id},'*');}catch(e){}}\n  window.__demoGo=go;\n  window.__demoBlocked=function(f){alert('「'+f+'」未包含在本次合并的原型范围内');};\n  document.addEventListener('click',function(e){\n    var t=e.target;\n    var a=t&&t.closest?t.closest('a[href]'):null;\n    if(!a)return;\n    var h=a.getAttribute('href')||'';\n    if(!/\\.html(\\?|#|$)/.test(h))return;\n    e.preventDefault();e.stopPropagation();\n    if(MAP[h]){go(MAP[h]);}else{window.__demoBlocked(h);}\n  },true);\n  function allBtns(){return document.querySelectorAll('button,[role=\"button\"],a');}\n  function hookText(txt,id,delay,toast){\n    allBtns().forEach(function(b){\n      if(b.__dh)return;\n      if((b.textContent||'').replace(/\\s+/g,'').indexOf(txt)>-1){\n        b.__dh=1;\n        b.addEventListener('click',function(){setTimeout(function(){\n          if(toast){alert(toast);return;}\n          if(id)go(id);\n        },delay||0);});\n      }\n    });\n  }\n  function hookAria(prefix,id){\n    document.querySelectorAll('[aria-label]').forEach(function(b){\n      if(b.__dh)return;\n      if((b.getAttribute('aria-label')||'').indexOf(prefix)===0){\n        b.__dh=1;\n        b.addEventListener('click',function(){go(id);});\n      }\n    });\n  }\n  hookText('提交审核','p8',1200);\n  var BACK={\"p11\": \"p1\", \"p12\": \"p1\", \"p13\": \"p12\", \"p2\": \"p1\", \"p3\": \"p2\", \"p31\": \"p3\", \"p4\": \"p1\", \"p8\": \"p1\", \"p9\": \"p8\"}[ID];\n  var bk=document.querySelector('.nsk-navbar__back,.c-navbar__back');\n  if(bk&&BACK){bk.addEventListener('click',function(e){e.stopPropagation();e.preventDefault();go(BACK);});}\n  /* 2x 设计板页面（社群系列）按画板宽度等比缩放适配容器 */\n  var BOARD=0;\n  if(BOARD){\n    (function(){\n      var st=document.createElement('style');\n      st.textContent='html{overflow-x:hidden!important}body{margin:0 auto!important;zoom:'+(430/BOARD).toFixed(4)+'}';\n      document.head.appendChild(st);\n      var lastW=-1;\n      function fit(){\n        var w=document.documentElement.clientWidth||window.innerWidth||0;\n        if(w>0&&w!==lastW){\n          lastW=w;\n          document.body.style.zoom=(w/BOARD).toFixed(4);\n        }\n      }\n      window.__demoFit=fit;\n      fit();\n      window.addEventListener('resize',fit);\n      window.addEventListener('load',fit);\n      if(window.ResizeObserver){try{new ResizeObserver(fit).observe(document.documentElement);}catch(e){}}\n      /* 轮询自愈：任何事件时机漏掉（如 iframe 隐藏期未量到宽度）都会在下一拍补上 */\n      setInterval(fit,200);\n    })();\n  }\n})();\n<\/script>\n<\/body><\/html>"

  "p8": {
    "title": "查看活动",
    "html": "<!DOCTYPE html>\n<html lang=\"zh-CN\"><head>\n<meta charset=\"UTF-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n<meta name=\"theme-color\" content=\"#387DEC\">\n<title>主理人查看活动 · 活动管理<\/title>\n<style>\n/* ================================================================\n   设计令牌（与「1.主理人中心.html」「4.主理人发布活动-改版.html」完全一致）\n   §1 色彩 / §2 字体 / §3 圆角 / §4 阴影 / §0 4px 栅格\n   ================================================================ */\n:root{\n  --brand-01:#387DEC; --brand-02:#0855D1; --brand-03:#9BBEF5; --brand-04:#E0ECFF;\n  --text-01:#303133; --text-02:#909399; --text-03:#C0C4CC; --text-04:#FFFFFF;\n  --line-01:#EBEBEB; --bg-page:#F2F5F7;\n  --success-01:#10A17C; --success-02:#E6F7F2;\n  --huidou-01:#F76346; --huidou-02:#FFE7E6;\n  --danger:#EB4A38; --danger-bg:#FDECEA;\n  --brand-01-hover:#2C71DE; --row-hover:#FAFBFC; --fill-disabled:#F7F8FA;\n  --focus-ring:0 0 0 2px rgba(56,125,236,.24); --mask:rgba(0,0,0,.45);\n  --font-cn:\"PingFang SC\",\"苹方-简\",-apple-system,BlinkMacSystemFont,\"Helvetica Neue\",sans-serif;\n  --font-num:\"Source Han Sans SC\",\"思源黑体\",\"PingFang SC\",-apple-system,BlinkMacSystemFont,sans-serif;\n  --fs-xl:18px; --fs-lg:16px; --fs-md:14px; --fs-sm:12px; --fs-xs:10px;\n  --lh-title:1.3; --lh-body:1.4; --lh-num:1.2;\n  --r-pill:22px; --r-sheet:16px; --r-card:12px; --r-ctl:8px; --r-tag:2px;\n  --sh-card:0 1px 6px rgba(0,0,0,.02); --sh-sheet:0 -2px 16px rgba(0,0,0,.08);\n  --sp-1:4px; --sp-2:8px; --sp-3:12px; --sp-4:16px; --sp-5:20px; --sp-6:24px; --sp-8:32px;\n}\n/* ================= 基础重置 ================= */\n*,*::before,*::after{box-sizing:border-box;}\nhtml{-webkit-text-size-adjust:100%;}\nbody{margin:0;padding:0;background:var(--bg-page);font-family:var(--font-cn);font-size:var(--fs-md);\n  line-height:var(--lh-body);color:var(--text-01);-webkit-font-smoothing:antialiased;\n  -webkit-tap-highlight-color:transparent;}\nh1,h2,h3,h4,h5,h6{margin:0;font-size:inherit;font-weight:600;line-height:va cus{outline:none;}\n.nsk-navbar__more:focus-visible{box-shadow:var(--focus-ring);}\n.nsk-navbar__more[disabled]{color:var(--text-03);cursor:not-allowed;}\n.nsk-scroll{flex:1;overflow-y:auto;overflow-x:hidden;padding:0 var(--sp-3) var(--sp-3);\n  scrollbar-width:none;scroll-behavior:smooth;}\n.nsk-scroll::-webkit-scrollbar{display:none;}\n/* 卡片 */\n.nsk-card{background:var(--text-04);border-radius:var(--r-card);box-shadow:var(--sh-card);\n  margin-top:var(--sp-2);overflow:hidden;}\n.nsk-card__head{display:flex;align-items:center;justify-content:space-between;gap:var(--sp-2);\n  padding:var(--sp-3) var(--sp-3) 0;}\n.nsk-card__title{font-size:var(--fs-lg);font-weight:600;color:var(--text-01);}\n.nsk-card__extra{font-size:var(--fs-sm);color:var(--text-02);}\n.nsk-card__link{font-size:var(--fs-sm);color:var(--brand-01);padding:2px 0;border-radius:var(--r-tag);}\n.nsk-card__link:hover{color:var(--brand-01-hover);text-decoration:underline;}\n.nsk-card__link:focus{outline:none;}\n.nsk-card__link:focus-visible{box-shadow:var(--focus-ring);}\n/* 按钮 */\n.nsk-btn{display:inline-flex;align-items:center;justify-content:center;gap:var(--sp-1);\n  min-height:44px;padding:0 var(--sp-6);border-radius:var(--r-pill);\n  font-size:var(--fs-lg);font-weight:600;line-height:1;border:1px solid transparent;\n  transition:background-color .15s,border-color .15s,color .15s,box-shadow .15s,opacity .15s,transform .12s;}\n.nsk-btn:focus{outline:none;}\n.nsk-btn:focus-visible{box-shadow:var(--focus-ring);}\n.nsk-btn--primary{background:var(--brand-01);color:var(--text-04);}\n.nsk-btn--primary:hover{background:var(--brand-01-hover);}\n.nsk-btn--primary:active{background:var(--brand-02);transform:scale(.98);}\n.nsk-btn--secondary{background:var(--text-04);border-color:var(--brand-01);color:var(--brand-01);}\n.nsk-btn--secondary:hover{background:var(--brand-04);}\n.nsk-btn--secondary:active{background:var(--brand-04);color:var(--brand-02);transform:scale(.98);}\n.nsk-btn--danger{background:var(--text ke-width=\"1.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><\/svg><\/span><\/button>\n      <button type=\"button\" class=\"nsk-row\" id=\"validEnd\"><span class=\"nsk-row__k\">结束时间<\/span><span class=\"nsk-row__v\" id=\"validEndV\">2026-11-08 21:30<\/span><span class=\"nsk-row__arrow\" aria-hidden=\"true\"><svg width=\"12\" height=\"12\" viewBox=\"0 0 12 12\" focusable=\"false\"><path d=\"M4 2 L8 6 L4 10\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><\/svg><\/span><\/button>\n    <\/div>\n    <p class=\"nsk-validhint\" id=\"validHint\" hidden>开始时间需早于结束时间，且不晚于活动结束后 24 小时<\/p>\n    <div class=\"nsk-sheet__btns\">\n      <button type=\"button\" class=\"nsk-btn nsk-btn--secondary\" data-close>取消<\/button>\n      <button type=\"button\" class=\"nsk-btn nsk-btn--primary\" id=\"validOk\">保存<\/button>\n    <\/div>\n  <\/div>\n\n  <!-- 暂停活动 · 适配场次 -->\n  <div class=\"nsk-sheet\" id=\"sheetPauseSes\" role=\"dialog\" aria-modal=\"true\" aria-labelledby=\"psTitle\" hidden>\n    <div class=\"nsk-sheet__head\">\n      <h2 class=\"nsk-sheet__title\" id=\"psTitle\">暂停场次<\/h2>\n      <button type=\"button\" class=\"nsk-sheet__close\" data-close aria-label=\"关闭\">✕<\/button>\n    <\/div>\n    <span class=\"nsk-sheet__lb\">选择要暂停的场次 <i>可多选，至少一场<\/i><\/span>\n    <div class=\"nsk-sheet__grid\" id=\"pauseSesGrid\"><\/div>\n    <p class=\"nsk-sheet__note\">暂停后所选场次立即停止报名，已报名用户不受影响，可随时恢复；已举办的场次无需暂停。<\/p>\n    <div class=\"nsk-sheet__btns\">\n      <button type=\"button\" class=\"nsk-btn nsk-btn--secondary\" data-close>取消<\/button>\n      <button type=\"button\" class=\"nsk-btn nsk-btn--primary\" id=\"pauseSesOk\">确认暂停<\/button>\n    <\/div>\n  <\/div>\n\n  <!-- 签到有效期 · 适配场次 -->\n  <div class=\"nsk-sheet\" id=\"sheetSes\" role=\"dialog\" aria-modal=\"true\" aria-labelledby=\"sesTitle\" hidden>\n    <div class=\"nsk-sheet__head\">\n      <h2 class=\"nsk-sheet__title\" id=\"sesTitle\">适配场次<\/h2>\n      <button type=\"button\" class=\"nsk-sheet__close\" data-close aria-label=\"关闭\">✕<\/button>\n    <\/div>\n    <span class=\"nsk-sheet__lb\">选择场次 <i>「全部场次」与具体场次互斥，可多选<\/i><\/span>\n    <div class=\"nsk-sheet__grid\" id=\"sesGrid\"><\/div>\n    <p class=\"nsk-sheet__note\">签到码仅在所选场次的扫码时间范围内生效，各场次按自身的开始 / 结束时间计算。<\/p>\n    <div class=\"nsk-sheet__btns\">\n      <button type=\"button\" class=\"nsk-btn nsk-btn--secondary\" data-close>取消<\/button>\n      <button type=\"button\" class=\"nsk-btn nsk-btn--primary\" id=\"sesOk\">保存<\/button>\n    <\/div>\n  <\/div>\n\n  <!-- 更多操作 -->\n  <div class=\"nsk-sheet\" id=\"sheetMore\" role=\"dialog\" aria-modal=\"true\" aria-labelledby=\"moreTitle\" hidden>\n    <div class=\"nsk-sheet__head\">\n      <h2 class=\"nsk-sheet__title\" id=\"moreTitle\">更多操作<\/h2>\n      <button type=\"button\" class=\"nsk-sheet__close\" data-close aria-label=\"关闭\">✕<\/button>\n    <\/div>\n    <div class=\"nsk-sheet__grid\">\n      <button type=\"button\" class=\"nsk-opt\" data-more=\"活动预览\">活动预览<\/button>\n      <button type=\"button\" class=\"nsk-opt\" data-more=\"复制活动\">复制活动<\/button>\n      <button type=\"button\" class=\"nsk-opt\" data-more=\"查看审核记录\">查看审核记录<\/button>\n      <button type=\"button\" class=\"nsk-opt\" data-more=\"导出活动数据\">导出活动数据<\/button>\n    <\/div>\n    <div class=\"nsk-sheet__btns\"><button type=\"button\" class=\"nsk-btn nsk-btn--secondary\" data-close>取消<\/button><\/div>\n  <\/div>\n\n  <!-- 二次确认 -->\n  <div class=\"nsk-dialog\" id=\"dialogConfirm\" role=\"alertdialog\" aria-modal=\"true\" aria-labelledby=\"dlgTitle\" aria-describedby=\"dlgDesc\" hidden>\n    <h2 class=\"nsk-dialog__t\" id=\"dlgTitle\">确认操作<\/h2>\n    <p class=\"nsk-dialog__d\" id=\"dlgDesc\">请确认<\/p>\n    <div class=\"nsk-dialog__btns\">\n      <button type=\"button\" class=\"nsk-btn nsk-btn--secondary\" id=\"dlgCancel\">取消<\/button>\n      <button type=\"button\" class=\"nsk-btn nsk-btn--primary\" id=\"dlgOk\">确认<\/button>\n    <\/div>\n  <\/div>\n\n  <p class=\"nsk-toast\" id=\"toast\" role=\"status\" aria-live=\"polite\"><\/p>\n<\/div>\n\n<p class=\"proto-foot\">招商荟有家 · C 端主理人 移动端原型 · 查看活动<\/p>\n<\/div>\n\n<script>\n(function(){\n  'use strict';\n  var $ = function(s,c){ return (c||document).querySelector(s); };\n  var $$ = function(s,c){ return Array.prototype.slice.call((c||document).querySelectorAll(s)); };\n\n  /* ============ 轻提示 ============ */\n  var toastEl = $('#toast'), toastTimer = null;\n  function toast(msg){\n    if(!toastEl) return;\n    toastEl.textContent = msg;\n    toastEl.classList.add('is-show');\n    clearTimeout(toastTimer);\n    toastTimer = setTimeout(function(){ toastEl.classList.remove('is-show'); }, 2200);\n  }\n\n  /* ============ 弹层管理 ============ */\n  var mask = $('#mask');\n  var sheets = $$('.nsk-sheet');\n  var dialog = $('#dialogConfirm');\n  function closeAll(){\n    mask.hidden = true;\n    sheets.forEach(function(s){ s.hidden = true; });\n    dialog.hidden = true;\n  }\n  function openSheet(id){\n    closeAll();\n    $('#'+id).hidden = false;\n    mask.hidden = false;\n  }\n  function swapSheet(id){\n    $('#'+id).hidden = false;\n    mask.hidden = false;\n  }\n  function openDialog(){ closeAll(); dialog.hidden = false; mask.hidden = false; }\n  mask.addEventListener('click', closeAll);\n  $$('[data-close]').forEach(function(b){ b.addEventListener('click', closeAll); });\n  document.addEventListener('keydown', function(e){ if(e.key === 'Escape') closeAll(); });\n\n  /* ============ 活动状态机 ============ */\n  var state = 'running';   // running | ended\n  var pausedSes = [];      // 已暂停的场次名\n  var btnPause = $('#btnPause'), btnEnd = $('#btnEnd');\n  var heroProgress = $('#heroProgress'), opsHint = $('#opsHint');\n\n  function pausableSes(){\n    return SESSIONS.filter(function(s){ return s.status !== '已举办'; });\n  }\n  function applyState(){\n    var allPaused = pausedSes.length > 0 && pausableSes().every(function(s){ return pausedSes.indexOf(s.name) > -1; });\n    if(state === 'running'){\n      btnPause.textContent = pausedSes.length ? '恢复活动' : '暂停活动';\n      btnPause.className = pausedSes.length ? 'nsk-btn nsk-btn--secondary nsk-btn--compact' : 'nsk-btn nsk-btn--huidou nsk-btn--compact';\n      btnPause.disabled = false;\n      btnEnd.disabled = false;\n      heroProgress.classList.toggle('is-off', allPaused);\n      opsHint.textContent = pausedSes.length\n        ? '当前已暂停：「' + pausedSes.join('、') + '」已停止报名，已报名用户不受影响，可随时恢复。'\n        : '暂停后 C 端停止报名，已报名用户不受影响；活动结束后不可恢复，请谨慎操作。';\n    } else {\n      btnPause.textContent = '恢复活动';\n      btnPause.disabled = true;\n      btnEnd.disabled = true;\n      heroProgress.classList.add('is-off');\n      opsHint.textContent = '活动已结束：报名入口、分享推广与签到码均已关闭，仅可查看数据与历史报名名单。';\n    }\n    // 结束后禁用推广与编辑\n    $$('#tilePoster, #tileCode, #btnMore').forEach(function(el){\n      if(state === 'ended'){ el.setAttribute('disabled',''); }\n      else { el.removeAttribute('disabled'); }\n    });\n  }\n\n  /* ============ 二次确认（暂停 / 恢复 / 结束） ============ */\n  var pendingAction = null;\n  var dlgTitle = $('#dlgTitle'), dlgDesc = $('#dlgDesc'), dlgOk = $('#dlgOk');\n  function askPause(names){\n    pendingAction = { type:'pause', names:names.slice() };\n    dlgTitle.textContent = '确认暂停所选场次？';\n    dlgDesc.textContent = '暂停后「' + names.join('、') + '」立即停止报名，已报名用户不受影响，可随时恢复。';\n    dlgOk.textContent = '确认暂停';\n    dlgOk.className = 'nsk-btn nsk-btn--solid-huidou';\n    openDialog();\n  }\n  function askResume(names){\n    pendingAction = { type:'resume', names:names.slice() };\n    dlgTitle.textContent = '确认恢复场次？';\n    dlgDesc.textContent = '恢复后「' + names.join('、') + '」报名入口重新开放，剩余 8 个名额继续接受报名。';\n    dlgOk.textContent = '确认恢复';\n    dlgOk.className = 'nsk-btn nsk-btn--primary';\n    openDialog();\n  }\n  function askEnd(){\n    pendingAction = { type:'end', names:[] };\n    dlgTitle.textContent = '确认结束活动？';\n    dlgDesc.textContent = '结束后不可恢复，第二场（11-08）报名、分享与签到码将全部关闭。请确认无需再举办该场次。';\n    dlgOk.textContent = '确认结束';\n    dlgOk.className = 'nsk-btn nsk-btn--solid-danger';\n    openDialog();\n  }\n  $('#dlgCancel').addEventListener('click', closeAll);\n  dlgOk.addEventListener('click', function(){\n    var a = pendingAction;\n    pendingAction = null;\n    closeAll();\n    if(!a) return;\n    if(a.type === 'pause'){\n      pausedSes = a.names.slice();\n      applyState();\n      toast('已暂停：「' + a.names.join('、') + '」报名入口已关闭');\n    } else if(a.type === 'resume'){\n      pausedSes = [];\n      applyState();\n      toast('已恢复：「' + a.names.join('、') + '」报名入口重新开放');\n    } else {\n      state = 'ended';\n      applyState();\n      toast('活动已结束，数据与报名名单仍可查看');\n    }\n  });\n\n  /* ---- 暂停 · 适配场次（多场次多选，单场次直接确认） ---- */\n  var pauseTmp = [];\n  function renderPauseSes(){\n    $('#pauseSesGrid').innerHTML = SESSIONS.map(function(s){\n      var held = s.status === '已举办';\n      return '<button type=\"button\" class=\"nsk-opt\" data-pses=\"' + s.name + '\"' + (held ? ' disabled' : '') +\n        ' aria-pressed=\"' + (!held && pauseTmp.indexOf(s.name) > -1 ? 'true' : 'false') + '\">' + s.name +\n        '<br><small style=\"color:var(--text-03)\">' + s.date + (held ? ' · ' + s.status : '') + '<\/small><\/button>';\n    }).join('');\n  }\n  $('#pauseSesGrid').addEventListener('click', function(e){\n    var b = e.target.closest('.nsk-opt');\n    if(!b || b.disabled) return;\n    var v = b.getAttribute('data-pses'), i = pauseTmp.indexOf(v);\n    if(i > -1) pauseTmp.splice(i, 1); else pauseTmp.push(v);\n    $$('#pauseSesGrid .nsk-opt').forEach(function(o){\n      if(!o.disabled) o.setAttribute('aria-pressed', String(pauseTmp.indexOf(o.getAttribute('data-pses')) > -1));\n    });\n  });\n  $('#pauseSesOk').addEventListener('click', function(){\n    if(!pauseTmp.length){ toast('请至少选择一个场次'); return; }\n    var names = pauseTmp.slice();\n    closeAll();\n    askPause(names);\n  });\n\n  btnPause.addEventListener('click', function(){\n    if(state === 'ended'){ toast('活动已结束，不可再变更状态'); return; }\n    if(pausedSes.length){ askResume(pausedSes.slice()); return; }\n    if(SESSIONS.length > 1){\n      pauseTmp = [];\n      renderPauseSes();\n      openSheet('sheetPauseSes');\n    }else{\n      askPause(pausableSes().map(function(s){ return s.name; }));\n    }\n  });\n  btnEnd.addEventListener('click', function(){\n    if(state === 'ended'){ toast('活动已结束，不可再变更状态'); return; }\n    askEnd();\n  });\n\n  /* ============ 编辑活动（复用发布表单） ============ */\n  $$('[data-edit]').forEach(function(b){\n    b.addEventListener('click', function(){\n      if(state === 'ended'){ toast('活动已结束，不可编辑'); return; }\n      toast('进入编辑：复用发布表单并回填现有活动信息');\n    });\n  });\n\n  /* ============ 分享活动 ============ */\n  function openShare(){ openSheet('sheetShare'); }\n  $('#tileShare').addEventListener('click', openShare);\n  $('#btnShareBottom').addEventListener('click', openShare);\n  $$('#shareGrid .nsk-opt').forEach(function(b){\n    b.addEventListener('click', function(){\n      var ch = b.getAttribute('data-channel');\n      closeAll();\n      toast(ch === '复制活动链接' ? '活动链接已复制' : '已选择「'+ch+'」，原型演示不调起微信');\n    });\n  });\n\n  /* ============ 生成活动海报 ============ */\n  $('#tilePoster').addEventListener('click', function(){ openSheet('sheetPoster'); });\n  var posterBg = $('#posterBg'), posterUpload = $('#posterUpload');\n  function applyPosterTpl(chip){\n    $$('#posterTpl .nsk-chip').forEach(function(x){ x.classList.remove('is-on'); x.setAttribute('aria-pressed','false'); });\n    chip.classList.add('is-on'); chip.setAttribute('aria-pressed','true');\n    var tpl = chip.getAttribute('data-tpl');\n    $('#posterPreview').className = 'nsk-poster nsk-poster--' + tpl;\n    posterBg.hidden = tpl !== 'custom';\n    $('#posterCustomTip').hidden = tpl !== 'custom';\n  }\n  $$('#posterTpl .nsk-chip').forEach(function(b){\n    b.addEventListener('click', function(){\n      if(b.getAttribute('data-tpl') === 'custom'){ posterUpload.click(); return; }\n      applyPosterTpl(b);\n    });\n  });\n  posterUpload.addEventListener('change', function(){\n    var f = this.files && this.files[0];\n    this.value = '';\n    if(!f) return;\n    if(!/^image\\//.test(f.type)){ toast('请选择图片文件（JPG / PNG）'); return; }\n    if(f.size > 10 * 1024 * 1024){ toast('自定义背景图不能超过 10MB'); return; }\n    var rd = new FileReader();\n    rd.onload = function(){\n      posterBg.style.backgroundImage = 'url(\"' + rd.result + '\")';\n      applyPosterTpl($('#posterTpl .nsk-chip[data-tpl=\"custom\"]'));\n      toast('已应用自定义背景');\n    };\n    rd.readAsDataURL(f);\n  });\n  $('#posterSave').addEventListener('click', function(){ toast('海报已保存到相册（原型演示）'); });\n  $('#posterShare').addEventListener('click', function(){ toast('已调起分享，可发送到微信或社群'); });\n\n  /* ============ 生成签到码 ============ */\n  $('#tileCode').addEventListener('click', function(){ $('#codeCfg').hidden = false; $('#codeResult').hidden = true; openSheet('sheetCode'); });\n\n  var codeSeed = 23;\n  function buildQR(){\n    var n = 21, u = 6, pad = 2, size = (n + pad*2) * u, seed = codeSeed;\n    var out = '<svg width=\"100%\" height=\"100%\" viewBox=\"0 0 '+size+' '+size+'\" aria-hidden=\"true\" focusable=\"false\">';\n    out += '<rect width=\"'+size+'\" height=\"'+size+'\" fill=\"#FFFFFF\"/>';\n    function finder(i,j,oi,oj){\n      var r = i-oi, c = j-oj;\n      if(r<0||r>6||c<0||c>6) return false;\n      return (r===0||r===6||c===0||c===6)||(r>=2&&r<=4&&c>=2&&c<=4);\n    }\n    function dark(i,j){\n      if(i<8 && j<8) return finder(i,j,0,0);\n      if(i<8 && j>n-9) return finder(i,j,0,n-7);\n      if(i>n-9 && j<8) return finder(i,j,n-7,0);\n      return ((i*7 + j*13 + (i*j)%5 + seed) % 9) < 4;\n    }\n    for(var i=0;i<n;i++){\n      for(var j=0;j<n;j++){\n        if(dark(i,j)) out += '<rect x=\"'+((j+pad)*u)+'\" y=\"'+((i+pad)*u)+'\" width=\"'+u+'\" height=\"'+u+'\" fill=\"#303133\"/>';\n      }\n    }\n    out += '<\/svg>';\n    $('#qrImg').innerHTML = out;\n  }\n  $('#codeGenerate').addEventListener('click', function(){\n    buildQR();\n    $('#codeCfg').hidden = true;\n    $('#codeResult').hidden = false;\n    toast('已生成签到码');\n  });\n  $('#codeRegen').addEventListener('click', function(){ codeSeed = (codeSeed + 7) % 97; buildQR(); toast('签到码已重新生成'); });\n\n  /* ============ 签到有效期配置 ============ */\n  var SESSIONS = [\n    { key:'s1', name:'第一场', date:'11-01 周日 19:00', start:'2026-11-01 19:00', end:'2026-11-01 21:00', status:'已举办' },\n    { key:'s2', name:'第二场', date:'11-08 周日 19:00', start:'2026-11-08 19:00', end:'2026-11-08 21:00', status:'报名中' }\n  ];\n  var validCfg = { ses:['全部场次'], qk:'3', start:'', end:'' };\n  function dtMin(s){ return Math.round(new Date(s.replace(' ', 'T')).getTime() / 60000); }\n  function minDt(m){\n    var d = new Date(m * 60000), p = function(x){ return x < 10 ? '0' + x : x; };\n    return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate()) + ' ' + p(d.getHours()) + ':' + p(d.getMinutes());\n  }\n  function sesList(){\n    if(validCfg.ses.indexOf('全部场次') > -1) return SESSIONS.slice();\n    return SESSIONS.filter(function(s){ return validCfg.ses.indexOf(s.name) > -1; });\n  }\n  function sesSpan(){\n    var ls = sesList();\n    return {\n      st: Math.min.apply(null, ls.map(function(s){ return dtMin(s.start); })),\n      en: Math.max.apply(null, ls.map(function(s){ return dtMin(s.end); }))\n    };\n  }\n  var QK = {\n    '1': { get:function(){ var p = sesSpan(); return [ minDt(p.st).slice(0, 10) + ' 00:00', minDt(p.en).slice(0, 10) + ' 23:59' ]; } },\n    '2': { get:function(){ var p = sesSpan(); return [ minDt(p.st - 60), minDt(p.en + 30) ]; } },\n    '3': { get:function(){ var p = sesSpan(); return [ minDt(p.st), minDt(p.en + 30) ]; } }\n  };\n  function sesText(){\n    return (validCfg.ses.indexOf('全部场次') > -1 || validCfg.ses.length === SESSIONS.length) ? '全部场次' : validCfg.ses.join('、');\n  }\n  function fmtRange(){ return (sesText() === '全部场次' ? '' : sesText() + ' · ') + validCfg.start.slice(5) + ' 至 ' + validCfg.end.slice(5); }\n  function applyQk(key){\n    var r = QK[key].get();\n    validCfg.qk = key;\n    validCfg.start = r[0]; validCfg.end = r[1];\n    $('#validStartV').textContent = validCfg.start;\n    $('#validEndV').textContent = validCfg.end;\n  }\n  function applyValid(){\n    $('#validSesV').textContent = sesText();\n    $('#validStartV').textContent = validCfg.start;\n    $('#validEndV').textContent = validCfg.end;\n    $('#codeValid .nsk-row__v').textContent = fmtRange();\n  }\n  applyQk('3');\n  $('#codeValid').addEventListener('click', function(){ applyValid(); $('#validHint').hidden = true; openSheet('sheetValid'); });\n  $$('#sheetValid [data-valid-qk]').forEach(function(chip){\n    chip.addEventListener('click', function(){\n      $$('#sheetValid [data-valid-qk]').forEach(function(x){ x.classList.remove('is-on'); x.setAttribute('aria-pressed','false'); });\n      chip.classList.add('is-on'); chip.setAttribute('aria-pressed','true');\n      applyQk(chip.getAttribute('data-valid-qk'));\n      $('#validHint').hidden = true;\n    });\n  });\n  /* ---- 适配场次多选（全部场次互斥） ---- */\n  var sesTmp = [];\n  function renderSes(){\n    var opts = [{ v:'全部场次', d:'' }].concat(SESSIONS.map(function(s){ return { v:s.name, d:s.date }; }));\n    $('#sesGrid').innerHTML = opts.map(function(o){\n      return '<button type=\"button\" class=\"nsk-opt\" data-ses=\"' + o.v + '\" aria-pressed=\"' +\n        (sesTmp.indexOf(o.v) > -1 ? 'true' : 'false') + '\">' + o.v + (o.d ? '<br><small style=\"color:var(--text-03)\">' + o.d + '<\/small>' : '') + '<\/button>';\n    }).join('');\n  }\n  $('#validSes').addEventListener('click', function(){\n    sesTmp = validCfg.ses.slice();\n    renderSes();\n    openSheet('sheetSes');\n  });\n  $('#sesGrid').addEventListener('click', function(e){\n    var b = e.target.closest('.nsk-opt');\n    if(!b) return;\n    var v = b.getAttribute('data-ses');\n    if(v === '全部场次'){ sesTmp = ['全部场次']; }\n    else{\n      var i = sesTmp.indexOf(v), ai = sesTmp.indexOf('全部场次');\n      if(ai > -1) sesTmp.splice(ai, 1);\n      if(i > -1) sesTmp.splice(i, 1); else sesTmp.push(v);\n    }\n    $$('#sesGrid .nsk-opt').forEach(function(o){\n      o.setAttribute('aria-pressed', String(sesTmp.indexOf(o.getAttribute('data-ses')) > -1));\n    });\n  });\n  $('#sesOk').addEventListener('click', function(){\n    if(!sesTmp.length){ toast('请至少选择一个场次'); return; }\n    validCfg.ses = sesTmp.slice();\n    applyQk(validCfg.qk);\n    $('#validSesV').textContent = sesText();\n    $('#sheetSes').hidden = true;\n    swapSheet('sheetValid');\n    toast('已保存适配场次：' + (sesTmp.indexOf('全部场次') > -1 ? '全部场次' : sesTmp.join('、')));\n  });\n  function pickTime(title, cur, cb){\n    var inp = document.createElement('input');\n    inp.type = 'datetime-local';\n    inp.value = cur.replace(' ', 'T');\n    inp.addEventListener('change', function(){ cb(inp.value.replace('T', ' ')); });\n    inp.click();\n  }\n  $('#validStart').addEventListener('click', function(){\n    pickTime('开始时间', validCfg.start, function(v){ if(v){ validCfg.start = v; $('#validStartV').textContent = v; $('#validHint').hidden = true; } });\n  });\n  $('#validEnd').addEventListener('click', function(){\n    pickTime('结束时间', validCfg.end, function(v){ if(v){ validCfg.end = v; $('#validEndV').textContent = v; $('#validHint').hidden = true; } });\n  });\n  $('#validOk').addEventListener('click', function(){\n    if(validCfg.start >= validCfg.end){\n      $('#validHint').textContent = '开始时间需早于结束时间';\n      $('#validHint').hidden = false;\n      return;\n    }\n    applyValid();\n    $('#sheetValid').hidden = true;\n    swapSheet('sheetCode');\n    toast('签到有效期已保存：' + fmtRange());\n  });\n\n  /* ============ 更多操作 ============ */\n  $('#btnMore').addEventListener('click', function(){ if(!this.disabled) openSheet('sheetMore'); });\n  $$('#sheetMore .nsk-opt').forEach(function(b){\n    b.addEventListener('click', function(){\n      var t = b.getAttribute('data-more'); closeAll();\n      toast('「'+t+'」原型演示：'+ (t === '导出活动数据' ? '请在报名名单页导出明细' : '功能入口已预留'));\n    });\n  });\n\n  /* ============ 数字滚动（纯视觉：最终数值不变） ============ */\n  (function(){\n    if(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;\n    function countUp(el){\n      var node = null;\n      for(var i = 0; i < el.childNodes.length; i++){\n        if(el.childNodes[i].nodeType === 3 && el.childNodes[i].nodeValue.trim()){ node = el.childNodes[i]; break; }\n      }\n      if(!node) return;\n      var raw = node.nodeValue.trim();\n      var num = raw.replace(/,/g, '');\n      if(!/^\\d+(\\.\\d+)?$/.test(num)) return;\n      var dec = num.indexOf('.') > -1 ? num.split('.')[1].length : 0;\n      var target = parseFloat(num);\n      var t0 = null, dur = 850;\n      function fmt(v){\n        var s = dec ? v.toFixed(dec) : String(Math.round(v));\n        var p = s.split('.');\n        p[0] = p[0].replace(/\\B(?=(\\d{3})+(?!\\d))/g, ',');\n        return p.join('.');\n      }\n      function tick(now){\n        if(t0 === null) t0 = now;\n        var pr = Math.min((now - t0) / dur, 1);\n        var e = 1 - Math.pow(1 - pr, 3);\n        node.nodeValue = fmt(target * e);\n        if(pr < 1) requestAnimationFrame(tick);\n      }\n      requestAnimationFrame(tick);\n      setTimeout(function(){ node.nodeValue = fmt(target); }, dur + 150);\n    }\n    [$('.nsk-money__v'), $('.nsk-hero__prog-t b')].concat($$('.nsk-drow__v')).forEach(function(el){\n      if(el) countUp(el);\n    });\n  })();\n\n  applyState();\n})();\n<\/script>\n\n<script>\n(function(){\n  var ID=\"p8\";\n  var MAP={\"1.主理人中心.html\": \"p1\", \"11.主理人创建社群.html\": \"p11\", \"12.主理人管理社群可基于社群创建活动.html\": \"p12\", \"13.主理人社群成员列表.html\": \"p13\", \"2.申请成为主理人.html\": \"p2\", \"3-1.查看申请记录.html\": \"p31\", \"3.申请提交页面.html\": \"p3\", \"4.主理人发布活动-改版.html\": \"p4\", \"8.主理人查看活动-改版.html\": \"p8\", \"9.活动报名名单-改版.html\": \"p9\"};\n  function go(id){try{parent.postMessage({__demoNav:id},'*');}catch(e){}}\n  window.__demoGo=go;\n  window.__demoBlocked=function(f){alert('「'+f+'」未包含在本次合并的原型范围内');};\n  document.addEventListener('click',function(e){\n    var t=e.target;\n    var a=t&&t.closest?t.closest('a[href]'):null;\n    if(!a)return;\n    var h=a.getAttribute('href')||'';\n    if(!/\\.html(\\?|#|$)/.test(h))return;\n    e.preventDefault();e.stopPropagation();\n    if(MAP[h]){go(MAP[h]);}else{window.__demoBlocked(h);}\n  },true);\n  function allBtns(){return document.querySelectorAll('button,[role=\"button\"],a');}\n  function hookText(txt,id,delay,toast){\n    allBtns().forEach(function(b){\n      if(b.__dh)return;\n      if((b.textContent||'').replace(/\\s+/g,'').indexOf(txt)>-1){\n        b.__dh=1;\n        b.addEventListener('click',function(){setTimeout(function(){\n          if(toast){alert(toast);return;}\n          if(id)go(id);\n        },delay||0);});\n      }\n    });\n  }\n  function hookAria(prefix,id){\n    document.querySelectorAll('[aria-label]').forEach(function(b){\n      if(b.__dh)return;\n      if((b.getAttribute('aria-label')||'').indexOf(prefix)===0){\n        b.__dh=1;\n        b.addEventListener('click',function(){go(id);});\n      }\n    });\n  }\n  hookText('编辑活动','p4');\n  var BACK={\"p11\": \"p1\", \"p12\": \"p1\", \"p13\": \"p12\", \"p2\": \"p1\", \"p3\": \"p2\", \"p31\": \"p3\", \"p4\": \"p1\", \"p8\": \"p1\", \"p9\": \"p8\"}[ID];\n  var bk=document.querySelector('.nsk-navbar__back,.c-navbar__back');\n  if(bk&&BACK){bk.addEventListener('click',function(e){e.stopPropagation();e.preventDefault();go(BACK);});}\n  /* 2x 设计板页面（社群系列）按画板宽度等比缩放适配容器 */\n  var BOARD=0;\n  if(BOARD){\n    (function(){\n      var st=document.createElement('style');\n      st.textContent='html{overflow-x:hidden!important}body{margin:0 auto!important;zoom:'+(430/BOARD).toFixed(4)+'}';\n      document.head.appendChild(st);\n      var lastW=-1;\n      function fit(){\n        var w=document.documentElement.clientWidth||window.innerWidth||0;\n        if(w>0&&w!==lastW){\n          lastW=w;\n          document.body.style.zoom=(w/BOARD).toFixed(4);\n        }\n      }\n      window.__demoFit=fit;\n      fit();\n      window.addEventListener('resize',fit);\n      window.addEventListener('load',fit);\n      if(window.ResizeObserver){try{new ResizeObserver(fit).observe(document.documentElement);}catch(e){}}\n      /* 轮询自愈：任何事件时机漏掉（如 iframe 隐藏期未量到宽度）都会在下一拍补上 */\n      setInterval(fit,200);\n    })();\n  }\n})();\n<\/script>\n<\/body>\n<\/html>\n"

  "p9": {
    "title": "报名名单",
    "html": "<!DOCTYPE html>\n<html lang=\"zh-CN\"><head>\n<meta charset=\"UTF-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n<meta name=\"theme-color\" content=\"#387DEC\">\n<title>活动报名名单 · 主理人<\/title>\n<style>\n/* ================================================================\n   设计令牌（与「1.主理人中心.html」「4.主理人发布活动-改版.html」完全一致）\n   §1 色彩 / §2 字体 / §3 圆角 / §4 阴影 / §0 4px 栅格\n   ================================================================ */\n:root{\n  --brand-01:#387DEC; --brand-02:#0855D1; --brand-03:#9BBEF5; --brand-04:#E0ECFF;\n  --text-01:#303133; --text-02:#909399; --text-03:#C0C4CC; --text-04:#FFFFFF;\n  --line-01:#EBEBEB; --bg-page:#F2F5F7;\n  --success-01:#10A17C; --success-02:#E6F7F2;\n  --huidou-01:#F76346; --huidou-02:#FFE7E6;\n  --danger:#EB4A38; --danger-bg:#FDECEA;\n  --brand-01-hover:#2C71DE; --row-hover:#FAFBFC; --fill-disabled:#F7F8FA;\n  --focus-ring:0 0 0 2px rgba(56,125,236,.24); --mask:rgba(0,0,0,.45);\n  --font-cn:\"PingFang SC\",\"苹方-简\",-apple-system,BlinkMacSystemFont,\"Helvetica Neue\",sans-serif;\n  --font-num:\"Source Han Sans SC\",\"思源黑体\",\"PingFang SC\",-apple-system,BlinkMacSystemFont,sans-serif;\n  --fs-xl:18px; --fs-lg:16px; --fs-md:14px; --fs-sm:12px; --fs-xs:10px;\n  --lh-title:1.3; --lh-body:1.4; --lh-num:1.2;\n  --r-pill:22px; --r-sheet:16px; --r-card:12px; --r-ctl:8px; --r-tag:2px;\n  --sh-card:0 1px 6px rgba(0,0,0,.02); --sh-sheet:0 -2px 16px rgba(0,0,0,.08);\n  --sp-1:4px; --sp-2:8px; --sp-3:12px; --sp-4:16px; --sp-5:20px; --sp-6:24px; --sp-8:32px;\n}\n/* ================= 基础重置 ================= */\n*,*::before,*::after{box-sizing:border-box;}\nhtml{-webkit-text-size-adjust:100%;}\nbody{margin:0;padding:0;background:var(--bg-page);font-family:var(--font-cn);font-size:var(--fs-md);\n  line-height:var(--lh-body);color:var(--text-01);-webkit-font-smoothing:antialiased;\n  -webkit-tap-highlight-color:transparent;}\nh1,h2,h3,h4,h5,h6{margin:0;font-size:inherit;font-weight:600;line-height:var(--lh-title);}\np{margin:0;} dl{margin:0;} dd{margin:0;}\nul,ol{margin:0;padding:0;list-style:none;}\nbutton{font-family:inherit;font-size:inherit;color:inherit;background:none;border:0;margin:0;padding:0;cursor:pointer;}\nimg,svg{display:block;}\na{color:inherit;text-decoration:none;}\n.nsk-num{font-family:var(--font-num);font-variant-numeric:tabular-nums;line-height:var(--lh-num);}\n.nsk-sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;}\n[hidden]{display:none !important;}\n/* ================= 通用组件 ================= */\n.nsk-page{position:relative;max-width:390px;margin:0 auto;background:var(--bg-page);}\n.nsk-statusbar{display:flex;align-items:center;justify-content:space-between;\n  padding:var(--sp-2) var(--sp-6) var(--sp-1);color:var(--text-01);}\n.nsk-statusbar__time{font-size:var(--fs-lg);font-weight:600;}\n.nsk-statusbar__icons{display:flex;align-items:center;gap:var(--sp-1);}\n.nsk-icon{color:inherit;}\n.nsk-top{flex:none;background:var(--bg-page);}\n.nsk-navbar{display:flex;align-items:center;gap:var(--sp-2);padding:var(--sp-1) var(--sp-4) var(--sp-2);}\n.nsk-navbar__back{display:flex;align-items:center;justify-content:center;width:32px;height:32px;\n  margin-left:-6px;border-radius:50%;color:var(--text-01);transition:background-color .15s;}\n.nsk-navbar__back:hover{background:var(--row-hover);}\n.nsk-navbar__back:focus{outline:none;}\n.nsk-navbar__back:focus-visible{box-shadow:var(--focus-ring);}\n.nsk-navbar__title{flex:1;font-size:var(--fs-xl);font-weight:600;color:var(--text-01);}\n.nsk-navbar__act{font-size:var(--fs-md);color:var(--brand-01);padding:6px 4px;border-radius:var(--r-tag);}\n.nsk-navbar__act:hover{color:var(--brand-01-hover);text-decoration:underline;}\n.nsk-navbar__act:focus{outline:none;}\n.nsk-navbar__act:focus-visible{box-shadow:var(--focus-ring);}\n.nsk-scroll{flex:1;overflow-y:auto;overflow-x:hidden;padding:0 var(--sp-3) var(--sp-3);\n  scrollbar-width:none;scroll-behavior:smooth;}\n.nsk-scroll::-webkit-scrollbar{display:none;}\n.nsk-card{background:var(--text-04);border-radius:var(--r-card);box-shadow:var(--sh-card);\n  margin-top:var(--sp-2);overflow:hidden;}\n.nsk-card__head{display:flex;align-items:center;justify-content:space-between;gap:var(--sp-2);\n  padding:var(--sp-3) var(--sp-3) 0;}\n.nsk-card__title{font-size:var(--fs-lg);font-weight:600;color:var(--text-01);}\n.nsk-card__extra{font-size:var(--fs-sm);color:var(--text-02);}\n.nsk-card__link{font-size:var(--fs-sm);color:var(--brand-01);padding:2px 0;border-radius:var(--r-tag);}\n.nsk-card__link:hover{color:var(--brand-01-hover);text-decoration:underline;}\n.nsk-card__link:focus{outline:none;}\n.nsk-card__link:focus-visible{box-shadow:var(--focus-ring);}\n.nsk-btn{display:inline-flex;align-items:center;justify-content:center;gap:var(--sp-1);\n  min-height:44px;padding:0 var(--sp-6);border-radius:var(--r-pill);\n  font-size:var(--fs-lg);font-weight:600;line-height:1;border:1px solid transparent;\n  transition:background-color .15s,border-color .15s,color .15s,box-shadow .15s,opacity .15s,transform .12s;}\n.nsk-btn:focus{outline:none;}\n.nsk-btn:focus-visible{box-shadow:var(--focus-ring);}\n.nsk-btn--primary{background:var(--brand-01);color:var(--text-04);}\n.nsk-btn--primary:hover{background:var(--brand-01-hover);}\n.nsk-btn--primary:active{background:var(--brand-02);transform:scale(.98);}\n.nsk-btn--secondary{background:var(--text-04);border-color:var(--brand-01);color:var(--brand-01);}\n.nsk-btn--secondary:hover{background:var(--brand-04);}\n.nsk-btn--secondary:active{background:var(--brand-04);color:var(--brand-02);transform:scale(.98);}\n.nsk-btn--sm{min-height:32px;padding:0 var(--sp-3);font-size:var(--fs-sm);}\n.nsk-btn--link{min-height:28px;padding:0 var(--sp-1);font-size:var(--fs-sm);font-weight:400;\n  color:var(--brand-01);border-radius:var(--r-tag);}\n.nsk-btn--link:hover{text-decoration:underline;}\n.nsk-btn--link:focus{outline:none;}\n.nsk-btn--link:focus-visible{box-shad ead\">\n      <h2 class=\"nsk-sheet__title\" id=\"exportTitle\">导出报名数据<\/h2>\n      <button type=\"button\" class=\"nsk-sheet__close\" data-close aria-label=\"关闭\">✕<\/button>\n    <\/div>\n\n    <span class=\"nsk-sheet__lb\">导出范围<\/span>\n    <div class=\"nsk-seg\" id=\"segScope\">\n      <button type=\"button\" class=\"nsk-seg__opt\" data-scope=\"all\" aria-pressed=\"true\">全部报名人（42）<\/button>\n      <button type=\"button\" class=\"nsk-seg__opt\" data-scope=\"filtered\" aria-pressed=\"false\">当前筛选结果<\/button>\n    <\/div>\n\n    <span class=\"nsk-sheet__lb\">导出字段（基础 4 列 + 自定义表单 3 列 + 订单 5 列 + 签到 2 列）<\/span>\n    <div id=\"fieldChecks\">\n      <label class=\"nsk-check\"><input type=\"checkbox\" data-group=\"base\" checked><span><span class=\"nsk-check__t\">基础信息<\/span><span class=\"nsk-check__m\">序号 / 姓名 / 手机号 / 报名状态 / 报名时间<\/span><\/span><\/label>\n      <label class=\"nsk-check\"><input type=\"checkbox\" data-group=\"custom\" checked><span><span class=\"nsk-check__t\">自定义表单字段<\/span><span class=\"nsk-check__m\">参与身份 / 年龄段 / 紧急联系人<\/span><\/span><\/label>\n      <label class=\"nsk-check\"><input type=\"checkbox\" data-group=\"order\" checked><span><span class=\"nsk-check__t\">订单与支付<\/span><span class=\"nsk-check__m\">票种 / 份数 / 场次 / 支付金额 / 支付状态<\/span><\/span><\/label>\n      <label class=\"nsk-check\"><input type=\"checkbox\" data-group=\"checkin\" checked><span><span class=\"nsk-check__t\">签到信息<\/span><span class=\"nsk-check__m\">签到状态 / 签到时间<\/span><\/span><\/label>\n    <\/div>\n    <p class=\"nsk-sheet__note\" style=\"margin-top:8px\">「姓名」「手机号」为系统预置的报名字段，与 3 个自定义字段合计 5 个字段，导出时不重复成列。<\/p>\n\n    <span class=\"nsk-sheet__lb\">文件格式<\/span>\n    <div class=\"nsk-seg\" id=\"segFormat\">\n      <button type=\"button\" class=\"nsk-seg__opt\" data-format=\"xls\" aria-pressed=\"true\">Excel 工作簿 (.xls)<\/button>\n      <button type=\"button\" class=\"nsk-seg__opt\" data-format=\"csv\" aria-pressed=\"false\">CSV (.csv)<\/button>\n    <\/div>\n\n    <div class=\"nsk-shee
