  "p11": {
    "title": "创建社群",
    "html": "<!DOCTYPE html>\n<html lang=\"zh-CN\">\n<head>\n<meta charset=\"UTF-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n<title>发起社群<\/title>\n<!--\n  组件规范来源：one蛇口组件系统.sketch\n  页面缩放系数 --scale = 853 / 750 = 1.137（标准稿基于 750 画布，本页 853）\n  属性书写顺序约定：class → id → type → name → role → aria-* → data-* → value/checked/disabled\n-->\n<style>\n/* ============================================================\n   0. 设计令牌 Design Tokens（来源：one蛇口组件系统 / 共享色板）\n   ============================================================ */\n:root{\n  /* 0.1 品牌色 Brand */\n  --brand-01:#387DEC;          /* 品牌色/Brand01 常规 */\n  --brand-02:#0855D1;          /* 品牌色/Brand02 点击 */\n  --brand-03:#9BBEF5;          /* 品牌色/Brand03 一般禁用 */\n  --brand-04:#E0ECFF;          /* 品牌色/Brand04 特殊场景/置灰底 */\n  /* 0.2 文字色 Text */\n  --text-01:#303133;           /* 文字色/Text01 强调·正文标题 */\n  --text-02:#909399;           /* 文字色/Text02 次强调 */\n  --text-03:#C0C4CC;           /* 文字色/Text03 置灰/禁用信息 */\n  --text-04:#FFFFFF;           /* 文字色/Text04 纯白文字 */\n  /* 0.3 中性色 Neutral */\n  --line-01:#EBEBEB;           /* 中性色/Line01 分割线 */\n  --bg-page:#F2F5F7;           /* 中性色/页面背景 */\n  --bg-card:#FFFFFF;\n  /* 0.4 功能色 */\n  --success-01:#10A17C;        /* 功能色/Success01 */\n  --success-02:#E6F7F2;        /* 功能色/Success02 */\n  --huidou-01:#F76346;         /* 荟豆色/huidou01 */\n  --huidou-02:#FFE7E6;         /* 荟豆色/huidou02 */\n  --danger-01:#EB4A38;         /* 错误价格/Danger */\n  --danger-02:#FDECEA;         /* Danger 淡底（按 Success02 同法派生） */\n  /* 0.5 交互状态（标准未单列 hover，按 Brand01→Brand02 方向派生） */\n  --brand-hover:#2F6FDC;\n  --brand-active:var(--brand-02);\n  --brand-disabled:var(--brand-03);\n  --text-disabled:var(--text-03);\n  --focus-ring:var(--brand-03);\n  /* 0.6 字体（基础样式：中文 PingFang SC；数字 思源黑体 Source Han Sans SC） */\n  --font-cn:\"PingFang SC\",\"Helvetica Neue\",\"Hiragino Sans GB\",\"Microsoft YaHei\",sans-serif;\n  --font-num:\"Source Han Sans SC\",\"PingFang SC\",\"Helvetica Neue\",sans-serif;\n  /* 0.7 字号档位（基础样式：36 超大标题 / 32 卡片标题 / 28 正文 / 24 次级 / 20 极少数次级；标签 22） */\n  --scale:1.137;\n  --fs-h1:calc(36px * var(--scale));\n  --fs-title:calc(32px * var(--scale));\n  --fs-body:calc(28px * var(--scale));\n  --fs-sub:calc(24px * var(--scale));\n  --fs-min:calc(20px * var(--scale));\n  --fs-tag:calc(22px * var(--scale));\n  --lh-title:1.375;            /* 卡片标题 44/32 */\n  --lh-body:1.43;              /* 正文 40/28 */\n  /* 0.8 圆角（控件：卡片 24 / 图片 16 / 指示条 4，均按 --scale 换算） */\n  --radius-card:calc(24px * var(--scale));\n  --radius-field:calc(16px * var(--scale));\n  --radius-tag:calc(8px * var(--scale));\n  --radius-pill:999px;\n  /* 0.9 阴影（控件：卡片/卡片组 shadow blur12 offsetY2） */\n  --shadow-card:0 1px 6px rgba(0,0,0,.06);\n  --shadow-focus:0 0 0 3px rgba(155,190,245,.6);\n}\n\n/* ============================================================\n   1. 基础重置与页面骨架\n   ============================================================ */\n*{margin:0;padding:0;box-sizing:border-box;-webkit-font-smoothing:antialiased}\nbody{\n  font-family:var(--font-cn);\n  font-size:var(--fs-body);\n  line-height:var(--lh-body);\n  color:var(--text-01);\n  background:var(--bg-page);\n  width:853px;margin:0 auto;\n}\n.l-page{display:flex;flex-direction:column;min-height:1844px;overflow-x:hidden}\n.l-main{flex:1;min-height:0;padding:0 32px;display:flex;flex-direction:column}\n.c-form{display:flex;flex-direction:column}\n.c-skip-link{position:absolute;left:-9999px;top:0;z-index:99;background:var(--brand-01);color:var(--text-04);padding:8px 16px;border-radius:8px}\n.c-skip-link:focus{left:16px;top:16px}\n\n/* ============================================================\n   2. 组件库 Components\n   ============================================================ */\n\n/* 2.1 状态栏 Statusbar（装饰性，aria-hidden） */\n.c-statusbar{height:96px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:0 56px 0 64px;background:var(--bg-page)}\n.c-statusbar__time{font-family:var(--font-num);font-size:32px;font-weight:600;color:var(--text-01)}\n.c-statusbar__icons{display:flex;align-items:center;gap:14px}\n\n/* 2.2 导航栏 Navbar（控件/Navbar/black） */\n.c-navbar{height:86px;flex:none;display:flex;align-items:center;padding:0 32px;position:relative;background:var(--bg-page)}\n.c-navbar__back{width:64px;display:flex;align-items:center;justify-content:flex-start}\n.c-navbar__title{position:absolute;left:0;right:0;text-align:center;font-size:var(--fs-title);line-height:var(--lh-title);font-weight:600;color:var(--text-01)}\n.c-capsule{margin-left:auto;position:relative;z-index:2;width:190px;height:72px;border:1px solid var(--line-01);border-radius:36px;background:rgba(255,255,255,.9);display:flex;align-items:center}\n.c-capsule__btn{flex:1;height:100%;display:flex;align-items:center;justify-content:center;border:0;background:transparent;cursor:pointer}\n.c-capsule__divider{width:1px;height:34px;background:var(--line-01)}\n\n/* 2.3 图标按钮 IconButton */\n.c-iconbtn{border:0;background:transparent;padding:0;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;border-radius:8px;transition:opacity .18s}\n.c-iconbtn:hover{opacity:.6}\n.c-iconbtn:active{opacity:.4}\n.c-iconbtn:focus-visible{outline:3px solid var(--focus-ring);outline-offset:2px}\n\n/* 2.4 卡片 Card（控件/卡片/卡片组：白底 + blur12 y2 阴影 + 圆角24） */\n.c-card{background:var(--bg-card);border-radius:var(--radius-card);box-shadow:var(--shadow-card)}\n.c-card__head{display:flex;align-items:baseline;gap:24px}\n.c-card__title{font-size:var(--fs-title);line-height:var(--lh-title);font-weight:600;color:var(--text-01)}\n.c-card__hint{margin-left:0;font-size:var(--fs-sub);color:var(--text-02)}\n.c-tags-head .c-card__hint,.c-card__head--end .c-card__hint{margin-left:auto}\n\n/* 2.5 表单域 Field（圆角16 / 描边 Line01 / 标签 24 / 值 32） */\n.c-formrow{display:flex;gap:30px;margin-top:16px}\n.c-field{border:1px solid var(--line-01);border-radius:var(--radius-field);background:var(--bg-card);transition:border-color .18s,box-shadow .18s}\n.c-field:hover{border-color:var(--brand-03)}\n.c-field:focus-within{border-color:var(--brand-01);box-shadow:var(--shadow-focus)}\n.c-field.is-error{border-color:var(--danger-01)}\n.c-field.is-error .c-field__control{color:var(--danger-01)}\n.c-field__label{display:block;font-size:var(--fs-sub);color:var(--text-02)}\n.c-field__control{width:100%;border:0;outline:0;background:transparent;font-family:var(--font-cn);font-size:var(--fs-title);line-height:var(--lh-title);font-weight:600;color:var(--text-01);padding:0}\n.c-field__control::placeholder{color:var(--text-03);font-weight:400}\n.c-field__control:disabled{color:var(--text-disabled);cursor:not-allowed}\n.c-field--box{padding:18px 28px;display:flex;flex-direction:column;justify-content:center;gap:10px;flex:1}\n/* 多行输入框：高度由「标签 + 2 行正文 + 计数器 + 内边距」推导，避免正文行被容器压掉（#18） */\n.c-field--area{position:relative;min-height:195px;margin-top:22px;padding:18px 28px 14px;display:flex;flex-direction:column}\n.c-field--area .c-field__control--area{flex:1;min-height:calc(2em * var(--lh-body));resize:none;font-size:var(--fs-body);font-weight:400;line-height:var(--lh-body)}\n.c-field__counter{font-family:var(--font-num);font-size:var(--fs-min);color:var(--text-03);text-align:right}\n.c-field__error{display:none;font-size:var(--fs-min);color:var(--danger-01)}\n.c-field.is-error .c-field__error{display:block}\n\n/* 2.6 上传器 Uploader（图片圆角16） */\n.c-uploader{width:145px;height:120px;flex:none;border:0;border-radius:var(--radius-field);background:#F5F6F8;color:var(--text-02);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;cursor:pointer;transition:background-color .18s,color .18s}\n.c-uploader:hover{background:var(--brand-04);color:var(--brand-01)}\n.c-uploader:active{background:var(--brand-04);color:var(--brand-02)}\n.c-uploader:focus-visible{outline:3px solid var(--focus-ring);outline-offset:2px}\n.c-uploader__text{font-size:var(--fs-min)}\n\n/* 2.7 标签 Tag（控件/Tag/blue：Brand04 底 + Brand01 字） */\n.c-tags{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;margin-top:16px}\n.c-tag{height:55px;border:1px solid var(--line-01);border-radius:var(--radius-tag);background:var(--bg-card);color:var(--text-01);font-family:var(--font-cn);font-size:var(--fs-tag);display:flex;align-items:center;justify-content:center;cursor:pointer;transition:background-color .18s,border-color .18s,color .18s}\n.c-tag:hover{border-color:var(--brand-03);color:var(--brand-01)}\n.c-tag:active{background:var(--brand-04)}\n.c-tag:focus-visible{outline:3px solid var(--focus-ring);outline-offset:2px}\n.c-tag.is-selected{background:var(--brand-04);border-color:var(--brand-01);color:var(--brand-01);font-weight:600}\n.c-tag.is-disabled,.c-tag[disabled]{background:#F5F6F8;border-color:var(--line-01);color:var(--text-disabled);pointer-events:none}\n\n/* 2.8 列表行 Cell（控件/Icon/24px/跳转：箭头 Text02 2px） */\n.c-list{list-style:none}\n.c-cell{width:100%;height:56px;border:0;background:transparent;padding:0;display:flex;align-items:center;gap:20px;cursor:pointer;font-family:var(--font-cn);line-height:1.2;transition:opacity .18s,background-color .18s}\n.c-cell:hover{opacity:.72}\n.c-cell:active{background:var(--brand-04)}\n.c-cell:focus-visible{outline:3px solid var(--focus-ring);outline-offset:-2px;border-radius:8px}\n.c-cell.is-disabled{opacity:.45;pointer-events:none}\n.c-cell__icon{width:44px;flex:none;display:flex;align-items:center;justify-content:center;color:var(--brand-01)}\n.c-cell__label{font-size:var(--fs-body);color:var(--text-01)}\n.c-cell__value{margin-left:auto;display:flex;align-items:center;gap:14px;font-size:var(--fs-body);color:var(--text-02)}\n.c-cell__arrow{flex:none;color:var(--text-02)}\n.c-cell--owner{height:84px;margin-top:4px;gap:22px;cursor:default}\n.c-cell--owner .c-avatar{width:64px;height:64px;border-radius:50%;flex:none;background:linear-gradient(135deg,#C6D8E6 0%,#93B4CB 45%,#5E8199 100%)}\n.c-cell--owner .c-cell__body{display:flex;flex-direction:column;gap:6px}\n.c-cell--owner .c-cell__name{font-size:var(--fs-body);color:var(--text-01)}\n.c-cell--owner .c-cell__desc{font-size:var(--fs-min);color:var(--text-02)}\n.c-cell__link{margin-left:auto;display:flex;align-items:center;gap:14px;border:0;background:transparent;font-size:var(--fs-body);color:var(--text-02);cursor:pointer;font-family:var(--font-cn)}\n.c-cell__link:hover{color:var(--brand-01)}\n.c-cell__link:focus-visible{outline:3px solid var(--focus-ring);outline-offset:2px;border-radius:8px}\n\n/* 2.9 分割线 Divider（控件/分割线：1px Line01） */\n.c-divider{height:1px;border:0;background:var(--line-01);margin-left:64px}\n\n/* 2.10 分段控件 Segmented（Tabbar 选中态：Brand01 字 + Brand04 底） */\n.c-segmented{display:flex;height:50px;margin-top:16px;border:1px solid var(--line-01);border-radius:var(--radius-field);padding:5px}\n.c-segmented__item{flex:1;border:0;background:transparent;border-radius:8px;font-family:var(--font-cn);font-size:var(--fs-sub);color:var(--text-02);display:flex;align-items:center;justify-content:center;cursor:pointer;transition:background-color .18s,color .18s}\n.c-segmented__item:hover{color:var(--brand-01)}\n.c-segmented__item:focus-visible{outline:3px solid var(--focus-ring);outline-offset:2px}\n.c-segmented__item.is-selected{background:var(--brand-04);border:1px solid var(--brand-01);color:var(--brand-01);font-weight:600}\n\n/* 2.11 提示条 Banner */\n.c-banner{margin-top:18px;padding:12px 24px;border-radius:var(--radius-field);background:var(--brand-04);color:var(--brand-01);font-size:var(--fs-sub)}\n\n/* 2.12 按钮 Button（控件/Button：Primary 底 Brand01、Pressed Brand02；Secondary 描边 Brand01） */\n.c-btn{font-family:var(--font-cn);font-size:var(--fs-title);font-weight:600;border-radius:var(--radius-pill);display:inline-flex;align-items:center;justify-content:center;cursor:pointer;position:relative;transition:background-color .18s,border-color .18s,color .18s,box-shadow .18s}\n.c-btn--lg{height:100px}\n.c-btn--primary{background:var(--brand-01);border:0;color:var(--text-04)}\n.c-btn--primary:hover{background:var(--brand-hover)}\n.c-btn--primary:active{background:var(--brand-active);box-shadow:var(--shadow-card)}\n.c-btn--secondary{background:var(--bg-card);border:2px solid var(--brand-01);color:var(--brand-01)}\n.c-btn--secondary:hover{border-color:var(--brand-hover);color:var(--brand-hover)}\n.c-btn--secondary:active{border-color:var(--brand-active);color:var(--brand-active);background:var(--brand-04)}\n.c-btn:focus-visible{outline:3px solid var(--focus-ring);outline-offset:3px}\n.c-btn[disabled],.c-btn.is-disabled{background:var(--brand-disabled);border-color:var(--brand-disabled);color:var(--text-04);pointer-events:none}\n.c-btn.is-loading{color:transparent;pointer-events:none}\n.c-btn.is-loading::after{content:\"\";position:absolute;width:28px;height:28px;border:3px solid rgba(255,255,255,.45);border-top-color:#fff;border-radius:50%;animation:c-spin .8s linear infinite}\n@keyframes c-spin{to{transform:rotate(360deg)}}\n\n/* 2.13 复选框 Checkbox */\n.c-checkbox{display:flex;align-items:center;gap:16px;position:relative}\n.c-checkbox__input{position:absolute;opacity:0;width:36px;height:36px;margin:0;cursor:pointer}\n.c-checkbox__box{width:36px;height:36px;flex:none;border-radius:9px;background:var(--brand-01);display:flex;align-items:center;justify-content:center;color:var(--text-04);transition:background-color .18s}\n.c-checkbox__input:not(:checked) + .c-checkbox__box{background:var(--bg-card);border:1px solid var(--line-01);color:transparent}\n.c-checkbox__input:focus-visible + .c-checkbox__box{outline:3px solid var(--focus-ring);outline-offset:2px}\n.c-checkbox__label{font-size:var(--fs-body);color:var(--text-01);cursor:pointer}\n.c-link{color:var(--brand-01);text-decoration:none}\n.c-link:hover{color:var(--brand-hover);text-decoration:underline}\n.c-link:focus-visible{outline:3px solid var(--focus-ring);outline-offset:2px;border-radius:4px}\n\n/* 2.14 说明文字 Tip */\n.c-tip{display:flex;align-items:center;justify-content:center;gap:12px;font-size:var(--fs-sub);color:var(--text-02)}\n\n/* 2.15 底部操作栏 ActionBar */\n.c-actionbar{flex:none;height:135px;padding:0 32px 26px;display:flex;gap:30px;background:var(--bg-page)}\n.c-actionbar .c-btn--secondary{width:358px}\n.c-actionbar .c-btn--primary{flex:1}\n\n/* ============================================================\n   3. 页面级布局量（沿用稿件绝对尺寸，保证 1:1 版式）\n   ============================================================ */\n.p-card-profile{min-height:610px;padding:22px 24px 20px}\n.p-card-profile .c-tags-head{margin-top:20px}\n/* 主要活动区域：城市 + 项目/片区 双下拉（2x 设计板尺寸） */\n.p-area-row{display:flex;gap:16px;margin-top:14px}\n.p-area-sel{flex:1;height:56px;border:1px solid var(--line-01);border-radius:var(--radius-field);background:var(--bg-card);\n  display:flex;align-items:center;justify-content:space-between;gap:8px;padding:0 18px;cursor:pointer;\n  font-family:var(--font-cn);font-size:var(--fs-body);color:var(--text-01);\n  transition:border-color .18s,box-shadow .18s}\n.p-area-sel:hover{border-color:var(--brand-03)}\n.p-area-sel:focus-visible{outline:3px solid var(--focus-ring);outline-offset:2px}\n.p-area-sel__val{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}\n.p-area-sel.is-empty .p-area-sel__val{color:var(--text-03)}\n.p-area-sel__caret{flex:none;color:var(--text-02)}\n/* 底部选择弹层 */\n.p-sheet-mask{position:fixed;inset:0;z-index:80;background:rgba(17,24,39,.45)}\n.p-sheet{position:fixed;left:0;right:0;bottom:0;z-index:90;background:var(--bg-card);\n  border-radius:24px 24px 0 0;padding:16px 28px 28px;max-height:70%;display:flex;flex-direction:column}\n.p-sheet__head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:8px 0 12px}\n.p-sheet__title{font-size:var(--fs-title);font-weight:600;color:var(--text-01)}\n.p-sheet__cancel{border:0;background:none;font-family:var(--font-cn);font-size:var(--fs-body);color:var(--text-02);cursor:pointer;padding:6px}\n.p-sheet__ok{font-size:var(--fs-body);font-weight:600;color:var(--brand-01);cursor:pointer;padding:6px}\n.p-sheet__list{list-style:none;margin:0;padding:0;overflow-y:auto}\n.p-sheet__item{display:flex;align-items:center;justify-content:space-between;gap:10px;height:60px;\n  border-bottom:1px solid var(--line-01);font-family:var(--font-cn);font-size:var(--fs-body);color:var(--text-01);cursor:pointer}\n.p-sheet__item:hover{color:var(--brand-01)}\n.p-sheet__item[aria-selected=\"true\"]{color:var(--brand-01);font-weight:600}\n.p-sheet__item[aria-selected=\"true\"]::after{content:\"✓\"}\n/* 多选行：复选框 + 文本（项目 / 片区多选） */\n.p-sheet__item--multi,.p-sheet__item--all{gap:16px;justify-content:flex-start}\n.p-sheet__item--all{border-bottom:2px solid var(--line-01)}\n.p-sheet__check{flex:none;width:36px;height:36px;border:2px solid var(--line-01);border-radius:8px;\n  display:inline-flex;align-items:center;justify-content:center;color:transparent;font-size:20px;font-weight:700;\n  transition:background-color .18s,border-color .18s,color .18s}\n.p-sheet__item--multi[aria-selected=\"true\"] .p-sheet__check,\n.p-sheet__item--all[aria-selected=\"true\"] .p-sheet__check{background:var(--brand-01);border-color:var(--brand-01);color:#fff}\n.p-sheet__item--multi[aria-selected=\"true\"] .p-sheet__check::after,\n.p-sheet__item--all[aria-selected=\"true\"] .p-sheet__check::after{content:\"✓\"}\n.p-sheet__item--multi[aria-selected=\"true\"]::after,.p-sheet__item--all[aria-selected=\"true\"]::after{content:\"\"}\n.p-owner-list{margin-top:20px}\n.p-card-join{min-height:345px;margin-top:28px;padding:24px 24px 0}\n.p-card-join .c-list{margin-top:14px}\n.p-card-join .c-cell{height:46px;margin-top:14px}\n.p-card-join .c-cell__icon{width:40px}\n.p-card-join .c-divider{margin-left:60px}\n.c-req{color:var(--danger-01,#EB4A38);margin-left:4px}\n.c-uploader-wrap{display:flex;flex-direction:column;flex:none;width:145px}\n.c-uploader__hint{margin-top:8px;font-size:var(--fs-min);color:var(--text-03);line-height:1.4;text-align:center}\n.c-uploader__error{margin-top:8px;font-size:var(--fs-min);color:var(--danger-01,#EB4A38);line-height:1.4;text-align:center}\n.c-cellhint{margin-top:8px;font-size:var(--fs-min);color:var(--text-03);line-height:1.5}\n/* 上传社群头像：占位框沿用「上传封面」同一 .c-uploader 外观，仅外层承载行与说明文案为新增 */\n.p-avatar-field{display:flex;align-items:center;gap:30px;margin-top:22px}\n.p-avatar-field .c-cellhint{margin-top:0;flex:1;min-width:0}\n.c-morepanel__body{padding:16px 0 22px;display:flex;flex-direction:column;gap:14px}\n.c-moreitem{display:flex;align-items:center;gap:16px;flex-wrap:wrap}\n.c-moreitem__label{font-size:var(--fs-body);color:var(--text-01)}\n.c-checkrow{display:flex;align-items:center;gap:14px;font-size:var(--fs-body);color:var(--text-01);cursor:pointer}\n.c-checkrow input{width:32px;height:32px;accent-color:var(--brand-01);flex:none}\n.c-btn--sm{height:60px;padding:0 22px;font-size:var(--fs-sub)}\n.c-field--compact{min-height:195px;margin-top:0}\n.c-cell__arrow--down{transition:transform .18s}\n[aria-expanded=\"true\"] .c-cell__arrow--down{transform:rotate(180deg)}\n.p-card-more{margin-top:22px;padding:22px 24px 24px}\n.p-rules{padding:0}\n.p-rules .c-field--compact{min-height:150px}\n.p-rules .c-checkrow{margin-top:16px}\n.p-rules .c-checkrow__hint{font-size:var(--fs-min);color:var(--text-03);font-weight:400}\n.p-agree{padding:22px 8px 0;display:flex;flex-direction:column;gap:14px}\n/* 社群公约正文：与「欢迎语」同构，直接复用 .c-field--area + .c-field--compact，\n   不再新增控件样式（对齐 PC 端「运营规则 → 社群公约」正文可直接查看编辑 + N/200 计数） */\n.p-pactfield .c-field__control--area{min-height:calc(3em * var(--lh-body))}\n<\/style>\n<\/head>\n<body>\n\n<a class=\"c-skip-link\" href=\"#main\">跳到主要内容<\/a>\n\n<div class=\"l-page\">\n\n  <!-- 状态栏（装饰性） -->\n  <div class=\"c-statusbar\" aria-hidden=\"true\">\n    <span class=\"c-statusbar__time\">9:41<\/span>\n    <span class=\"c-statusbar__icons\">\n      <svg width=\"40\" height=\"26\" viewBox=\"0 0 40 26\" fill=\"none\" focusable=\"false\"><rect x=\"0\" y=\"16\" width=\"6\" height=\"10\" rx=\"1.5\" fill=\"#303133\"/><rect x=\"9\" y=\"11\" width=\"6\" height=\"15\" rx=\"1.5\" fill=\"#303133\"/><rect x=\"18\" y=\"6\" width=\"6\" height=\"20\" rx=\"1.5\" fill=\"#303133\"/><rect x=\"27\" y=\"1\" width=\"6\" height=\"25\" rx=\"1.5\" fill=\"#303133\"/><\/svg>\n      <svg width=\"34\" height=\"26\" viewBox=\"0 0 34 26\" fill=\"none\" focusable=\"false\"><path d=\"M17 22.5l4.8-5.6a7.6 7.6 0 0 0-9.6 0L17 22.5z\" fill=\"#303133\"/><path d=\"M9.4 13.7a11.6 11.6 0 0 1 15.2 0\" stroke=\"#303133\" stroke-width=\"2.6\" stroke-linecap=\"round\"/><path d=\"M5 9a17.6 17.6 0 0 1 24 0\" stroke=\"#303133\" stroke-width=\"2.6\" stroke-linecap=\"round\"/><\/svg>\n      <svg width=\"52\" height=\"26\" viewBox=\"0 0 52 26\" fill=\"none\" focusable=\"false\"><rect x=\"1\" y=\"1\" width=\"42\" height=\"24\" rx=\"7\" stroke=\"#303133\" stroke-opacity=\".4\" stroke-width=\"2\"/><rect x=\"4\" y=\"4\" width=\"33\" height=\"18\" rx=\"4\" fill=\"#303133\"/><path d=\"M46 9v8a4.5 4.5 0 0 0 0-8z\" fill=\"#303133\" fill-opacity=\".5\"/><\/svg>\n    <\/span>\n  <\/div>\n\n  <!-- 导航栏 Navbar/black -->\n  <header class=\"c-navbar\">\n    <button class=\"c-iconbtn c-navbar__back\" type=\"button\" aria-label=\"返回上一页\">\n      <svg width=\"24\" height=\"40\" viewBox=\"0 0 24 40\" fill=\"none\" aria-hidden=\"true\" focusable=\"false\"><path d=\"M21 4L5 20l16 16\" stroke=\"#303133\" stroke-width=\"4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><\/svg>\n    <\/button>\n    <h1 class=\"c-navbar__title\">发起社群<\/h1>\n    <div class=\"c-capsule\" role=\"group\" aria-label=\"小程序菜单\">\n      <button class=\"c-capsule__btn\" type=\"button\" aria-label=\"更多菜单\">\n        <svg width=\"44\" height=\"8\" viewBox=\"0 0 44 8\" fill=\"#303133\" aria-hidden=\"true\" focusable=\"false\"><circle cx=\"4\" cy=\"4\" r=\"4\"/><circle cx=\"22\" cy=\"4\" r=\"4\"/><circle cx=\"40\" cy=\"4\" r=\"4\"/><\/svg>\n      <\/button>\n      <span class=\"c-capsule__divider\" aria-hidden=\"true\"><\/span>\n      <button class=\"c-capsule__btn\" type=\"button\" aria-label=\"关闭当前页面\">\n        <svg width=\"34\" height=\"34\" viewBox=\"0 0 36 36\" fill=\"none\" aria-hidden=\"true\" focusable=\"false\"><circle cx=\"18\" cy=\"18\" r=\"15\" stroke=\"#303133\" stroke-width=\"2.6\"/><circle cx=\"18\" cy=\"18\" r=\"6.5\" stroke=\"#303133\" stroke-width=\"2.6\"/><circle cx=\"18\" cy=\"18\" r=\"1.8\" fill=\"#303133\"/><\/svg>\n      <\/button>\n    <\/div>\n  <\/header>\n\n  <main class=\"l-main\" id=\"main\">\n    <form class=\"c-form\" id=\"main-form\" novalidate>\n\n      <!-- 卡片1：社群资料 + 社群标签（控件/卡片/卡片组） -->\n      <section class=\"c-card p-card-profile\" aria-labelledby=\"sec-profile-title\">\n        <header class=\"c-card__head\">\n          <h2 class=\"c-card__title\" id=\"sec-profile-title\">社群资料<\/h2>\n          <p class=\"c-card__hint\">名称与介绍将公开展示<\/p>\n        <\/header>\n\n        <div class=\"c-formrow\">\n          <div class=\"c-uploader-wrap\">\n            <button class=\"c-uploader\" type=\"button\" aria-label=\"上传社群封面，必填\" aria-describedby=\"cover-constraint\">\n              <svg width=\"34\" height=\"34\" viewBox=\"0 0 40 40\" fill=\"none\" aria-hidden=\"true\" focusable=\"false\"><path d=\"M20 6v28M6 20h28\" stroke=\"currentColor\" stroke-width=\"3\" stroke-linecap=\"round\"/><\/svg>\n              <span class=\"c-uploader__text\">上传封面<span class=\"c-req\" aria-hidden=\"true\">*<\/span><\/span>\n            <\/button>\n            <p class=\"c-uploader__hint\" id=\"cover-constraint\">1200×600 · JPG/PNG · ≤5MB<\/p>\n            <p class=\"c-uploader__error\" id=\"cover-error\" role=\"alert\" hidden>上传失败，请检查尺寸与格式后重试<\/p>\n          <\/div>\n\n          <div class=\"c-field c-field--box\">\n            <label class=\"c-field__label\" for=\"community-name\">社群名称<span class=\"c-req\" aria-hidden=\"true\">*<\/span><\/label>\n            <input class=\"c-field__control\" id=\"community-name\" name=\"communityName\" type=\"text\" value=\"招商玺飞盘社\" maxlength=\"20\" autocomplete=\"off\" required aria-describedby=\"name-counter\">\n            <span class=\"c-field__counter\" id=\"name-counter\" aria-live=\"polite\">6/20<\/span>\n          <\/div>\n        <\/div>\n\n        <div class=\"c-field c-field--area\">\n          <label class=\"c-field__label\" for=\"community-intro\">社群介绍<span class=\"c-req\" aria-hidden=\"true\">*<\/span><\/label>\n          <textarea class=\"c-field__control c-field__control--area\" id=\"community-intro\" name=\"communityIntro\" rows=\"2\" maxlength=\"100\" placeholder=\"一句话说明社群特色、适合人群和日常活动\" aria-describedby=\"intro-counter intro-error\"><\/textarea>\n          <span class=\"c-field__counter\" id=\"intro-counter\" aria-live=\"polite\">0/100<\/span>\n          <span class=\"c-field__error\" id=\"intro-error\" role=\"alert\">请填写社群介绍<\/span>\n        <\/div>\n\n        <!-- 上传社群头像（选填；占位框与「上传封面」同款，未上传时默认取封面中心裁切） -->\n        <div class=\"p-avatar-field\">\n          <div class=\"c-uploader-wrap\">\n            <button class=\"c-uploader\" type=\"button\" aria-label=\"上传社群头像，选填\" aria-describedby=\"avatar-constraint\">\n              <svg width=\"34\" height=\"34\" viewBox=\"0 0 40 40\" fill=\"none\" aria-hidden=\"true\" focusable=\"false\"><path d=\"M20 6v28M6 20h28\" stroke=\"currentColor\" stroke-width=\"3\" stroke-linecap=\"round\"/><\/svg>\n              <span class=\"c-uploader__text\">上传头像<\/span>\n            <\/button>\n          <\/div>\n          <p class=\"c-cellhint\" id=\"avatar-constraint\">建议尺寸 200x200，JPG/PNG，不超过 2MB；默认取封面中心裁切<\/p>\n        <\/div>\n\n        <!-- 主要活动区域：城市（必填）+ 项目/片区（选填） -->\n        <header class=\"c-card__head c-tags-head p-area-head\">\n          <h2 class=\"c-card__title\">主要活动区域<span class=\"c-req\" aria-hidden=\"true\">*<\/span><\/h2>\n        <\/header>\n        <div class=\"p-area-row\">\n          <button class=\"p-area-sel\" type=\"button\" id=\"area-city\" aria-haspopup=\"listbox\" aria-label=\"选择城市，当前：深圳\">\n            <span class=\"p-area-sel__val\">深圳<\/span>\n            <svg class=\"p-area-sel__caret\" width=\"24\" height=\"14\" viewBox=\"0 0 26 16\" fill=\"none\" aria-hidden=\"true\" focusable=\"false\"><path d=\"M3 3l10 10L23 3\" stroke=\"currentColor\" stroke-width=\"3.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><\/svg>\n          <\/button>\n          <button class=\"p-area-sel\" type=\"button\" id=\"area-proj\" aria-haspopup=\"listbox\" aria-label=\"选择项目 / 片区，选填，当前：蛇口片区\">\n            <span class=\"p-area-sel__val\">蛇口片区<\/span>\n            <svg class=\"p-area-sel__caret\" width=\"24\" height=\"14\" viewBox=\"0 0 26 16\" fill=\"none\" aria-hidden=\"true\" focusable=\"false\"><path d=\"M3 3l10 10L23 3\" stroke=\"currentColor\" stroke-width=\"3.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><\/svg>\n          <\/button>\n        <\/div>\n        <p class=\"c-cellhint\">项目 / 片区为选填，不选则默认覆盖所选城市全部区域<\/p>\n\n        <!-- 底部选择弹层：城市 / 项目片区 -->\n        <div class=\"p-sheet-mask\" id=\"area-mask\" hidden><\/div>\n        <div class=\"p-sheet\" role=\"dialog\" aria-modal=\"true\" aria-labelledby=\"area-sheet-title\" id=\"area-sheet\" hidden>\n          <header class=\"p-sheet__head\">\n            <button class=\"p-sheet__cancel\" type=\"button\" id=\"area-cancel\">取消<\/button>\n            <h2 class=\"p-sheet__title\" id=\"area-sheet-title\">选择城市<\/h2>\n            <span class=\"p-sheet__ok\" id=\"area-ok\">确定<\/span>\n          <\/header>\n          <ul class=\"p-sheet__list\" id=\"area-sheet-list\" role=\"listbox\"><\/ul>\n        <\/div>\n        <header class=\"c-card__head c-tags-head\">\n          <h2 class=\"c-card__title\" id=\"sec-tags-title\">社群标签<\/h2>\n          <p class=\"c-card__hint\">已选 1/3<\/p>\n        <\/header>\n        <p class=\"c-cellhint\">候选标签取自平台标签库（城市内容管理-内容标签管理）<\/p>\n        <div class=\"c-tags\" role=\"group\" aria-labelledby=\"sec-tags-title\">\n          <button class=\"c-tag is-selected\" type=\"button\" aria-pressed=\"true\">飞盘<\/button>\n          <button class=\"c-tag\" type=\"button\" aria-pressed=\"false\">跑步<\/button>\n          <button class=\"c-tag\" type=\"button\" aria-pressed=\"false\">篮球<\/button>\n          <button class=\"c-tag\" type=\"button\" aria-pressed=\"false\">亲子<\/button>\n          <button class=\"c-tag\" type=\"button\" aria-pressed=\"false\">生活方式<\/button>\n          <button class=\"c-tag\" type=\"button\" aria-pressed=\"false\">兴趣社交<\/button>\n        <\/div>\n\n        <!-- 主理人 -->\n        <ul class=\"c-list p-owner-list\">\n          <li>\n            <div class=\"c-cell c-cell--owner\">\n              <span class=\"c-avatar\" role=\"img\" aria-label=\"主理人头像占位图\"><\/span>\n              <span class=\"c-cell__body\">\n                <span class=\"c-cell__name\">主理人：谢广坤<\/span>\n                <span class=\"c-cell__desc\">个人资料将同步展示在社群主页<\/span>\n              <\/span>\n              <button class=\"c-cell__link\" type=\"button\">查看资料\n                <svg class=\"c-cell__arrow\" width=\"16\" height=\"28\" viewBox=\"0 0 18 30\" fill=\"none\" aria-hidden=\"true\"><path d=\"M3 3l12 12L3 27\" stroke=\"currentColor\" stroke-width=\"3.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><\/svg>\n              <\/button>\n            <\/div>\n          <\/li>\n        <\/ul>\n      <\/section>\n\n      <!-- 卡片3：加入设置 -->\n      <section class=\"c-card p-card-join\" aria-labelledby=\"sec-join-title\">\n        <header class=\"c-card__head\">\n          <h2 class=\"c-card__title\" id=\"sec-join-title\">加入设置<\/h2>\n          <p class=\"c-card__hint\">已使用推荐默认值<\/p>\n        <\/header>\n\n        <div class=\"c-segmented\" role=\"tablist\" aria-label=\"加入方式\">\n          <button class=\"c-segmented__item\" id=\"seg-direct\" type=\"button\" role=\"tab\" aria-selected=\"false\" aria-controls=\"join-banner\">直接加入<\/button>\n          <button class=\"c-segmented__item is-selected\" id=\"seg-audit\" type=\"button\" role=\"tab\" aria-selected=\"true\" aria-controls=\"join-banner\">申请审核<\/button>\n        <\/div>\n        <p class=\"c-banner\" id=\"join-banner\" role=\"note\" aria-live=\"polite\" data-text-direct=\"用户可直接成为成员，适合开放式兴趣社群。\" data-text-audit=\"用户需经主理人审核后方可成为成员，适合需要筛选成员的社群。\">用户需经主理人审核后方可成为成员，适合需要筛选成员的社群。<\/p>\n\n        <ul class=\"c-list\">\n          <li>\n            <button class=\"c-cell\" type=\"button\" aria-label=\"可见范围，当前：所有人可见\">\n              <span class=\"c-cell__icon\" aria-hidden=\"true\">\n                <svg width=\"36\" height=\"42\" viewBox=\"0 0 46 52\" fill=\"none\" focusable=\"false\"><path d=\"M23 3L4 11v13c0 12.4 8.1 20.8 19 25 10.9-4.2 19-12.6 19-25V11L23 3z\" stroke=\"currentColor\" stroke-width=\"3.4\" stroke-linejoin=\"round\"/><path d=\"M15 25.5l6 6 10-11\" stroke=\"currentColor\" stroke-width=\"3.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><\/svg>\n              <\/span>\n              <span class=\"c-cell__label\">可见范围<\/span>\n              <span class=\"c-cell__value\">所有人可见\n                <svg class=\"c-cell__arrow\" width=\"16\" height=\"28\" viewBox=\"0 0 18 30\" fill=\"none\" aria-hidden=\"true\" focusable=\"false\"><path d=\"M3 3l12 12L3 27\" stroke=\"currentColor\" stroke-width=\"3.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><\/svg>\n              <\/span>\n            <\/button>\n          <\/li>\n          <li><hr class=\"c-divider\"><\/li>\n          <li>\n            <button class=\"c-cell\" type=\"button\" aria-label=\"身份范围，当前：业主、居民与企业员工\">\n              <span class=\"c-cell__icon\" aria-hidden=\"true\">\n                <svg width=\"38\" height=\"42\" viewBox=\"0 0 46 52\" fill=\"none\" focusable=\"false\"><circle cx=\"23\" cy=\"16\" r=\"9\" stroke=\"currentColor\" stroke-width=\"3.4\"/><path d=\"M5 46c2-11 9.4-16 18-16s16 5 18 16\" stroke=\"currentColor\" stroke-width=\"3.4\" stroke-linecap=\"round\"/><\/svg>\n              <\/span>\n              <span class=\"c-cell__label\">身份范围<\/span>\n              <span class=\"c-cell__value\">业主、居民与企业员工\n                <svg class=\"c-cell__arrow\" width=\"16\" height=\"28\" viewBox=\"0 0 18 30\" fill=\"none\" aria-hidden=\"true\" focusable=\"false\"><path d=\"M3 3l12 12L3 27\" stroke=\"currentColor\" stroke-width=\"3.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><\/svg>\n              <\/span>\n            <\/button>\n          <\/li>\n          <li><hr class=\"c-divider\"><\/li>\n          <li>\n            <button class=\"c-cell\" type=\"button\" aria-label=\"成员上限，当前：200 人（档位选择）\" aria-describedby=\"limit-hint\">\n              <span class=\"c-cell__icon\" aria-hidden=\"true\">\n                <svg width=\"42\" height=\"38\" viewBox=\"0 0 52 46\" fill=\"none\" focusable=\"false\"><circle cx=\"19\" cy=\"14\" r=\"9\" stroke=\"currentColor\" stroke-width=\"3.4\"/><path d=\"M3 42c1.8-9.4 8.2-14 16-14s14.2 4.6 16 14\" stroke=\"currentColor\" stroke-width=\"3.4\" stroke-linecap=\"round\"/><path d=\"M36 7.5a9 9 0 0 1 0 13\" stroke=\"currentColor\" stroke-width=\"3.4\" stroke-linecap=\"round\"/><path d=\"M41 29.5c4.5 2.2 7.3 6.3 8.3 12\" stroke=\"currentColor\" stroke-width=\"3.4\" stroke-linecap=\"round\"/><\/svg>\n              <\/span>\n              <span class=\"c-cell__label\">成员上限<\/span>\n              <span class=\"c-cell__value\">200 人\n                <svg class=\"c-cell__arrow\" width=\"16\" height=\"28\" viewBox=\"0 0 18 30\" fill=\"none\" aria-hidden=\"true\" focusable=\"false\"><path d=\"M3 3l12 12L3 27\" stroke=\"currentColor\" stroke-width=\"3.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><\/svg>\n              <\/span>\n            <\/button>\n          <\/li>\n        <\/ul>\n        <p class=\"c-cellhint\" id=\"limit-hint\">档位：100 / 200 / 500 / 1000 人（与 PC 端共用同一档位表）；达到上限后暂停新申请<\/p>\n      <\/section>\n\n      <!-- 卡片4：运营规则 -->\n      <section class=\"c-card p-card-more\" aria-labelledby=\"sec-rules-title\">\n        <header class=\"c-card__head\">\n          <h2 class=\"c-card__title\" id=\"sec-rules-title\">运营规则<\/h2>\n        <\/header>\n        <div class=\"c-morepanel__body p-rules\">\n          <div class=\"c-field c-field--area c-field--compact p-pactfield\">\n            <label class=\"c-field__label\" for=\"pact-text\">社群公约<span class=\"c-req\" aria-hidden=\"true\">*<\/span><\/label>\n            <textarea class=\"c-field__control c-field__control--area\" id=\"pact-text\" name=\"pact\" rows=\"2\" maxlength=\"200\">友善交流，尊重他人与隐私；\n禁止广告、推销及任何形式的商业信息。<\/textarea>\n            <span class=\"c-field__counter\" id=\"pact-counter\" aria-live=\"polite\">30/200<\/span>\n          <\/div>\n          <label class=\"c-checkrow\">\n            <input class=\"c-checkbox__input\" id=\"auto-send\" name=\"autoSend\" type=\"checkbox\" checked>\n            新成员加入后自动发送公约与欢迎语\n          <\/label>\n          <label class=\"c-checkrow\">\n            <input class=\"c-checkbox__input\" id=\"content-audit\" name=\"contentAudit\" type=\"checkbox\" checked>\n            非主理人发布公开内容需先审核<span class=\"c-checkrow__hint\">（与详情页「允许成员发起话题」为同一权威开关的两种视图）<\/span>\n          <\/label>\n          <div class=\"c-field c-field--area c-field--compact\">\n            <label class=\"c-field__label\" for=\"welcome-msg\">欢迎语<span class=\"c-req\" aria-hidden=\"true\">*<\/span><\/label>\n            <textarea class=\"c-field__control c-field__control--area\" id=\"welcome-msg\" name=\"welcomeMsg\" rows=\"2\" maxlength=\"100\">欢迎加入蛇口亲子社群，请先阅读社群公约并完善个人信息。<\/textarea>\n            <span class=\"c-field__counter\" id=\"welcome-counter\" aria-live=\"polite\">26/100<\/span>\n          <\/div>\n        <\/div>\n      <\/section>\n\n    <\/form>\n\n    <!-- 协议勾选 -->\n    <div class=\"p-agree\">\n      <div class=\"c-checkbox\">\n        <input class=\"c-checkbox__input\" id=\"agree-terms\" name=\"agreeTerms\" type=\"checkbox\" checked required aria-describedby=\"agree-tip\">\n        <span class=\"c-checkbox__box\" aria-hidden=\"true\">\n          <svg width=\"20\" height=\"16\" viewBox=\"0 0 22 18\" fill=\"none\" focusable=\"false\"><path d=\"M2 9.5l6 6L20 2.5\" stroke=\"currentColor\" stroke-width=\"3.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><\/svg>\n        <\/span>\n        <label class=\"c-checkbox__label\" for=\"agree-terms\">已阅读并同意<a class=\"c-link\" href=\"#terms\">《社群运营规范》<\/a><\/label>\n      <\/div>\n      <p class=\"c-tip\" id=\"agree-tip\">\n        <svg width=\"28\" height=\"28\" viewBox=\"0 0 30 30\" fill=\"none\" aria-hidden=\"true\" focusable=\"false\"><circle cx=\"15\" cy=\"15\" r=\"12.5\" stroke=\"currentColor\" stroke-width=\"2.4\"/><path d=\"M15 8.5V15l4.5 4\" stroke=\"currentColor\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><\/svg>\n        提交后预计1个工作日内完成审核\n      <\/p>\n    <\/div>\n  <\/main>\n\n  <!-- 底部操作栏 -->\n  <footer class=\"c-actionbar\">\n    <button class=\"c-btn c-btn--secondary c-btn--lg\" type=\"button\">存草稿<\/button>\n    <button class=\"c-btn c-btn--primary c-btn--lg\" type=\"submit\" form=\"main-form\">提交审核<\/button>\n  <\/footer>\n\n<\/div>\n\n<script>\n  /* 社群介绍字数统计（标准：Field 必选属性 maxlength + 计数反馈） */\n  (function () {\n    var ta = document.getElementById('community-intro');\n    var counter = document.getElementById('intro-counter');\n    function sync() { counter.textContent = ta.value.length + '/100'; }\n    ta.addEventListener('input', sync);\n    sync();\n  })();\n\n  /* 分段控件：切换选中态（Tabbar 选中/未选中） */\n  (function () {\n    var items = document.querySelectorAll('.c-segmented__item');\n    items.forEach(function (item) {\n      item.addEventListener('click', function () {\n        items.forEach(function (i) {\n          i.classList.remove('is-selected');\n          i.setAttribute('aria-selected', 'false');\n        });\n        item.classList.add('is-selected');\n        item.setAttribute('aria-selected', 'true');\n      });\n    });\n  })();\n\n  /* 社群名称：1-20 字实时计数 + 超长拦截（规范 #1） */\n  (function () {\n    var ipt = document.getElementById('community-name');\n    var c = document.getElementById('name-counter');\n    function sync() {\n      var v = ipt.value.slice(0, 20);\n      if (ipt.value !== v) ipt.value = v;\n      c.textContent = v.length + '/20';\n    }\n    ipt.addEventListener('input', sync); sync();\n  })();\n  /* 主要活动区域：城市（必填）→ 项目/片区（选填，随城市联动）双下拉 */\n  (function () {\n    var CITYS = ['深圳', '武汉', '上海', '成都', '杭州', '苏州'];\n    var PROJS = {\n      '深圳': ['蛇口片区', '前海片区', '后海片区', '科技园片区', '宝安中心区'],\n      '武汉': ['光谷片区', '汉口滨江', '武昌中心', '经开片区'],\n      '上海': ['浦东前滩', '徐汇滨江', '大虹桥', '临港新片区'],\n      '成都': ['高新片区', '天府新区', '锦江片区', '东郊记忆片区'],\n      '杭州': ['钱江新城', '滨江片区', '未来科技城', '之江片区'],\n      '苏州': ['工业园区', '姑苏片区', '高新片区', '太湖新城']\n    };\n    var cityBtn = document.getElementById('area-city');\n    var projBtn = document.getElementById('area-proj');\n    var mask = document.getElementById('area-mask');\n    var sheet = document.getElementById('area-sheet');\n    var title = document.getElementById('area-sheet-title');\n    var list = document.getElementById('area-sheet-list');\n    var okBtn = document.getElementById('area-ok');\n    var cancelBtn = document.getElementById('area-cancel');\n    var state = { city: '深圳', projs: ['蛇口片区'], open: null, pick: null, msel: [] };\n\n    function projText() {\n      if (!state.projs.length) return '';\n      if (state.projs.length === (PROJS[state.city] || []).length) return '全部';\n      return state.projs.join('、');\n    }\n    function renderProjBtn() {\n      var t = projText();\n      var span = projBtn.querySelector('.p-area-sel__val');\n      span.textContent = t || '选填';\n      projBtn.classList.toggle('is-empty', !t);\n      projBtn.setAttribute('aria-label', '选择项目 / 片区，选填，当前：' + (t || '未选择'));\n    }\n\n    function openSheet(kind) {\n      state.open = kind;\n      state.pick = state.city;\n      state.msel = (kind === 'proj' ? state.projs : []).slice();\n      title.textContent = kind === 'city' ? '选择城市' : '选择项目 / 片区';\n      if (kind === 'city') {\n        list.innerHTML = CITYS.map(function (o) {\n          return '<li class=\"p-sheet__item\" role=\"option\" tabindex=\"0\" aria-selected=\"' + (o === state.pick) + '\" data-v=\"' + o + '\">' + o + '<\/li>';\n        }).join('');\n      } else {\n        var opts = PROJS[state.city] || [];\n        var allOn = opts.length > 0 && state.msel.length === opts.length;\n        var h = '<li class=\"p-sheet__item p-sheet__item--all\" role=\"option\" tabindex=\"0\" aria-selected=\"' + allOn + '\" data-v=\"__all__\">' +\n          '<span class=\"p-sheet__check\"><\/span><span class=\"p-sheet__txt\">全部<\/span><\/li>';\n        h += opts.map(function (o) {\n          var on = state.msel.indexOf(o) > -1;\n          return '<li class=\"p-sheet__item p-sheet__item--multi\" role=\"option\" tabindex=\"0\" aria-selected=\"' + on + '\" data-v=\"' + o + '\">' +\n            '<span class=\"p-sheet__check\"><\/span><span class=\"p-sheet__txt\">' + o + '<\/span><\/li>';\n        }).join('');\n        list.innerHTML = h;\n      }\n      mask.hidden = false;\n      sheet.hidden = false;\n    }\n    function closeSheet() { mask.hidden = true; sheet.hidden = true; state.open = null; }\n\n    function syncAllRow() {\n      var opts = PROJS[state.city] || [];\n      var allLi = list.querySelector('.p-sheet__item--all');\n      if (!allLi) return;\n      var allOn = opts.length > 0 && state.msel.length === opts.length;\n      allLi.setAttribute('aria-selected', String(allOn));\n    }\n\n    list.addEventListener('click', function (e) {\n      var li = e.target.closest('.p-sheet__item');\n      if (!li) return;\n      var v = li.getAttribute('data-v');\n      if (state.open === 'city') {\n        state.pick = v;\n        [].forEach.call(list.children, function (c) {\n          c.setAttribute('aria-selected', String(c === li));\n        });\n      } else {\n        if (v === '__all__') {\n          var opts = PROJS[state.city] || [];\n          state.msel = state.msel.length === opts.length ? [] : opts.slice();\n        } else {\n          var i = state.msel.indexOf(v);\n          if (i > -1) state.msel.splice(i, 1);\n          else state.msel.push(v);\n        }\n        li.setAttribute('aria-selected', String(li.getAttribute('aria-selected') !== 'true'));\n        syncAllRow();\n      }\n    });\n    okBtn.addEventListener('click', function () {\n      if (state.open === 'city') {\n        state.city = state.pick;\n        cityBtn.querySelector('.p-area-sel__val').textContent = state.city;\n        cityBtn.setAttribute('aria-label', '选择城市，当前：' + state.city);\n        /* 切换城市后，原项目不在新城市候选内则剔除 */\n        var opts = PROJS[state.city] || [];\n        state.projs = state.projs.filter(function (x) { return opts.indexOf(x) > -1; });\n        renderProjBtn();\n      } else if (state.open === 'proj') {\n        state.projs = state.msel.slice();\n        renderProjBtn();\n      }\n      closeSheet();\n    });\n    cancelBtn.addEventListener('click', closeSheet);\n    mask.addEventListener('click', closeSheet);\n    cityBtn.addEventListener('click', function () { openSheet('city'); });\n    projBtn.addEventListener('click', function () { openSheet('proj'); });\n  })();\n  /* 运营规则：公约与欢迎语编辑后实时字数计数（初始态展示与设计稿一致的演示值） */\n  (function () {\n    var ta = document.getElementById('welcome-msg');\n    var wc = document.getElementById('welcome-counter');\n    function syncW() { wc.textContent = ta.value.length + '/100'; }\n    ta.addEventListener('input', syncW);\n  })();\n  (function () {\n    var MAX = 200;\n    var ta = document.getElementById('pact-text');\n    var c = document.getElementById('pact-counter');\n    function sync() {\n      var v = ta.value.slice(0, MAX);\n      if (ta.value !== v) ta.value = v;\n      c.textContent = v.length + '/' + MAX;\n    }\n    ta.addEventListener('input', sync);\n  })();\n  /* 加入方式：场景化说明随选中项切换（规范 #16） */\n  (function () {\n    var b = document.getElementById('join-banner');\n    var d = document.getElementById('seg-direct'), a = document.getElementById('seg-audit');\n    function set() { b.textContent = a.getAttribute('aria-selected') === 'true' ? b.dataset.textAudit : b.dataset.textDirect; }\n    d.addEventListener('click', set); a.addEventListener('click', set); set();\n  })();\n  /* 社群标签：最多 3 个（Tag 选中态 + 计数联动） */\n  (function () {\n    var tags = document.querySelectorAll('.c-tag');\n    var hint = document.querySelector('.c-tags-head .c-card__hint');\n    tags.forEach(function (tag) {\n      tag.addEventListener('click', function () {\n        var on = tag.classList.contains('is-selected')\n          ? (tag.classList.remove('is-selected'), false)\n          : (document.querySelectorAll('.c-tag.is-selected').length < 3 ? (tag.classList.add('is-selected'), true) : false);\n        tag.setAttribute('aria-pressed', on ? 'true' : 'false');\n        hint.textContent = '已选 ' + document.querySelectorAll('.c-tag.is-selected').length + '/3';\n      });\n    });\n  })();\n<\/script>\n\n<!--\n================================================================\n本次修改点（依据：one蛇口组件系统.sketch）\n================================================================\n1. 【设计令牌化】新增 :root 令牌块，色彩全部替换为共享色板：\n   Brand01 #387DEC / Brand02 #0855D1 / Brand03 #9BBEF5 / Brand04 #E0ECFF、\n   Text01 #303133 / Text02 #909399 / Text03 #C0C4CC / Text04 #FFFFFF、\n   Line01 #EBEBEB、页面背景 #F2F5F7、Success #10A17C/#E6F7F2、荟豆 #F76346/#FFE7E6、Danger #EB4A38。\n   原稿临时色（#2563EB / #101828 / #98A2B3 / #F7F8FA 等）全部废弃。\n   依据：🏷基础样式 / 色彩（共享色板 swatch 列表）\n2. 【字号规范化】字号改为标准档位 × 页面缩放 --scale=1.137（853/750）：\n   36 超大标题 / 32 卡片标题 / 28 正文 / 24 次级 / 20 极少数次级 / 22 标签；\n   行高取标准值：卡片标题 44/32=1.375、正文 40/28≈1.43。\n   依据：🏷基础样式 / 字体（36pt 超大标题、32pt 卡片标题、28pt 正文、24pt 次级、20pt 极少数次级）\n3. 【字体族】中文 PingFang SC（Light/Regular/Medium/Semibold），数字 Source Han Sans SC（思源黑体）；\n   状态栏时间与字数计数等数字节点改用 --font-num。\n   依据：基础样式「中文字体PingFang SC 苹方-简」「数字字体思源黑体、系统默认字体」\n4. 【圆角统一】--radius-card 24 / --radius-field 16 / --radius-tag 8（均按 --scale 换算），\n   上传器与图片沿用图片圆角 16。依据：控件页 弹窗背景 r=24、位图 r=16、Tabbar 指示条 r=4\n5. 【卡片】统一为「控件/卡片/卡片组」：白底 + 圆角 24 + 阴影 blur12/offsetY2\n   （转 CSS：0 1px 6px rgba(0,0,0,.06)）。依据：控件/卡片/卡片组 shadow blurRadius12 offsetY2\n6. 【按钮】按「控件/Button」重构为 .c-btn--primary / .c-btn--secondary + .c-btn--lg：\n   Primary 底 Brand01、Pressed/active 底 Brand02；Secondary 白底 + Brand01 2px 描边 + Brand01 文字；\n   主按钮由稿件渐变改为标准纯色 Brand01（标准未定义渐变主按钮）。\n   补 hover（派生 --brand-hover #2F6FDC）、active、focus-visible（Brand03 焦点环）、\n   disabled（底 Brand03 / 字 Text03）、.is-loading（内置 spinner）。\n   依据：控件/Button/Primary,Large,Default｜Primary,Large,Pressed｜Secondary,Large,Default｜Secondary,Large,Pressed\n7. 【标签】按「控件/Tag/blue」重构为 .c-tag：选中 Brand04 底 + Brand01 描边 + Brand01 字，\n   未选中 Line01 描边 + Text01 字；补 hover / active / focus-visible / .is-disabled。\n   依据：控件/Tag/blue（底 #E0ECFF、字 #387DEC、字号 22）\n8. 【列表行 + 跳转箭头】统一 .c-cell（原生 button）：图标 Brand01、值 Text02、\n   箭头按「控件/Icon/24px/跳转」取 Text02、描边 2px；补 hover/active/focus-visible/.is-disabled。\n   依据：控件/Icon/24px/跳转（borders #909399 2px）\n9. 【分割线】改用语义化 <hr class=\"c-divider\">，颜色 Line01 #EBEBEB、1px。依据：控件/分割线（#EBEBEB 1px）\n10.【分段控件】按 Tabbar 选中/未选中：选中 Brand04 底 + Brand01 描边 + Brand01 字，未选中 Text02 字；\n    补 role=\"tablist\"/role=\"tab\"/aria-selected/aria-controls 与 hover/focus-visible。\n    依据：控件/Tabbar/选中（字 #387DEC + 指示条 #387DEC）｜Tabbar/未选中（字 #909399）\n11.【表单语义化 + 必选属性】社群名称/社群介绍改为 label[for] + input/textarea，\n    补齐 id、name、type、maxlength、placeholder、aria-describedby、autocomplete；\n    计数器加 aria-live=\"polite\"，并新增 .c-field__error（role=\"alert\"）错误态与 .c-field.is-error 样式。\n    依据：表单控件必选属性约定（id/name/type/maxlength/aria-describedby）\n12.【可访问性】补 lang=\"zh-CN\"、跳过导航链接 .c-skip-link、header/main#main/footer 语义骨架、\n    h1（导航标题）与 h2（卡片标题）层级、section[aria-labelledby]、\n    所有可点击元素由 div/span 改为原生 button[type=button]（返回、胶囊菜单、上传封面、标签、列表行、更多设置）、\n    装饰图标与状态栏加 aria-hidden=\"true\" + focusable=\"false\"、占位图 role=\"img\" + aria-label、\n    复选框用原生 input:checkbox + 可见 .c-checkbox__box，焦点环统一 Brand03。\n13.【状态类全覆盖】统一状态类命名：.is-selected（选中）、.is-disabled / [disabled]（禁用）、\n    .is-loading（加载）、.is-error（错误），并在按钮 / 标签 / 列表行 / 字段四类组件全部实现。\n    依据：🏷基础样式 品牌色六态标注「常规 / 悬浮 / 点击 / 一般禁用 / 文字禁用 / 置灰」\n14.【属性书写顺序】统一为 class → id → type → name → role → aria-* → data-* → value/checked/disabled。\n15.【保留项】全部文案、数值、图标构成、卡片顺序与 853×1844 版式尺寸保持不变，功能与原稿一致；\n    如仍需还原截图取色，只需覆盖 :root 中对应色彩变量即可，无需改动结构。\n16.【新增·上传社群头像】在「社群资料」卡片、「社群介绍」字段下方新增上传头像区域：\n    占位框直接复用「上传封面」的 .c-uploader（145×120、圆角 16、#F5F6F8 底、无描边、\n    34px 加号图标 + 20px 说明文字、hover/active/focus-visible 状态一致），\n    外层用新增的 .p-avatar-field 承载（横向排列 + 右侧说明文案），说明文案沿用 .c-cellhint。\n    头像为选填项，未上传时按文案约定默认取封面中心裁切，故不加必填星号。\n17.【取值调整·主要活动区域】「运营信息」卡片内「主要活动区域」由原写死的片区示例「蛇口片区」\n    改为城市级取值「深圳」（字段名、class、位置图标、跳转箭头、aria-label 结构均保持不变，\n    仅同步 aria-label 中的当前取值文案）。    注：PC 端各页仍为「蛇口片区」，本次未联动修改。\n18.【缺陷修复·多行输入正文被截】.c-field--area 原写死 height:140px，减去上下内边距 32、\n    标签 39、计数器 33 后，textarea 只剩约 35px，而正文行高为 28×1.137×1.43≈45.5px，\n    导致「社群介绍」占位文字底部被切掉约 5px（.c-field--compact 的欢迎语更严重，仅剩 26px）。\n    改为 min-height:195px（18+39+2×45.5+33+14），并给 .c-field__control--area 加\n    min-height:calc(2em * var(--lh-body)) 锁定 2 行正文高度；\n    .c-field--compact 同步由 height:130px 改为 min-height:195px（其占位文案会折成 2 行）。\n19.【交互对齐·社群公约（对齐 PC 端 2.管理后台-新建/编辑社群「运营规则 → 社群公约」）】\n    PC 端口径：公约正文是一个常驻可见、可直接查看并编辑的多行输入框 + 右下角 N/200 计数。\n    C 端改为同构实现——「社群公约」行下方常驻一个 .c-field--area.c-field--compact 输入框\n    （完全复用「欢迎语」同一组件，仅新增 1 条 .p-pactfield 修饰：正文区锁 3 行高\n    calc(3em * var(--lh-body))，避免 3 条公约折行后首行被滚出视野），\n    textarea#pact-text(name=pact, maxlength=200) + .c-field__counter 实时计数，\n    沿用「社群名称」计数器的 slice 截断写法；「引用模板 / 复用既有公约」降级为一键填入\n    （填入后光标置于末尾、scrollTop 归零），不再作为唯一输入途径。\n    提示文案由「移动端不提供空白输入，仅支持…」改为「可点上方…一键填入，也可直接编辑；最多 200 字」。\n    平台模板前两条与 PC 端运营规则卡片公约正文逐字一致，保证两端口径统一。\n-->\n\n<script>\n(function(){\n  var ID=\"p11\";\n  var MAP={\"1.主理人中心.html\": \"p1\", \"11.主理人创建社群.html\": \"p11\", \"12.主理人管理社群可基于社群创建活动.html\": \"p12\", \"13.主理人社群成员列表.html\": \"p13\", \"2.申请成为主理人.html\": \"p2\", \"3-1.查看申请记录.html\": \"p31\", \"3.申请提交页面.html\": \"p3\", \"4.主理人发布活动-改版.html\": \"p4\", \"8.主理人查看活动-改版.html\": \"p8\", \"9.活动报名名单-改版.html\": \"p9\"};\n  function go(id){try{parent.postMessage({__demoNav:id},'*');}catch(e){}}\n  window.__demoGo=go;\n  window.__demoBlocked=function(f){alert('「'+f+'」未包含在本次合并的原型范围内');};\n  document.addEventListener('click',function(e){\n    var t=e.target;\n    var a=t&&t.closest?t.closest('a[href]'):null;\n    if(!a)return;\n    var h=a.getAttribute('href')||'';\n    if(!/\\.html(\\?|#|$)/.test(h))return;\n    e.preventDefault();e.stopPropagation();\n    if(MAP[h]){go(MAP[h]);}else{window.__demoBlocked(h);}\n  },true);\n  function allBtns(){return document.querySelectorAll('button,[role=\"button\"],a');}\n  function hookText(txt,id,delay,toast){\n    allBtns().forEach(function(b){\n      if(b.__dh)return;\n      if((b.textContent||'').replace(/\\s+/g,'').indexOf(txt)>-1){\n        b.__dh=1;\n        b.addEventListener('click',function(){setTimeout(function(){\n          if(toast){alert(toast);return;}\n          if(id)go(id);\n        },delay||0);});\n      }\n    });\n  }\n  function hookAria(prefix,id){\n    document.querySelectorAll('[aria-label]').forEach(function(b){\n      if(b.__dh)return;\n      if((b.getAttribute('aria-label')||'').indexOf(prefix)===0){\n        b.__dh=1;\n        b.addEventListener('click',function(){go(id);});\n      }\n    });\n  }\n  hookText('提交审核','p12',1200);\n  var BACK={\"p11\": \"p1\", \"p12\": \"p1\", \"p13\": \"p12\", \"p2\": \"p1\", \"p3\": \"p2\", \"p31\": \"p3\", \"p4\": \"p1\", \"p8\": \"p1\", \"p9\": \"p8\"}[ID];\n  var bk=document.querySelector('.nsk-navbar__back,.c-navbar__back');\n  if(bk&&BACK){bk.addEventListener('click',function(e){e.stopPropagation();e.preventDefault();go(BACK);});}\n  /* 2x 设计板页面（社群系列）按画板宽度等比缩放适配容器 */\n  var BOARD=853;\n  if(BOARD){\n    (function(){\n      var st=document.createElement('style');\n      st.textContent='html{overflow-x:hidden!important}body{margin:0 auto!important;zoom:'+(430/BOARD).toFixed(4)+'}';\n      document.head.appendChild(st);\n      var lastW=-1;\n      function fit(){\n        var w=document.documentElement.clientWidth||window.innerWidth||0;\n        if(w>0&&w!==lastW){\n          lastW=w;\n          document.body.style.zoom=(w/BOARD).toFixed(4);\n        }\n      }\n      window.__demoFit=fit;\n      fit();\n      window.addEventListener('resize',fit);\n      window.addEventListener('load',fit);\n      if(window.ResizeObserver){try{new ResizeObserver(fit).observe(document.documentElement);}catch(e){}}\n      /* 轮询自愈：任何事件时机漏掉（如 iframe 隐藏期未量到宽度）都会在下一拍补上 */\n      setInterval(fit,200);\n    })();\n  }\n})();\n<\/script>\n<\/body>\n<\/html>\n"
  },
  "p12": {
    "title": "管理社群",
    "html": "<!DOCTYPE html>\n<html lang=\"zh-CN\">\n<head>\n<meta charset=\"UTF-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n<title>招商玺社群管理<\/title>\n<!--\n  组件规范来源：one蛇口组件系统.sketch\n  页面缩放系数 --scale = 941 / 750 = 1.255（标准稿基于 750 画布，本页 941）\n  属性书写顺序约定：class → id → type → name → role → aria-* → data-* → value/checked/disabled\n-->\n<style>\n/* ============================================================\n   0. 设计令牌 Design Tokens（来源：one蛇口组件系统 / 共享色板）\n   ============================================================ */\n:root{\n  /* 0.1 品牌色 Brand */\n  --brand-01:#387DEC;          /* 品牌色/Brand01 常规 */\n  --brand-02:#0855D1;          /* 品牌色/Brand02 点击 */\n  --brand-03:#9BBEF5;          /* 品牌色/Brand03 一般禁用 */\n  --brand-04:#E0ECFF;          /* 品牌色/Brand04 特殊场景/置灰底 */\n  /* 0.2 文字色 Text */\n  --text-01:#303133;           /* 文字色/Text01 强调·正文标题 */\n  --text-02:#909399;           /* 文字色/Text02 次强调 */\n  --text-03:#C0C4CC;           /* 文字色/Text03 置灰/禁用信息 */\n  --text-04:#FFFFFF;           /* 文字色/Text04 纯白文字 */\n  /* 0.3 中性色 Neutral */\n  --line-01:#EBEBEB;           /* 中性色/Line01 分割线 */\n  --bg-page:#F2F5F7;           /* 中性色/页面背景 */\n  --bg-card:#FFFFFF;\n  /* 0.4 功能色 */\n  --success-01:#10A17C;        /* 功能色/Success01 */\n  --success-02:#E6F7F2;        /* 功能色/Success02 */\n  --huidou-01:#F76346;         /* 荟豆色/huidou01 */\n  --huidou-02:#FFE7E6;         /* 荟豆色/huidou02 */\n  --danger-01:#EB4A38;         /* 错误价格/Danger */\n  --danger-02:#FDECEA;         /* Danger 淡底（按 Success02 同法派生） */\n  /* 0.5 交互状态（标准未单列 hover，按 Brand01→Brand02 方向派生） */\n  --brand-hover:#2F6FDC;\n  --brand-active:var(--brand-02);\n  --brand-disabled:var(--brand-03);\n  --text-disabled:var(--text-03);\n  --focus-ring:var(--brand-03);\n  /* 0.6 字体（基础样式：中文 PingFang SC；数字 思源黑体 Source Han Sans SC） */\n  --font-cn:\"PingFang SC\",\"Helvetica Neue\",\"Hiragino Sans GB\",\"Microsoft YaHei\",sans-serif;\n  --font-num:\"Source Han Sans SC\",\"PingFang SC\",\"Helvetica Neue\",sans-serif;\n  /* 0.7 字号档位（基础样式：36 超大标题 / 32 卡片标题 / 28 正文 / 24 次级 / 20 极少数次级；标签 22） */\n  --scale:1.255;\n  --fs-h1:calc(36px * var(--scale));\n  --fs-title:calc(32px * var(--scale));\n  --fs-body:calc(28px * var(--scale));\n  --fs-sub:calc(24px * var(--scale));\n  --fs-min:calc(20px * var(--scale));\n  --fs-tag:calc(22px * var(--scale));\n  --lh-title:1.375;            /* 卡片标题 44/32 */\n  --lh-body:1.43;              /* 正文 40/28 */\n  /* 0.8 圆角（控件：卡片 24 / 图片 16 / 指示条 4，均按 --scale 换算） */\n  --radius-card:calc(24px * var(--scale));\n  --radius-field:calc(16px * var(--scale));\n  --radius-tag:calc(8px * var(--scale));\n  --radius-pill:999px;\n  /* 0.9 阴影（控件：卡片/卡片组 shadow blur12 offsetY2） */\n  --shadow-card:0 1px 6px rgba(0,0,0,.06);\n  --shadow-focus:0 0 0 3px rgba(155,190,245,.6);\n}\n\n/* ============================================================\n   1. 基础重置与页面骨架\n   ============================================================ */\n*{margin:0;padding:0;box-sizing:border-box;-webkit-font-smoothing:antialiased}\nbody{\n  font-family:var(--font-cn);\n  font-size:var(--fs-body);\n  line-height:var(--lh-body);\n  color:var(--text-01);\n  background:var(--bg-page);\n  width:941px;margin:0 auto;\n}\n.l-page{display:flex;flex-direction:column;min-height:1672px;overflow-x:hidden;position:relative}\n.l-main{flex:1;min-height:0;padding:0 30px;display:flex;flex-direction:column}\n.c-skip-link{position:absolute;left:-9999px;top:0;z-index:99;background:var(--brand-01);color:var(--text-04);padding:8px 16px;border-radius:8px}\n.c-skip-link:focus{left:16px;top:16px}\n\n/* ============================================================\n   2. 组件库 Components\n   ============================================================ */\n\n/* 2.1 状态栏 Statusbar（装饰性，aria-hidden） */\n.c-statusbar{height:88px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:0 56px 0 64px;background:var(--bg-page)}\n.c-statusbar__time{font-family:var(--font-num);font-size:30px;font-weight:600;color:var(--text-01)}\n.c-statusbar__icons{display:flex;align-items:center;gap:14px}\n\n/* 2.2 导航栏 Navbar（控件/Navbar/black） */\n.c-navbar{height:94px;flex:none;display:flex;align-items:center;padding:0 36px;position:relative;background:var(--bg-page)}\n.c-navbar__back{width:60px;display:flex;align-items:center;justify-content:flex-start}\n.c-navbar__title{position:absolute;left:0;right:0;text-align:center;font-size:var(--fs-title);line-height:var(--lh-title);font-weight:600;color:var(--text-01)}\n.c-navbar__action{margin-left:auto;position:relative;z-index:2;border:0;background:transparent;padding:0;font-family:var(--font-cn);font-size:var(--fs-sub);color:var(--brand-01);cursor:pointer;border-radius:8px}\n.c-navbar__action:hover{color:var(--brand-hover)}\n.c-navbar__action:active{color:var(--brand-active)}\n.c-navbar__action:focus-visible{outline:3px solid var(--focus-ring);outline-offset:2px}\n\n/* 2.3 图标按钮 IconButton */\n.c-iconbtn{border:0;background:transparent;padding:0;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;border-radius:8px;transition:opacity .18s}\n.c-iconbtn:hover{opacity:.6}\n.c-iconbtn:active{opacity:.4}\n.c-iconbtn:focus-visible{outline:3px solid var(--focus-ring);outline-offset:2px}\n\n/* 2.4 卡片 Card（控件/卡片/卡片组：白底 + blur12 y2 阴影 + 圆角24） */\n.c-card{background:var(--bg-card);border-radius:var(--radius-card);box-shadow:var(--shadow-card)}\n.c-card__head{display:flex;align-items:baseline;gap:24px}\n.c-card__title{font-size:var(--fs-title);line-height:var(--lh-title);font-weight:600;color:var(--text-01)}\n.c-card__hint{margin-left:auto;font-size:var(--fs-sub);color:var(--text-02)}\n\n/* 2.5 标签 Tag（控件/Tag/green：Success02 底 + Success01 字） */\n.c-tag{display:inline-flex;align-items:center;justify-content:center;height:42px;padding:0 16px;border-radius:var(--radius-tag);font-family:var(--font-cn);font-size:var(--fs-tag);font-weight:500}\n.c-tag--success{background:var(--success-02);color:var(--success-01)}\n.c-tag--brand{background:var(--brand-04);color:var(--brand-01)}\n.c-tag--huidou{background:var(--huidou-02);color:var(--huidou-01)}\n\n/* 2.6 头像 Avatar（图片圆角规范：头像为圆形） */\n.c-avatar{width:130px;height:130px;flex:none;border-radius:50%;background:radial-gradient(circle at 35% 35%,#9CC29A 0%,#6E9E6C 40%,#42663F 100%)}\n\n/* 2.7 列表行 Cell（控件/Icon/24px/跳转：箭头 Text02 2px） */\n.c-list{list-style:none}\n.c-cell{width:100%;min-height:56px;border:0;background:transparent;padding:0;display:flex;align-items:center;gap:20px;cursor:pointer;font-family:var(--font-cn);transition:opacity .18s,background-color .18s}\n.c-cell:hover{opacity:.72}\n.c-cell:active{background:var(--brand-04)}\n.c-cell:focus-visible{outline:3px solid var(--focus-ring);outline-offset:-2px;border-radius:8px}\n.c-cell.is-disabled{opacity:.45;pointer-events:none}\n.c-cell__label{font-size:var(--fs-body);color:var(--text-01)}\n.c-cell__value{margin-left:auto;display:flex;align-items:center;gap:18px;font-size:var(--fs-body);color:var(--text-02)}\n.c-cell__arrow{flex:none;color:var(--text-02)}\n\n/* 2.8 徽标 Badge（功能色 Danger） */\n.c-badge{min-width:42px;height:42px;padding:0 10px;border-radius:var(--radius-pill);background:var(--danger-01);color:var(--text-04);font-family:var(--font-num);font-size:var(--fs-min);font-weight:600;display:inline-flex;align-items:center;justify-content:center}\n\n/* 2.9 分割线 Divider（控件/分割线：1px Line01） */\n.c-divider{height:1px;border:0;background:var(--line-01)}\n\n/* 2.10 数值宫格 Stat（控件/卡片标题 体系） */\n.c-stats{list-style:none;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));padding:0 10px}\n.c-stat{width:100%;display:flex;flex-direction:column;align-items:center;gap:12px;background:transparent;border:0;font-family:var(--font-cn);cursor:pointer;border-radius:12px;padding:8px 0;transition:background-color .18s}\n.c-stat__icon{height:74px;display:flex;align-items:center;justify-content:center;color:var(--brand-01);position:relative}\n/* 群成员申请角标：图标右上红色数字（≥100 显示 99+，由数据侧截断） */\n.c-stat__badge{position:absolute;top:-6px;right:-26px;min-width:34px;height:34px;padding:0 8px;border-radius:var(--radius-pill);background:var(--danger-01);color:var(--text-04);font-family:var(--font-num);font-size:var(--fs-min);font-weight:600;display:inline-flex;align-items:center;justify-content:center;border:3px solid var(--bg-card)}\n.c-stat__label{font-size:var(--fs-body);font-weight:600;color:var(--text-01)}\n.c-stat__value{font-family:var(--font-num);font-size:var(--fs-sub);color:var(--text-02);margin-top:-6px}\n.c-stat:hover{background:var(--brand-04)}\n.c-stat:active{background:var(--brand-04)}\n.c-stat:focus-visible{outline:3px solid var(--focus-ring);outline-offset:2px}\n.c-stat.is-disabled{opacity:.45;pointer-events:none}\n\n/* 2.11 活动行 Activity（缩略图沿用图片圆角16） */\n.c-acts{list-style:none}\n.c-act{width:100%;display:flex;gap:22px;align-items:center;border:0;background:transparent;padding:0;cursor:pointer;font-family:var(--font-cn);text-align:left;transition:background-color .18s}\n.c-act:hover{background:var(--brand-04)}\n.c-act:active{background:var(--brand-04)}\n.c-act:focus-visible{outline:3px solid var(--focus-ring);outline-offset:-2px;border-radius:12px}\n.c-act__thumb{width:190px;height:125px;flex:none;border-radius:var(--radius-field)}\n.c-act__body{flex:1;min-width:0;display:flex;flex-direction:column;gap:8px}\n.c-act__head{display:flex;align-items:baseline;gap:20px;line-height:1.2}\n.c-act__name{font-size:var(--fs-title);font-weight:600;color:var(--text-01)}\n.c-act__date{font-family:var(--font-num);font-size:var(--fs-sub);color:var(--text-02)}\n.c-act__meta{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px 24px}\n.c-act__meta dt{font-size:var(--fs-min);line-height:1.15;color:var(--text-02)}\n.c-act__meta dd{font-family:var(--font-num);font-size:var(--fs-body);line-height:1.15;color:var(--text-01);margin-top:4px;white-space:nowrap}\n.c-act__arrow{flex:none;color:var(--text-02)}\n.c-act__status{font-size:var(--fs-min);line-height:1.5;padding:2px 12px;border-radius:999px;flex:none;font-weight:600}\n.c-act__status--tg-blue{background:var(--brand-04);color:var(--brand-01)}\n.c-act__status--tg-grey{background:#F2F4F7;color:var(--text-02)}\n.c-act__prog{margin-top:6px;display:block}\n.c-act__track{display:block;height:10px;border-radius:999px;background:#EDF0F4;overflow:hidden}\n.c-act__fill{display:block;height:100%;border-radius:999px;background:var(--brand-01)}\n\n/* 2.12 按钮 Button（控件/Button） */\n.c-btn{font-family:var(--font-cn);font-size:var(--fs-title);font-weight:600;border-radius:var(--radius-pill);display:inline-flex;align-items:center;justify-content:center;cursor:pointer;position:relative;transition:background-color .18s,border-color .18s,color .18s,box-shadow .18s}\n.c-btn--lg{height:85px}\n.c-btn--primary{background:var(--brand-01);border:0;color:var(--text-04)}\n.c-btn--primary:hover{background:var(--brand-hover)}\n.c-btn--primary:active{background:var(--brand-active);box-shadow:var(--shadow-card)}\n.c-btn--secondary{background:var(--bg-card);border:2px solid var(--brand-01);color:var(--brand-01)}\n.c-btn--secondary:hover{border-color:var(--brand-hover);color:var(--brand-hover)}\n.c-btn--secondary:active{border-color:var(--brand-active);color:var(--brand-active);background:var(--brand-04)}\n/* 社群设置按钮：按 2026-10-27 截图实测取色（暂停=橙 / 关闭=红），\n   仅作用于本页按钮，不改全局 --huidou-* / --danger-* 令牌（徽标、荟豆标签仍用原值） */\n.c-btn--huidou{background:#FFF6EE;border:1px solid #F9962B;color:#FD6E00;font-size:var(--fs-sub);border-radius:var(--radius-field)}\n.c-btn--huidou:hover{background:#FFEFDF}\n.c-btn--huidou:active{background:#FFE4CB}\n.c-btn--danger{background:#FEEEEF;border:1px solid #FE5C5A;color:#FC0000;font-size:var(--fs-sub);border-radius:var(--radius-field)}\n.c-btn--danger:hover{background:#FCE3E4}\n.c-btn--danger:active{background:#F9D7D8}\n.c-btn:focus-visible{outline:3px solid var(--focus-ring);outline-offset:3px}\n.c-btn[disabled],.c-btn.is-disabled{background:var(--brand-disabled);border-color:var(--brand-disabled);color:var(--text-04);pointer-events:none}\n.c-btn.is-loading{color:transparent;pointer-events:none}\n.c-btn.is-loading::after{content:\"\";position:absolute;width:26px;height:26px;border:3px solid rgba(255,255,255,.45);border-top-color:#fff;border-radius:50%;animation:c-spin .8s linear infinite}\n@keyframes c-spin{to{transform:rotate(360deg)}}\n\n/* 2.13 底部操作栏 ActionBar */\n.c-actionbar{flex:none;height:107px;padding:0 30px 22px;background:var(--bg-page)}\n.c-actionbar .c-btn{width:100%}\n\n/* ============================================================\n   3. 页面级布局量（沿用稿件绝对尺寸，保证 1:1 版式）\n   ============================================================ */\n.p-card-head{min-height:181px;display:flex;align-items:center;gap:28px;padding:22px 26px}\n.p-card-head .c-head__body{flex:1;min-width:0;display:flex;flex-direction:column;gap:9px}\n.p-card-head .c-head__row{display:flex;align-items:center;gap:16px}\n.p-card-head .c-head__name{font-size:var(--fs-title);line-height:var(--lh-title);font-weight:700;color:var(--text-01)}\n.p-card-head .c-head__meta{font-size:var(--fs-sub);color:var(--text-02)}\n.p-card-head .c-head__meta .sep{color:var(--text-03);margin:0 12px}\n.p-card-head .c-head__slogan{font-size:var(--fs-sub);color:var(--text-02)}\n.p-card-stats{min-height:190px;margin-top:32px;padding:18px 0;display:flex;align-items:center}\n.p-card-stats .c-stats{width:100%}\n.p-card-notice{min-height:203px;margin-top:32px;padding:22px 26px}\n.p-card-notice .c-list{margin-top:14px}\n.p-card-notice .c-cell{min-height:64px}\n.p-card-acts{min-height:520px;margin-top:32px;padding:22px 26px}\n.p-card-acts .c-card__head{margin-bottom:14px}\n.p-card-acts .c-divider{margin:18px 0}\n.p-card-acts .c-act:first-of-type{margin-top:4px}\n.p-card-set{min-height:147px;margin-top:24px;padding:20px 26px}\n.p-setbtns{display:flex;gap:24px;margin-top:18px}\n.p-setbtns .c-btn{flex:1;height:60px;gap:14px}\n/* 二次确认弹窗：沿用 .c-* 组件体系与既有令牌（卡片圆角/阴影、c-btn 按钮系列、焦点环） */\n.c-mask{position:absolute;top:0;right:0;bottom:0;left:0;z-index:20;background:rgba(0,0,0,.45)}\n.c-dialog{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);z-index:21;width:calc(100% - 140px);max-width:640px;background:var(--bg-card);border-radius:var(--radius-card);box-shadow:var(--shadow-card);padding:44px 36px 36px;text-align:center}\n.c-mask[hidden],.c-dialog[hidden]{display:none}\n.c-dialog__title{font-size:var(--fs-title);line-height:var(--lh-title);font-weight:600;color:var(--text-01)}\n.c-dialog__body{margin-top:20px;font-size:var(--fs-sub);line-height:1.5;color:var(--text-01)}\n.c-dialog__actions{display:flex;gap:24px;margin-top:36px}\n.c-dialog__btn{flex:1;height:72px;font-size:var(--fs-sub);border-radius:var(--radius-field)}<\/style>\n<\/head>\n<body>\n\n<a class=\"c-skip-link\" href=\"#main\">跳到主要内容<\/a>\n\n<div class=\"l-page\">\n\n  <!-- 状态栏（装饰性） -->\n  <div class=\"c-statusbar\" aria-hidden=\"true\">\n    <span class=\"c-statusbar__time\">9:41<\/span>\n    <span class=\"c-statusbar__icons\">\n      <svg width=\"40\" height=\"26\" viewBox=\"0 0 40 26\" fill=\"none\" focusable=\"false\"><rect x=\"0\" y=\"16\" width=\"6\" height=\"10\" rx=\"1.5\" fill=\"#303133\"/><rect x=\"9\" y=\"11\" width=\"6\" height=\"15\" rx=\"1.5\" fill=\"#303133\"/><rect x=\"18\" y=\"6\" width=\"6\" height=\"20\" rx=\"1.5\" fill=\"#303133\"/><rect x=\"27\" y=\"1\" width=\"6\" height=\"25\" rx=\"1.5\" fill=\"#303133\"/><\/svg>\n      <svg width=\"34\" height=\"26\" viewBox=\"0 0 34 26\" fill=\"none\" focusable=\"false\"><path d=\"M17 22.5l4.8-5.6a7.6 7.6 0 0 0-9.6 0L17 22.5z\" fill=\"#303133\"/><path d=\"M9.4 13.7a11.6 11.6 0 0 1 15.2 0\" stroke=\"#303133\" stroke-width=\"2.6\" stroke-linecap=\"round\"/><path d=\"M5 9a17.6 17.6 0 0 1 24 0\" stroke=\"#303133\" stroke-width=\"2.6\" stroke-linecap=\"round\"/><\/svg>\n      <svg width=\"52\" height=\"26\" viewBox=\"0 0 52 26\" fill=\"none\" focusable=\"false\"><rect x=\"1\" y=\"1\" width=\"42\" height=\"24\" rx=\"7\" stroke=\"#303133\" stroke-opacity=\".4\" stroke-width=\"2\"/><rect x=\"4\" y=\"4\" width=\"33\" height=\"18\" rx=\"4\" fill=\"#303133\"/><path d=\"M46 9v8a4.5 4.5 0 0 0 0-8z\" fill=\"#303133\" fill-opacity=\".5\"/><\/svg>\n    <\/span>\n  <\/div>\n\n  <!-- 导航栏 Navbar/black -->\n  <header class=\"c-navbar\">\n    <button class=\"c-iconbtn c-navbar__back\" type=\"button\" aria-label=\"返回上一页\">\n      <svg width=\"24\" height=\"40\" viewBox=\"0 0 25 42\" fill=\"none\" aria-hidden=\"true\" focusable=\"false\"><path d=\"M22 4L4 21l18 17\" stroke=\"#303133\" stroke-width=\"4.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><\/svg>\n    <\/button>\n    <h1 class=\"c-navbar__title\">招商玺社群管理<\/h1>\n  <\/header>\n\n  <main class=\"l-main\" id=\"main\">\n\n    <!-- 卡片1：社群头部 -->\n    <section class=\"c-card p-card-head\" aria-labelledby=\"community-name\">\n      <span class=\"c-avatar\" role=\"img\" aria-label=\"社群头像占位图\"><\/span>\n      <span class=\"c-head__body\">\n        <span class=\"c-head__row\">\n          <span class=\"c-head__name\" id=\"community-name\">招商玺飞盘社<\/span>\n          <span class=\"c-tag c-tag--success\">运营中<\/span>\n          <span class=\"c-tag c-tag--success\" title=\"统一审核状态机：待审核 / 审核中 / 已通过 / 已驳回\">已通过<\/span>\n        <\/span>\n        <span class=\"c-head__meta\">112 位成员<span class=\"sep\" aria-hidden=\"true\">｜<\/span>累计活动 3 场<span class=\"sep\" aria-hidden=\"true\">｜<\/span>创建于2024.03.15<\/span>\n        <span class=\"c-head__slogan\">一起运动，一起快乐！<\/span>\n      <\/span>\n      <button class=\"c-iconbtn\" type=\"button\" aria-label=\"查看社群资料\">\n        <svg width=\"18\" height=\"32\" viewBox=\"0 0 20 34\" fill=\"none\" aria-hidden=\"true\" focusable=\"false\"><path d=\"M3 3l14 14L3 31\" stroke=\"#909399\" stroke-width=\"3.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><\/svg>\n      <\/button>\n    <\/section>\n\n    <!-- 卡片2：快捷入口 -->\n    <section class=\"c-card p-card-stats\" aria-label=\"社群快捷管理入口\">\n      <ul class=\"c-stats\">\n        <li>\n          <button class=\"c-stat
