<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>主理人原型 · 合并串讲版</title>
<style>
  :root{--bg:#1c2130;--bar:#262c3f;--txt:#e8ebf4;--sub:#9aa3ba;--pri:#4f7cff;--line:#3a4258}
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%}
  body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--txt);display:flex;flex-direction:column;overflow:hidden}
  header{height:52px;flex-shrink:0;background:var(--bar);display:flex;align-items:center;padding:0 16px;gap:12px;border-bottom:1px solid var(--line)}
  header h1{font-size:15px;font-weight:600;letter-spacing:.5px}
  header .crumb{font-size:12.5px;color:var(--sub);flex:1;display:flex;align-items:center;gap:6px;min-width:0}
  header .crumb .cur{color:#fff;background:var(--pri);padding:2px 12px;border-radius:999px;font-weight:500;white-space:nowrap}
  header .toc-btn{background:var(--pri);color:#fff;border:none;border-radius:8px;padding:7px 14px;font-size:13px;cursor:pointer;font-weight:500}
  header .toc-btn:active{opacity:.85}
  #stage{flex:1;position:relative;display:flex;justify-content:center;background:
    radial-gradient(ellipse at 50% 0%,#2b3348 0%,var(--bg) 60%)}
  #frames{width:100%;max-width:430px;height:100%;position:relative;box-shadow:0 0 0 1px var(--line),0 12px 40px rgba(0,0,0,.45)}
  .page-frame{position:absolute;inset:0;width:100%;height:100%;border:none;background:#fff;display:none}
  .page-frame.on{display:block}
  #mask{position:fixed;inset:0;background:rgba(10,13,22,.55);opacity:0;pointer-events:none;transition:opacity .2s;z-index:40}
  #mask.on{opacity:1;pointer-events:auto}
  #toc{position:fixed;top:52px;right:0;bottom:0;width:288px;background:#222839;border-left:1px solid var(--line);z-index:50;transform:translateX(105%);transition:transform .22s;overflow-y:auto;padding:18px 0 30px}
  #toc.on{transform:none}
  #toc h2{font-size:13px;color:var(--sub);font-weight:600;padding:14px 20px 8px;letter-spacing:1px}
  #toc .item{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:none;border:none;color:var(--txt);font-size:14px;padding:11px 20px;cursor:pointer;font-family:inherit}
  #toc .item:hover{background:#2b3247}
  #toc .item.on{background:#313a55;color:#fff}
  #toc .item .no{display:inline-flex;align-items:center;justify-content:center;min-width:22px;height:22px;border-radius:6px;background:#39415c;color:#c6cee4;font-size:11.5px;font-weight:600}
  #toc .item.on .no{background:var(--pri);color:#fff}
  #toc .tip{margin:14px 20px 0;padding:12px 14px;background:#2b3247;border-radius:10px;font-size:12px;color:var(--sub);line-height:1.7}
  #toc .tip b{color:#c6cee4}
</style>
</head>
<body>
<header>
  <h1>主理人原型 · 合并串讲版</h1>
  <div class="crumb">当前页面：<span class="cur" id="cur">主理人中心</span></div>
  <button class="toc-btn" id="toc-open">页面目录</button>
</header>
<div id="stage"><div id="frames"></div></div>
<div id="mask"></div>
<nav id="toc"></nav>
<script>
var PAGES={
  "p1": {
    "title": "主理人中心",
    "html": "<!DOCTYPE html>\n<html lang=\"zh-CN\">\n<head>\n<meta charset=\"UTF-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n<meta name=\"theme-color\" content=\"#387DEC\">\n<title>主理人中心<\/title>\n<style>\n/* ================================================================\n   设计令牌（§1 色彩 / §2 字体 / §3 圆角 / §4 阴影 / §0 4px 栅格）\n   ================================================================ */\n:root{\n  /* §1 色彩 —— document.sharedSwatches */\n  --brand-01:#387DEC;   /* Brand01 常规 Default */\n  --brand-02:#0855D1;   /* Brand02 点击 Pressed */\n  --brand-03:#9BBEF5;   /* Brand03 一般禁用 Disabled */\n  --brand-04:#E0ECFF;   /* Brand04 文字禁用 / Tag 蓝底 */\n  --text-01:#303133;    /* Text01 强调·正文标题 */\n  --text-02:#909399;    /* Text02 次强调·正文次要·图标描边 */\n  --text-03:#C0C4CC;    /* Text03 置灰·禁用信息 */\n  --text-04:#FFFFFF;    /* Text04 纯白文字 */\n  --line-01:#EBEBEB;    /* Line01 分割线 */\n  --bg-page:#F2F5F7;    /* 页面背景 */\n  --success-01:#10A17C; /* Success01 成功 */\n  --success-02:#E6F7F2; /* Success02 成功浅底 / Tag 绿底 */\n  --huidou-01:#F76346;  /* huidou01 荟豆主题色 */\n  --huidou-02:#FFE7E6;  /* huidou02 荟豆浅底 / Tag 荟豆底 */\n  --danger:#EB4A38;     /* Danger 错误态 */\n  /* §1 派生值（标准未定义，按组件库惯例派生） */\n  --brand-01-hover:#2C71DE;\n  --danger-bg:#FDECEA;\n  --row-hover:#FAFBFC;      /* §6 Hover 可点行底 */\n  --fill-disabled:#F7F8FA;  /* §6 Disabled 输入类背景 */\n  --focus-ring:0 0 0 2px rgba(56,125,236,.24);\n  --mask:rgba(0,0,0,.45);       /* §7-2 派生：弹层遮罩底 */\n  /* §2 字体 */\n  --font-cn:\"PingFang SC\",\"苹方-简\",-apple-system,BlinkMacSystemFont,\"Helvetica Neue\",sans-serif;\n  --font-num:\"Source Han Sans SC\",\"思源黑体\",\"PingFang SC\",-apple-system,BlinkMacSystemFont,sans-serif;\n  --fs-xl:18px; --fs-lg:16px; --fs-md:14px; --fs-sm:12px; --fs-xs:10px;\n  --lh-title:1.3; --lh-body:1.4; --lh-num:1.2;\n  /* §3 圆角 */\n  --r-pill:22px; --r-sheet:16px; --r-card:12px; --r-ctl:8px; --r-tag:2px;\n  /* §4 阴影 / 分隔 */\n  --sh-card:0 1px 6px rgba(0,0,0,.02);\n  --sh-sheet:0 -2px 16px rgba(0,0,0,.08);\n  /* §0 间距栅格 */\n  --sp-1:4px; --sp-2:8px; --sp-3:12px; --sp-4:16px; --sp-5:20px; --sp-6:24px; --sp-8:32px;\n}\n/* ================================================================\n   基础重置\n   ================================================================ */\n*,*::before,*::after{box-sizing:border-box;}\nhtml{-webkit-text-size-adjust:100%;}\nbody{margin:0;padding:0;background:var(--bg-page);font-family:var(--font-cn);font-size:var(--fs-md);\n  line-height:var(--lh-body);color:var(--text-01);-webkit-font-smoothing:antialiased;\n  -webkit-tap-highlight-color:transparent;}\nh1,h2,h3,h4,h5,h6{margin:0;font-size:inherit;font-weight:600;line-height:var(--lh-title);}\np{margin:0;}\nul,ol{margin:0;padding:0;list-style:none;}\nbutton{font-family:inherit;font-size:inherit;color:inherit;background:none;border:0;margin:0;padding:0;cursor:pointer;}\nimg,svg{display:block;}\n/* 数字 / 金额（§2、§8.3） */\n.nsk-num{font-family:var(--font-num);font-variant-numeric:tabular-nums;line-height:var(--lh-num);}\n/* ================================================================\n   通用组件\n   ================================================================ */\n/* 页面容器 / 状态栏 / 导航栏（§5） */\n.nsk-page{position:relative;max-width:390px;margin:0 auto;background:var(--bg-page);padding-bottom:var(--sp-2);}\n.nsk-statusbar{display:flex;align-items:center;justify-content:space-between;padding:var(--sp-2) var(--sp-6) var(--sp-1);color:var(--text-01);}\n.nsk-statusbar__time{font-size:var(--fs-lg);font-weight:600;}\n.nsk-statusbar__icons{display:flex;align-items:center;gap:var(--sp-1);}\n.nsk-navbar{display:flex;align-items:center;justify-content:space-between;gap:var(--sp-2);padding:var(--sp-2) var(--sp-4);}\n.nsk-navbar__title{font-size:var(--fs-xl);font-weight:600;color:var(--text-01);}\n/* 图标（§8.2） */\n.nsk-icon{color:inherit;}\n.nsk-icon--inv{fill:var(--text-04);stroke:var(--text-04);}\n.nsk-icon--inv-stroke{fill:none;stroke:var(--text-04);}\n.nsk-ico--brand{color:var(--brand-01);}\n.nsk-ico--success{color:var(--success-01);}\n.nsk-ico--huidou{color:var(--huidou-01);}\n.nsk-ico--muted{color:var(--text-02);}\n.nsk-ico--on-brand{color:var(--text-04);}\n/* 按钮（§5 Button 702×88 → 高 44 / 圆角 22 / 文字 16 Semibold） */\n.nsk-btn{display:inline-flex;align-items:center;justify-content:center;gap:var(--sp-1);\n  min-height:44px;padding:0 var(--sp-6);border-radius:var(--r-pill);\n  font-size:var(--fs-lg);font-weight:600;line-height:1;border:1px solid transparent;\n  transition:background-color .15s,border-color .15s,color .15s,box-shadow .15s,opacity .15s;}\n.nsk-btn:focus{outline:none;}\n.nsk-btn:focus-visible{box-shadow:var(--focus-ring);}\n.nsk-btn--primary{background:var(--brand-01);color:var(--text-04);}\n.nsk-btn--primary:hover{background:var(--brand-01-hover);}\n.nsk-btn--primary:active{background:var(--brand-02);transform:scale(.98);}\n.nsk-btn--secondary{background:transparent;border-color:var(--brand-01);color:var(--brand-01);}\n.nsk-btn--secondary:hover{border-color:var(--brand-01-hover);color:var(--brand-01-hover);}\n.nsk-btn--secondary:active{border-color:var(--brand-02);color:var(--brand-02);transform:scale(.98);}\n.nsk-btn--ghost-white{background:var(--text-04);color:var(--brand-01);}\n.nsk-btn--ghost-white:hover{background:var(--brand-04);color:var(--brand-01-hover);}\n.nsk-btn--ghost-white:active{background:var(--brand-04);color:var(--brand-02);transform:scale(.98);}\n.nsk-btn--link{min-height:32px;padding:0 var(--sp-2);border-radius:var(--r-ctl);\n  font-size:var(--fs-sm);font-weight:400;color:var(--text-02);}\n.nsk-btn--link:hover{background:var(--row-hover);color:var(--brand-01-hover);}\n.nsk-btn--link:active{color:var(--brand-02);}\n.nsk-btn--more{min-height:32px;padding:0 var(--sp-1);border-radius:var(--r-ctl);\n  font-size:var(--fs-md);font-weight:400;color:var(--text-02);}\n.nsk-btn--more:hover{color:var(--brand-01-hover);}\n.nsk-btn--more:active{color:var(--brand-02);}\n.nsk-btn--sm{min-height:32px;padding:0 var(--sp-3);font-size:var(--fs-sm);}\n.nsk-btn--block{display:flex;width:100%;}\n.nsk-btn[disabled],.nsk-btn.is-disabled{cursor:not-allowed;pointer-events:none;}\n.nsk-btn--primary[disabled],.nsk-btn--primary.is-disabled{background:var(--brand-03);color:var(--text-04);}\n.nsk-btn--secondary[disabled],.nsk-btn--secondary.is-disabled{border-color:var(--line-01);color:var(--text-03);}\n.nsk-btn.is-loading{pointer-events:none;opacity:.7;}\n.nsk-btn__spinner{width:14px;height:14px;border-radius:50%;border:2px solid currentColor;\n  border-top-color:transparent;animation:nsk-spin .6s linear infinite;}\n@keyframes nsk-spin{to{transform:rotate(360deg);}}\n/* 标签（§5 Tag：蓝 #E0ECFF/#387DEC、绿 #E6F7F2/#10A17C、荟豆 #FFE7E6/#F76346） */\n.nsk-tag{display:inline-flex;align-items:center;height:20px;padding:0 var(--sp-1);\n  border-radius:var(--r-tag);font-size:var(--fs-sm);font-weight:400;line-height:1;white-space:nowrap;}\n.nsk-tag--blue{background:var(--brand-04);color:var(--brand-01);}\n.nsk-tag--green{background:var(--success-02);color:var(--success-01);}\n.nsk-tag--huidou{background:var(--huidou-02);color:var(--huidou-01);}\n.nsk-tag--grey{background:var(--bg-page);color:var(--text-02);}\n/* 卡片（§5 卡片组：圆角 12、--sh-card、1px 白描边 / 渐变底） */\n.nsk-card{background:var(--text-04);border-radius:var(--r-card);padding:var(--sp-3);\n  box-shadow:var(--sh-card);border:1px solid var(--text-04);}\n.nsk-section{padding:var(--sp-3) var(--sp-4) var(--sp-2);}\n.nsk-section__head{display:flex;align-items:center;justify-content:space-between;gap:var(--sp-2);\n  padding:0;margin-bottom:var(--sp-1);}\n.nsk-section__title{font-size:var(--fs-lg);font-weight:600;color:var(--text-01);}\n/* 列表（§8.2） */\n.nsk-list__item{position:relative;}\n.nsk-list__action{position:absolute;inset:0;width:100%;height:100%;border-radius:var(--r-card);}\n.nsk-list__action:focus{outline:none;}\n.nsk-list__action:focus-visible{box-shadow:var(--focus-ring);}\n.nsk-list__arrow{color:var(--text-03);}\n/* 分割线（§5 分割线 1px #EBEBEB） */\n.nsk-divider{height:1px;background:var(--line-01);border:0;margin:0;}\n/* 表单（§6 状态） */\n.nsk-field__control{width:100%;min-height:44px;padding:var(--sp-2) var(--sp-3);border:1px solid var(--line-01);\n  border-radius:var(--r-ctl);background:var(--text-04);font-family:inherit;font-size:var(--fs-md);\n  color:var(--text-01);line-height:var(--lh-body);resize:none;\n  transition:background-color .15s,border-color .15s,color .15s,box-shadow .15s,opacity .15s;}\n.nsk-field__control::placeholder{color:var(--text-03);}\n.nsk-field__control:hover{border-color:var(--brand-03);}\n.nsk-field__control:focus{outline:none;border-color:var(--brand-01);box-shadow:var(--focus-ring);}\n.nsk-field__control[disabled],.nsk-field__control.is-disabled{background:var(--fill-disabled);color:var(--text-03);}\n.nsk-field__control.is-error,.nsk-field__control[aria-invalid=\"true\"]{border-color:var(--danger);}\n.nsk-field__error{display:block;margin-top:var(--sp-1);font-size:var(--fs-sm);color:var(--danger);}\n/* 弹层（§3 --r-sheet / §4 --sh-sheet） */\n.nsk-sheet{position:fixed;left:50%;bottom:0;transform:translateX(-50%);width:100%;max-width:390px;\n  background:var(--text-04);border-radius:var(--r-sheet) var(--r-sheet) 0 0;box-shadow:var(--sh-sheet);\n  padding:var(--sp-4) var(--sp-4) var(--sp-6);z-index:9;}\n.nsk-mask{position:fixed;inset:0;z-index:8;background:var(--mask);}\n.nsk-mask[hidden],.nsk-sheet[hidden],[hidden]{display:none !important;}\n.nsk-sheet__head{display:flex;align-items:center;justify-content:space-between;gap:var(--sp-2);margin-bottom:var(--sp-2);}\n.nsk-sheet__title{font-size:var(--fs-lg);font-weight:600;color:var(--text-01);}\n.nsk-sheet__close{min-height:32px;padding:0 var(--sp-2);border-radius:var(--r-ctl);\n  font-size:var(--fs-sm);font-weight:400;color:var(--text-02);\n  transition:background-color .15s,border-color .15s,color .15s,box-shadow .15s,opacity .15s;}\n.nsk-sheet__close:hover{background:var(--row-hover);color:var(--text-01);}\n.nsk-sheet__close:focus{outline:none;}\n.nsk-sheet__close:focus-visible{box-shadow:var(--focus-ring);}\n.nsk-sheet__close:active{color:var(--brand-02);}\n/* 状态类（§6） */\n.is-selected,.nsk-btn[aria-selected=\"true\"],.nsk-btn[aria-pressed=\"true\"]{color:var(--brand-01);}\n.is-loading{pointer-events:none;opacity:.7;}\n.is-error{color:var(--danger);}\n.is-disabled{cursor:not-allowed;pointer-events:none;}\n.nsk-sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;}\n/* 占位块（§7-3） */\n.nsk-thumb{display:block;background:var(--brand-04);}\n/* ================================================================\n   本页面局部样式\n   ================================================================ */\n/* 顶部 Banner */\n.nsk-banner{display:flex;margin:0 var(--sp-4);border-radius:var(--r-sheet);overflow:hidden;position:relative;\n  background:linear-gradient(100deg,var(--brand-01) 0%,var(--brand-02) 100%);}\n.nsk-banner__main{flex:1;padding:var(--sp-3) 0 var(--sp-3) var(--sp-3);position:relative;z-index:2;}\n.nsk-banner__title{font-size:var(--fs-xl);font-weight:600;color:var(--text-04);letter-spacing:1px;}\n.nsk-banner__desc{margin-top:var(--sp-1);font-size:var(--fs-sm);color:var(--text-04);opacity:.92;}\n.nsk-banner__stats{display:flex;align-items:center;margin-top:var(--sp-3);}\n.nsk-banner__stat-txt{margin-left:var(--sp-2);font-size:var(--fs-xs);color:var(--text-04);opacity:.95;}\n.nsk-banner__photo{width:44%;min-height:128px;}\n/* 头像组 */\n.nsk-avatars{display:flex;}\n.nsk-avatar{display:block;width:18px;height:18px;border-radius:50%;border:1px solid var(--text-04);margin-right:-6px;}\n.nsk-avatar--1{background:var(--brand-03);}\n.nsk-avatar--2{background:var(--brand-01);}\n.nsk-avatar--3{background:var(--huidou-01);}\n.nsk-avatars--mini .nsk-avatar{width:22px;height:22px;margin-right:0;margin-left:-7px;}\n/* 轮播指示器 */\n.nsk-carousel__dots{position:absolute;right:var(--sp-3);bottom:var(--sp-3);display:flex;gap:var(--sp-1);z-index:3;}\n.nsk-carousel__dot{width:6px;height:6px;padding:0;border-radius:var(--r-tag);background:var(--text-04);opacity:.5;\n  transition:background-color .15s,opacity .15s,box-shadow .15s,width .15s;}\n.nsk-carousel__dot:hover{opacity:.8;}\n.nsk-carousel__dot:focus{outline:none;}\n.nsk-carousel__dot:focus-visible{box-shadow:var(--focus-ring);}\n.nsk-carousel__dot[aria-selected=\"true\"]{width:12px;opacity:1;}\n/* 常用操作 */\n.nsk-ops{display:flex;gap:var(--sp-2);}\n.nsk-opcard{position:relative;overflow:hidden;border-radius:var(--r-card);padding:var(--sp-3);\n  box-shadow:var(--sh-card);border:1px solid var(--text-04);background:var(--text-04)}\n.nsk-opcard--wide{flex:2.3 1 0;min-width:0;background:linear-gradient(180deg,var(--brand-04) 0%,var(--text-04) 100%);}\n.nsk-opcard--wide .nsk-opcard__title,.nsk-opcard--wide .nsk-opcard__desc{padding-right:72px;}\n.nsk-opcard--mini{flex:1 1 0;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:space-between;\n  gap:var(--sp-2);padding:var(--sp-3) 6px var(--sp-2);background:var(--text-04);\n  transition:background-color .15s,border-color .15s,color .15s,box-shadow .15s,opacity .15s;}\n.nsk-opcard--mini:hover{background:var(--row-hover);}\n.nsk-opcard--mini:focus{outline:none;}\n.nsk-opcard--mini:focus-visible{box-shadow:var(--focus-ring);}\n.nsk-opcard--mini:active{background:var(--brand-04);}\n.nsk-opcard__title{font-size:var(--fs-lg);font-weight:600;color:var(--text-01);}\n.nsk-opcard__desc{margin-top:var(--sp-1);font-size:var(--fs-sm);color:var(--text-02);}\n.nsk-opcard__cta{margin-top:var(--sp-2);}\n.nsk-opcard__illus{position:absolute;right:var(--sp-3);top:50%;transform:translateY(-50%);width:64px;height:64px;border-radius:16px;}\n.nsk-opcard__icon{display:block;width:36px;height:36px;border-radius:var(--r-card);}\n.nsk-opcard__icon--cal{background:linear-gradient(135deg,var(--success-01) 0%,var(--success-02) 100%);}\n.nsk-opcard__icon--people{background:linear-gradient(135deg,var(--brand-01) 0%,var(--success-01) 100%);}\n.nsk-opcard__label{font-size:clamp(11px,3.6vw,14px);font-weight:600;color:var(--text-01);white-space:nowrap;}\n@media (max-width:359px){\n  .nsk-opcard__icon{width:30px;height:30px;}\n  .nsk-opcard--wide .nsk-opcard__title,.nsk-opcard--wide .nsk-opcard__desc{padding-right:60px;}\n  .nsk-opcard__illus{width:54px;height:54px;}\n}\n/* 我的身份 */\n.nsk-identity__top{display:flex;align-items:center;gap:var(--sp-3);}\n.nsk-identity__avatar{display:flex;align-items:center;justify-content:center;width:40px;height:40px;\n  border-radius:50%;flex-shrink:0;background:linear-gradient(135deg,var(--success-02) 0%,var(--brand-04) 100%);}\n.nsk-identity__name{font-size:var(--fs-xl);font-weight:600;color:var(--text-01);display:flex;align-items:center;gap:var(--sp-2);}\n.nsk-identity__slogan{margin-top:var(--sp-1);font-size:var(--fs-sm);color:var(--text-02);\n  display:flex;align-items:center;gap:var(--sp-2);}\n.nsk-stats{display:flex;margin-top:var(--sp-3);}\n.nsk-stats__item{flex:1;display:flex;align-items:center;gap:var(--sp-2);}\n.nsk-stats__item + .nsk-stats__item{border-left:1px solid var(--line-01);padding-left:var(--sp-2);}\n.nsk-stats__body{display:flex;flex-direction:column;}\n.nsk-stats__value{font-size:var(--fs-xl);font-weight:700;}\n.nsk-stats__label{margin-top:2px;font-size:var(--fs-xs);color:var(--text-02);}\n.nsk-identity__cash{display:flex;align-items:center;justify-content:space-between;gap:var(--sp-2);\n  margin-top:var(--sp-3);padding-top:var(--sp-2);border-top:1px dashed var(--line-01);}\n.nsk-identity__cash-left{display:flex;align-items:center;gap:var(--sp-2);}\n.nsk-identity__coin{display:flex;align-items:center;justify-content:center;width:28px;height:28px;\n  border-radius:50%;flex-shrink:0;font-size:var(--fs-lg);font-weight:700;color:var(--text-04);\n  background:linear-gradient(135deg,var(--huidou-01) 0%,var(--huidou-02) 100%);}\n.nsk-identity__amount{font-size:var(--fs-xl);font-weight:700;color:var(--text-01);}\n.nsk-identity__sub{margin-top:2px;font-size:var(--fs-sm);color:var(--text-02);}\n/* 我创建的社群 */\n.nsk-list--card{margin:0;padding:var(--sp-1) var(--sp-3);background:var(--text-04);\n  border-radius:var(--r-card);box-shadow:var(--sh-card);border:1px solid var(--text-04);}\n.nsk-list__item--row{display:flex;align-items:center;gap:var(--sp-2);padding:var(--sp-2) 0;}\n.nsk-list__item--row + .nsk-list__item--row{border-top:1px solid var(--line-01);}\n.nsk-list__item--row:hover{background:var(--row-hover);}\n.nsk-list__thumb{width:44px;height:44px;border-radius:50%;flex-shrink:0;}\n.nsk-list__body{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px;}\n.nsk-list__title{font-size:var(--fs-lg);font-weight:600;color:var(--text-01);display:flex;align-items:center;gap:var(--sp-1);}\n.nsk-list__meta{font-size:var(--fs-sm);color:var(--text-02);}\n.nsk-list__extra{display:flex;align-items:center;gap:var(--sp-2);}\n/* 我发布的活动 */\n.nsk-panel{background:var(--text-04);border-radius:var(--r-card);box-shadow:var(--sh-card);\n  border:1px solid var(--text-04);padding:0 0 var(--sp-2);}\n.nsk-tabs{display:flex;gap:var(--sp-6);padding:var(--sp-2) var(--sp-4) 0;}\n.nsk-tabs__item{position:relative;min-height:32px;padding:0 0 var(--sp-2);font-size:var(--fs-md);\n  font-weight:400;color:var(--text-02);border-radius:var(--r-tag);\n  transition:background-color .15s,border-color .15s,color .15s,box-shadow .15s,opacity .15s;}\n.nsk-tabs__item:hover{color:var(--brand-01-hover);}\n.nsk-tabs__item:focus{outline:none;}\n.nsk-tabs__item:focus-visible{box-shadow:var(--focus-ring);}\n.nsk-tabs__item:active{color:var(--brand-02);}\n.nsk-tabs__item[aria-selected=\"true\"]{color:var(--brand-01);font-weight:600;}\n.nsk-tabs__item[aria-selected=\"true\"]::after{content:\"\";position:absolute;left:50%;transform:translateX(-50%);\n  bottom:var(--sp-1);width:30px;height:3px;border-radius:var(--r-tag);background:var(--brand-01);}\n.nsk-note{padding:var(--sp-1) var(--sp-4);font-size:var(--fs-sm);color:var(--text-02);}\n.nsk-list--stack{display:flex;flex-direction:column;gap:var(--sp-2);padding:0 var(--sp-3) var(--sp-1);}\n.nsk-act{display:flex;gap:var(--sp-2);padding:var(--sp-2);border:1px solid var(--line-01);\n  border-radius:var(--r-card);background:var(--text-04);box-shadow:var(--sh-card)}\n.nsk-act__photo{width:60px;height:80px;border-radius:var(--r-ctl);flex-shrink:0;}\n.nsk-act__body{flex:1;min-width:0;}\n.nsk-act__head{display:flex;align-items:center;gap:var(--sp-2);}\n.nsk-act__title{font-size:var(--fs-lg);font-weight:600;color:var(--text-01);}\n.nsk-act__date{display:block;margin-top:var(--sp-1);font-size:var(--fs-sm);color:var(--text-02);}\n.nsk-act__nums{display:flex;align-items:center;margin-top:var(--sp-2);}\n.nsk-act__num{flex:1;display:flex;align-items:center;gap:var(--sp-1);min-width:0;}\n.nsk-act__num + .nsk-act__num{margin-left:var(--sp-1);}\n.nsk-act__num-body{display:flex;flex-direction:column;min-width:0;}\n.nsk-act__num-ic{width:18px;height:18px;border-radius:var(--r-ctl);flex-shrink:0;}\n.nsk-act__num-v{font-size:var(--fs-md);font-weight:700;color:var(--text-01);white-space:nowrap;}\n.nsk-act__num-v.is-sm{font-size:var(--fs-sm);}   /* 长金额 12px */\n.nsk-act__num-v.is-xs{font-size:var(--fs-xs);}   /* 超长金额 10px */\n.nsk-act__num-l{margin-top:2px;font-size:var(--fs-xs);color:var(--text-02);white-space:nowrap;}\n/* 金额列（每行最后一个统计项）：右侧独立列、右对齐，不参与等分，可容纳更长金额 */\n.nsk-act__num:last-child{flex:0 0 auto;margin-left:var(--sp-3);justify-content:flex-end;}\n.nsk-act__num:last-child .nsk-act__num-body{align-items:flex-end;}\n/* —— 活动报名提醒（第六轮新增：列表内提醒条 + 报名明细弹层）—— */\n.nsk-act__alert{position:relative;z-index:2;display:flex;align-items:center;gap:var(--sp-1);\n  width:100%;min-height:28px;margin-top:var(--sp-2);padding:var(--sp-1) var(--sp-2);\n  border-radius:var(--r-ctl);background:var(--brand-04);color:var(--brand-01);text-align:left;\n  transition:background-color .15s,border-color .15s,color .15s,box-shadow .15s,opacity .15s;}\n.nsk-act__alert:hover{color:var(--brand-01-hover);}\n.nsk-act__alert:focus{outline:none;}\n.nsk-act__alert:focus-visible{box-shadow:var(--focus-ring);}\n.nsk-act__alert:active{color:var(--brand-02);}\n.nsk-act__alert-ic{width:14px;height:14px;flex:0 0 auto;}\n.nsk-act__alert-txt{flex:1;min-width:0;font-size:var(--fs-sm);font-weight:600;line-height:var(--lh-body);\n  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}\n.nsk-act__alert-dot{width:6px;height:6px;flex:0 0 auto;border-radius:50%;background:var(--danger);\n  animation:nsk-blink 1.6s ease-in-out infinite;}\n@keyframes nsk-blink{0%,100%{opacity:1;}50%{opacity:.25;}}\n.nsk-act__alert-cta{flex:0 0 auto;font-size:var(--fs-sm);font-weight:600;}\n.nsk-act__alert-cta--read{display:none;}\n/* 已读：提醒条转灰、红点与「查看」隐藏、显示「已查看」 */\n.nsk-act__alert.is-read{background:var(--fill-disabled);color:var(--text-02);}\n.nsk-act__alert.is-read .nsk-act__alert-dot{display:none;animation:none;}\n.nsk-act__alert.is-read .nsk-act__alert-cta--new{display:none;}\n.nsk-act__alert.is-read .nsk-act__alert-cta--read{display:inline;}\n/* 报名明细（弹层内容） */\n.nsk-sg__sub{margin-bottom:var(--sp-2);font-size:var(--fs-sm);color:var(--text-02);}\n.nsk-sg__list{display:flex;flex-direction:column;gap:var(--sp-1);max-height:200px;overflow-y:auto;}\n.nsk-sg__row{display:flex;align-items:center;gap:var(--sp-2);padding:var(--sp-2);\n  border:1px solid var(--line-01);border-radius:var(--r-card);background:var(--text-04);}\n.nsk-sg__avatar{width:32px;height:32px;flex:0 0 auto;border-radius:50%;}\n.nsk-sg__avatar--1{background:linear-gradient(135deg,var(--brand-01) 0%,var(--brand-03) 100%);}\n.nsk-sg__avatar--2{background:linear-gradient(135deg,var(--success-01) 0%,var(--success-02) 100%);}\n.nsk-sg__avatar--3{background:linear-gradient(135deg,var(--huidou-01) 0%,var(--huidou-02) 100%);}\n.nsk-sg__body{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px;}\n.nsk-sg__name{font-size:var(--fs-md);font-weight:600;color:var(--text-01);}\n.nsk-sg__meta{font-size:var(--fs-sm);color:var(--text-02);}\n.nsk-sg__amt{flex:0 0 auto;font-size:var(--fs-md);font-weight:700;color:var(--text-01);}\n.nsk-sg__note{margin-top:var(--sp-2);font-size:var(--fs-sm);color:var(--text-02);}\n.nsk-sheet__btns{display:flex;gap:var(--sp-2);margin-top:var(--sp-3);}\n.nsk-sheet__btns .nsk-btn{flex:1;}\n@media (max-width:359px){\n  /* 超窄屏（≤359）：提醒条收 padding，隐藏右侧 CTA，优先保证「N 位会员刚刚报名」完整可读 */\n  .nsk-act__alert{padding:var(--sp-1);}\n  .nsk-act__alert-cta--new,.nsk-act__alert.is-read .nsk-act__alert-cta--read{display:none;}\n  /* 超窄屏：弹层双按钮收横向 padding 并禁止换行，避免「查看全部报名 ›」折行 */\n  .nsk-sheet__btns{gap:var(--sp-1);}\n  .nsk-sheet__btns .nsk-btn{padding:0 var(--sp-2);white-space:nowrap;}\n}\n/* 占位图（§7-3：纯色 / 渐变块，主色落在 token 上） */\n.nsk-thumb--party{background:linear-gradient(135deg,var(--success-01) 0%,var(--text-01) 100%);}\n.nsk-thumb--scan{background:linear-gradient(135deg,var(--brand-03) 0%,var(--brand-04) 100%);}\n.nsk-thumb--frisbee{background:linear-gradient(135deg,var(--success-02) 0%,var(--success-01) 100%);}\n.nsk-thumb--night{background:linear-gradient(135deg,var(--brand-02) 0%,var(--text-01) 100%);}\n.nsk-thumb--dusk{background:linear-gradient(135deg,var(--huidou-01) 0%,var(--text-01) 100%);}\n.nsk-thumb--festival{background:linear-gradient(135deg,var(--danger) 0%,var(--text-01) 100%);}\n/* ================================================================\n   页面状态原型（依据 PRD 状态表：默认未认证/审核中/加载/空态/异常/禁用）\n   切换方式：.nsk-page[data-state]（默认无值 = 已认证），由画布顶部状态条驱动；\n   仅做显隐与补充模块，不改动已认证态的任何既有结构\n   ================================================================ */\n.nsk-identity--unverified,.nsk-identity--reviewing,\n.nsk-empty,.nsk-skelbox,.nsk-errorsec,.nsk-bannote{display:none;}\n/* —— 骨架屏（加载态）—— */\n.nsk-skel{overflow:hidden;border-radius:var(--r-ctl);\n  background:linear-gradient(90deg,#EFF2F6 25%,#E4EAF2 37%,#EFF2F6 63%);\n  background-size:400% 100%;animation:nsk-shimmer 1.2s ease infinite;}\n@keyframes nsk-shimmer{from{background-position:100% 0;}to{background-position:-100% 0;}}\n.nsk-skelbox{flex-direction:column;gap:var(--sp-2);padding:0 var(--sp-3) var(--sp-1);}\n.nsk-skelbox--comm{padding:0;}\n.nsk-skelrow{display:flex;align-items:center;gap:var(--sp-2);padding:var(--sp-2);\n  background:var(--text-04);border:1px solid var(--text-04);border-radius:var(--r-card);box-shadow:var(--sh-card);}\n.nsk-skel--circ{width:44px;height:44px;border-radius:50%;flex-shrink:0;}\n.nsk-skel--photo{width:60px;height:80px;flex-shrink:0;}\n.nsk-skel__lines{flex:1;display:flex;flex-direction:column;gap:var(--sp-1);}\n.nsk-skel--l{height:12px;border-radius:var(--r-tag);}\n.nsk-skel--w40{width:40%;} .nsk-skel--w60{width:60%;} .nsk-skel--w75{width:75%;}\n/* —— 空态（无社群 / 无活动）—— */\n.nsk-empty{display:none;flex-direction:column;align-items:center;text-align:center;gap:2px;\n  padding:var(--sp-6) var(--sp-4);background:var(--text-04);border:1px solid var(--text-04);\n  border-radius:var(--r-card);box-shadow:var(--sh-card);}\n.nsk-empty__illus{width:72px;height:72px;border-radius:50%;margin-bottom:var(--sp-2);\n  background:linear-gradient(135deg,var(--brand-04) 0%,var(--fill-disabled) 100%);}\n.nsk-empty__title{font-size:var(--fs-md);font-weight:600;color:var(--text-01);}\n.nsk-empty__desc{font-size:var(--fs-sm);color:var(--text-02);}\n.nsk-empty .nsk-btn{margin-top:var(--sp-3);}\n/* —— 异常态（接口失败 / 网络异常）—— */\n.nsk-errcard{display:flex;flex-direction:column;align-items:center;text-align:center;gap:2px;\n  padding:var(--sp-6) var(--sp-4);background:var(--text-04);border:1px solid var(--text-04);\n  border-radius:var(--r-card);box-shadow:var(--sh-card);}\n.nsk-errcard__illus{width:72px;height:72px;border-radius:50%;margin-bottom:var(--sp-2);\n  background:linear-gradient(135deg,var(--danger-bg) 0%,var(--brand-04) 100%);}\n.nsk-errcard__title{font-size:var(--fs-lg);font-weight:600;color:var(--text-01);}\n.nsk-errcard__desc{font-size:var(--fs-sm);color:var(--text-02);}\n.nsk-errcard .nsk-btn{margin-top:var(--sp-3);}\n/* —— 停用提示卡（禁用态，替换认证 Banner）—— */\n.nsk-bannote{align-items:center;gap:var(--sp-2);margin:0 var(--sp-4);padding:var(--sp-3);\n  background:var(--text-04);border:1px solid var(--text-04);border-radius:var(--r-card);box-shadow:var(--sh-card);}\n.nsk-bannote__ic{display:flex;align-items:center;justify-content:center;width:40px;height:40px;\n  border-radius:50%;flex-shrink:0;background:var(--danger-bg);color:var(--danger);}\n.nsk-bannote__title{font-size:var(--fs-lg);font-weight:600;color:var(--text-01);}\n.nsk-bannote__desc{margin-top:2px;font-size:var(--fs-sm);color:var(--text-02);}\n/* —— 身份卡变体（未认证 / 审核中）—— */\n.nsk-identity__avatar--muted{background:var(--fill-disabled);color:var(--text-02);}\n.nsk-identity--unverified .nsk-btn,.nsk-identity--reviewing .nsk-btn{margin-top:var(--sp-3);}\n/* 已停用标识：默认隐藏，仅 banned 态替换「已认证」绿标 */\n.nsk-identity__tag--banned{display:none;}\n/* —— 轻提示（停用态点击冻结入口）—— */\n.nsk-toast{position:fixed;left:50%;bottom:72px;z-index:99;transform:translate(-50%,8px);\n  max-width:290px;padding:var(--sp-2) var(--sp-3);border-radius:var(--r-ctl);\n  background:var(--text-01);color:var(--text-04);box-shadow:var(--sh-sheet);\n  font-size:var(--fs-sm);line-height:1.5;text-align:center;\n  opacity:0;pointer-events:none;transition:opacity .18s ease,transform .18s ease;}\n.nsk-toast.is-show{opacity:1;transform:translate(-50%,0);}\n@media (prefers-reduced-motion:reduce){.nsk-toast{transition:none;}}\n/* —— 状态切换规则 —— */\n[data-state=\"unverified\"] .nsk-identity--verified,\n[data-state=\"reviewing\"] .nsk-identity--verified{display:none;}\n[data-state=\"unverified\"] .nsk-identity--unverified{display:block;}\n[data-state=\"reviewing\"] .nsk-identity--reviewing{display:block;}\n[data-state=\"banned\"] .nsk-banner{display:none;}\n[data-state=\"banned\"] .nsk-bannote{display:flex;}\n/* 加载态：列表 → 骨架屏 */\n[data-state=\"loading\"] .nsk-comm-list,[data-state=\"loading\"] .nsk-act-list{display:none;}\n[data-state=\"loading\"] .nsk-skelbox{display:flex;}\n/* 空态（含未认证 / 审核中：社群与活动区为空） */\n[data-state=\"empty\"] .nsk-comm-list,[data-state=\"empty\"] .nsk-panel,\n[data-state=\"unverified\"] .nsk-com lass=\"nsk-sg__amt nsk-num\">¥30.00<\/span>\n      <\/li>\n      <li class=\"nsk-sg__row\">\n        <span class=\"nsk-sg__avatar nsk-sg__avatar--2\" role=\"img\" aria-label=\"占位图：报名会员头像\"><\/span>\n        <span class=\"nsk-sg__body\">\n          <span class=\"nsk-sg__name\">陈默<\/span>\n          <span class=\"nsk-sg__meta nsk-num\">07.12 22:37 报名 · 双人票<\/span>\n        <\/span>\n        <span class=\"nsk-sg__amt nsk-num\">¥60.00<\/span>\n      <\/li>\n      <li class=\"nsk-sg__row\">\n        <span class=\"nsk-sg__avatar nsk-sg__avatar--3\" role=\"img\" aria-label=\"占位图：报名会员头像\"><\/span>\n        <span class=\"nsk-sg__body\">\n          <span class=\"nsk-sg__name\">苏晴<\/span>\n          <span class=\"nsk-sg__meta nsk-num\">07.13 09:12 报名 · 单人票<\/span>\n        <\/span>\n        <span class=\"nsk-sg__amt nsk-num\">¥30.00<\/span>\n      <\/li>\n    <\/ul>\n    <p class=\"nsk-sg__note\" data-sheet-item=\"act-1\">另有 <span class=\"nsk-num\">39<\/span> 位会员此前已报名，进入活动详情可查看全部名单<\/p>\n\n    <!-- 周四飞盘局 -->\n    <p class=\"nsk-sg__sub\" data-sheet-item=\"act-2\" hidden>周四飞盘局 · <span class=\"nsk-num\">1<\/span> 条新报名<\/p>\n    <ul class=\"nsk-sg__list\" data-sheet-item=\"act-2\" hidden>\n      <li class=\"nsk-sg__row\">\n        <span class=\"nsk-sg__avatar nsk-sg__avatar--2\" role=\"img\" aria-label=\"占位图：报名会员头像\"><\/span>\n        <span class=\"nsk-sg__body\">\n          <span class=\"nsk-sg__name\">周乐<\/span>\n          <span class=\"nsk-sg__meta nsk-num\">07.15 20:18 报名 · 单人票<\/span>\n        <\/span>\n        <span class=\"nsk-sg__amt nsk-num\">¥30.00<\/span>\n      <\/li>\n    <\/ul>\n    <p class=\"nsk-sg__note\" data-sheet-item=\"act-2\" hidden>另有 <span class=\"nsk-num\">27<\/span> 位会员此前已报名，进入活动详情可查看全部名单<\/p>\n\n    <div class=\"nsk-sheet__btns\">\n      <button type=\"button\" class=\"nsk-btn nsk-btn--secondary\" id=\"nsk-signup-read\">知道了<\/button>\n      <button type=\"button\" class=\"nsk-btn nsk-btn--primary\" id=\"nsk-signup-all\">查看全部报名 ›<\/button>\n    <\/div>\n  <\/div>\n<\/div>\n\n<script>\n/* Tab 选中态维护：仅同步 aria-selected / aria-labelledby，不改文案与结构（§6 Selected、§8.3） */\n(function(){\n  var tabs = document.querySelectorAll('.nsk-tabs [role=\"tab\"]');\n  var panel = document.getElementById('nsk-act-panel');\n  tabs.forEach(function(tab){\n    tab.addEventListener('click', function(){\n      tabs.forEach(function(t){ t.setAttribute('aria-selected', String(t === tab)); });\n      if (panel) { panel.setAttribute('aria-labelledby', tab.id); }\n    });\n  });\n  var dots = document.querySelectorAll('.nsk-carousel__dot');\n  dots.forEach(function(dot){\n    dot.addEventListener('click', function(){\n      dots.forEach(function(d){ d.setAttribute('aria-selected', String(d === dot)); });\n    });\n  });\n})();\n/* 页面状态切换（原型演示）：画布顶部状态条 → .nsk-page[data-state]（PRD 状态表） */\n(function(){\n  var page = document.querySelector('.nsk-page');\n  var chips = document.querySelectorAll('.proto-chip');\n  var meta = document.querySelector('.proto-tag__meta');\n  if (!page || !chips.length) { return; }\n  chips.forEach(function(chip){\n    chip.addEventListener('click', function(){\n      chips.forEach(function(c){ c.setAttribute('aria-pressed', String(c === chip)); });\n      page.setAttribute('data-state', chip.getAttribute('data-nsk-state') || '');\n      if (meta) { meta.textContent = '390 × 844 · @1x · ' + chip.textContent; }\n    });\n  });\n})();\n/* 已停用态：社群与活动仅保留查看权限，点击冻结入口（核销 / 发布活动 / 创建社群）给出轻提示 */\n(function(){\n  var page = document.querySelector('.nsk-page');\n  var toast = document.getElementById('nsk-toast');\n  if (!page || !toast) { return; }\n  var MSG = '账号已停用，社群与活动权益已冻结，如需恢复使用，请联系客服重新启用';\n  var FROZEN = '.nsk-opcard__cta,.nsk-opcard--mini,.nsk-sec-head-action--create';\n  var timer = null;\n  function show(){\n    toast.textContent = MSG;\n    toast.classList.add('is-show');\n    if (timer) { clearTimeout(timer); }\n    timer = setTimeout(function(){ toast.classList.remove('is-show'); }, 2400);\n  }\n  document.addEventListener('click', function(e){\n    if (page.getAttribute('data-state') !== 'banned') { return; }\n    var hit = e.target.closest ? e.target.closest(FROZEN) : null;\n    if (!hit) { return; }\n    show();\n  });\n})();\n/* 活动报名提醒（第六轮新增）：列表内提醒条 → 报名明细弹层。\n   仅维护属性——同步 hidden / aria-expanded / 焦点，活动内容按 data-sheet-item 显隐切换；\n   关闭 / 遮罩 / Esc / 知道了 / 查看全部报名 均将该条提醒标记为已读（.is-read），不改任何文案与结构 */\n(function(){\n  var sheet = document.getElementById('nsk-signup-sheet');\n  var mask = document.getElementById('nsk-signup-mask');\n  var closeBtn = document.getElementById('nsk-signup-close');\n  var readBtn = document.getElementById('nsk-signup-read');\n  var allBtn = document.getElementById('nsk-signup-all');\n  var toast = document.getElementById('nsk-toast');\n  var alerts = document.querySelectorAll('.nsk-act__alert');\n  if (!sheet || !mask || !alerts.length) { return; }\n  var current = null, last = null, timer = null;\n  function sync(key){\n    sheet.querySelectorAll('[data-sheet-item]').forEach(function(el){\n      el.hidden = el.getAttribute('data-sheet-item') !== key;\n    });\n  }\n  function open(alert){\n    current = alert; last = document.activeElement;\n    sync(alert.getAttribute('data-act-alert'));\n    sheet.hidden = false; mask.hidden = false;\n    alert.setAttribute('aria-expanded', 'true');\n    if (closeBtn) { closeBtn.focus(); }\n  }\n  function read(){\n    if (current) {\n      current.classList.add('is-read');\n      current.setAttribute('aria-expanded', 'false');\n    }\n    sheet.hidden = true; mask.hidden = true;\n    if (last && last.focus) { last.focus(); }\n    last = null;\n  }\n  function tip(msg){\n    if (!toast) { return; }\n    toast.textContent = msg;\n    toast.classList.add('is-show');\n    if (timer) { clearTimeout(timer); }\n    timer = setTimeout(function(){ toast.classList.remove('is-show'); }, 2400);\n  }\n  alerts.forEach(function(alert){\n    alert.addEventListener('click', function(){ open(alert); });\n  });\n  if (closeBtn) { closeBtn.addEventListener('click', read); }\n  mask.addEventListener('click', read);\n  if (readBtn) { readBtn.addEventListener('click', read); }\n  if (allBtn) {\n    allBtn.addEventListener('click', function(){ read(); tip('报名提醒已读，即将进入活动报名管理'); });\n  }\n  document.addEventListener('keydown', function(e){\n    if ((e.key === 'Escape' || e.key === 'Esc') && !sheet.hidden) { read(); }\n  });\n})();\n/* 活动统计数值自适应（第七轮）：按文本长度给 .nsk-act__num-v 降字号，长金额不换行、不溢出（仅维护 class，不改文案与结构） */\n(function(){\n  document.querySelectorAll('.nsk-act__num-v').forEach(function(el){\n    var len = (el.textContent || '').trim().length;\n    el.classList.remove('is-sm', 'is-xs');\n    if (len >= 13) { el.classList.add('is-xs'); }\n    else if (len >= 10) { el.classList.add('is-sm'); }\n  });\n})();\n<\/script>\n\n<!--\n================================================================\n本次修改点（依据：one蛇口组件系统.sketch / nsk_standard.md）\n================================================================\n【令牌 §1 色彩】删除全部非 token 色（#111/#333/#666/#8a909c/#9aa0ab/#eef0f4/#f2f3f6/#1e6ef5/#3f8cff/#2f9bff/#22c2a8/#27a35a/#35d0a5/#ffc53d/#ff5a5f/#4a90f5/#c3c8d1 等），全部替换为 :root 令牌：标题/正文 → --text-01，次要信息 → --text-02，箭头/置灰 → --text-03，分割线 → --line-01，页面底 → --bg-page，卡片/按钮白 → --text-04。\n【令牌 §1 色彩】Banner 与按钮渐变主色落 token：原 #2f9bff→#1e6ef5 改为 linear-gradient(100deg,var(--brand-01),var(--brand-02))；原「去核销」蓝渐变改为 --brand-01 实底；原「去提现」青蓝渐变改为 --brand-01 实底。\n【令牌 §1 色彩】状态徽章按 Tag 色系映射：已认证/活跃/进行中 → Tag/green（--success-02 底 / --success-01 字），已结束 → --bg-page 底 / --text-02 字；荟豆图标与金额 → --huidou-01。\n【令牌 §2 字体】19 处阶梯外字号全部收敛进 18/16/14/12/10：24（主理人中心）、22（Banner 标题 / 佣金金额）、17（区块标题）、15（社群名 / Tab）、13（须知 / 更多 / 副标题）→ 18/16/14；11 与 10 → 12/10；金额 22 → 18（--fs-xl 上限）。\n【令牌 §2 字体】数字与金额统一套 --font-num 并加 .nsk-num（tabular-nums）：9:41、36、298、2/8/186/320、¥238.60、112/96 位成员、07.13 20:30 等活动时间、42/1,260/¥420.00 等活动数值、Tab 计数（8）（2）（6）。\n【令牌 §3 圆角】全部圆角收敛到 22/16/12/8/2：Banner 与底部弹层 → --r-sheet 16，卡片/操作卡/活动卡/图标底 → --r-card 12，输入框/缩略图/统计图标 → --r-ctl 8，Tag 与 Tab 指示条 → nsk-tabs__item / nsk-carousel__dots），状态类用 is- 前缀；属性顺序按 class → id → 功能属性 → role → aria-*。\n【语义化 §8.2】.phone → .nsk-page(role=\"application\")；.statusbar → .nsk-statusbar(aria-hidden)；.header → <header class=\"nsk-navbar\">；.sec → <section class=\"nsk-section\">；.card → <section class=\"nsk-card\">；活动/社群列表 → <ul class=\"nsk-list\"> + <li class=\"nsk-list__item\">；.tab → <button role=\"tab\"> 且容器 role=\"tablist\"；标题层级 h1 页面 → h2 区块 → h3 卡片 → h4 列表项，不跳级；所有装饰 SVG 加 aria-hidden=\"true\" focusable=\"false\"。\n【可访问性 §8.3】补齐 role=\"application\"/\"tablist\"/\"tab\"/\"tabpanel\"/\"img\"、aria-label、aria-selected、aria-labelledby、aria-controls、aria-hidden；列表行用覆盖式 <button class=\"nsk-list__action\" aria-label> 承担点击语义并保持 h4 标题结构；Tab 与轮播点增加 aria-selected 同步脚本（仅维护属性，不改文案与结构）。\n【结构 §8.4】文件结构按 DOCTYPE → meta(charset/viewport/theme-color #387DEC) → title → style(令牌→重置→通用组件→局部样式→可访问性) → body(.nsk-page) → 末尾改动说明注释 重排；单文件自包含，未引任何外部资源。\n【冲突点】① 原稿金额字号 22/26 与 Banner 标题 22 超出 §2 字号阶梯上限 18，本次统一降为 18（--fs-xl）；② 原稿存在橙/金/青等状态色（#e8930c/#c77700/#ffc53d/#22c2a8），§1 无对应 token，按语义就近映射为 --brand-01 / --huidou-01 / --success-01；③ 原稿 Banner 渐变含 #2f9bff、#1e6ef5 非 token 蓝，按 §1「渐变主色必须落 token」改为 --brand-01 → --brand-02。\n================================================================\n-->\n\n<!-- 第二轮修改点（空白区域修复）：\n【A 底栏】本页无 .nsk-bottombar：删除 .nsk-page 的 min-height:100vh，padding-bottom sp-6→sp-2，消除内容后被视口/内边距撑出的页面底色空白。\n【C 密度】状态栏+导航栏总高 91→79（padding sp-3→sp-2 / sp-1）；Banner 主区 padding sp-6/sp-4→sp-3，desc/cta/stats 间距 sp-2/sp-3→sp-1/sp-2，占位图 min-height 176→128；区块 padding-top sp-5→sp-3，区块头 margin-bottom sp-2→sp-1；.nsk-card padding sp-4→sp-3；操作卡 padding sp-4→sp-3、插画 64→52、图标 44→36、mini 卡 gap/padding 收紧；身份卡头像 48→40、金币 34→28、stats/cash 间距 sp-4→sp-3、cash padding-top sp-3→sp-2；社群行 padding sp-3→sp-2、缩略图 52→44、gap sp-3→sp-2；活动卡 padding sp-3→sp-2、图 92×70→84×60、数值图标 22→18、nums 间距 sp-3→sp-2；panel/note/tabs 同步收紧。实测内容高度 1520→1273（字号/行高令牌冻结，与原稿小字号密度存在结构性差距，按规范兜底条款处理，未删任何内容）。\n【D inline】无（.nsk-act__head、.nsk-stats__body、.nsk-list__body 等行内容器均已显式 flex/block）。\n【E 占位】无（banner photo/illus/icon/thumb 全部带 --* 渐变或令牌纯色背景，宽高均 >0）。\n-->\n\n<!-- 第三轮修改点（背景框一致性修补，依据：one蛇口组件系统.sketch / nsk_standard.md）\n【§5 卡片组】.nsk-opcard 基类缺 background（此前仅靠 --wide/--mini 两个变体各自声明，基类裸奔）→ 补 background:var(--text-04)，使新增变体自动继承白底框。\n【§4 阴影 / §5 卡片组】.nsk-act（活动卡 332×98，白底 + 1px --line-01 + 圆角 12）缺 box-shadow → 补 box-shadow:var(--sh-card)，与 .nsk-card 基线（0 1px 6px rgba(0,0,0,.02)）一致。\n-->\n\n<!-- 第四轮修改点（补齐 PRD 状态表 6 个待补充原型，依据：状态定义截图 + 主理人认证与权限梳理）\n【状态机制】.nsk-page[data-state] 驱动（verified 默认 / unverified / reviewing / loading / empty / error / banned）；切换条为画布层 .proto-statebar（proto-* 展示壳，位于设备框外，不影响像素还原），脚本仅维护 data-state 与 aria-pressed。\n【默认未认证】新增身份卡变体 .nsk-identity--unverified（还未成为主理人 + 立即申请）；社群/活动列表区切换为空态块；Banner 保持「立即申请」。\n【默认审核中】新增身份卡变体 .nsk-identity--reviewing（审核中 Tag + 查看申请记录）；Banner CTA 由 .nsk-banner__cta--apply 换为 --review「查看申请记录」（两按钮 CSS 显隐，无 JS 改文案）。\n【加载】列表隐藏 → .nsk-skelbox 骨架屏（nsk-skel 渐变 shimmer，社群 2 行 / 活动 2 卡，aria-hidden），Tab 与区块标题保留。\n【空态】新增 .nsk-empty 空态块（占位插图圈 + 标题 + 说明 + 次级按钮）；未认证/审核中复用空态但隐藏按钮。\n【异常】新增 .nsk-errorsec 异常卡（网络开小差了 + 重新加载），error 态下社群/活动两区块整体替换。\n【禁用】Banner 替换为 .nsk-bannote 停用提示卡（Danger 图标 + 账号已停用 + 联系城市公司管理员）；身份卡变体 --banned（已停用灰 Tag）；常用操作三卡、区块头「全部社群/发布活动」、列表行点击 .nsk-list__action 全部 pointer-events:none + opacity .45。\n【影响范围】新增类均带 --unverified/--reviewing/--banned/skel/empty/err/bannote 后缀，已认证默认态 DOM 仅新增 class 标记（nsk-identity--verified / nsk-comm-list / nsk-act-list / nsk-sec-comm / nsk-sec-act / nsk-banner__cta--apply / nsk-sec-head-action），未改动任何既有样式与交互脚本。\n-->\n\n<!-- 第五轮修改点（状态相关界面与交互调整，依据：产品状态规则补充）\n【Banner 去按钮】所有状态下移除「成为社区主理人」Banner 内的操作按钮（立即申请 / 查看申请记录）：删除两个 .nsk-banner__cta 按钮（含 #apply-now-btn）及其 CSS（.nsk-banner__cta / --apply / --review 与 reviewing 态的显隐规则），Banner 仅保留标题、副标题、人数统计与轮播点；.nsk-banner__stats 上间距 sp-2→sp-3 补偿按钮移除后的留白。申请入口统一收敛到身份卡（未认证「立即申请」/ 审核中「查看申请记录」）。注：.nsk-btn--ghost-white 为按钮组件库既有变体，保留未删。\n【未认证 / 审核中】「常用操作」整块新增 .nsk-sec-ops 标记类，[data-state=\"unverified\"|\"reviewing\"] 下 display:none——未取得主理人身份时无核销 / 发布 / 建群权益。\n【已停用 · 身份卡】删除第四轮新增的简化版 .nsk-identity--banned 变体卡，改为复用「已认证」身份卡（头像 / 数据 / 佣金 / 去提现结构与交互完全一致）：banned 态下头像转灰（--fill-disabled），绿色「已认证」Tag 隐藏、灰色「已停用」Tag 显示（.nsk-identity__tag--verified / --banned 对切），佣金区下方补 .nsk-identity__tip「账号停用期间，未提现佣金仍可正常提现」，去提现按钮保持可用。\n【已停用 · 权限】社群与活动列表保留查看权限（移除原 .nsk-list__action{pointer-events:none}，Tab 与列表行可正常点击）；核销 / 发布活动 / 创建社群等冻结入口改为 opacity:.55 弱化但保留可点击，点击后由新增 .nsk-toast（role=\"status\" + aria-live=\"polite\"，2.4s 自动消失）提示「账号已停用，社群与活动权益已冻结，如需恢复使用，请联系客服重新启用」；区块头「全部社群 ›」属查看类入口，新增 .nsk-sec-head-action--create 区分「发布活动 ›」，仅后者拦截。停用提示卡 .nsk-bannote 文案同步为该提示口径。\n【脚本】新增独立 IIFE：仅在 data-state=\"banned\" 时对 .nsk-opcard__cta / .nsk-opcard--mini / .nsk-sec-head-action--create 的点击弹出提示，未触碰 Tab / 轮播 / 状态条三个既有脚本。\n-->\n\n<!-- 第六轮修改点（活动报名提醒交互，依据：主理人活动列表场景补充）\n【列表提醒条】「我发布的活动」两条进行中活动卡（周一飞盘局 / 周四飞盘局）在数值行下方新增 .nsk-act__alert 报名提醒条（铃铛 14×14 + 「N 位会员刚刚/今日报名」+ 红色未读闪点 + 「查看 › / 已查看」双 CTA 未按 CSS 显隐切换）；蓝底 --brand-04 / 字 --brand-01 / 圆角 --r-ctl 8 / 高 28，未读点 --danger 6×6 并带 1.6s nsk-blink 呼吸（prefers-reduced-motion 已由全局规则降级）；已结束活动不发提醒。提醒条 position:relative + z-index:2，压在覆盖式 .nsk-list__action 之上，点击不误触整卡跳转。\n【报名明细弹层】新增 #nsk-signup-mask（.nsk-mask，--mask 派生，z-index 8）+ #nsk-signup-sheet（复用既有 .nsk-sheet / .nsk-sheet__head / --title / --close，role=\"dialog\" aria-modal，z-index 9 高于遮罩）；内容含副标题「活动名 · N 条新报名」、.nsk-sg__row 报名成员行（32px 渐变头像 + 昵称 + 报名时间/票种 + 支付金额，最多 3 行、超 200px 内部滚动）、历史报名说明、底部双按钮「知道了（Secondary）/ 查看全部报名 ›（Primary）」。两个活动的内容全部预置，靠 data-sheet-item 显隐切换，脚本不改任何文案。\n【交互】新 IIFE：点击提醒条 → open()（同步 sheet/mask hidden、aria-expanded=\"true\"、按 data-act-alert 切换内容、焦点移到关闭按钮）；✕ / 遮罩 / Esc /「知道了」/「查看全部报名」→ read() 关闭并把该条提醒置为 .is-read（底色 --fill-disabled、字 --text-02、红点与「查看 ›」隐藏、「已查看」显示，再点击可重看但已是已读态）；「查看全部报名 ›」关闭后复用 .nsk-toast 提示「报名提醒已读，即将进入活动报名管理」（2.4s）。未触碰 Tab / 轮播 / 状态条 / 停用提示四个既有脚本。\n【影响范围】新增类均带 __alert / __sg / __sheet 后缀，沿用既有令牌与 nsk- BEM；已认证默认态新增提醒条与默认隐藏的弹层，加载/空态/异常/未认证/审核中状态下活动列表已由既有规则隐藏，弹层不受影响；banned 态下提醒属查看类，不做拦截。\n-->\n\n<!-- 第七轮修改点（活动占位图比例，依据：视觉走查反馈）\n【占位图改竖向】活动列表占位图由横向 84×60 改为竖向 60×80（3:4，圆角 --r-ctl 8、占位渐变不变），贴近真实活动封面比例；同步把加载骨架 .nsk-skel--photo 改为同尺寸，避免加载态与真实态切换时跳版。\n【实测】390 下占位图渲染 60×80、卡片高 134；320 下卡片高 148，图片未超出卡片边界，文本区宽度 210 → 234，报名提醒条宽度 152 → 176（≤359 隐藏右侧 CTA 的规则保留，避免拥挤）；390/375/360/320 均无横向溢出、无 JS 报错，标题 / 日期 / 三项数据 / 提醒条排版未受影响。\n【未同步】同类横向占位图还存在于 6.主理人生成签到码.html（110×86）与 12.主理人管理社群可基于社群创建活动.html（64×48），本次未改动，待确认是否统一为竖向。\n-->\n\n<!-- 第八轮修改点（统计数值布局 + 长金额自适应，依据：长金额展示需求）\n【布局重排】活动卡片三项统计由「三等分」改为「左两列等分 + 右侧金额独立列」：.nsk-act__nums 保持 flex，左列（报名人数 / 收获荟豆）仍 flex:1 均分并加 min-width:0；右侧「收取现金」用 .nsk-act__num:last-child 定位为 flex:0 0 auto + margin-left:sp-3 + 右对齐（不参与等分、不参与换行），.nsk-act__num-body 加 align-items:flex-end，金额与标签右对齐，容纳更长金额；三项值 / 标签统一 white-space:nowrap 防折行。\n【长金额自适应】新增 IIFE：按 .nsk-act__num-v 文本长度降字号——<10 字符保持 14px（--fs-md），10-12 字符 .is-sm（12px --fs-sm），≥13 字符 .is-xs（10px --fs-xs）；仅维护 class，不改文案与结构。\n【实测】长金额演示（¥1,260,000.00 / ¥12,345.00 / ¥1,234,567.00）三档字号分别落到 10/12/14，金额列宽 88px、值宽 66px 无溢出；390/320 无横向滚动、无 JS 报错；320 下因数值标签 nowrap，内容高度较此前略降（3135→3051）。\n-->\n<\/div>\n<p class=\"proto-foot\">招商荟有家 · C 端主理人 移动端原型<\/p>\n<\/div>\n\n<script>\n(function(){\n  var ID=\"p1\";\n  var MAP={\"1.主理人中心.html\": \"p1\", \"11.主理人创建社群.html\": \"p11\", \"12.主理人管理社群可基于社群创建活动.html\": \"p12\", \"13.主理人社群成员列表.html\": \"p13\", \"2.申请成为主理人.html\": \"p2\", \"3-1.查看申请记录.html\": \"p31\", \"3.申请提交页面.html\": \"p3\", \"4.主理人发布活动-改版.html\": \"p4\", \"8.主理人查看活动-改版.html\": \"p8\", \"9.活动报名名单-改版.html\": \"p9\"};\n  function go(id){try{parent.postMessage({__demoNav:id},'*');}catch(e){}}\n  window.__demoGo=go;\n  window.__demoBlocked=function(f){alert('「'+f+'」未包含在本次合并的原型范围内');};\n  document.addEventListener('click',function(e){\n    var t=e.target;\n    var a=t&&t.closest?t.closest('a[href]'):null;\n    if(!a)return;\n    var h=a.getAttribute('href')||'';\n    if(!/\\.html(\\?|#|$)/.test(h))return;\n    e.preventDefault();e.stopPropagation();\n    if(MAP[h]){go(MAP[h]);}else{window.__demoBlocked(h);}\n  },true);\n  function allBtns(){return document.querySelectorAll('button,[role=\"button\"],a');}\n  function hookText(txt,id,delay,toast){\n    allBtns().forEach(function(b){\n      if(b.__dh)return;\n      if((b.textContent||'').replace(/\\s+/g,'').indexOf(txt)>-1){\n        b.__dh=1;\n        b.addEventListener('click',function(){setTimeout(function(){\n          if(toast){alert(toast);return;}\n          if(id)go(id);\n        },delay||0);});\n      }\n    });\n  }\n  function hookAria(prefix,id){\n    document.querySelectorAll('[aria-label]').forEach(function(b){\n      if(b.__dh)return;\n      if((b.getAttribute('aria-label')||'').indexOf(prefix)===0){\n        b.__dh=1;\n        b.addEventListener('click',function(){go(id);});\n      }\n    });\n  }\n  hookText('立即申请','p2');\nhookText('查看申请记录','p31');\nhookText('发布活动','p4');\nhookText('创建社群','p11');\nhookText('去核销',null,0,'扫码核销页面未包含在本次合并范围');\nhookAria('查看社群：','p12');\nhookAria('查看活动：','p8');\nhookAria('查看全部社群','p12');\n  var BACK={\"p11\": \"p1\", \"p12\": \"p1\", \"p13\": \"p12\", \"p2\": \"p1\", \"p3\": \"p2\", \"p31\": \"p3\", \"p4\": \"p1\", \"p8\": \"p1\", \"p9\": \"p8\"}[ID];\n  var bk=document.querySelector('.nsk-navbar__back,.c-navbar__back');\n  if(bk&&BACK){bk.addEventListener('click',function(e){e.stopPropagation();e.preventDefault();go(BACK);});}\n  /* 2x 设计板页面（社群系列）按画板宽度等比缩放适配容器 */\n  var BOARD=0;\n  if(BOARD){\n    (function(){\n      var st=document.createElement('style');\n      st.textContent='html{overflow-x:hidden!important}body{margin:0 auto!important;zoom:'+(430/BOARD).toFixed(4)+'}';\n      document.head.appendChild(st);\n      var lastW=-1;\n      function fit(){\n        var w=document.documentElement.clientWidth||window.innerWidth||0;\n        if(w>0&&w!==lastW){\n          lastW=w;\n          document.body.style.zoom=(w/BOARD).toFixed(4);\n        }\n      }\n      window.__demoFit=fit;\n      fit();\n      window.addEventListener('resize',fit);\n      window.addEventListener('load',fit);\n      if(window.ResizeObserver){try{new ResizeObserver(fit).observe(document.documentElement);}catch(e){}}\n      /* 轮询自愈：任何事件时机漏掉（如 iframe 隐藏期未量到宽度）都会在下一拍补上 */\n      setInterval(fit,200);\n    })();\n  }\n})();\n<\/script>\n<\/body>\n<\/html>\n"
