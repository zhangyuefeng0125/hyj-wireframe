  "p2": {
    "title": "申请成为主理人",
    "html": "<!DOCTYPE html>\n<html lang=\"zh-CN\">\n<head>\n<meta charset=\"UTF-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n<meta name=\"theme-color\" content=\"#387DEC\">\n<title>申请成为主理人<\/title>\n<style>\n/* ================================================================\n   设计令牌（§1 色彩 / §2 字体 / §3 圆角 / §4 阴影 / §0 4px 栅格）\n   ================================================================ */\n:root{\n  /* §1 色彩 */\n  --brand-01:#387DEC;   /* Brand01 常规 Default */\n  --brand-02:#0855D1;   /* Brand02 点击 Pressed */\n  --brand-03:#9BBEF5;   /* Brand03 一般禁用 Disabled */\n  --brand-04:#E0ECFF;   /* Brand04 文字禁用 / Tag 蓝底 */\n  --text-01:#303133;    /* Text01 强调·正文标题 */\n  --text-02:#909399;    /* Text02 次强调·正文次要·图标描边 */\n  --text-03:#C0C4CC;    /* Text03 置灰·禁用信息 */\n  --text-04:#FFFFFF;    /* Text04 纯白文字 */\n  --line-01:#EBEBEB;    /* Line01 分割线 */\n  --bg-page:#F2F5F7;    /* 页面背景 */\n  --success-01:#10A17C;\n  --success-02:#E6F7F2;\n  --huidou-01:#F76346;\n  --huidou-02:#FFE7E6;\n  --danger:#EB4A38;     /* Danger 错误态 */\n  /* §1 派生值 */\n  --brand-01-hover:#2C71DE;\n  --danger-bg:#FDECEA;\n  --row-hover:#FAFBFC;      /* §6 Hover 可点行底 */\n  --fill-disabled:#F7F8FA;  /* §6 Disabled 输入类背景 */\n  --focus-ring:0 0 0 2px rgba(56,125,236,.24);\n  /* §2 字体 */\n  --font-cn:\"PingFang SC\",\"苹方-简\",-apple-system,BlinkMacSystemFont,\"Helvetica Neue\",sans-serif;\n  --font-num:\"Source Han Sans SC\",\"思源黑体\",\"PingFang SC\",-apple-system,BlinkMacSystemFont,sans-serif;\n  --fs-xl:18px; --fs-lg:16px; --fs-md:14px; --fs-sm:12px; --fs-xs:10px;\n  --lh-title:1.3; --lh-body:1.4; --lh-num:1.2;\n  /* §3 圆角 */\n  --r-pill:22px; --r-sheet:16px; --r-card:12px; --r-ctl:8px; --r-tag:2px;\n  /* §4 阴影 */\n  --sh-card:0 1px 6px rgba(0,0,0,.02);\n  --sh-sheet:0 -2px 16px rgba(0,0,0,.08);\n  /* §0 间距栅格 */\n  --sp-1:4px; --sp-2:8px; --sp-3:12px; --sp-4:16px; --sp-5:20px; --sp-6:24px; --sp-8:32px;\n}\n/* ================================================================\n   基础重置\n   ================================================================ */\n*,*::before,*::after{box-sizing:border-box;}\nhtml{-webkit-text-size-adjust:100%;}\nbody{margin:0;padding:var(--sp-8) var(--sp-5) 48px;\n  background:radial-gradient(900px 420px at 50% 0%,#FFFFFF 0%,rgba(255,255,255,0) 62%),\n             linear-gradient(180deg,#F8FAFD 0%,#E9EEF5 100%);\n  background-attachment:fixed;\n  font-family:var(--font-cn);font-size:var(--fs-md);\n  line-height:var(--lh-body);color:var(--text-01);-webkit-font-smoothing:antialiased;\n  -webkit-tap-highlight-color:transparent;}\nh1,h2,h3,h4,h5,h6{margin:0;font-size:inherit;font-weight:600;line-height:var(--lh-title);}\np{margin:0;}\nul,ol,dl,dd{margin:0;padding:0;list-style:none;}\nbutton{font-family:inherit;font-size:inherit;color:inherit;background:none;border:0;margin:0;padding:0;cursor:pointer;}\nsvg{display:block;}\n.nsk-num{font-family:var(--font-num);font-variant-numeric:tabular-nums;line-height:var(--lh-num);}\n/* ================================================================\n   原型画布背景（第四轮：设备框 + 桌面画布，不改动任何业务组件）\n   ================================================================ */\n.proto-grid{position:fixed;inset:0;z-index:0;pointer-events:none;\n  background-image:linear-gradient(rgba(56,125,236,.055) 1px,transparent 1px),\n                   linear-gradient(90deg,rgba(56,125,236,.055) 1px,transparent 1px);\n  background-size:22px 22px;\n  -webkit-mask-image:radial-gradient(125% 95% at 50% 28%,#000 26%,transparent 100%);\n          mask-image:radial-gradient(125% 95% at 50% 28%,#000 26%,transparent 100%);}\n.proto-stage{position:relative;z-index:1;width:390px;margin:0 auto;}\n.proto-tag{display:flex;align-items:center;gap:var(--sp-2);width:max-content;margin:0 auto var(--sp-3);\n  padding:6px var(--sp-3);border-radius:var(--r-pill);\n  background:rgba(255,255,255,.88);border:1px solid rgba(56,125,236,.14);\n  box-shadow:0 2px 10px rgba(23,43,77,.06);font-size:var(--fs-sm);color:var(--text-02);}\n.proto-tag__dot{width:8px;height:8px;border-radius:50%;background:var(--brand-01);flex-shrink:0;}\n.proto-tag__name{font-size:var(--fs-md);font-weight:600;color:var(--text-01);}\n.proto-tag__sep{width:1px;height:12px;background:var(--line-01);}\n.proto-tag__size{font-size:var(--fs-xs);color:var(--text-03);}\n.proto-frame{border-radius:28px;overflow:clip;background:var(--text-04);\n  box-shadow:0 28px 64px rgba(23,43,77,.16),0 2px 8px rgba(23,43,77,.06),0 0 0 1px rgba(23,43,77,.05);}\n.proto-foot{width:max-content;margin:var(--sp-3) auto 0;font-size:var(--fs-xs);color:var(--text-03);letter-spacing:.5px;}\n@media (max-width:430px){\n  body{padding:0;background:var(--bg-page);}\n  .proto-grid,.proto-tag,.proto-foot{display:none;}\n  .proto-stage{width:100%;max-width:390px;}\n  .proto-frame{border-radius:0;box-shadow:none;}\n}\n/* ================================================================\n   通用组件\n   ================================================================ */\n/* 页面容器 / 状态栏 / 导航栏（§5） */\n.nsk-page{position:relative;max-width:390px;margin:0 auto;background:var(--bg-page);padding-bottom:0;}\n.nsk-statusbar{display:flex;align-items:center;justify-content:space-between;padding:var(--sp-2) var(--sp-6) var(--sp-1);color:var(--text-01);}\n.nsk-statusbar__time{font-size:var(--fs-lg);font-weight:600;}\n.nsk-statusbar__icons{display:flex;align-items:center;gap:var(--sp-1);}\n.nsk-navbar{display:flex;align-items:center;justify-content:space-between;gap:var(--sp-2);padding:var(--sp-1) var(--sp-4);}\n.nsk-navbar__title{font-size:var(--fs-lg);font-weight:600;color:var(--text-01);text-align:center;flex:1;}\n.nsk-icon{color:inherit;}\n.nsk-icon--inv{fill:var(--text-04);stroke:var(--text-04);}\n.nsk-icon--inv-stroke{fill:none;stroke:var(--text-04);}\n.nsk-ico--brand{color:var(--brand-01);}\n.nsk-ico--muted{color:var(--text-02);}\n.nsk-ico--on-brand{color:var(--text-04);}\n/* 按钮（§5 Button：高 44 / 圆角 22 胶囊 / 文字 16 Semibold） */\n.nsk-btn{display:inline-flex;align-items:center;justify-content:center;gap:var(--sp-1);\n  min-height:44px;padding:0 var(--sp-6);border-radius:var(--r-pill);\n  font-size:var(--fs-lg);font-weight:600;line-height:1;border:1px solid transparent;\n  transition:background-color .15s,border-color .15s,color .15s,box-shadow .15s,opacity .15s;}\n.nsk-btn:focus{outline:none;}\n.nsk-btn:focus-visible{box-shadow:var(--focus-ring);}\n.nsk-btn--primary{background:var(--brand-01);color:var(--text-04);}\n.nsk-btn--primary:hover{background:var(--brand-01-hover);}\n.nsk-btn--primary:active{background:var(--brand-02);transform:scale(.98);}\n.nsk-btn--secondary{background:transparent;border-color:var(--brand-01);color:var(--brand-01);}\n.nsk-btn--secondary:hover{border-color:var(--brand-01-hover);color:var(--brand-01-hover);}\n.nsk-btn--secondary:active{border-color:var(--brand-02);color:var(--brand-02);transform:scale(.98);}\n.nsk-btn--outline{background:var(--brand-04);border-color:var(--brand-03);color:var(--brand-01);}\n.nsk-btn--outline:hover{background:var(--brand-04);border-color:var(--brand-01-hover);color:var(--brand-01-hover);}\n.nsk-btn--outline:active{border-color:var(--brand-02);color:var(--brand-02);}\n.nsk-btn--text-brand{min-height:32px;padding:0 var(--sp-2);border-radius:var(--r-ctl);\n  font-size:var(--fs-md);font-weight:400;color:var(--brand-01);}\n.nsk-btn--text-brand:hover{color:var(--brand-01-hover);background:var(--row-hover);}\n.nsk-btn--text-brand:active{color:var(--brand-02);}\n.nsk-btn--link{min-height:32px;padding:0;font-size:inherit;font-weight:400;color:var(--brand-01);}\n.nsk-btn--link:hover{color:var(--brand-01-hover);}\n.nsk-btn--link:active{color:var(--brand-02);}\n.nsk-btn--sm{min-height:32px;padding:0 var(--sp-3);font-size:var(--fs-sm);}\n.nsk-btn--block{display:flex;width:100%;}\n.nsk-btn[disabled],.nsk-btn.is-disabled{cursor:not-allowed;pointer-events:none;}\n.nsk-btn--primary[disabled],.nsk-btn--primary.is-disabled{background:var(--brand-03);color:var(--text-04);}\n.nsk-btn--secondary[disabled],.nsk-btn--secondary.is-disabled{border-color:var(--line-01);color:var(--text-03);}\n.nsk-btn--outline[disabled],.nsk-btn--outline.is-disabled{background:var(--fill-disabled);border-color:var(--line-01);color:var(--text-03);}\n.nsk-btn.is-loading{pointer-events:none;opacity:.7;}\n.nsk-btn__spinner{width:14px;height:14px;border-radius:50%;border:2px solid currentColor;\n  border-top-color:transparent;animation:nsk-spin .6s linear infinite;}\n@keyframes nsk-spin{to{transform:rotate(360deg);}}\n/* 图标按钮（§5 返回图标 32×32，热区 ≥44×44） */\n.nsk-iconbtn{display:inline-flex;align-items:center;justify-content:center;width:44px;height:44px;\n  border-radius:var(--r-ctl);color:var(--text-01);\n  transition:background-color .15s,border-color .15s,color .15s,box-shadow .15s,opacity .15s;}\n.nsk-iconbtn:hover{background:var(--row-hover);}\n.nsk-iconbtn:focus{outline:none;}\n.nsk-iconbtn:focus-visible{box-shadow:var(--focus-ring);}\n.nsk-iconbtn:active{color:var(--brand-02);}\n.nsk-iconbtn[disabled],.nsk-iconbtn.is-disabled{color:var(--text-03);cursor:not-allowed;pointer-events:none;}\n/* 标签（§5 Tag） */\n.nsk-tag{display:inline-flex;align-items:center;height:20px;padding:0 var(--sp-1);\n  border-radius:var(--r-tag);font-size:var(--fs-sm);font-weight:400;line-height:1;white-space:nowrap;}\n.nsk-tag--blue{background:var(--brand-04);color:var(--brand-01);}\n.nsk-tag--green{background:var(--success-02);color:var(--success-01);}\n.nsk-tag--huidou{background:var(--huidou-02);color:var(--huidou-01);}\n/* 卡片 / 区块（§5 卡片组） */\n.nsk-card{background:var(--text-04);border-radius:var(--r-card);padding:var(--sp-3);\n  box-shadow:var(--sh-card);border:1px solid var(--text-04);}\n.nsk-section{margin:var(--sp-3) var(--sp-4) 0;background:var(--text-04);border-radius:var(--r-card);\n  padding:var(--sp-3);box-shadow:var(--sh-card);border:1px solid var(--text-04);}\n.nsk-section__head{display:flex;align-items:baseline;gap:var(--sp-2);}\n.nsk-section__no{font-size:var(--fs-md);font-weight:600;color:var(--brand-01);}\n.nsk-section__title{font-size:var(--fs-lg);font-weight:600;color:var(--text-01);}\n.nsk-section__note{margin-left:auto;font-size:var(--fs-xs);color:var(--text-02);}\n/* 表单（§6） */\n.nsk-fields{margin-top:var(--sp-2);}\n.nsk-field__grid{display:flex;gap:var(--sp-4);}\n.nsk-field__grid > div{flex:1;}\n.nsk-field__label{display:block;margin-top:var(--sp-1);font-size:var(--fs-sm);color:var(--text-02);}\n.nsk-field__label--strong{font-size:var(--fs-md);font-weight:600;color:var(--text-01);}\n.nsk-field__req{color:var(--danger);}\n.nsk-field__value{margin-top:2px;padding-bottom:2px;font-size:var(--fs-md);\n  color:var(--text-01);border-bottom:1px solid var(--line-01);\n  display:flex;align-items:center;justify-content:space-between;gap:var(--sp-2);}\n.nsk-field__control{display:block;width:100%;min-height:56px;padding:var(--sp-2);\n  border:1px solid var(--line-01);border-radius:var(--r-ctl);background:var(--text-04);\n  font-family:inherit;font-size:var(--fs-md);color:var(--text-01);line-height:var(--lh-body);resize:none;\n  transition:background-color .15s,border-color .15s,color .15s,box-shadow .15s,opacity .15s;}\n.nsk-field__control::placeholder{color:var(--text-03);}\n.nsk-field__control:hover{border-color:var(--brand-03);}\n.nsk-field__control:focus{outline:none;border-color:var(--brand-01);box-shadow:var(--focus-ring);}\n.nsk-field__control[disabled],.nsk-field__control.is-disabled{background:var(--fill-disabled);color:var(--text-03);}\n.nsk-field__control.is-error,.nsk-field__control[aria-invalid=\"true\"]{border-color:var(--danger);}\n.nsk-field__error{display:block;margin-top:var(--sp-1);font-size:var(--fs-sm);color:var(--danger);}\n.nsk-field__counter{margin-top:2px;font-size:var(--fs-xs);color:var(--text-03);text-align:right;}\n.nsk-field__value .nsk-field__select{flex:1;justify-content:space-between;}\n/* 单行下划线输入框容器：去掉 .nsk-field__value 的 1px 下划线，改由输入框自带底线，避免双层线 */\n.nsk-field__value--box{margin-top:var(--sp-1);padding-bottom:0;border-bottom:0;}\n/* 单行下划线输入框（§6 表单控件的线性变体）：仅保留底部 1px 直线，与 01 区块既有字段视觉一致 */\n.nsk-field__control--single{min-height:32px;padding:var(--sp-1) 0;\n  border-width:0 0 1px 0;border-radius:0;background:transparent;}\n.nsk-field__control--single:hover{border-color:var(--brand-03);}\n.nsk-field__control--single:focus{outline:none;border-color:var(--brand-01);box-shadow:none;}\n.nsk-field__select{min-height:32px;padding:0 var(--sp-1);border-radius:var(--r-ctl);\n  font-size:var(--fs-md);font-weight:400;color:var(--text-01);display:inline-flex;align-items:center;gap:var(--sp-1);\n  transition:background-color .15s,border-color .15s,color .15s,box-shadow .15s,opacity .15s;}\n.nsk-field__select:hover{background:var(--row-hover);color:var(--brand-01-hover);}\n.nsk-field__select:focus{outline:none;}\n.nsk-field__select:focus-visible{box-shadow:var(--focus-ring);}\n.nsk-field__select:active{color:var(--brand-02);}\n.nsk-field__select[aria-expanded=\"true\"]{color:var(--brand-01);background:var(--brand-04);}\n/* 选项 chip（§6 Selected） */\n.nsk-chips{display:flex;flex-wrap:wrap;gap:var(--sp-1) var(--sp-2);margin-top:var(--sp-1);}\n.nsk-chip{min-height:32px;padding:0 var(--sp-4);border-radius:var(--r-pill);\n  font-size:var(--fs-md);font-weight:400;background:var(--bg-page);color:var(--text-01);\n  border:1px solid transparent;display:inline-flex;align-items:center;gap:var(--sp-1);\n  transition:background-color .15s,border-color .15s,color .15s,box-shadow .15s,opacity .15s;}\n.nsk-chip:hover{background:var(--row-hover);}\n.nsk-chip:focus{outline:none;}\n.nsk-chip:focus-visible{box-shadow:var(--focus-ring);}\n.nsk-chip:active{background:var(--brand-04);}\n.nsk-chip.is-selected,.nsk-chip[aria-pressed=\"true\"]{background:var(--brand-04);border-color:var(--brand-03);\n  color:var(--brand-01);font-weight:600;}\n.nsk-chip[disabled],.nsk-chip.is-disabled{background:var(--fill-disabled);color:var(--text-03);cursor:not-allowed;pointer-events:none;}\n/* 弹层（§3 --r-sheet / §4 --sh-sheet） */\n.nsk-sheet{position:fixed;left:50%;bottom:0;transform:translateX(-50%);width:100%;max-width:390px;\n  background:var(--text-04);border-radius:var(--r-sheet) var(--r-sheet) 0 0;box-shadow:var(--sh-sheet);\n  padding:var(--sp-4) var(--sp-4) var(--sp-6);z-index:9;}\n/* 分割线（§5） */\n.nsk-divider{height:1px;background:var(--line-01);border:0;margin:0;}\n/* 状态类（§6） */\n.is-selected{color:var(--brand-01);}\n.is-loading{pointer-events:none;opacity:.7;}\n.is-error{color:var(--danger);}\n.is-disabled{cursor:not-allowed;pointer-events:none;}\n.nsk-thumb{display:block;background:var(--brand-04);}\n/* ================================================================\n   本页面局部样式\n   ================================================================ */\n/* Hero */\n.nsk-hero{margin:var(--sp-1) var(--sp-4) 0;border-radius:var(--r-sheet);padding:var(--sp-3) var(--sp-3) 48px;\n  position:relative;overflow:hidden;background:linear-gradient(120deg,var(--brand-01) 0%,var(--brand-02) 70%);}\n.nsk-hero__eyebrow{font-size:var(--fs-xs);letter-spacing:2px;color:var(--text-04);opacity:.75;}\n.nsk-hero__title{margin-top:var(--sp-1);font-size:var(--fs-xl);font-weight:600;color:var(--text-04);}\n.nsk-hero__desc{margin-top:var(--sp-1);font-size:var(--fs-sm);color:var(--text-04);opacity:.85;}\n.nsk-hero__medal{position:absolute;right:var(--sp-3);top:var(--sp-4);width:56px;height:56px;border-radius:50%;\n  background:radial-gradient(circle at 35% 30%,rgba(255,255,255,.55),rgba(255,255,255,.12) 60%,rgba(255,255,255,.05));\n  display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--text-04);}\n.nsk-hero__medal-num{font-size:var(--fs-xl);font-weight:700;}\n.nsk-hero__medal-label{margin-top:2px;font-size:var(--fs-xs);}\n/* 步骤条 */\n.nsk-steps{margin:-44px var(--sp-4) 0;background:var(--text-04);border-radius:var(--r-card);\n  padding:var(--sp-2) var(--sp-2);display:flex;position:relative;box-shadow:var(--sh-card);}\n.nsk-steps__item{flex:1;display:flex;flex-direction:column;align-items:center;position:relative;}\n.nsk-steps__dot{width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;\n  font-size:var(--fs-sm);font-weight:700;z-index:2;background:var(--bg-page);color:var(--text-03);}\n.nsk-steps__item.is-current .nsk-steps__dot{background:var(--brand-01);color:var(--text-04);}\n.nsk-steps__label{margin-top:var(--sp-1);font-size:var(--fs-sm);color:var(--text-02);}\n.nsk-steps__item.is-current .nsk-steps__label{color:var(--brand-01);font-weight:600;}\n.nsk-steps__item::before{content:\"\";position:absolute;top:12px;left:-50%;width:100%;border-top:2px dashed var(--line-01);}\n.nsk-steps__item:first-child::before{display:none;}\n.nsk-steps__item.is-done::before{border-top-color:var(--brand-01);}\n/* 上传区 */\n.nsk-upload{margin-top:var(--sp-2);border:1px dashed var(--brand-03);border-radius:var(--r-card);\n  background:var(--brand-04);padding:var(--sp-2) var(--sp-3);display:flex;gap:var(--sp-3);align-items:center;}\n.nsk-upload--block{width:100%;text-align:left;}\n.nsk-upload__icon{display:flex;align-items:center;justify-content:center;width:40px;height:40px;\n  border-radius:var(--r-card);background:var(--text-04);color:var(--brand-01);flex-shrink:0;}\n.nsk-upload__title{display:block;font-size:var(--fs-md);font-weight:600;color:var(--text-01);}\n.nsk-upload__desc{display:block;margin-top:var(--sp-1);font-size:var(--fs-xs);color:var(--text-02);}\n/* 底部协议 */\n.nsk-agree{display:flex;align-items:flex-start;gap:var(--sp-1);padding:var(--sp-2) var(--sp-4) 0;\n  font-size:var(--fs-xs);color:var(--text-02);}\n.nsk-agree__check{display:inline-flex;align-items:center;justify-content:center;width:14px;height:14px;\n  border-radius:50%;background:var(--brand-01);color:var(--text-04);font-size:var(--fs-xs);flex-shrink:0;\n  transition:background-color .15s,border-color .15s,color .15s,box-shadow .15s,opacity .15s;}\n.nsk-agree__check:hover{background:var(--brand-01-hover);}\n.nsk-agree__check:focus{outline:none;}\n.nsk-agree__check:focus-visible{box-shadow:var(--focus-ring);}\n.nsk-agree__check:active{background:var(--brand-02);}\n.nsk-agree__check[aria-checked=\"false\"]{background:var(--text-04);border:1px solid var(--line-01);color:var(--text-03);}\n/* 底部操作栏（第二轮：fixed 改 sticky 流内块，homebar 移入栏内） */\n.nsk-bottombar{position:sticky;bottom:0;width:auto;\n  background:var(--text-04);padding:var(--sp-3) var(--sp-4) var(--sp-5);display:flex;flex-wrap:wrap;gap:var(--sp-3);\n  row-gap:0;\n  box-shadow:var(--sh-sheet);z-index:9;border-top:1px solid var(--line-01)}\n.nsk-bottombar .nsk-btn{flex:1;}\n.nsk-bottombar .nsk-btn--primary{flex:1.4;}\n.nsk-homebar{position:static;flex-basis:100%;margin:var(--sp-1) auto 0;width:130px;height:5px;\n  border-radius:var(--r-tag);background:var(--text-01);opacity:.85;}\n/* ================================================================\n   可访问性\n   ================================================================ */\n@media (prefers-reduced-motion:reduce){\n  *,*::before,*::after{animation-duration:.01ms !important;animation-iteration-count:1 !important;\n    transition-duration:.01ms !important;scroll-behavior:auto !important;}\n}\n<\/style>\n<\/head>\n<body>\n<div class=\"proto-grid\" aria-hidden=\"true\"><\/div>\n<div class=\"proto-stage\">\n  <p class=\"proto-tag\" role=\"note\" aria-label=\"原型画布说明\">\n    <span class=\"proto-tag__dot\" aria-hidden=\"true\"><\/span>\n    <span class=\"proto-tag__name\">2.申请成为主理人<\/span>\n    <span class=\"proto-tag__sep\" aria-hidden=\"true\"><\/span>\n    <span class=\"proto-tag__size nsk-num\">390 × 844 · @1x<\/span>\n  <\/p>\n  <div class=\"proto-frame\">\n  <div class=\"nsk-page\" role=\"application\" aria-label=\"移动端预览容器\">\n  <!-- 状态栏 -->\n  <div class=\"nsk-statusbar\" aria-hidden=\"true\">\n    <span class=\"nsk-statusbar__time nsk-num\">9:41<\/span>\n    <span class=\"nsk-statusbar__icons\">\n      <svg class=\"nsk-icon\" width=\"17\" height=\"11\" viewBox=\"0 0 17 11\" aria-hidden=\"true\" focusable=\"false\"><rect x=\"0\" y=\"7\" width=\"3\" height=\"4\" rx=\"1\" fill=\"currentColor\"/><rect x=\"4.5\" y=\"5\" width=\"3\" height=\"6\" rx=\"1\" fill=\"currentColor\"/><rect x=\"9\" y=\"2.5\" width=\"3\" height=\"8.5\" rx=\"1\" fill=\"currentColor\"/><rect x=\"13.5\" y=\"0\" width=\"3\" height=\"11\" rx=\"1\" fill=\"currentColor\"/><\/svg>\n      <svg class=\"nsk-icon\" width=\"15\" height=\"11\" viewBox=\"0 0 15 11\" aria-hidden=\"true\" focusable=\"false\"><path d=\"M7.5 9.5 L9.6 7.2 A3.4 3.4 0 0 0 5.4 7.2 Z M11.2 5.5 A6 6 0 0 0 3.8 5.5 L2.2 3.8 A8.4 8.4 0 0 1 12.8 3.8 Z\" fill=\"currentColor\"/><path d=\"M13.9 1.9 A10 10 0 0 0 1.1 1.9 L0 0.6 A11.6 11.6 0 0 1 15 0.6 Z\" fill=\"currentColor\"/><\/svg>\n      <svg class=\"nsk-icon\" width=\"25\" height=\"12\" viewBox=\"0 0 25 12\" aria-hidden=\"true\" focusable=\"false\"><rect x=\"0.5\" y=\"0.5\" width=\"21\" height=\"11\" rx=\"3\" fill=\"none\" stroke=\"currentColor\" opacity=\".4\"/><rect x=\"2\" y=\"2\" width=\"18\" height=\"8\" rx=\"1.8\" fill=\"currentColor\"/><path d=\"M23 4 v4 a2 2 0 0 0 0-4z\" fill=\"currentColor\" opacity=\".4\"/><\/svg>\n    <\/span>\n  <\/div>\n\n  <!-- 导航栏 -->\n  <header class=\"nsk-navbar\">\n    <button type=\"button\" class=\"nsk-iconbtn\" aria-label=\"返回\">\n      <svg class=\"nsk-icon\" width=\"32\" height=\"32\" viewBox=\"0 0 32 32\" aria-hidden=\"true\" focusable=\"false\"><path d=\"M20 8 L12 16 L20 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><\/svg>\n    <\/button>\n    <h1 class=\"nsk-navbar__title\">申请成为主理人<\/h1>\n    <button type=\"button\" class=\"nsk-btn nsk-btn--text-brand\" aria-label=\"查看申请记录\">申请记录<\/button>\n  <\/header>\n\n  <!-- 顶部 Hero -->\n  <section class=\"nsk-hero\" aria-labelledby=\"nsk-hero-title\">\n    <p class=\"nsk-hero__eyebrow\">ONE COMMUNITY CREATOR<\/p>\n    <h2 class=\"nsk-hero__title\" id=\"nsk-hero-title\">把热爱变成连接<br>让城市因你更有趣<\/h2>\n    <p class=\"nsk-hero__desc\">发起社群、组织活动，与邻里共创有趣的社区生活<\/p>\n    <span class=\"nsk-hero__medal\" role=\"img\" aria-label=\"占位图：主理人等级徽章\">\n      <span class=\"nsk-hero__medal-num nsk-num\">1<\/span>\n      <span class=\"nsk-hero__medal-label\">主理人<\/span>\n    <\/span>\n  <\/section>\n\n  <!-- 步骤 -->\n  <ol class=\"nsk-steps\" aria-label=\"申请步骤\">\n    <li class=\"nsk-steps__item is-current\" aria-current=\"step\">\n      <span class=\"nsk-steps__dot nsk-num\">1<\/span>\n      <span class=\"nsk-steps__label\">提交资料<\/span>\n    <\/li>\n    <li class=\"nsk-steps__item\">\n      <span class=\"nsk-steps__dot nsk-num\">2<\/span>\n      <span class=\"nsk-steps__label\">城市审核<\/span>\n    <\/li>\n    <li class=\"nsk-steps__item\">\n      <span class=\"nsk-steps__dot nsk-num\">3<\/span>\n      <span class=\"nsk-steps__label\">认证开通<\/span>\n    <\/li>\n  <\/ol>\n\n  <!-- 01 基础信息 -->\n  <section class=\"nsk-section\" aria-labelledby=\"nsk-sec-01\">\n    <header class=\"nsk-section__head\">\n      <span class=\"nsk-section__no nsk-num\">01<\/span>\n      <h3 class=\"nsk-section__title\" id=\"nsk-sec-01\">基础信息<\/h3>\n      <span class=\"nsk-section__note\">用于审核及活动对接联系<\/span>\n    <\/header>\n    <dl class=\"nsk-fields\">\n      <dt class=\"nsk-field__label\">申请来源<\/dt>\n      <dd class=\"nsk-field__value\">微信小程序申请<\/dd>\n      <dt class=\"nsk-field__label\">姓名<\/dt>\n      <dd class=\"nsk-field__value\">林晓夏<\/dd>\n      <dt class=\"nsk-field__label\">联系方式<\/dt>\n      <dd class=\"nsk-field__value\"><span class=\"nsk-num\">138 **** 6606<\/span><\/dd>\n      <dt class=\"nsk-field__label\" id=\"nsk-label-idcard\">身份证号<\/dt>\n      <dd class=\"nsk-field__value nsk-field__value--box\">\n        <input class=\"nsk-field__control nsk-field__control--single nsk-num\" id=\"nsk-input-idcard\" type=\"text\" inputmode=\"numeric\" autocomplete=\"off\" maxlength=\"18\" aria-labelledby=\"nsk-label-idcard\" placeholder=\"请输入身份证号，用于实名佣金结算\">\n      <\/dd>\n      <dt class=\"nsk-field__label\" id=\"nsk-label-code\">验证码<\/dt>\n      <dd class=\"nsk-field__value\" aria-labelledby=\"nsk-label-code\">\n        <span class=\"nsk-num\">926518<\/span>\n        <button type=\"button\" class=\"nsk-btn nsk-btn--outline nsk-btn--sm\" aria-describedby=\"nsk-label-code\">获取验证码<\/button>\n      <\/dd>\n      <dt class=\"nsk-field__label\">所在城市<\/dt>\n      <dd class=\"nsk-field__value\">深圳<\/dd>\n    <\/dl>\n    <div class=\"nsk-field__grid\">\n      <div>\n        <span class=\"nsk-field__label\" id=\"nsk-label-age\">年龄区间<\/span>\n        <p class=\"nsk-field__value\"><button type=\"button\" class=\"nsk-field__select\" aria-haspopup=\"listbox\" aria-expanded=\"false\" aria-labelledby=\"nsk-label-age\">26 – 35岁<span aria-hidden=\"true\">⌄<\/span><\/button><\/p>\n      <\/div>\n      <div>\n        <span class=\"nsk-field__label\" id=\"nsk-label-gender\">性别<\/span>\n        <p class=\"nsk-field__value\"><button type=\"button\" class=\"nsk-field__select\" aria-haspopup=\"listbox\" aria-expanded=\"false\" aria-labelledby=\"nsk-label-gender\">女<span aria-hidden=\"true\">⌄<\/span><\/button><\/p>\n      <\/div>\n    <\/div>\n    <div>\n      <span class=\"nsk-field__label\" id=\"nsk-label-role\">当前身份<\/span>\n      <p class=\"nsk-field__value\"><button type=\"button\" class=\"nsk-field__select\" aria-haspopup=\"listbox\" aria-expanded=\"false\" aria-labelledby=\"nsk-label-role\">招商业主<span aria-hidden=\"true\">⌄<\/span><\/button><\/p>\n    <\/div>\n  <\/section>\n\n  <!-- 02 主理方向 -->\n  <section class=\"nsk-section\" aria-labelledby=\"nsk-sec-02\">\n    <header class=\"nsk-section__head\">\n      <span class=\"nsk-section__no nsk-num\">02<\/span>\n      <h3 class=\"nsk-section__title\" id=\"nsk-sec-02\">主理方向<\/h3>\n      <span class=\"nsk-section__note\">可多选，将匹配运营支撑<\/span>\n    <\/header>\n    <p class=\"nsk-field__label nsk-field__label--strong\" id=\"nsk-label-direction\">计划运营的主理方向<span class=\"nsk-field__req\" aria-hidden=\"true\">*<\/span><\/p>\n    <div class=\"nsk-chips\" role=\"group\" aria-labelledby=\"nsk-label-direction\">\n      <button type=\"button\" class=\"nsk-chip is-selected\" aria-pressed=\"true\">✓ 滨海运动<\/button>\n      <button type=\"button\" class=\"nsk-chip is-selected\" aria-pressed=\"true\">✓ 城市共创<\/button>\n      <button type=\"button\" class=\"nsk-chip\" aria-pressed=\"false\">文化艺术<\/button>\n      <button type=\"button\" class=\"nsk-chip\" aria-pressed=\"false\">亲子成长<\/button>\n      <button type=\"button\" class=\"nsk-chip\" aria-pressed=\"false\">国际交流<\/button>\n      <button type=\"button\" class=\"nsk-chip\" aria-pressed=\"false\">志愿服务<\/button>\n    <\/div>\n    <p class=\"nsk-field__label nsk-field__label--strong\" id=\"nsk-label-advantage\" style=\"margin-top:var(--sp-2);\">申请优势 <span style=\"color:var(--text-02);font-weight:400;\">选填<\/span><\/p>\n    <textarea class=\"nsk-field__control\" rows=\"3\" aria-labelledby=\"nsk-label-advantage\" aria-describedby=\"nsk-counter-advantage\" maxlength=\"200\" style=\"min-height:72px;\">希望连接更多热爱运动与城市生活的人，让好点子在路口真正发生。有社群组织经验，可链接运动教练、公共空间及社区志愿者资源。<\/textarea>\n    <p class=\"nsk-field__counter nsk-num\" id=\"nsk-counter-advantage\">59/200<\/p>\n    <button type=\"button\" class=\"nsk-upload nsk-upload--block\" aria-label=\"上传申请资料，支持 JPG、PNG、PDF，单个文件不超过 5MB\">\n      <span class=\"nsk-upload__icon\" aria-hidden=\"true\">\n        <svg class=\"nsk-icon\" width=\"22\" height=\"22\" viewBox=\"0 0 22 22\" aria-hidden=\"true\" focusable=\"false\"><path d=\"M6 15 a4 4 0 0 1 .6-8 A5.5 5.5 0 0 1 17 8.5 a3.5 3.5 0 0 1-.5 6.5\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\"/><path d=\"M11 18 v-6 M8.5 14 L11 11.5 L13.5 14\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><\/svg>\n      <\/span>\n      <span>\n        <span class=\"nsk-upload__title\">上传申请资料<\/span>\n        <span class=\"nsk-upload__desc\">活动照片、作品、证书或运营案例<br>JPG / PNG / PDF，单个文件不超过5MB<\/span>\n      <\/span>\n    <\/button>\n  <\/section>\n\n  <!-- 底部协议 -->\n  <div class=\"nsk-agree\">\n    <button type=\"button\" class=\"nsk-agree__check\" role=\"checkbox\" aria-checked=\"true\" aria-label=\"我已阅读并同意《主理人申请须知》与《个人信息保护规则》\">✓<\/button>\n    <span>我已阅读并同意 <button type=\"button\" class=\"nsk-btn nsk-btn--link\" aria-label=\"查看《主理人申请须知》\">《主理人申请须知》<\/button> 与 <button type=\"button\" class=\"nsk-btn nsk-btn--link\" aria-label=\"查看《个人信息保护规则》\">《个人信息保护规则》<\/button><\/span>\n  <\/div>\n\n  <!-- 底部按钮 -->\n  <div class=\"nsk-bottombar\">\n    <button type=\"button\" class=\"nsk-btn nsk-btn--secondary\">返回<\/button>\n    <button type=\"button\" class=\"nsk-btn nsk-btn--primary\" id=\"submit-apply-btn\">提交申请<\/button>\n    <div class=\"nsk-homebar\" aria-hidden=\"true\"><\/div>\n  <\/div>\n  <\/div>\n  <\/div>\n  <p class=\"proto-foot\">招商荟有家 · C 端主理人 移动端原型<\/p>\n<\/div>\n\n<script>\n/* 仅维护状态属性，不改变文案与结构（§6 Selected / §8.3） */\n(function(){\n  var chips = document.querySelectorAll('.nsk-chip');\n  chips.forEach(function(chip){\n    chip.addEventListener('click', function(){\n      var on = chip.getAttribute('aria-pressed') !== 'true';\n      chip.setAttribute('aria-pressed', String(on));\n      chip.classList.toggle('is-selected', on);\n    });\n  });\n  var selects = document.querySelectorAll('.nsk-field__select');\n  selects.forEach(function(sel){\n    sel.addEventListener('click', function(){\n      var open = sel.getAttribute('aria-expanded') !== 'true';\n      selects.forEach(function(s){ s.setAttribute('aria-expanded', 'false'); });\n      sel.setAttribute('aria-expanded', String(open));\n    });\n  });\n  var agree = document.querySelector('.nsk-agree__check');\n  if (agree){\n    agree.addEventListener('click', function(){\n      agree.setAttribute('aria-checked', agree.getAttribute('aria-checked') === 'true' ? 'false' : 'true');\n    });\n  }\n})();\n\n/* 身份证号：提交前明文可编辑；提交后按「前 3 后 4」掩码展示（中间每位一个 *） */\n(function(){\n  var input = document.getElementById('nsk-input-idcard');\n  var submit = document.getElementById('submit-apply-btn');\n  if (!input || !submit) return;\n\n  /* 掩码规则：保留前 3 位与后 4 位，中间每一位替换为一个 *；\n     位数不足时 head / tail 按实际可取位数收窄，hidden 最小为 0，不会多出或缺失星号 */\n  function maskId(value){\n    var s = String(value || '').replace(/\\s+/g, '');\n    var head = Math.min(3, s.length);\n    var tail = Math.min(4, s.length - head);\n    var hidden = s.length - head - tail;\n    return s.slice(0, head) + '*'.repeat(Math.max(0, hidden)) + s.slice(head + hidden);\n  }\n\n  submit.addEventListener('click', function(){\n    var raw = input.dataset.raw || input.value;\n    if (!String(raw).replace(/\\s+/g, '')) return;   /* 未填写（非必填）时不处理 */\n    input.dataset.raw = String(raw).replace(/\\s+/g, '');\n    input.value = maskId(input.dataset.raw);\n    input.setAttribute('readonly', 'readonly');\n  });\n})();\n<\/script>\n\n<!--\n================================================================\n本次修改点（依据：one蛇口组件系统.sketch / nsk_standard.md）\n================================================================\n【令牌 §1 色彩】删除全部非 token 色（#111/#333/#222/#555/#666/#999/#8a909c/#9aa0ab/#e8f1ff/#f4f6f9/#fafcff/#eef4ff/#c9d6ea/#9cc2fa/#7fb0f7/#1e6ef5/#3f9bff/#f04438/#e9ebf0/#f2f3f7/#f0f1f5 等），统一走 :root 令牌：正文标题 → --text-01，次级文字 → --text-02，置灰计数 → --text-03，分割线 → --line-01，页面底 → --bg-page，卡片白 → --text-04，必填星号 → --danger。\n【令牌 §1 色彩】Hero 渐变改为 linear-gradient(120deg,var(--brand-01),var(--brand-02) 70%)（原 #3f9bff→#1e6ef5）；底部主按钮渐变改为 --brand-01 实底；上传区描边 --brand-03 / 底 --brand-04；Chip 选中底 --brand-04 + 描边 --brand-03 + 字 --brand-01。\n【令牌 §1 色彩】冲突色就近映射：原 #f04438（必填星号）→ --danger；原 #e8930c / #c77700 类告警色本页未出现，第 3 页同类已按 token 处理。\n【令牌 §2 字体】13 处阶梯外字号收敛进 18/16/14/12/10：22（英雄标题 / 徽章数字）→ 18；17（导航栏标题）→ 16；15（步骤序号、区块编号同系）→ 14；13（Chip 文字）→ 14；11（区块说明、上传说明、字数计数、协议文案）→ 10；9（勾选对钩）→ 10；正文 14 保持不变。\n【令牌 §2 字体】数字统一套 --font-num + .nsk-num：9:41、926518、138 **** 6606、区块编号 01/02/03/04、步骤 1/2/3、徽章 1、字数计数 34/200、37/200、40/100。\n【令牌 §3 圆角】全部圆角收敛到 22/16/12/8/2：Hero → --r-sheet 16，步骤卡 / 区块卡 / 上传区 / 图标底 → --r-card 12，输入框与热区按钮 → --r-ctl 8，homebar → --r-tag 2，按钮与 Chip / nsk-btn--outline / nsk-bottombar / nsk-agree / nsk-homebar），状态类用 is- 前缀；属性顺序按 class → id → 功能属性 → role → aria-*。\n【语义化 §8.2】.phone → .nsk-page(role=\"application\")；.statusbar → .nsk-statusbar(aria-hidden)；.nav → <header class=\"nsk-navbar\">；.sec → <section class=\"nsk-section\">；字段列表改 <dl>/<dt>/<dd>；步骤改 <ol class=\"nsk-steps\"> + <li>；可点 span 全部改 <button>；标题层级 h1 页面 → h2 Hero → h3 区块，不跳级；装饰 SVG 全部 aria-hidden=\"true\" focusable=\"false\"。\n【可访问性 §8.3】补齐 role=\"application\"/\"checkbox\"/\"group\"/\"img\"、aria-label、aria-pressed、aria-checked、aria-expanded、aria-haspopup、aria-labelledby、aria-describedby、aria-current=\"step\"、aria-hidden；三个 textarea 均带 aria-labelledby + aria-describedby + maxlength；增加仅维护属性的脚本（Chip aria-pressed/is-selected、下拉 aria-expanded、协议勾选 aria-checked），不改变原有文案与结构。\n【结构 §8.4】文件结构按 DOCTYPE → meta(charset/viewport/theme-color #387DEC) → title → style(令牌→重置→通用组件→局部样式→可访问性) → body(.nsk-page) → 末尾改动说明注释 重排；单文件自包含，未引任何外部资源。\n【冲突点】① 原稿导航栏标题 17px、Hero 标题 22px 超出 §2 字号阶梯，降为 16 / 18；② 原稿底部栏与步骤卡使用自定义阴影与半透明底，§4 只给 --sh-card / --sh-sheet，已就近替换；③ 原稿 Chip 用 999 圆角与 #f4f6f9 底，非 §1/§3 尺度，改为 --r-pill 22 + --bg-page 底。\n================================================================\n-->\n\n<!-- 第二轮修改点（空白区域修复）：\n【A 底栏】.nsk-page 删除 min-height:100vh、padding-bottom 96→0；.nsk-bottombar 去掉 fixed/left:50%/transform/max-width，改 position:sticky;bottom:0;width:auto 流内块（保留白底/--sh-sheet/原内边距）；.nsk-homebar 不再 fixed，HTML 移入 .nsk-bottombar 内部（flex-basis:100% 居中，row-gap:0）。按钮紧随协议区之后，不再有大片空白。\n【C 密度】未发现重复区块；逐项收紧：状态栏 padding sp-3→sp-2、导航栏 sp-2→sp-1（总高≈83）；Hero padding sp-5/sp-4/72px→sp-3/sp-3/48px、标题与描述 margin sp-2→sp-1、徽章 72→56；步骤卡 -48px→-44px、padding sp-4→sp-2；区块 padding sp-4→sp-3；字段 label margin-top sp-3→sp-1、value margin-top/padding-bottom→2px、textarea min-height 88→56 且 rows 3→2、counter margin-top→2px；chips gap/margin-top 收至 sp-1；上传区 padding sp-4→sp-2、icon 44→40；协议区 padding-top sp-4→sp-2；行内 margin（申请理由/社群名称/社群简介 label）同步收紧。实测内容高度 2216→1758（字号令牌冻结下的密度下限，按规范兜底条款处理，未删任何内容）。\n【D inline】无（.nsk-upload__title/__desc 已 display:block，.nsk-field__value 已 flex，未发现 inline 容器包元素子节点导致塌陷）。\n【E 占位】无（hero 徽章 radial 渐变、上传图标白底均可见，无裸占位）。\n-->\n\n<!-- 第三轮修改点（背景框一致性修补，依据：one蛇口组件系统.sketch / nsk_standard.md）\n【§5 底栏】.nsk-bottombar 已有白底与 --sh-sheet，但缺 1px 上边框 → 补 border-top:1px solid var(--line-01)，与 4/5-1/8/9/11/12 页底栏三件套（白底 + 上边框 + 阴影）统一。\n-->\n\n<!-- 第四轮修改点（原型画布背景，依据：figma-to-html 原型展示规范 / nsk_standard.md 令牌）\n【新增 .proto-* 组件】仅在 .nsk-page 外增加「桌面画布 + 设备框」展示层：body 由 --bg-page 改为浅灰渐变画布（#F8FAFD→#E9EEF5，顶部径向提亮），fixed 蓝色细网格层 .proto-grid（radial-gradient 蒙版淡出，pointer-events:none）；\n【新增 .proto-* 组件】.proto-stage（390px 居中舞台）+ .proto-tag（顶部胶囊标签：页面名 + 「390 × 844 · @1x」规格）+ .proto-frame（28px 圆角设备框，overflow:hidden，三层阴影 0 28px 64px rgba(23,43,77,.16)）+ .proto-foot（框下说明「招商荟有家 · C 端主理人 移动端原型」）。\n【兼容性】@media (max-width:430px) 时画布/网格/标签/说明隐藏、设备框去圆角去阴影，退化为原 390px 纯移动端预览，响应式行为不变；\n【不变项】.nsk-page 及全部业务组件（Hero/步骤/区块/表单/Chips/底栏）、文案、ARIA、令牌零改动；.nsk-page 原有样式未动，仅外层包裹；横向溢出 0，内容总高 1911px（880×1920 视口）。\n整页截图输出：/Users/qianyu/Desktop/C 端主理人/页面截图/2.申请成为主理人.png（880×1920 CSS @2x=1760×3840）。\n-->\n\n<!-- 第五轮修改点（表单字段调整：合并申请优势、精简区块）\n【02 主理方向 · 合并】原「申请理由」（textarea + 34/200 计数）与「资源优势」（textarea + 37/200 计数）两块删除，合并为「申请优势」一个文本输入框（textarea，maxlength 200 不变，aria-labelledby=nsk-label-advantage / aria-describedby=nsk-counter-advantage，计数器 59/200 按合并后实际字数 30+29=59 重算）；因合并文案 59 字超出 rows=2 的 2 行容量，该 textarea 设 rows=\"3\" + min-height:72px，保证文案完整可见不截断。\n【02 主理方向 · 非必填】「申请优势」标签后按本页既有「社群标签 最多3个」的行内提示写法补 <span style=\"color:var(--text-02);font-weight:400;\">选填<\/span>，并去掉原两块标签上的 --danger 必填星号；本区块内仅保留「计划运营的主理方向」的必填星号（必填语义未变）。\n【02 主理方向 · 新增上传框】在文本输入框下新增一个上传资料框（复用既有 .nsk-upload / .nsk-upload--block 组件与其图标 SVG，未新增样式类）：标题「上传申请资料」、说明沿用「活动照片、作品、证书或运营案例 / JPG / PNG / PDF，单个文件不超过5MB」，同样为非必填。\n【删除 03 能力证明】整块 <section class=\"nsk-section\" aria-labelledby=\"nsk-sec-03\"> 连注释一并删除，含标题「能力证明」、说明「选填，帮助审核更了解你」与上传证明材料按钮；其上传组件已在 02 复用，样式无残留。\n【删除 04 社群资料】整块 <section class=\"nsk-section\" aria-labelledby=\"nsk-sec-04\"> 连注释一并删除，含标题、说明及社群封面 / 社群名称 / 社群分类 / 运营城市 / 所在片区 / 社群简介 / 社群标签全部表单元素。\n【连贯性】剩余区块编号自动连续为 01 基础信息 → 02 主理方向（无 03/04 空号）；步骤条 1 提交资料 / 2 城市审核 / 3 认证开通 与 01/02 无耦合，未改动；02 区块内 方向 Chips → 申请优势 → 上传框 的间距沿用既有 inline margin-top:var(--sp-2)。\n【残留检查】无空 <section>/空容器；无悬空 aria-labelledby/describedby 引用；无失效 id；删除模块未产生孤儿样式类（.nsk-upload*/.nsk-chip*/.nsk-field__grid 等仍被 01/02 使用）。历史改动说明注释按原样保留，未回改。\n-->\n\n<!-- 第六轮修改点（01 基础信息 · 新增身份证号字段，2026-10-30）\n【新增位置】01 基础信息区块 <dl class=\"nsk-fields\"> 内，「联系方式」行下方新增一组 dt/dd：「身份证号」；未改动任何既有 HTML 行的文案与顺序。\n【结构 / 样式】沿用本页既有表单规范：dt 用 .nsk-field__label（12px --text-02 小标签，与相邻行一致，无必填星号）；输入框用 §6 表单控件 .nsk-field__control 的线性变体 —— .nsk-field__control--single（去掉四周描边与圆角、背景透明，仅保留底部 1px --line-01 直线，高 32；hover 底线转 --brand-03、focus 底线转 --brand-01 且不带 focus ring），与「申请来源 / 姓名 / 联系方式 / 验证码」等同区块字段的下划线视觉一致；容器 .nsk-field__value--box 去掉 dd 自带下划线，避免与输入框底线叠加成双线。数字统一 .nsk-num 等宽。\n【占位文案】placeholder=\"请输入身份证号，用于实名佣金结算\"；maxlength=18、inputmode=\"numeric\"、autocomplete=\"off\"、aria-labelledby=nsk-label-idcard，非必填故无 aria-required / 必填校验。\n【提交前】type=\"text\" 明文输入框，可正常输入、聚焦光标正常、已填内容完整清晰可见（无长度截断、无自动掩码）。\n【提交后】#submit-apply-btn click → 读取 input.value（dataset.raw 兜底重复点击）→ maskId() 按「前 3 + 后 4」保留、中间每位一个 * → 写回 value 并置 readonly；位数不足时 head=min(3,len)、tail=min(4,len-head)、hidden=len-head-tail（≥0），例如 18 位 → 3+11 个 * + 4；8 位 → 3+1 个 * + 4；不足 8 位则按实际位数收敛、不产生多余或缺失星号；原始值存于 dataset.raw 便于回显。\n【零影响】未修改任何既有 CSS 规则（仅新增 2 条修饰类），未触碰 chips / select / agree / textarea 等既有交互脚本（新增脚本为独立 IIFE），04/05 轮的历史改动说明按原样保留。\n-->\n\n<script>\n(function(){\n  var ID=\"p2\";\n  var MAP={\"1.主理人中心.html\": \"p1\", \"11.主理人创建社群.html\": \"p11\", \"12.主理人管理社群可基于社群创建活动.html\": \"p12\", \"13.主理人社群成员列表.html\": \"p13\", \"2.申请成为主理人.html\": \"p2\", \"3-1.查看申请记录.html\": \"p31\", \"3.申请提交页面.html\": \"p3\", \"4.主理人发布活动-改版.html\": \"p4\", \"8.主理人查看活动-改版.html\": \"p8\", \"9.活动报名名单-改版.html\": \"p9\"};\n  function go(id){try{parent.postMessage({__demoNav:id},'*');}catch(e){}}\n  window.__demoGo=go;\n  window.__demoBlocked=function(f){alert('「'+f+'」未包含在本次合并的原型范围内');};\n  document.addEventListener('click',function(e){\n    var t=e.target;\n    var a=t&&t.closest?t.closest('a[href]'):null;\n    if(!a)return;\n    var h=a.getAttribute('href')||'';\n    if(!/\\.html(\\?|#|$)/.test(h))return;\n    e.preventDefault();e.stopPropagation();\n    if(MAP[h]){go(MAP[h]);}else{window.__demoBlocked(h);}\n  },true);\n  function allBtns(){return document.querySelectorAll('button,[role=\"button\"],a');}\n  function hookText(txt,id,delay,toast){\n    allBtns().forEach(function(b){\n      if(b.__dh)return;\n      if((b.textContent||'').replace(/\\s+/g,'').indexOf(txt)>-1){\n        b.__dh=1;\n        b.addEventListener('click',function(){setTimeout(function(){\n          if(toast){alert(toast);return;}\n          if(id)go(id);\n        },delay||0);});\n      }\n    });\n  }\n  function hookAria(prefix,id){\n    document.querySelectorAll('[aria-label]').forEach(function(b){\n      if(b.__dh)return;\n      if((b.getAttribute('aria-label')||'').indexOf(prefix)===0){\n        b.__dh=1;\n        b.addEventListener('click',function(){go(id);});\n      }\n    });\n  }\n  hookText('提交申请','p3');\nhookAria('查看申请记录','p31');\n  var BACK={\"p11\": \"p1\", \"p12\": \"p1\", \"p13\": \"p12\", \"p2\": \"p1\", \"p3\": \"p2\", \"p31\": \"p3\", \"p4\": \"p1\", \"p8\": \"p1\", \"p9\": \"p8\"}[ID];\n  var bk=document.querySelector('.nsk-navbar__back,.c-navbar__back');\n  if(bk&&BACK){bk.addEventListener('click',function(e){e.stopPropagation();e.preventDefault();go(BACK);});}\n  /* 2x 设计板页面（社群系列）按画板宽度等比缩放适配容器 */\n  var BOARD=0;\n  if(BOARD){\n    (function(){\n      var st=document.createElement('style');\n      st.textContent='html{overflow-x:hidden!important}body{margin:0 auto!important;zoom:'+(430/BOARD).toFixed(4)+'}';\n      document.head.appendChild(st);\n      var lastW=-1;\n      function fit(){\n        var w=document.documentElement.clientWidth||window.innerWidth||0;\n        if(w>0&&w!==lastW){\n          lastW=w;\n          document.body.style.zoom=(w/BOARD).toFixed(4);\n        }\n      }\n      window.__demoFit=fit;\n      fit();\n      window.addEventListener('resize',fit);\n      window.addEventListener('load',fit);\n      if(window.ResizeObserver){try{new ResizeObserver(fit).observe(document.documentElement);}catch(e){}}\n      /* 轮询自愈：任何事件时机漏掉（如 iframe 隐藏期未量到宽度）都会在下一拍补上 */\n      setInterval(fit,200);\n    })();\n  }\n})();\n<\/script>\n<\/body>\n<\/html>\n"

  "p3": {
    "title": "申请提交",
    "html": "<!DOCTYPE html>\n<html lang=\"zh-CN\">\n<head>\n<meta charset=\"UTF-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n<meta name=\"theme-color\" content=\"#387DEC\">\n<title>主理人申请<\/title>\n<style>\n/* ================================================================\n   设计令牌（§1 色彩 / §2 字体 / §3 圆角 / §4 阴影 / §0 4px 栅格）\n   ================================================================ */\n:root{\n  /* §1 色彩 */\n  --brand-01:#387DEC;   /* Brand01 常规 Default */\n  --brand-02:#0855D1;   /* Brand02 点击 Pressed */\n  --brand-03:#9BBEF5;   /* Brand03 一般禁用 Disabled */\n  --brand-04:#E0ECFF;   /* Brand04 文字禁用 / Tag 蓝底 */\n  --text-01:#303133;    /* Text01 强调·正文标题 */\n  --text-02:#909399;    /* Text02 次强调·正文次要·图标描边 */\n  --text-03:#C0C4CC;    /* Text03 置灰·禁用信息 */\n  --text-04:#FFFFFF;    /* Text04 纯白文字 */\n  --line-01:#EBEBEB;    /* Line01 分割线 */\n  --bg-page:#F2F5F7;    /* 页面背景 */\n  --success-01:#10A17C;\n  --success-02:#E6F7F2;\n  --huidou-01:#F76346;  /* huidou01 荟豆主题色 */\n  --huidou-02:#FFE7E6;  /* huidou02 荟豆浅底 */\n  --danger:#EB4A38;     /* Danger 错误态 */\n  /* §1 派生值 */\n  --brand-01-hover:#2C71DE;\n  --danger-bg:#FDECEA;\n  --row-hover:#FAFBFC;      /* §6 Hover 可点行底 */\n  --fill-disabled:#F7F8FA;  /* §6 Disabled 输入类背景 */\n  --focus-ring:0 0 0 2px rgba(56,125,236,.24);\n  /* §2 字体 */\n  --font-cn:\"PingFang SC\",\"苹方-简\",-apple-system,BlinkMacSystemFont,\"Helvetica Neue\",sans-serif;\n  --font-num:\"Source Han Sans SC\",\"思源黑体\",\"PingFang SC\",-apple-system,BlinkMacSystemFont,sans-serif;\n  --fs-xl:18px; --fs-lg:16px; --fs-md:14px; --fs-sm:12px; --fs-xs:10px;\n  --lh-title:1.3; --lh-body:1.4; --lh-num:1.2;\n  /* §3 圆角 */\n  --r-pill:22px; --r-sheet:16px; --r-card:12px; --r-ctl:8px; --r-tag:2px;\n  /* §4 阴影 */\n  --sh-card:0 1px 6px rgba(0,0,0,.02);\n  --sh-sheet:0 -2px 16px rgba(0,0,0,.08);\n  /* §0 间距栅格 */\n  --sp-1:4px; --sp-2:8px; --sp-3:12px; --sp-4:16px; --sp-5:20px; --sp-6:24px; --sp-8:32px;\n}\n/* ================================================================\n   基础重置\n   ================================================================ */\n*,*::before,*::after{box-sizing:border-box;}\nhtml{-webkit-text-size-adjust:100%;}\nbody{margin:0;padding:0;background:var(--bg-page);font-family:var(--font-cn);font-size:var(--fs-md);\n  line-height:var(--lh-body);color:var(--text-01);-webkit-font-smoothing:antialiased;\n  -webkit-tap-highlight-color:transparent;}\nh1,h2,h3,h4,h5,h6{margin:0;font-size:inherit;font-weight:600;line-height:var(--lh-title);}\np{margin:0;}\nul,ol,dl,dd{margin:0;padding:0;list-style:none;}\nbutton{font-family:inherit;font-size:inherit;color:inherit;background:none;border:0;margin:0;padding:0;cursor:pointer;}\nsvg{display:block;}\n.nsk-num{font-family:var(--font-num);font-variant-numeric:tabular-nums;line-height:var(--lh-num);}\n/* ================================================================\n   通用组件\n   ================================================================ */\n/* 页面容器 / 状态栏 / 导航栏（§5） */\n.nsk-page{position:relative;max-width:390px;margin:0 auto;background:var(--bg-page);padding-bottom:0;}\n.nsk-statusbar{display:flex;align-items:center;justify-content:space-between;padding:var(--sp-2) var(--sp-6) var(--sp-1);color:var(--text-01);}\n.nsk-statusbar__time{font-size:var(--fs-lg);font-weight:600;}\n.nsk-statusbar__icons{display:flex;align-items:center;gap:var(--sp-1);}\n.nsk-navbar{display:flex;align-items:center;justify-content:space-between;gap:var(--sp-2);padding:var(--sp-1) var(--sp-4);}\n.nsk-navbar__title{font-size:var(--fs-lg);font-weight:600;color:var(--text-01);text-align:center;flex:1;}\n.nsk-navbar__spacer{width:44px;flex-shrink:0;}\n.nsk-icon{color:inherit;}\n.nsk-icon--inv{fill:var(--text-04);stroke:var(--text-04);}\n.nsk-icon--inv-stroke{fill:none;stroke:var(--text-04);}\n.nsk-ico--brand{color:var(--brand-01);}\n.nsk-ico--muted{color:var(--text-02);}\n.nsk-ico--huidou{color:var(--huidou-01);}\n.nsk-ico--on-brand{color:var(--text-04);}\n/* 按钮（§5 Button：高 44 / 圆角 22 胶囊 / 文字 16 Semibold） */\n.nsk-btn{display:inline-flex;align-items:center;justify-content:center;gap:var(--sp-1);\n  min-height:44px;padding:0 var(--sp-6);border-radius:var(--r-pill);\n  font-size:var(--fs-lg);font-weight:600;line-height:1;border:1px solid transparent;\n  transition:background-color .15s,border-color .15s,color .15s,box-shadow .15s,opacity .15s;}\n.nsk-btn:focus{outline:none;}\n.nsk-btn:focus-visible{box-shadow:var(--focus-ring);}\n.nsk-btn--primary{background:var(--brand-01);color:var(--text-04);}\n.nsk-btn--primary:hover{background:var(--brand-01-hover);}\n.nsk-btn--primary:active{background:var(--brand-02);transform:scale(.98);}\n.nsk-btn--secondary{background:transparent;border-color:var(--brand-01);color:var(--brand-01);}\n.nsk-btn--secondary:hover{border-color:var(--brand-01-hover);color:var(--brand-01-hover);}\n.nsk-btn--secondary:active{border-color:var(--brand-02);color:var(--brand-02);transform:scale(.98);}\n.nsk-btn--outline{background:var(--brand-04);border-color:var(--brand-03);color:var(--brand-01);}\n.nsk-btn--outline:hover{border-color:var(--brand-01-hover);color:var(--brand-01-hover);}\n.nsk-btn--outline:active{border-color:var(--brand-02);color:var(--brand-02);}\n.nsk-btn--rect{border-radius:var(--r-ctl);}\n.nsk-btn--text-brand{min-height:32px;padding:0 var(--sp-2);border-radius:var(--r-ctl);\n  font-size:var(--fs-md);font-weight:400;color:var(--brand-01);}\n.nsk-btn--text-brand:hover{color:var(--brand-01-hover);background:var(--row-hover);}\n.nsk-btn--text-brand:active{color:var(--brand-02);}\n.nsk-btn--sm{min-height:32px;padding:0 var(--sp-3);font-size:var(--fs-sm);}\n.nsk-btn--block{display:flex;width:100%;}\n.nsk-btn[disabled],.nsk-btn.is-disabled{cursor:not-allowed;pointer-events:none;}\n.nsk-btn--primary[disabled],.nsk-btn--primary.is-disabled{background:var(--brand-03);color:var(--text-04);}\n.nsk-btn--secondary[disabled],.nsk-btn--secondary.is-disabled{border-color:var(--line-01);color:var(--text-03);}\n.nsk-btn--outline[disabled],.nsk-btn--outline.is-disabled{background:var(--fill-disabled);border-color:var(--line-01);color:var(--text-03);}\n.nsk-btn.is-loading{pointer-events:none;opacity:.7;}\n.nsk-btn__spinner{width:14px;height:14px;border-radius:50%;border:2px solid currentColor;\n  border-top-color:transparent;animation:nsk-spin .6s linear infinite;}\n@keyframes nsk-spin{to{transform:rotate(360deg);}}\n/* 图标按钮（§5 返回图标 32×32，热区 ≥44×44） */\n.nsk-iconbtn{display:inline-flex;align-items:center;justify-content:center;width:44px;height:44px;\n  border-radius:var(--r-ctl);color:var(--text-01);\n  transition:background-color .15s,border-color .15s,color .15s,box-shadow .15s,opacity .15s;}\n.nsk-iconbtn:hover{background:var(--row-hover);}\n.nsk-iconbtn:focus{outline:none;}\n.nsk-iconbtn:focus-visible{box-shadow:var(--focus-ring);}\n.nsk-iconbtn:active{color:var(--brand-02);}\n.nsk-iconbtn[disabled],.nsk-iconbtn.is-disabled{color:var(--text-03);cursor:not-allowed;pointer-events:none;}\n/* 标签（§5 Tag：蓝 / 绿 / 荟豆） */\n.nsk-tag{display:inline-flex;align-items:center;height:20px;padding:0 var(--sp-1);\n  border-radius:var(--r-tag);font-size:var(--fs-sm);font-weight:600;line-height:1;white-space:nowrap;}\n.nsk-tag--blue{background:var(--brand-04);color:var(--brand-01);}\n.nsk-tag--green{background:var(--success-02);color:var(--success-01);}\n.nsk-tag--huidou{background:var(--huidou-02);color:var(--huidou-01);}\n/* 卡片 / 区块 / 列表（§5 卡片组） */\n.nsk-card{margin:var(--sp-3) var(--sp-4) 0;background:var(--text-04);border-radius:var(--r-card);\n  padding:var(--sp-3);box-shadow:var(--sh-card);border:1px solid var(--text-04);}\n.nsk-section{padding:var(--sp-3) var(--sp-4) var(--sp-1);}\n.nsk-section__title{font-size:var(--fs-lg);font-weight:600;color:var(--text-01);}\n.nsk-list__item{position:relative;}\n.nsk-list__action{position:absolute;inset:0;width:100%;height:100%;border-radius:var(--r-card);}\n.nsk-list__action:focus{outline:none;}\n.nsk-list__action:focus-visible{box-shadow h=\"14\" height=\"14\" viewBox=\"0 0 14 14\" aria-hidden=\"true\" focusable=\"false\"><circle cx=\"7\" cy=\"4.5\" r=\"2.5\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.3\"/><path d=\"M2.5 12.5 c0-2.6 2-4.2 4.5-4.2 s4.5 1.6 4.5 4.2\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.3\"/><\/svg>\n          当前身份\n        <\/dt>\n        <dd class=\"nsk-summary__value\">招商业主<\/dd>\n      <\/div>\n      <div class=\"nsk-summary__row\">\n        <dt class=\"nsk-summary__key\">\n          <svg class=\"nsk-icon nsk-ico--muted\" width=\"14\" height=\"14\" viewBox=\"0 0 14 14\" aria-hidden=\"true\" focusable=\"false\"><path d=\"M3 1.5 v11 M3 2 h8 l-2 2.5 2 2.5 H3\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.3\" stroke-linejoin=\"round\"/><\/svg>\n          主理方向\n        <\/dt>\n        <dd class=\"nsk-summary__value\">滨海运动、城市共创<\/dd>\n      <\/div>\n    <\/dl>\n  <\/section>\n\n  <!-- 底部按钮 -->\n  <div class=\"nsk-bottombar\">\n    <button type=\"button\" class=\"nsk-btn nsk-btn--secondary\">返回首页<\/button>\n    <button type=\"button\" class=\"nsk-btn nsk-btn--primary\" id=\"view-record-btn\">查看申请记录<\/button>\n    <div class=\"nsk-homebar\" aria-hidden=\"true\"><\/div>\n  <\/div>\n<\/div>\n\n<script>\n/* 底部主按钮 → 查看申请记录页（右上角入口已删除，跳转收敛到底部主按钮） */\n(function(){\n  var btn = document.getElementById('view-record-btn');\n  if (btn) { btn.addEventListener('click', function(){ __demoGo(\"p31\"); }); }\n})();\n<\/script>\n\n<!--\n================================================================\n本次修改点（依据：one蛇口组件系统.sketch / nsk_standard.md）\n================================================================\n【令牌 §1 色彩】删除全部非 token 色（#111/#555/#666/#9aa0ab/#8a909c/#e9ebf0/#f2f3f7/#f4f5f8/#eaf3ff/#f7faff/#eef4ff/#dce9ff/#9cc2fa/#7fb0f7/#1e6ef5/#2f7bf6/#1e5fd0/#4a6da8/#5b7ba6/#e8930c/#fdf3e0/#c77700/#fdf3dc/#f5b93d/#e09a1a/#ffd77a/#c9d0dc/#e3e8f0 等），统一走 :root 令牌。\n【令牌 §1 色彩】Banner 渐变改为 linear-gradient(115deg,var(--brand-01),var(--brand-02) 70%)（原 #3f9bff→#1e6ef5）；底部主按钮渐变改 --brand-01 实底；说明卡底 #eaf3ff → --brand-04、标题 #1e5fd0 → --brand-02、正文 #4a6da8 → --text-02。\n【令牌 §1 色彩】冲突色就近映射（本页无 warning 色）：「审核中」原橙 #e8930c/#fdf3e0 → Tag/blue（--brand-04 底 / --brand-01 字）；「认证通过后发放」原金 #c77700/#fdf3dc → Tag/荟豆（--huidou-02 底 / --huidou-01 字）；奖励金额与图标原 #f5b93d/#e09a1a/#ffd77a → --huidou-01 主色 + 透明度派生。\n【令牌 §2 字体】15 处阶梯外字号收敛进 18/16/14/12/10：20（Banner 标题）与 26（奖励金额）→ 18；17（导航栏标题、审核标题）→ 16；15（时间轴条目标题）与 13（摘要行）→ 14；11（步骤标签、徽章）→ 10/12；9 已不出现。\n【令牌 §2 字体】数字统一套 --font-num + .nsk-num：9:41、500 荟豆、2026-07-29 14:28、3个工作日内、申请编号 OCM202607290018、步骤序号 2/3。\n【令牌 §3 圆角】全部圆角收敛到 22/16/12/8/2：Banner / 弹层 → --r-sheet 16，卡片 / 时间轴卡 / 说明卡 → --r-card 12，图标底与「查看申请详情」按钮 → --r-ctl 8，Tag → --r-tag 2，按钮 → --r-pill 22，homebar → --r-tag 2；原 14 / 10 / 6 / 999 全部替换。圆形元素（成功圈、步骤点、头像、奖励图标、时间轴节点）保留 50%。\n【令牌 §4 阴影/分隔】卡片统一 --sh-card + 1px --text-04 描边；信息行与摘要行分割改 1px --line-01（原 #f4f5f8）；底部操作栏改 --text-04 底 + --sh-sheet（原 rgba(245,246,250,.96) 删除）。\n【组件 §5 导航栏】标题 16px Semibold；返回改 <button class=\"nsk-iconbtn\" aria-label=\"返回\">，图标 32×32、描边 1px、热区 44×44；「申请记录」改 <button class=\"nsk-btn--text-brand\"> 并补齐 hover/focus-visible/active。\n【组件 §5 按钮】「查看申请详情」（原 span.btn-detail）、「返回首页」（原 span.btn-outline）、「查看申请记录」全部改原生 <button type=\"button\">；主按钮 44 高 / 22 胶囊 / 16 Semibold，Secondary 透明底 + 1px --brand-01 描边，Outline 用 --brand-04 底 + --brand-03 描边（矩形变体 --rect 走 --r-ctl 8）。\n【组件 §5 标签】「审核中」→ .nsk-tag--blue，「认证通过后发放」→ .nsk-tag--huidou，色值严格按 sketch，尺寸按 §7-1 最小可读值。\n【组件 §5 卡片标题】卡片标题统一 16px Semibold --text-01；信息行图标 18×18 统一 stroke --brand-01（原 #5b7ba6）。\n【状态 §6】补齐 hover（主按钮 → --brand-01-hover、图标按钮与文字按钮 → --row-hover）、:focus-visible（--focus-ring，去掉默认 outline）、:active（--brand-02 + 按钮 scale(.98)）、[disabled]/.is-disabled（Primary --brand-03 底白字、Secondary --line-01 描边 + --text-03 字、Outline --fill-disabled 底，均 cursor:not-allowed + pointer-events:none）、[aria-selected=\"true\"]/.is-selected（--brand-01，进度节点用 --brand-01 描边 / 未达成用 --line-01）、.is-loading（opacity .7 + .nsk-btn__spinner 14×14 旋转）、.is-error/[aria-invalid=\"true\"]（--danger 描边 + 12px --danger 文案）；统一 transition 与 -webkit-tap-highlight-color:transparent。\n【标准注释 §7-1】Tag 尺寸：sketch Tag 为 60×30@2x=30×15 CSS/11px，低于可读阈值，色值严格遵循标准，尺寸采用最小可读值（高 20px / 文字 12px / 横向 padding 4px / 圆角 --r-tag 2）。\n【标准注释 §7-2】Hover/Focus 值为派生：sketch 色板未给悬浮与聚焦 token，--brand-01-hover #2C71DE、--focus-ring、--row-hover #FAFBFC、--fill-disabled #F7F8FA 均按组件库惯例派生并集中声明在 :root。\n【标准注释 §7-3】占位图沿用纯色/渐变块：荟豆奖励图标（原金色勋章）与申请人头像保留原位与用途，改 role=\"img\" + aria-label=\"占位图：…\"，颜色落到 --huidou-01/--huidou-02 与 --brand-04/--brand-01，不引外部资源。\n【命名 §8.1】banner / card / rev-head / badge-rev / info-row / btn-detail / rw-head / rw-badge / rw-ic / rw-amt / sec-title / next-card / nx-row / nx-rail / nx-ic / notice-card / sum-head / sum-ava / sum-row / btn-outline / btn-main / homebar 等短名全部改 nsk- BEM（nsk-banner / nsk-card / nsk-review / nsk-tag / nsk-infolist / nsk-btn--outline / nsk-reward / nsk-timeline / nsk-notice / nsk-summary / nsk-bottombar / nsk-homebar），状态类用 is- 前缀；属性顺序按 class → id → 功能属性 → role → aria-*。\n【语义化 §8.2】.phone → .nsk-page(role=\"application\")；.statusbar → .nsk-statusbar(aria-hidden)；.nav → <header class=\"nsk-navbar\">；.card → <section class=\"nsk-card\">；信息行 / 摘要行改 <dl>/<dt>/<dd>；步骤与时间轴改 <ol> + <li>；说明列表改 <ul> + <li>；可点 span 全部改 <button>；标题层级 h1 页面 → h2 区块 → h3 卡片，不跳级；装饰 SVG 全部 aria-hidden=\"true\" focusable=\"false\"。\n【可访问性 §8.3】补齐 role=\"application\"/\"img\"、aria-label、aria-labelledby、aria-current=\"step\"、aria-hidden；装饰性图标容器（成功圈、步骤序号、时间轴轨道与图标、信息行图标）统一 aria-hidden 避免重复朗读；本页无可编辑表单，表单组件仅保留标准定义与错误态样式。\n【结构 §8.4】文件结构按 DOCTYPE → meta(charset/viewport/theme-color #387DEC) → title → style(令牌→重置→通用组件→局部样式→可访问性) → body(.nsk-page) → 末尾改动说明注释 重排；单文件自包含，未引任何外部资源。\n【冲突点】① 原稿「审核中」「认证通过后发放」使用橙 / 金告警色，§1 色板无 warning token，已按语义就近映射为 Tag/blue 与 Tag/荟豆；② 原稿奖励金额 26px、Banner 标题 20px 超出 §2 字号阶梯上限，统一降为 18（--fs-xl）；③ 原稿底部栏用半透明毛玻璃底与自定义阴影，§4 只给 --sh-card / --sh-sheet，已就近替换；④ 原稿时间轴节点描边 #c9d0dc、连线 #e3e8f0 非 token，统一改 --line-01。\n================================================================\n-->\n\n<!-- 第二轮修改点（空白区域修复）：\n【A 底栏】.nsk-page 删除 min-height:100vh、padding-bottom 96→0；.nsk-bottombar 去 fixed/left/transform/max-width 改 sticky 流内块；.nsk-homebar 移入底栏内部（flex-basis:100%、row-gap:0），不再 fixed。\n【C 密度】状态栏+导航栏总高≈83；成功 Banner padding sp-5/sp-4/56px→sp-3/sp-3/sp-3、成功圈 44→40、hint/steps 间距 sp-2/sp-5→sp-1/sp-2；.nsk-card padding sp-4→sp-3；审核信息行 padding sp-3→sp-1；奖励图标 56→44、body margin-top sp-3→sp-2；时间轴行 padding sp-3→sp-2、图标 40→36、desc margin-top→2px；说明卡 padding sp-3→sp-2、列表项 line-height 1.9→1.6、list margin-top sp-2→sp-1；摘要行 padding sp-2→sp-1；「接下来」标题区 padding sp-5→sp-3。实测内容高度 1520→1245（字号令牌冻结，按规范兜底条款处理，未删任何内容）。\n【D inline】无（.nsk-banner__row 子块、.nsk-summary__key（flex）、.nsk-reward__amount 行内 span 均无塌陷）。\n【E 占位】无（荟豆奖励图标渐变、申请人头像 brand-04 底均可见，无裸占位）。\n-->\n\n<!-- 第三轮修改点（背景框一致性修补，依据：one蛇口组件系统.sketch / nsk_standard.md）\n【§5 底栏】.nsk-bottombar 补 border-top:1px solid var(--line-01)，与其余页底栏三件套统一。\n【§4 阴影 / §5 卡片组】.nsk-notice（--brand-04 浅蓝提示卡，圆角 12、padding 8/12）缺 box-shadow → 补 box-shadow:var(--sh-card)，与其他卡片同一阴影基准。\n-->\n\n<!-- 第四轮修改点（入口收敛 + 跳转接线，2026-10-09）\n【导航栏】删除右上角「申请记录」文字按钮（与底部主按钮「查看申请记录」重复）；新增 .nsk-navbar__spacer（44px，与左侧返回图标按钮等宽）占位，保证标题在删除入口后仍水平居中、布局不错乱。.nsk-btn--text-brand 为组件库 §5 既有变体，保留声明不删。\n【跳转】底部主按钮 #view-record-btn 新增 click → location.href='3-1.查看申请记录.html'（记录页为同级新建文件，见该文件末尾注释）。\n-->\n<\/div>\n<p class=\"proto-foot\">招商荟有家 · C 端主理人 移动端原型<\/p>\n<\/div>\n\n<script>\n(function(){\n  var ID=\"p3\";\n  var MAP={\"1.主理人中心.html\": \"p1\", \"11.主理人创建社群.html\": \"p11\", \"12.主理人管理社群可基于社群创建活动.html\": \"p12\", \"13.主理人社群成员列表.html\": \"p13\", \"2.申请成为主理人.html\": \"p2\", \"3-1.查看申请记录.html\": \"p31\", \"3.申请提交页面.html\": \"p3\", \"4.主理人发布活动-改版.html\": \"p4\", \"8.主理人查看活动-改版.html\": \"p8\", \"9.活动报名名单-改版.html\": \"p9\"};\n  function go(id){try{parent.postMessage({__demoNav:id},'*');}catch(e){}}\n  window.__demoGo=go;\n  window.__demoBlocked=function(f){alert('「'+f+'」未包含在本次合并的原型范围内');};\n  document.addEventListener('click',function(e){\n    var t=e.target;\n    var a=t&&t.closest?t.closest('a[href]'):null;\n    if(!a)return;\n    var h=a.getAttribute('href')||'';\n    if(!/\\.html(\\?|#|$)/.test(h))return;\n    e.preventDefault();e.stopPropagation();\n    if(MAP[h]){go(MAP[h]);}else{window.__demoBlocked(h);}\n  },true);\n  function allBtns(){return document.querySelectorAll('button,[role=\"button\"],a');}\n  function hookText(txt,id,delay,toast){\n    allBtns().forEach(function(b){\n      if(b.__dh)return;\n      if((b.textContent||'').replace(/\\s+/g,'').indexOf(txt)>-1){\n        b.__dh=1;\n        b.addEventListener('click',function(){setTimeout(function(){\n          if(toast){alert(toast);return;}\n          if(id)go(id);\n        },delay||0);});\n      }\n    });\n  }\n  function hookAria(prefix,id){\n    document.querySelectorAll('[aria-label]').forEach(function(b){\n      if(b.__dh)return;\n      if((b.getAttribute('aria-label')||'').indexOf(prefix)===0){\n        b.__dh=1;\n        b.addEventListener('click',function(){go(id);});\n      }\n    });\n  }\n  hookText('返回首页','p1');\n  var BACK={\"p11\": \"p1\", \"p12\": \"p1\", \"p13\": \"p12\", \"p2\": \"p1\", \"p3\": \"p2\", \"p31\": \"p3\", \"p4\": \"p1\", \"p8\": \"p1\", \"p9\": \"p8\"}[ID];\n  var bk=document.querySelector('.nsk-navbar__back,.c-navbar__back');\n  if(bk&&BACK){bk.addEventListener('click',function(e){e.stopPropagation();e.preventDefault();go(BACK);});}\n  /* 2x 设计板页面（社群系列）按画板宽度等比缩放适配容器 */\n  var BOARD=0;\n  if(BOARD){\n    (function(){\n      var st=document.createElement('style');\n      st.textContent='html{overflow-x:hidden!important}body{margin:0 auto!important;zoom:'+(430/BOARD).toFixed(4)+'}';\n      document.head.appendChild(st);\n      var lastW=-1;\n      function fit(){\n        var w=document.documentElement.clientWidth||window.innerWidth||0;\n        if(w>0&&w!==lastW){\n          lastW=w;\n          document.body.style.zoom=(w/BOARD).toFixed(4);\n        }\n      }\n      window.__demoFit=fit;\n      fit();\n      window.addEventListener('resize',fit);\n      window.addEventListener('load',fit);\n      if(window.ResizeObserver){try{new ResizeObserver(fit).observe(document.documentElement);}catch(e){}}\n      /* 轮询自愈：任何事件时机漏掉（如 iframe 隐藏期未量到宽度）都会在下一拍补上 */\n      setInterval(fit,200);\n    })();\n  }\n})();\n<\/script>\n<\/body>\n<\/html>\n"
  },
  "p31": {
    "title": "查看申请记录",
    "html": "<!DOCTYPE html>\n<html lang=\"zh-CN\">\n<head>\n<meta charset=\"UTF-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n<meta name=\"theme-color\" content=\"#387DEC\">\n<title>申请记录<\/title>\n<style>\n/* ================================================================\n   设计令牌（§1 色彩 / §2 字体 / §3 圆角 / §4 阴影 / §0 4px 栅格）\n   与 3.申请提交页面.html 同一套令牌，保证整体风格一致\n   ================================================================ */\n:root{\n  /* §1 色彩 */\n  --brand-01:#387DEC;   /* Brand01 常规 Default */\n  --brand-02:#0855D1;   /* Brand02 点击 Pressed */\n  --brand-03:#9BBEF5;   /* Brand03 一般禁用 Disabled */\n  --brand-04:#E0ECFF;   /* Brand04 文字禁用 / Tag 蓝底 */\n  --text-01:#303133;    /* Text01 强调·正文标题 */\n  --text-02:#909399;    /* Text02 次强调·正文次要·图标描边 */\n  --text-03:#C0C4CC;    /* Text03 置灰·禁用信息 */\n  --text-04:#FFFFFF;    /* Text04 纯白文字 */\n  --line-01:#EBEBEB;    /* Line01 分割线 */\n  --bg-page:#F2F5F7;    /* 页面背景 */\n  --success-01:#10A17C;\n  --success-02:#E6F7F2;\n  --danger:#EB4A38;     /* Danger 错误态 */\n  /* §1 派生值 */\n  --brand-01-hover:#2C71DE;\n  --danger-bg:#FDECEA;\n  --row-hover:#FAFBFC;      /* §6 Hover 可点行底 */\n  --fill-disabled:#F7F8FA;  /* §6 Disabled 输入类背景 */\n  --focus-ring:0 0 0 2px rgba(56,125,236,.24);\n  /* §2 字体 */\n  --font-cn:\"PingFang SC\",\"苹方-简\",-apple-system,BlinkMacSystemFont,\"Helvetica Neue\",sans-serif;\n  --font-num:\"Source Han Sans SC\",\"思源黑体\",\"PingFang SC\",-apple-system,BlinkMacSystemFont,sans-serif;\n  --fs-xl:18px; --fs-lg:16px; --fs-md:14px; --fs-sm:12px; --fs-xs:10px;\n  --lh-title:1.3; --lh-body:1.4; --lh-num:1.2;\n  /* §3 圆角 */\n  --r-pill:22px; --r-sheet:16px; --r-card:12px; --r-ctl:8px; --r-tag:2px;\n  /* §4 阴影 */\n  --sh-card:0 1px 6px rgba(0,0,0,.02);\n  --sh-sheet:0 -2px 16px rgba(0,0,0,.08);\n  /* §0 间距栅格 */\n  --sp-1:4px; --sp-2:8px; --sp-3:12px; --sp-4:16px; --sp-5:20px; --sp-6:24px; --sp-8:32px;\n}\n/* ================================================================\n   基础重置\n   ================================================================ */\n*,*::before,*::after{box-sizing:border-box;}\nhtml{-webkit-text-size-adjust:100%;}\nbody{margin:0;padding:0;background:var(--bg-page);font-family:var(--font-cn);font-size:var(--fs-md);\n  line-height:var(--lh-body);color:var(--text-01);-webkit-font-smoothing:antialiased;\n  -webkit-tap-highlight-color:transparent;}\nh1,h2,h3,h4,h5,h6{margin:0;font-size:inherit;font-weight:600;line-height:var(--lh-title);}\np{margin:0;}\nul,ol,dl,dd{margin:0;padding:0;list-style:none;}\nbutton{font-family:inherit;font-size:inherit;color:inherit;background:none;border:0;margin:0;padding:0;cursor:pointer;}\nsvg{display:block;}\n.nsk-num{font-family:var(--font-num);font-variant-numeric:tabular-nums;line-height:var(--lh-num);}\n/* ================================================================\n   通用组件（与 3.申请提交页面.html 保持一致）\n   ================================================================ */\n/* 页面容器 / 状态栏 / 导航栏（§5） */\n.nsk-page{position:relative;max-width:390px;margin:0 auto;background:var(--bg-page);padding-bottom:var(--sp-6);}\n.nsk-statusbar{display:flex;align-items:center;justify-content:space-between;padding:var(--sp-2) var(--sp-6) var(--sp-1);color:var(--text-01);}\n.nsk-statusbar__time{font-size:var(--fs-lg);font-weight:600;}\n.nsk-statusbar__icons{display:flex;align-items:center;gap:var(--sp-1);}\n.nsk-navbar{display:flex;align-items:center;justify-content:space-between;gap:var(--sp-2);padding:var(--sp-1) var(--sp-4);}\n.nsk-navbar__title{font-size:var(--fs-lg);font-weight:600;color:var(--text-01);text-align:center;flex:1;}\n.nsk-navbar__spacer{width:44px;flex-shrink:0;}\n.nsk-icon{color:inherit;}\n.nsk-ico--brand{color:var(--brand-01);}\n.nsk-ico--muted{color:var(--text-02);}\n/* 图标按钮（§5 返回图标 32×32，热区 ≥44×44） */\n.nsk-iconbtn{display:inline-flex;align-items:center;justify-content:center;width:44px;height:44px;\n  border-radius:var(--r-ctl);color:var(--text-01);\n  transition:background-color .15s,border-color .15s,color .15s,box-shadow .15s,opacity .15s;}\n.nsk-iconbtn:hover{background:var(--row-hover);}\n.nsk-iconbtn:focus{outline:none;}\n.nsk-iconbtn:focus-visible{box-shadow:var(--focus-ring);}\n.nsk-iconbtn:active{color:var(--brand-02);}\n/* 标签（§5 Tag） */\n.nsk-tag{display:inline-flex;align-items:center;height:20px;padding:0 var(--sp-1);\n  border-radius:var(--r-tag);font-size:var(--fs-sm);font-weight:600;line-height:1;white-space:nowrap;}\n.nsk-tag--blue{background:var(--brand-04);color:var(--brand-01);}\n.nsk-tag--green{background:var(--success-02);color:var(--success-01);}\n.nsk-tag--danger{background:var(--danger-bg);color:var(--danger);}\n/* 卡片 / 信息行（§5 卡片组，与第 3 页审核卡同构） */\n.nsk-card{margin:var(--sp-3) var(--sp-4) 0;background:var(--text-04);border-radius:var(--r-card);\n  padding:var(--sp-3);box-shadow:var(--sh-card);border:1px solid var(--text-04);}\n.nsk-infolist{margin-top:var(--sp-1);}\n.nsk-infolist__row{display:flex;align-items:center;gap:var(--sp-2);padding:var(--sp-1) 0;\n  border-bottom:1px solid var(--line-01);font-size:var(--fs-md);}\n.nsk-infolist__row:last-of-type{border-bottom:none;}\n.nsk-infolist__icon{width:18px;height:18px;color:var(--brand-01);flex-shrink:0;display:flex;align-items:center;justify-content:center;}\n.nsk-infolist__key{color:var(--text-02);}\n.nsk-infolist__value{margin-left:auto;color:var(--text-01);font-weight:400;text-align:right;}\n/* ================================================================\n   本页面局部样式：申请记录列表\n   ================================================================ */\n.nsk-records__meta{padding:var(--sp-3) var(--sp-4) 0;font-size:var(--fs-sm);color:var(--text-02);}\n.nsk-record__head{display:flex;align-items:center;gap:var(--sp-2);}\n.nsk-record__no{margin-left:auto;font-size:var(--fs-sm);font-weight:400;color:var(--text-02);}\n.nsk-record__reason{color:var(--danger);}\n.nsk-record__foot{margin-top:var(--sp-2);display:flex;justify-content:flex-end;}\n/* 底部操作栏（与第 3 页同构：sticky 流内块 + homebar 内置） */\n.nsk-bottombar{position:sticky;bottom:0;width:auto;\n  background:var(--text-04);padding:var(--sp-3) var(--sp-4) var(--sp-5);display:flex;flex-wrap:wrap;gap:var(--sp-3);\n  row-gap:0;\n  box-shadow:var(--sh-sheet);z-index:9;border-top:1px solid var(--line-01);}\n.nsk-bottombar .nsk-btn{flex:1;}\n.nsk-homebar{position:static;flex-basis:100%;margin:var(--sp-1) auto 0;width:130px;height:5px;\n  border-radius:var(--r-tag);background:var(--text-01);opacity:.85;}\n/* 按钮（§5） */\n.nsk-btn{display:inline-flex;align-items:center;justify-content:center;gap:var(--sp-1);\n  min-height:44px;padding:0 var(--sp-6);border-radius:var(--r-pill);\n  font-size:var(--fs-lg);font-weight:600;line-height:1;border:1px solid transparent;\n  transition:background-color .15s,border-color .15s,color .15s,box-shadow .15s,opacity .15s;}\n.nsk-btn:focus{outline:none;}\n.nsk-btn:focus-visible{box-shadow:var(--focus-ring);}\n.nsk-btn--primary{background:var(--brand-01);color:var(--text-04);}\n.nsk-btn--primary:hover{background:var(--brand-01-hover);}\n.nsk-btn--primary:active{background:var(--brand-02);transform:scale(.98);}\n.nsk-btn--secondary{background:transparent;border-color:var(--brand-01);color:var(--brand-01);}\n.nsk-btn--secondary:hover{border-color:var(--brand-01-hover);color:var(--brand-01-hover);}\n.nsk-btn--secondary:active{border-color:var(--brand-02);color:var(--brand-02);transform:scale(.98);}\n/* ================================================================\n   可访问性\n   ================================================================ */\n@media (prefers-reduced-motion:reduce){\n  *,*::before,*::after{animation-duration:.01ms !important;animation-iteration-count:1 !important;\n    transition-duration:.01ms !important;scroll-behavior:auto !important;}\n}\n\n/* ================================================================\n   原型画布背景层（proto-*）—— 与 3.申请提交页面.html 同一展示壳\n   ================================================================ */\n:root{--proto-w:390px;}\nhtml{background:#E9EEF5;}\nbody{padding:32px 20px 48px;\n  background:radial-gradient(900px 420px at 50% 0%,#FFFFFF 0%,rgba(255,255,255,0) 62%),\n             linear-gradient(180deg,#F8FAFD 0%,#E9EEF5 100%);\n  background-attachment:fixed;}\n.proto-grid{position:fixed;inset:0;z-index:0;pointer-events:none;\n  background-image:linear-gradient(rgba(56,125,236,.055) 1px,transparent 1px),\n                   linear-gradient(90deg,rgba(56,125,236,.055) 1px,transparent 1px);\n  background-size:22px 22px;\n  -webkit-mask-image:radial-gradient(125% 95% at 50% 28%,#000 26%,transparent 100%);\n          mask-image:radial-gradient(125% 95% at 50% 28%,#000 26%,transparent 100%);}\n.proto-stage{position:relative;z-index:1;width:var(--proto-w);margin:0 auto;}\n.proto-tag{display:flex;align-items:center;gap:8px;width:max-content;max-width:100%;\n  margin:0 auto 12px;padding:6px 12px;border-radius:999px;\n  background:rgba(255,255,255,.88);border:1px solid rgba(56,125,236,.14);\n  box-shadow:0 2px 10px rgba(23,43,77,.06);\n  font-family:-apple-system,BlinkMacSystemFont,\"PingFang SC\",\"Microsoft YaHei\",sans-serif;\n  font-size:12px;color:#909399;}\n.proto-tag__dot{width:8px;height:8px;border-radius:50%;background:#387DEC;flex:0 0 auto;}\n.proto-tag__name{font-size:14px;font-weight:600;color:#303133;}\n.proto-tag__sep{width:1px;height:12px;background:#EBEBEB;}\n.proto-tag__meta{font-size:10px;color:#C0C4CC;font-variant-numeric:tabular-nums;\n  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}\n.proto-frame{border-radius:28px;overflow:clip;background:#FFFFFF;\n  box-shadow:0 28px 64px rgba(23,43,77,.16),0 2px 8px rgba(23,43,77,.06),0 0 0 1px rgba(23,43,77,.05);}\n.proto-foot{width:max-content;max-width:100%;margin:12px auto 0;\n  font-family:-apple-system,BlinkMacSystemFont,\"PingFang SC\",\"Microsoft YaHei\",sans-serif;\n  font-size:10px;color:#C0C4CC;letter-spacing:.5px;}\n@media (max-width:470px){\n  body{padding:0;background:var(--bg-page);}\n  .proto-grid,.proto-tag,.proto-foot{display:none;}\n  .proto-stage{width:100%;max-width:390px;}\n  .proto-frame{border-radius:0;box-shadow:none;}\n}\n<\/style>\n<\/head>\n<body>\n<div class=\"proto-grid\" aria-hidden=\"true\"><\/div>\n<div class=\"proto-stage\">\n<p class=\"proto-tag\" role=\"note\" aria-label=\"原型画布说明\"><span class=\"proto-tag__dot\" aria-hidden=\"true\"><\/span><span class=\"proto-tag__name\">查看申请记录<\/span><span class=\"proto-tag__sep\" aria-hidden=\"true\"><\/span><span class=\"proto-tag__meta\">390 × 844 · @1x<\/span><\/p>\n<div class=\"proto-frame\">\n\n<div class=\"nsk-page\" role=\"application\" aria-label=\"移动端预览容器\">\n  <!-- 状态栏 -->\n  <div class=\"nsk-statusbar\" aria-hidden=\"true\">\n    <span class=\"nsk-statusbar__time nsk-num\">9:41<\/span>\n    <span class=\"nsk-statusbar__icons\">\n      <svg class=\"nsk-icon\" width=\"17\" height=\"11\" viewBox=\"0 0 17 11\" aria-hidden=\"true\" focusable=\"false\"><rect x=\"0\" y=\"7\" width=\"3\" height=\"4\" rx=\"1\" fill=\"currentColor\"/><rect x=\"4.5\" y=\"5\" width=\"3\" height=\"6\" rx=\"1\" fill=\"currentColor\"/><rect x=\"9\" y=\"2.5\" width=\"3\" height=\"8.5\" rx=\"1\" fill=\"currentColor\"/><rect x=\"13.5\" y=\"0\" width=\"3\" height=\"11\" rx=\"1\" fill=\"currentColor\"/><\/svg>\n      <svg class=\"nsk-icon\" width=\"15\" height=\"11\" viewBox=\"0 0 15 11\" aria-hidden=\"true\" focusable=\"false\"><path d=\"M7.5 9.5 L9.6 7.2 A3.4 3.4 0 0 0 5.4 7.2 Z M11.2 5.5 A6 6 0 0 0 3.8 5.5 L2.2 3.8 A8.4 8.4 0 0 1 12.8 3.8 Z\" fill=\"currentColor\"/><path d=\"M13.9 1.9 A10 10 0 0 0 1.1 1.9 L0 0.6 A11.6 11.6 0 0 1 15 0.6 Z\" fill=\"currentColor\"/><\/svg>\n      <svg class=\"nsk-icon\" width=\"25\" height=\"12\" viewBox=\"0 0 25 12\" aria-hidden=\"true\" focusable=\"false\"><rect x=\"0.5\" y=\"0.5\" width=\"21\" height=\"11\" rx=\"3\" fill=\"none\" stroke=\"currentColor\" opacity=\".4\"/><rect x=\"2\" y=\"2\" width=\"18\" height=\"8\" rx=\"1.8\" fill=\"currentColor\"/><path d=\"M23 4 v4 a2 2 0 0 0 0-4z\" fill=\"currentColor\" opacity=\".4\"/><\/svg>\n    <\/span>\n  <\/div>\n\n  <!-- 导航栏（右上角对称占位 44px，保证标题居中） -->\n  <header class=\"nsk-navbar\">\n    <button type=\"button\" class=\"nsk-iconbtn\" id=\"back-btn\" aria-label=\"返回申请提交页\">\n      <svg class=\"nsk-icon\" width=\"32\" height=\"32\" viewBox=\"0 0 32 32\" aria-hidden=\"true\" focusable=\"false\"><path d=\"M20 8 L12 16 L20 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><\/svg>\n    <\/button>\n    <h1 class=\"nsk-navbar__title\">申请记录<\/h1>\n    <span class=\"nsk-navbar__spacer\" aria-hidden=\"true\"><\/span>\n  <\/header>\n\n  <!-- 记录列表（静态示例数据，按提交时间倒序） -->\n  <p class=\"nsk-records__meta nsk-num\">共 3 条申请记录<\/p>\n\n  <!-- 记录 1：审核中 -->\n  <section class=\"nsk-card nsk-record\" aria-labelledby=\"nsk-rec1-title\">\n    <div class=\"nsk-record__head\">\n      <span class=\"nsk-tag nsk-tag--blue\" id=\"nsk-rec1-title\">审核中<\/span>\n      <span class=\"nsk-record__no nsk-num\">OCM202607290018<\/span>\n    <\/div>\n    <dl class=\"nsk-infolist\">\n      <div class=\"nsk-infolist__row\">\n        <dt class=\"nsk-infolist__key\">\n          <span class=\"nsk-infolist__icon\" aria-hidden=\"true\"><svg class=\"nsk-icon\" width=\"16\" height=\"16\" viewBox=\"0 0 16 16\" aria-hidden=\"true\" focusable=\"false\"><circle cx=\"8\" cy=\"8\" r=\"6.4\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.4\"/><path d=\"M8 4.5 V8 l2.5 1.5\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.4\" stroke-linecap=\"round\"/><\/svg><\/span>\n          申请时间\n        <\/dt>\n        <dd class=\"nsk-infolist__value nsk-num\">2026-07-29 14:28<\/dd>\n      <\/div>\n      <div class=\"nsk-infolist__row\">\n        <dt class=\"nsk-infolist__key\">\n          <span class=\"nsk-infolist__icon\" aria-hidden=\"true\"><svg class=\"nsk-icon\" width=\"16\" height=\"16\" viewBox=\"0 0 16 16\" aria-hidden=\"true\" focusable=\"false\"><rect x=\"2\" y=\"2\" width=\"5\" height=\"5\" rx=\"1\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.4\"/><rect x=\"9\" y=\"2\" width=\"5\" height=\"5\" rx=\"1\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.4\"/><rect x=\"2\" y=\"9\" width=\"5\" height=\"5\" rx=\"1\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.4\"/><path d=\"M9 11.5 h5 M11.5 9 v5\" stroke=\"currentColor\" stroke-width=\"1.4\"/><\/svg><\/span>\n          审核单位\n        <\/dt>\n        <dd class=\"nsk-infolist__value\">深圳城市公司<\/dd>\n      <\/div>\n      <div class=\"nsk-infolist__row\">\n        <dt class=\"nsk-infolist__key\">\n          <span class=\"nsk-infolist__icon\" aria-hidden=\"true\"><svg class=\"nsk-icon\" width=\"16\" height=\"16\" viewBox=\"0 0 16 16\" aria-hidden=\"true\" focusable=\"false\"><rect x=\"2\" y=\"3\" width=\"12\" height=\"11\" rx=\"2\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.4\"/><path d=\"M2 6.5 h12 M5 1.5 v3 M11 1.5 v3\" stroke=\"currentColor\" stroke-width=\"1.4\"/><\/svg><\/span>\n          预计完成\n        <\/dt>\n        <dd class=\"nsk-infolist__value\"><span class=\"nsk-num\">3<\/span>个工作日内<\/dd>\n      <\/div>\n    <\/dl>\n  <\/section>\n\n  <!-- 记录 2：已通过 -->\n  <section class=\"nsk-card nsk-record\" aria-labelledby=\"nsk-rec2-title\">\n    <div class=\"nsk-record__head\">\n      <span class=\"nsk-tag nsk-tag--green\" id=\"nsk-rec2-title\">已通过<\/span>\n      <span class=\"nsk-record__no nsk-num\">OCM202605180009<\/span>\n    <\/div>\n    <dl class=\"nsk-infolist\">\n      <div class=\"nsk-infolist__row\">\n        <dt class=\"nsk-infolist__key\">\n          <span class=\"nsk-infolist__icon\" aria-hidden=\"true\"><svg class=\"nsk-icon\" width=\"16\" height=\"16\" viewBox=\"0 0 16 16\" aria-hidden=\"true\" focusable=\"false\"><circle cx=\"8\" cy=\"8\" r=\"6.4\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.4\"/><path d=\"M8 4.5 V8 l2.5 1.5\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.4\" stroke-linecap=\"round\"/><\/svg><\/span>\n          申请时间\n        <\/dt>\n        <dd class=\"nsk folist__icon\" aria-hidden=\"true\"><svg class=\"nsk-icon\" width=\"16\" height=\"16\" viewBox=\"0 0 16 16\" aria-hidden=\"true\" focusable=\"false\"><circle cx=\"8\" cy=\"8\" r=\"6.4\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.4\"/><path d=\"M8 4.5 V8 l2.5 1.5\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.4\" stroke-linecap=\"round\"/><\/svg><\/span>\n          申请时间\n        <\/dt>\n        <dd class=\"nsk-infolist__value nsk-num\">2026-04-02 19:37<\/dd>\n      <\/div>\n      <div class=\"nsk-infolist__row\">\n        <dt class=\"nsk-infolist__key\">\n          <span class=\"nsk-infolist__icon\" aria-hidden=\"true\"><svg class=\"nsk-icon\" width=\"16\" height=\"16\" viewBox=\"0 0 16 16\" aria-hidden=\"true\" focusable=\"false\"><rect x=\"2\" y=\"2\" width=\"5\" height=\"5\" rx=\"1\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.4\"/><rect x=\"9\" y=\"2\" width=\"5\" height=\"5\" rx=\"1\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.4\"/><rect x=\"2\" y=\"9\" width=\"5\" height=\"5\" rx=\"1\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.4\"/><path d=\"M9 11.5 h5 M11.5 9 v5\" stroke=\"currentColor\" stroke-width=\"1.4\"/><\/svg><\/span>\n          审核单位\n        <\/dt>\n        <dd class=\"nsk-infolist__value\">深圳城市公司<\/dd>\n      <\/div>\n      <div class=\"nsk-infolist__row\">\n        <dt class=\"nsk-infolist__key\">\n          <span class=\"nsk-infolist__icon\" aria-hidden=\"true\"><svg class=\"nsk-icon\" width=\"16\" height=\"16\" viewBox=\"0 0 16 16\" aria-hidden=\"true\" focusable=\"false\"><path d=\"M8 1.5 L15 14 H1 Z\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.4\" stroke-linejoin=\"round\"/><path d=\"M8 6 v3.2\" stroke=\"currentColor\" stroke-width=\"1.4\" stroke-linecap=\"round\"/><circle cx=\"8\" cy=\"11.8\" r=\".9\" fill=\"currentColor\"/><\/svg><\/span>\n          退回原因\n        <\/dt>\n        <dd class=\"nsk-infolist__value nsk-record__reason\">主理方向描述不够具体<\/dd>\n      <\/div>\n    <\/dl>\n ddEventListener('click',function(e){\n    var t=e.target;\n    var a=t&&t.closest?t.closest('a[href]'):null;\n    if(!a)return;\n    var h=a.getAttribute('href')||'';\n    if(!/\\.html(\\?|#|$)/.test(h))return;\n    e.preventDefault();e.stopPropagation();\n    if(MAP[h]){go(MAP[h]);}else{window.__demoBlocked(h);}\n  },true);\n  function allBtns(){return document.querySelectorAll('button,[role=\"button\"],a');}\n  function hookText(txt,id,delay,toast){\n    allBtns().forEach(function(b){\n      if(b.__dh)return;\n      if((b.textContent||'').replace(/\\s+/g,'').indexOf(txt)>-1){\n        b.__dh=1;\n        b.addEventListener('click',function(){setTimeout(function(){\n          if(toast){alert(toast);return;}\n          if(id)go(id);\n        },delay||0);});\n      }\n    });\n  }\n  function hookAria(prefix,id){\n    document.querySelectorAll('[aria-label]').forEach(function(b){\n      if(b.__dh)return;\n      if((b.getAttribute('aria-label')||'').indexOf(prefix)===0){\n        b.__dh=1;\n        b.addEventListener('click',function(){go(id);});\n      }\n    });\n  }\n  hookText('重新提交','p2');\nhookText('返回首页','p1');\n  var BACK={\"p11\": \"p1\", \"p12\": \"p1\", \"p13\": \"p12\", \"p2\": \"p1\", \"p3\": \"p2\", \"p31\": \"p3\", \"p4\": \"p1\", \"p8\": \"p1\", \"p9\": \"p8\"}[ID];\n  var bk=document.querySelector('.nsk-navbar__back,.c-navbar__back');\n  if(bk&&BACK){bk.addEventListener('click',function(e){e.stopPropagation();e.preventDefault();go(BACK);});}\n  /* 2x 设计板页面（社群系列）按画板宽度等比缩放适配容器 */\n  var BOARD=0;\n  if(BOARD){\n    (function(){\n      var st=document.createElement('style');\n      st.textContent='html{overflow-x:hidden!important}body{margin:0 auto!important;zoom:'+(430/BOARD).toFixed(4)+'}';\n      document.head.appendChild(st);\n      var lastW=-1;\n      function fit(){\n        var w=document.documentElement.clientWidth||window.innerWidth||0;\n        if(w>0&&w!==lastW){\n          lastW=w;\n          document.body.style.zoom=(w/BOARD).toFixed(4);\n        }\n      }\n      window.__demoFit=fit;\n      fit();\n      window.addEventListener('resize',fit);\n      window.addEventListener('load',fit);\n      if(window.ResizeObserver){try{new ResizeObserver(fit).observe(document.documentElement);}catch(e){}}\n      /* 轮询自愈：任何事件时机漏掉（如 iframe 隐藏期未量到宽度）都会在下一拍补上 */\n      setInterval(fit,200);\n    })();\n  }\n})();\n<\/script>\n<\/body>\n<\/html>\n"
