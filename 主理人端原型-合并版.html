deg,#8FAE6B 0%,#5E7F3E 55%,#3C5527 100%)\"><\/span>\n            <span class=\"c-act__body\">\n              <span class=\"c-act__head\"><span class=\"c-act__name\">周四飞盘局<\/span><span class=\"c-act__status c-act__status--tg-blue\" data-status=\"报名中\">报名中<\/span><span class=\"c-act__date\">07.16  20:30<\/span><\/span>\n              <dl class=\"c-act__meta\">\n                <div><dt>报名数 / 名额<\/dt><dd>28 / 40<\/dd><\/div>\n                <div><dt>签到人数<\/dt><dd>21<\/dd><\/div>\n                <div><dt>荟豆数<\/dt><dd>840<\/dd><\/div>\n                <div><dt>现金数<\/dt><dd>¥280.00<\/dd><\/div>\n              <\/dl>\n              <span class=\"c-act__prog\" role=\"img\" aria-label=\"名额进度 28 / 40\"><span class=\"c-act__track\"><span class=\"c-act__fill\" style=\"width:70%\"><\/span><\/span><\/span>\n            <\/span>\n            <svg class=\"c-act__arrow\" width=\"16\" height=\"28\" viewBox=\"0 0 18 30\" fill=\"none\" aria-hidden=\"true\" focusable=\"false\"><path d=\"M3 3l12 12L3 27\" stroke=\"currentColor\" stroke-width=\"3.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><\/svg>\n          <\/button>\n        <\/li>\n        <li><hr class=\"c-divider\"><\/li>\n        <li>\n          <button class=\"c-act\" type=\"button\" aria-label=\"端午游园会，06.08 10:00，状态已结束，报名 126 / 名额 150，签到 118 人，荟豆 3780，现金 1260 元\">\n            <span class=\"c-act__thumb\" role=\"img\" aria-label=\"活动封面占位图\" style=\"background:linear-gradient(135deg,#B5C98A 0%,#8AA55C 55%,#5F7538 100%)\"><\/span>\n            <span class=\"c-act__body\">\n              <span class=\"c-act__head\"><span class=\"c-act__name\">端午游园会<\/span><span class=\"c-act__status c-act__status--tg-grey\" data-status=\"已结束\">已结束<\/span><span class=\"c-act__date\">06.08  10:00<\/span><\/span>\n              <dl class=\"c-act__meta\">\n                <div><dt>报名数 / 名额<\/dt><dd>126 / 150<\/dd><\/div>\n                <div><dt>签到人数<\/dt><dd>118<\/dd><\/div>\n                <div><dt>荟豆数<\/dt><dd>3780<\/dd><\/div>\n                <div><dt>现金数<\/dt><dd>¥1260.00<\/dd><\/div>\n              <\/dl>\n              <span class=\"c-act__prog\" role=\"img\" aria-label=\"名额进度 126 / 150\"><span class=\"c-act__track\"><span class=\"c-act__fill\" style=\"width:84%\"><\/span><\/span><\/span>\n            <\/span>\n            <svg class=\"c-act__arrow\" width=\"16\" height=\"28\" viewBox=\"0 0 18 30\" fill=\"none\" aria-hidden=\"true\" focusable=\"false\"><path d=\"M3 3l12 12L3 27\" stroke=\"currentColor\" stroke-width=\"3.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><\/svg>\n          <\/button>\n        <\/li>\n      <\/ul>\n    <\/section>\n\n    <!-- 卡片5：社群设置 -->\n    <section class=\"c-card p-card-set\" aria-labelledby=\"sec-set-title\">\n      <header class=\"c-card__head\">\n        <h2 class=\"c-card__title\" id=\"sec-set-title\">社群设置<\/h2>\n        <span class=\"c-card__hint\" id=\"set-status\" hidden><\/span>\n      <\/header>\n      <div class=\"p-setbtns\">\n        <button class=\"c-btn c-btn--huidou\" id=\"btn-recruit\" type=\"button\" aria-haspopup=\"dialog\">\n          <svg width=\"30\" height=\"30\" viewBox=\"0 0 36 36\" fill=\"none\" aria-hidden=\"true\" focusable=\"false\"><circle cx=\"18\" cy=\"18\" r=\"16\" fill=\"currentColor\"/><rect x=\"13\" y=\"11\" width=\"4\" height=\"14\" rx=\"1.5\" fill=\"#fff\"/><rect x=\"19\" y=\"11\" width=\"4\" height=\"14\" rx=\"1.5\" fill=\"#fff\"/><\/svg>\n          <span class=\"p-setbtn__label\">暂停社群招募<\/span>\n        <\/button>\n        <button class=\"c-btn c-btn--danger\" id=\"btn-apply\" type=\"button\" aria-haspopup=\"dialog\">\n          <svg width=\"30\" height=\"30\" viewBox=\"0 0 36 36\" fill=\"none\" aria-hidden=\"true\" focusable=\"false\"><circle cx=\"18\" cy=\"18\" r=\"16\" fill=\"currentColor\"/><rect x=\"15.4\" y=\"9.4\" width=\"5.2\" height=\"11\" rx=\"2.6\" fill=\"#fff\"/><circle cx=\"18\" cy=\"25\" r=\"2.7\" fill=\"#fff\"/><\/svg>\n          <span class=\"p-setbtn__label\">关闭社群申请<\/span>\n        <\/button>\n      <\/div>\n    <\/section>\n\n  <\/main>\n\n  <!-- 底部操作栏 -->\n  <footer class=\"c-actionbar\">\n    <button class=\"c-btn c-btn--primary c-btn--lg\" type=\"button\">\n      <svg width=\"30\" height=\"30\" viewBox=\"0 0 34 34\" fill=\"none\" aria-hidden=\"true\" focusable=\"false\"><path d=\"M17 4v26M4 17h26\" stroke=\"currentColor\" stroke-width=\"4\" stroke-linecap=\"round\"/><\/svg>\n      创建新活动\n    <\/button>\n  <\/footer>\n\n  <!-- ========== 二次确认弹窗：关闭社群招募 ========== -->\n  <div class=\"c-mask\" id=\"mask-recruit\" hidden><\/div>\n  <div class=\"c-dialog\" id=\"dlg-recruit\" hidden role=\"dialog\" aria-modal=\"true\" aria-labelledby=\"dlg-recruit-title\" aria-describedby=\"dlg-recruit-body\">\n    <h3 class=\"c-dialog__title\" id=\"dlg-recruit-title\">关闭社群招募<\/h3>\n    <p class=\"c-dialog__body\" id=\"dlg-recruit-body\">关闭社群招募后，仅允许会员查看社群，不允许新成员加入，不允许被活动关联选择<\/p>\n    <div class=\"c-dialog__actions\">\n      <button class=\"c-btn c-btn--secondary c-dialog__btn\" type=\"button\" data-dlg-cancel>取消<\/button>\n      <button class=\"c-btn c-btn--primary c-dialog__btn\" type=\"button\" data-dlg-confirm>确认<\/button>\n    <\/div>\n  <\/div>\n\n  <!-- ========== 二次确认弹窗：关闭社群申请 ========== -->\n  <div class=\"c-mask\" id=\"mask-apply\" hidden><\/div>\n  <div class=\"c-dialog\" id=\"dlg-apply\" hidden role=\"dialog\" aria-modal=\"true\" aria-labelledby=\"dlg-apply-title\" aria-describedby=\"dlg-apply-body\">\n    <h3 class=\"c-dialog__title\" id=\"dlg-apply-title\">关闭社群申请<\/h3>\n    <p class=\"c-dialog__body\" id=\"dlg-apply-body\">社群关闭成功后，不再对外展示该社群，且不允许被活动关联选择<\/p>\n    <div class=\"c-dialog__actions\">\n      <button class=\"c-btn c-btn--secondary c-dialog__btn\" type=\"button\" data-dlg-cancel>取消<\/button>\n      <button class=\"c-btn c-btn--primary c-dialog__btn\" type=\"button\" data-dlg-confirm>确认<\/button>\n    <\/div>\n  <\/div>\n\n<\/div>\n\n<script>\n(function () {\n  'use strict';\n\n  var statusEl = document.getElementById('set-status');\n  var state = { recruit: false, apply: false };\n\n  /* 卡片右上角状态位：把已关闭项拼成一行提示 */\n  function refreshStatus() {\n    var notes = [];\n    if (state.recruit) { notes.push('社群招募已关闭'); }\n    if (state.apply) { notes.push('社群已关闭'); }\n    if (!notes.length) { statusEl.hidden = true; statusEl.textContent = ''; return; }\n    statusEl.hidden = false;\n    statusEl.textContent = notes.join(' · ');\n  }\n\n  /* 把按钮切到「已关闭」生效态：置灰不可点 + 文案改为已关闭 */\n  function markClosed(btnId, label) {\n    var btn = document.getElementById(btnId);\n    var text = btn.querySelector('.p-setbtn__label');\n    if (text) { text.textContent = label; }\n    btn.classList.add('is-disabled');\n    btn.setAttribute('aria-disabled', 'true');\n    btn.removeAttribute('aria-haspopup');\n  }\n\n  /* 通用弹窗绑定：取消/遮罩/Esc 只关闭不改状态，确认才落状态 */\n  function bindDialog(cfg) {\n    var trigger = document.getElementById(cfg.triggerId);\n    var mask = document.getElementById(cfg.maskId);\n    var dialog = document.getElementById(cfg.dialogId);\n    var cancelBtn = dialog.querySelector('[data-dlg-cancel]');\n    var confirmBtn = dialog.querySelector('[data-dlg-confirm]');\n    var lastFocused = null;\n\n    function isOpen() { return !dialog.hidden; }\n\n    function close() {\n      if (!isOpen()) { return; }\n      dialog.hidden = true;\n      mask.hidden = true;\n      document.removeEventListener('keydown', onKeydown, true);\n      if (lastFocused && lastFocused.focus) { lastFocused.focus(); }\n      lastFocused = null;\n    }\n\n    function onKeydown(e) {\n      if (e.key === 'Escape' || e.key === 'Esc') { e.stopPropagation(); close(); }\n    }\n\n    function open() {\n      if (trigger.classList.contains('is-disabled')) { return; }\n      lastFocused = document.activeElement;\n      dialog.hidden = false;\n      mask.hidden = false;\n      document.addEventListener('keydown', onKeydown, true);\n      confirmBtn.focus();\n    }\n\n    trigger.addEventListener('click', open);\n    mask.addEventListener('click', close);\n    cancelBtn.addEventListener('click', close);\n    confirmBtn.addEventListener('click', function () {\n      close();\n      if (state[cfg.stateKey]) { return; }\n      state[cfg.stateKey] = true;\n      markClosed(cfg.triggerId, cfg.closedLabel);\n      refreshStatus();\n    });\n  }\n\n  bindDialog({\n    triggerId: 'btn-recruit', maskId: 'mask-recruit', dialogId: 'dlg-recruit',\n    stateKey: 'recruit', closedLabel: '招募已关闭'\n  });\n  bindDialog({\n    triggerId: 'btn-apply', maskId: 'mask-apply', dialogId: 'dlg-apply',\n    stateKey: 'apply', closedLabel: '社群已关闭'\n  });\n\n  /* 群成员快捷入口：携带待审数跳转成员列表页（入群申请改在列表页「待审核成员」处理） */\n  document.getElementById('stat-members').addEventListener('click', function () {\n    __demoGo(\"p13\");\n  });\n})();\n<\/script>\n\n<!--\n================================================================\n本次修改点（依据：one蛇口组件系统.sketch）\n================================================================\n1. 【设计令牌化】新增 :root 令牌块，色彩全部替换为共享色板：\n   Brand01 #387DEC / Brand02 #0855D1 / Brand03 #9BBEF5 / Brand04 #E0ECFF、\n   Text01 #303133 / Text02 #909399 / Text03 #C0C4CC / Text04 #FFFFFF、\n   Line01 #EBEBEB、页面背景 #F2F5F7、Success #10A17C/#E6F7F2、荟豆 #F76346/#FFE7E6、Danger #EB4A38。\n   原稿临时色（#2563EB / #101828 / #98A2B3 / #F04438 / #F79009 / #F7F8FA 等）全部废弃。\n   依据：🏷基础样式 / 色彩（共享色板 swatch 列表）\n2. 【字号规范化】字号改为标准档位 × 页面缩放 --scale=1.255（941/750）：\n   36 超大标题 / 32 卡片标题 / 28 正文 / 24 次级 / 20 极少数次级 / 22 标签；\n   行高取标准值：卡片标题 44/32=1.375、正文 40/28≈1.43。\n   依据：🏷基础样式 / 字体（36pt 超大标题、32pt 卡片标题、28pt 正文、24pt 次级、20pt 极少数次级）\n3. 【字体族】中文 PingFang SC，数字（成员数、荟豆、金额、日期）改用 Source Han Sans SC（思源黑体）。\n   依据：基础样式「中文字体PingFang SC 苹方-简」「数字字体思源黑体、系统默认字体」\n4. 【圆角统一】--radius-card 24 / --radius-field 16 / --radius-tag 8（均按 --scale 换算），\n   活动缩略图沿用图片圆角 16，头像按图片规范取圆形。\n   依据：控件页 弹窗背景 r=24、位图 r=16、Tabbar 指示条 r=4\n5. 【卡片】统一为「控件/卡片/卡片组」：白底 + 圆角 24 + 阴影 blur12/offsetY2\n   （转 CSS：0 1px 6px rgba(0,0,0,.06)）。依据：控件/卡片/卡片组 shadow blurRadius12 offsetY2\n6. 【状态标签】「活跃」由临时绿改为标准 Success 组合：Success02 #E6F7F2 底 + Success01 #10A17C 字。\n   依据：控件/Tag/green（底 #E6F7F2、字 #10A17C）\n7. 【徽标】通知未读数按功能色 Danger #EB4A38（原 #F04438），圆形 pill，数字用思源黑体。\n   依据：🏷基础样式 错误/价格 Danger #EB4A38\n8. 【底部主按钮】按「控件/Button/Primary,Large,Default」取纯色 Brand01（原稿为渐变，标准未定义渐变主按钮），\n   并补 hover（派生 --brand-hover #2F6FDC）、active（Brand02）、focus-visible（Brand03 焦点环）、\n   disabled（Brand03 底 + Text04 字）、.is-loading（内置 spinner）。\n   依据：控件/Button/Primary,Large,Default｜Primary,Large,Pressed\n9. 【社群设置按钮】标准无 Warning 色，按功能色体系改用荟豆色（huidou01 字 + huidou02 底，暂停社群招募）\n   与 Danger（#EB4A38 字 + 派生淡底 #FDECEA，关闭社群申请），并补齐 hover/active/focus-visible。\n   依据：🏷基础样式 荟豆色 huidou01/huidou02、错误价格 Danger\n10.【列表行 + 跳转箭头】统一 .c-cell（原生 button）：值色 Text02、\n    箭头按「控件/Icon/24px/跳转」取 Text02、描边 2px；补 hover/active/focus-visible/.is-disabled。\n    依据：控件/Icon/24px/跳转（borders #909399 2px）\n11.【分割线】改用语义化 <hr class=\"c-divider\">，颜色 Line01 #EBEBEB、1px。依据：控件/分割线（#EBEBEB 1px）\n12.【结构语义化】快捷入口由 div 宫格改为 ul/li + 原生 button（.c-stats/.c-stat），\n    活动列表改为 ul/li + button，活动指标由 span 网格改为 dl/dt/dd 语义结构。\n13.【可访问性】补 lang=\"zh-CN\"、跳过导航链接 .c-skip-link、header/main#main/footer 骨架、\n    h1（导航标题）与 h2（卡片标题）层级、section[aria-labelledby]、\n    所有可点击元素改为原生 button[type=button]（返回、查看社群资料、通知行、活动行、设置按钮、创建活动）、\n    装饰图标与状态栏加 aria-hidden=\"true\" + focusable=\"false\"、\n    头像/缩略图占位块 role=\"img\" + aria-label、徽标数字用 aria-label 在按钮上完整朗读。\n14.【状态类全覆盖】统一状态类命名：.is-disabled / [disabled]（禁用）、.is-loading（加载）、\n    .is-selected（选中）、.is-error（错误），并在按钮 / 快捷入口 / 列表行 / 活动行四类组件全部实现。\n    依据：🏷基础样式 品牌色六态标注「常规 / 悬浮 / 点击 / 一般禁用 / 文字禁用 / 置灰」\n15.【属性书写顺序】统一为 class → id → type → name → role → aria-* → data-* → value/checked/disabled。\n17.【入口精简 + 间距整治】① 删除导航栏右上角「群数据」入口（.c-navbar__action 整个按钮）；\n    ② 删除快捷入口第 4 项「更多管理」，宫格由 repeat(4,1fr) 改为 repeat(3,minmax(0,1fr))；\n       同时修正第 13 条中「群数据 / 4 个快捷入口」的描述。\n    ③ 间距/溢出修复（原稿为写死 height 的 941×1672 版式，实际内容已超出并被裁切）：\n       - .p-card-head    height:181px → min-height:181px + padding:22px 26px（原内容 192px 被裁 11px）\n       - .p-card-stats   height:190px → min-height:190px + padding:18px 0（原内容 195px 被裁 5px）\n       - .p-card-notice  height:203px → min-height:203px + 补下内边距 22px（原为上 22px、下 0）\n       - .p-card-acts    padding 16px 26px 0 → 22px 26px；分割线 margin 12→18；标题与列表间距 8→14\n       - .p-card-set     height:147px → min-height:147px + 补下内边距 22px；设置按钮 56→60px\n       - .p-card-notice .c-cell 56→64px；卡片间距统一为 32px（原 41/42/40/15 不齐）\n    ④ 活动指标从一行四列改为两行两列（repeat(2,minmax(0,1fr))，gap 10px 24px）：\n       原 4 列时「报名数 / 名额」标签折行、数值「126 / 150」因 white-space:nowrap 撑破\n       137px 列宽达 17px；改 2×2 后列宽 278px，标签与数值均单行完整显示。\n    依据：三处写死 height 导致 scrollHeight > clientHeight 实测溢出，修正后全页无溢出。\n18.【社群设置按钮配色】按 2026-10-27 提供截图逐像素实测取色，替换原荟豆色/Danger 方案：\n    - 暂停社群招募：底 #FFF6EE、边框 #F9962B、文字/图标 #FD6E00（橙）\n    - 关闭社群申请：底 #FEEEEF、边框 #FE5C5A、文字/图标 #FC0000（红）；图标由「圆圈叉」\n      改为「实心圆 + 白色感叹号」（与截图一致）\n    - hover/active 为对应浅底加深一档；仅作用于 .c-btn--huidou / .c-btn--danger，\n      全局 --huidou-* / --danger-* 令牌不动（.c-badge、.c-tag--huidou 仍用原值）。\n19.【社群设置二次确认弹窗】新增两个确认弹窗 + 全页首个 <script>（原文件无弹窗组件，\n    样式沿用本页 .c-* 组件体系：卡片圆角/阴影、.c-btn--secondary/.c-btn--primary 按钮对、焦点环）：\n    - .c-mask（遮罩 rgba(0,0,0,.45)，z20）+ .c-dialog（居中卡片，role=dialog/aria-modal），\n      弹窗打开时自动聚焦「确认」，Esc / 遮罩点击 / 取消 均只关闭不改状态；\n    - 暂停社群招募 → 「关闭社群招募」弹窗：确认后按钮文案改「招募已关闭」并置灰\n      （.is-disabled，不可再触发），卡片标题右侧 #set-status 显示「社群招募已关闭」；\n    - 关闭社群申请 → 「关闭社群申请」弹窗：确认后文案改「社群已关闭」置灰，状态位显示「社群已关闭」；\n      两项都关闭时状态位为「社群招募已关闭 · 社群已关闭」；\n    - 两条确认文案按需求原文一字不差。已无头实测：取消/Esc/遮罩/确认/关闭后再点击全链路通过，\n      无 JS 报错、无重复 id、页面无横向溢出。\n20.【群通知删行】删除「活动报名申请」通知行（c-cell + 前置 c-divider），仅保留「新成员申请」；\n    其余功能与样式不动。\n21.【群通知改角标 + 成员列表页】因通知仅剩「新成员申请」一种：整个「群通知」卡片删除，\n    改为「群成员」图标右上角红色数字角标（.c-stat__badge，≥100 由数据侧截断为 99+，当前 3）；\n    点击「群成员」跳转新增页 13.主理人社群成员列表.html，入群申请在该页「待审核成员」区同意/拒绝。\n-->\n\n<script>\n(function(){\n  var ID=\"p12\";\n  var MAP={\"1.主理人中心.html\": \"p1\", \"11.主理人创建社群.html\": \"p11\", \"12.主理人管理社群可基于社群创建活动.html\": \"p12\", \"13.主理人社群成员列表.html\": \"p13\", \"2.申请成为主理人.html\": \"p2\", \"3-1.查看申请记录.html\": \"p31\", \"3.申请提交页面.html\": \"p3\", \"4.主理人发布活动-改版.html\": \"p4\", \"8.主理人查看活动-改版.html\": \"p8\", \"9.活动报名名单-改版.html\": \"p9\"};\n  function go(id){try{parent.postMessage({__demoNav:id},'*');}catch(e){}}\n  window.__demoGo=go;\n  window.__demoBlocked=function(f){alert('「'+f+'」未包含在本次合并的原型范围内');};\n  document.addEventListener('click',function(e){\n    var t=e.target;\n    var a=t&&t.closest?t.closest('a[href]'):null;\n    if(!a)return;\n    var h=a.getAttribute('href')||'';\n    if(!/\\.html(\\?|#|$)/.test(h))return;\n    e.preventDefault();e.stopPropagation();\n    if(MAP[h]){go(MAP[h]);}else{window.__demoBlocked(h);}\n  },true);\n  function allBtns(){return document.querySelectorAll('button,[role=\"button\"],a');}\n  function hookText(txt,id,delay,toast){\n    allBtns().forEach(function(b){\n      if(b.__dh)return;\n      if((b.textContent||'').replace(/\\s+/g,'').indexOf(txt)>-1){\n        b.__dh=1;\n        b.addEventListener('click',function(){setTimeout(function(){\n          if(toast){alert(toast);return;}\n          if(id)go(id);\n        },delay||0);});\n      }\n    });\n  }\n  function hookAria(prefix,id){\n    document.querySelectorAll('[aria-label]').forEach(function(b){\n      if(b.__dh)return;\n      if((b.getAttribute('aria-label')||'').indexOf(prefix)===0){\n        b.__dh=1;\n        b.addEventListener('click',function(){go(id);});\n      }\n    });\n  }\n  hookText('创建新活动','p4');\n  var BACK={\"p11\": \"p1\", \"p12\": \"p1\", \"p13\": \"p12\", \"p2\": \"p1\", \"p3\": \"p2\", \"p31\": \"p3\", \"p4\": \"p1\", \"p8\": \"p1\", \"p9\": \"p8\"}[ID];\n  var bk=document.querySelector('.nsk-navbar__back,.c-navbar__back');\n  if(bk&&BACK){bk.addEventListener('click',function(e){e.stopPropagation();e.preventDefault();go(BACK);});}\n  /* 2x 设计板页面（社群系列）按画板宽度等比缩放适配容器 */\n  var BOARD=941;\n  if(BOARD){\n    (function(){\n      var st=document.createElement('style');\n      st.textContent='html{overflow-x:hidden!important}body{margin:0 auto!important;zoom:'+(430/BOARD).toFixed(4)+'}';\n      document.head.appendChild(st);\n      var lastW=-1;\n      function fit(){\n        var w=document.documentElement.clientWidth||window.innerWidth||0;\n        if(w>0&&w!==lastW){\n          lastW=w;\n          document.body.style.zoom=(w/BOARD).toFixed(4);\n        }\n      }\n      window.__demoFit=fit;\n      fit();\n      window.addEventListener('resize',fit);\n      window.addEventListener('load',fit);\n      if(window.ResizeObserver){try{new ResizeObserver(fit).observe(document.documentElement);}catch(e){}}\n      /* 轮询自愈：任何事件时机漏掉（如 iframe 隐藏期未量到宽度）都会在下一拍补上 */\n      setInterval(fit,200);\n    })();\n  }\n})();\n<\/script>\n<\/body>\n<\/html>\n"
  },
  "p13": {
    "title": "社群成员列表",
    "html": "<!DOCTYPE html>\n<html lang=\"zh-CN\">\n<head>\n<meta charset=\"UTF-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n<title>社群成员列表<\/title>\n<!--\n  组件规范来源：one蛇口组件系统.sketch\n  页面缩放系数 --scale = 941 / 750 = 1.255（标准稿基于 750 画布，本页 941）\n  属性书写顺序约定：class → id → type → name → role → aria-* → data-* → value/checked/disabled\n-->\n<style>\n/* ============================================================\n   0. 设计令牌 Design Tokens（来源：one蛇口组件系统 / 共享色板，与 12 号页一致）\n   ============================================================ */\n:root{\n  --brand-01:#387DEC;\n  --brand-02:#0855D1;\n  --brand-03:#9BBEF5;\n  --brand-04:#E0ECFF;\n  --text-01:#303133;\n  --text-02:#909399;\n  --text-03:#C0C4CC;\n  --text-04:#FFFFFF;\n  --line-01:#EBEBEB;\n  --bg-page:#F2F5F7;\n  --bg-card:#FFFFFF;\n  --success-01:#10A17C;\n  --success-02:#E6F7F2;\n  --danger-01:#EB4A38;\n  --danger-02:#FDECEA;\n  --brand-hover:#2F6FDC;\n  --brand-active:var(--brand-02);\n  --brand-disabled:var(--brand-03);\n  --focus-ring:var(--brand-03);\n  --font-cn:\"PingFang SC\",\"Helvetica Neue\",\"Hiragino Sans GB\",\"Microsoft YaHei\",sans-serif;\n  --font-num:\"Source Han Sans SC\",\"PingFang SC\",\"Helvetica Neue\",sans-serif;\n  --scale:1.255;\n  --fs-h1:calc(36px * var(--scale));\n  --fs-title:calc(32px * var(--scale));\n  --fs-body:calc(28px * var(--scale));\n  --fs-sub:calc(24px * var(--scale));\n  --fs-min:calc(20px * var(--scale));\n  --fs-tag:calc(22px * var(--scale));\n  --lh-title:1.375;\n  --lh-body:1.43;\n  --radius-card:calc(24px * var(--scale));\n  --radius-field:calc(16px * var(--scale));\n  --radius-tag:calc(8px * var(--scale));\n  --radius-pill:999px;\n  --shadow-card:0 1px 6px rgba(0,0,0,.06);\n}\n\n/* 1. 基础重置与页面骨架 */\n*{margin:0;padding:0;box-sizing:border-box;-webkit-font-smoothing:antialiased}\nbody{\n  font-family:var(--font-cn);\n  font-size:var(--fs-body);\n  line-height:var(--lh-body);\n  color:var(--text-01);\n  background:var(--bg-page);\n  width:941px;margin:0 auto;\n}\n.l-page{display:flex;flex-direction:column;min-height:1800px;overflow-x:hidden;position:relative}\n.l-main{flex:1;min-height:0;padding:0 24px;display:flex;flex-direction:column}\n.c-skip-link{position:absolute;left:-9999px;top:0;z-index:99;background:var(--brand-01);color:var(--text-04);padding:8px 16px;border-radius:8px}\n.c-skip-link:focus{left:16px;top:16px}\n\n/* 2. 组件（与 12 号页同源：状态栏 / 导航栏 / 图标按钮 / 头像） */\n.c-statusbar{height:88px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:0 56px 0 64px;background:var(--bg-page)}\n.c-statusbar__time{font-family:var(--font-num);font-size:30px;font-weight:600;color:var(--text-01)}\n.c-statusbar__icons{display:flex;align-items:center;gap:14px}\n.c-navbar{height:94px;flex:none;display:flex;align-items:center;padding:0 36px;position:relative;background:var(--bg-page)}\n.c-navbar__back{width:60px;display:flex;align-items:center;justify-content:flex-start}\n.c-navbar__title{position:absolute;left:0;right:0;text-align:center;font-size:var(--fs-title);line-height:var(--lh-title);font-weight:600;color:var(--text-01)}\n.c-iconbtn{border:0;background:transparent;padding:0;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;border-radius:8px;transition:opacity .18s}\n.c-iconbtn:hover{opacity:.6}\n.c-iconbtn:active{opacity:.4}\n.c-iconbtn:focus-visible{outline:3px solid var(--focus-ring);outline-offset:2px}\n.c-avatar{width:130px;height:130px;flex:none;border-radius:50%;background:radial-gradient(circle at 35% 35%,#9CC29A 0%,#6E9E6C 40%,#42663F 100%)}\n.c-avatar--blue{background:radial-gradient(circle at 35% 35%,#8FB6F2 0%,#5E93DD 40%,#2F62A8 100%)}\n.c-avatar--orange{background:radial-gradient(circle at 35% 35%,#F2C48F 0%,#E09B55 40%,#A86528 100%)}\n.c-avatar--teal{background:radial-gradient(circle at 35% 35%,#8FD8CC 0%,#55B3A4 40%,#2A7A6E 100%)}\n.c-avatar--purple{background:radial-gradient(circle at 35% 35%,#C4A8E8 0%,#9674C9 40%,#5F3F96 100%)}\n.c-avatar--grey{background:radial-gradient(circle at 35% 35%,#C9CED8 0%,#9AA3B3 40%,#66708A 100%)}\n.c-divider{height:1px;border:0;background:var(--line-01)}\n\n/* ============================================================\n   3. 页面级：成员列表弹层（参考截图弹层版式）\n   ============================================================ */\n.p-sheet{flex:1;display:flex;flex-direction:column;background:var(--bg-card);border-radius:var(--radius-card);box-shadow:var(--shadow-card);margin:12px 6px 0;padding:38px 30px 30px}\n.p-memhead{display:flex;align-items:flex-start;gap:20px}\n.p-memhead__titles{flex:1;min-width:0}\n.p-memtitle{font-size:var(--fs-h1);line-height:1.3;font-weight:700;color:var(--text-01)}\n.p-memtitle .cnt{font-family:var(--font-num);font-size:var(--fs-sub);font-weight:400;color:var(--text-02);margin-left:14px}\n.p-memsub{margin-top:8px;font-size:var(--fs-sub);color:var(--text-02)}\n.p-closebtn{flex:none;width:58px;height:58px;border:0;border-radius:50%;background:#F2F4F7;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;transition:background-color .18s}\n.p-closebtn:hover{background:#E8EBF0}\n.p-closebtn:active{background:#E0E4EA}\n.p-closebtn:focus-visible{outline:3px solid var(--focus-ring);outline-offset:2px}\n\n.p-search{margin-top:30px;height:80px;display:flex;align-items:center;gap:16px;padding:0 28px;background:#F5F6F8;border-radius:var(--radius-pill)}\n.p-search svg{flex:none;color:var(--text-02)}\n.p-search input{flex:1;min-width:0;border:0;background:transparent;font-family:var(--font-cn);font-size:var(--fs-sub);color:var(--text-01)}\n.p-search input::placeholder{color:var(--text-03)}\n.p-search input:focus{outline:none}\n.p-search:focus-within{outline:3px solid var(--focus-ring);outline-offset:-2px}\n\n.p-grouplab{margin-top:38px;display:flex;align-items:baseline;font-size:var(--fs-sub);color:var(--text-02)}\n.p-grouplab .num{margin-left:auto;font-family:var(--font-num);font-size:var(--fs-sub);color:var(--text-02)}\n\n/* 待审核成员 / 社群成员 通用行 */\n.p-members{list-style:none;margin-top:6px}\n.p-members li{display:flex;align-items:center;gap:24px;padding:26px 0}\n.p-members li+li{border-top:1px solid var(--line-01)}\n.p-members .c-avatar{width:110px;height:110px}\n.p-memb__body{flex:1;min-width:0;display:flex;flex-direction:column;gap:8px}\n.p-memb__name{font-size:var(--fs-body);font-weight:600;color:var(--text-01)}\n.p-memb__meta{font-size:var(--fs-min);color:var(--text-02)}\n.p-memb__side{margin-left:auto;display:flex;align-items:center;gap:18px;flex:none}\n.p-hotflag{font-size:var(--fs-min);color:var(--success-01)}\n.p-arrow{color:var(--text-02)}\n\n/* 待审核操作按钮 */\n.p-actbtns{margin-left:auto;display:flex;gap:16px;flex:none}\n.p-btn{height:64px;padding:0 30px;border-radius:var(--radius-pill);font-family:var(--font-cn);font-size:var(--fs-sub);font-weight:600;cursor:pointer;transition:background-color .18s,border-color .18s,color .18s}\n.p-btn--ok{border:0;background:var(--brand-01);color:var(--text-04)}\n.p-btn--ok:hover{background:var(--brand-hover)}\n.p-btn--ok:active{background:var(--brand-active)}\n.p-btn--no{border:2px solid #C9CDD6;background:var(--bg-card);color:var(--text-01)}\n.p-btn--no:hover{border-color:var(--text-02);color:var(--text-02)}\n.p-btn:active{opacity:.85}\n.p-btn:focus-visible{outline:3px solid var(--focus-ring);outline-offset:2px}\n.p-empty{padding:34px 0;text-align:center;font-size:var(--fs-sub);color:var(--text-03)}\n\n/* 底部隐私提示 */\n.p-footnote{margin-top:auto;padding-top:44px;text-align:center;font-size:var(--fs-min);line-height:1.9;color:var(--text-03)}\n.p-footnote .shield{display:inline-flex;vertical-align:-4px;margin-right:10px;color:var(--text-03)}\n<\/style>\n<\/head>\n<body>\n\n<a class=\"c-skip-link\" href=\"#main\">跳到主要内容<\/a>\n\n<div class=\"l-page\">\n\n  <div class=\"c-statusbar\" aria-hidden=\"true\">\n    <span class=\"c-statusbar__time\">9:41<\/span>\n    <span class=\"c-statusbar__icons\">\n      <svg width=\"34\" height=\"26\" viewBox=\"0 0 34 26\" fill=\"none\" focusable=\"false\"><path d=\"M17 22.5l4.8-5.6a7.6 7.6 0 0 0-9.6 0L17 22.5z\" fill=\"#303133\"/><path d=\"M9.4 13.7a11.6 11.6 0 0 1 15.2 0\" stroke=\"#303133\" stroke-width=\"2.6\" stroke-linecap=\"round\"/><path d=\"M5 9a17.6 17.6 0 0 1 24 0\" stroke=\"#303133\" stroke-width=\"2.6\" stroke-linecap=\"round\"/><\/svg>\n      <svg width=\"52\" height=\"26\" viewBox=\"0 0 52 26\" fill=\"none\" focusable=\"false\"><rect x=\"1\" y=\"1\" width=\"42\" height=\"24\" rx=\"7\" stroke=\"#303133\" stroke-opacity=\".4\" stroke-width=\"2\"/><rect x=\"4\" y=\"4\" width=\"33\" height=\"18\" rx=\"4\" fill=\"#303133\"/><path d=\"M46 9v8a4.5 4.5 0 0 0 0-8z\" fill=\"#303133\" fill-opacity=\".5\"/><\/svg>\n    <\/span>\n  <\/div>\n\n  <!-- 导航栏 -->\n  <header class=\"c-navbar\">\n    <button class=\"c-iconbtn c-navbar__back\" id=\"btn-back\" type=\"button\" aria-label=\"返回社群管理页\">\n      <svg width=\"24\" height=\"40\" viewBox=\"0 0 25 42\" fill=\"none\" aria-hidden=\"true\" focusable=\"false\"><path d=\"M22 4L4 21l18 17\" stroke=\"#303133\" stroke-width=\"4.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><\/svg>\n    <\/button>\n    <h1 class=\"c-navbar__title\">招商玺社群管理<\/h1>\n  <\/header>\n\n  <main class=\"l-main\" id=\"main\">\n\n    <!-- 成员列表弹层 -->\n    <section class=\"p-sheet\" aria-label=\"社群成员列表\">\n      <div class=\"p-memhead\">\n        <div class=\"p-memhead__titles\">\n          <h2 class=\"p-memtitle\">社群成员<span class=\"cnt\" id=\"cnt-title\">112人<\/span><\/h2>\n          <p class=\"p-memsub\">一起认识热爱飞盘的邻居<\/p>\n        <\/div>\n        <button class=\"p-closebtn\" id=\"btn-close\" type=\"button\" aria-label=\"关闭成员列表，返回社群管理页\">\n          <svg width=\"26\" height=\"26\" viewBox=\"0 0 26 26\" fill=\"none\" aria-hidden=\"true\" focusable=\"false\"><path d=\"M4 4l18 18M22 4L4 22\" stroke=\"#303133\" stroke-width=\"3.2\" stroke-linecap=\"round\"/><\/svg>\n        <\/button>\n      <\/div>\n\n      <div class=\"p-search\">\n        <svg width=\"30\" height=\"30\" viewBox=\"0 0 30 30\" fill=\"none\" aria-hidden=\"true\" focusable=\"false\"><circle cx=\"13\" cy=\"13\" r=\"9\" stroke=\"currentColor\" stroke-width=\"2.6\"/><path d=\"M20 20l6 6\" stroke=\"currentColor\" stroke-width=\"2.6\" stroke-linecap=\"round\"/><\/svg>\n        <input type=\"search\" id=\"mem-search\" placeholder=\"搜索成员\" aria-label=\"搜索成员\">\n      <\/div>\n\n      <!-- 待审核成员（新申请展示在最上方，可直接同意/拒绝） -->\n      <h3 class=\"p-grouplab\" id=\"lab-pending\">待审核成员<span class=\"num\" id=\"cnt-pending\">共3人<\/span><\/h3>\n      <ul class=\"p-members\" id=\"pending-list\" aria-labelledby=\"lab-pending\">\n        <li data-name=\"王小雨\">\n          <span class=\"c-avatar c-avatar--blue\" role=\"img\" aria-label=\"王小雨头像\"><\/span>\n          <span class=\"p-memb__body\">\n            <span class=\"p-memb__name\">王小雨<\/span>\n            <span class=\"p-memb__meta\">今天 10:24 申请加入<\/span>\n          <\/span>\n          <span class=\"p-actbtns\">\n            <button class=\"p-btn p-btn--no\" type=\"button\" data-act=\"reject\" aria-label=\"拒绝王小雨加入社群\">拒绝<\/button>\n            <button class=\"p-btn p-btn--ok\" type=\"button\" data-act=\"approve\" aria-label=\"同意王小雨加入社群\">同意<\/button>\n          <\/span>\n        <\/li>\n        <li data-name=\"刘志强\">\n          <span class=\"c-avatar c-avatar--teal\" role=\"img\" aria-label=\"刘志强头像\"><\/span>\n          <span class=\"p-memb__body\">\n            <span class=\"p-memb__name\">刘志强<\/span>\n            <span class=\"p-memb__meta\">昨天 18:03 申请加入<\/span>\n          <\/span>\n          <span class=\"p-actbtns\">\n            <button class=\"p-btn p-btn--no\" type=\"button\" data-act=\"reject\" aria-label=\"拒绝刘志强加入社群\">拒绝<\/button>\n            <button class=\"p-btn p-btn--ok\" type=\"button\" data-act=\"approve\" aria-label=\"同意刘志强加入社群\">同意<\/button>\n          <\/span>\n        <\/li>\n        <li data-name=\"何佳佳\">\n          <span class=\"c-avatar c-avatar--purple\" role=\"img\" aria-label=\"何佳佳头像\"><\/span>\n          <span class=\"p-memb__body\">\n            <span class=\"p-memb__name\">何佳佳<\/span>\n            <span class=\"p-memb__meta\">07.12 09:15 申请加入<\/span>\n          <\/span>\n          <span class=\"p-actbtns\">\n            <button class=\"p-btn p-btn--no\" type=\"button\" data-act=\"reject\" aria-label=\"拒绝何佳佳加入社群\">拒绝<\/button>\n            <button class=\"p-btn p-btn--ok\" type=\"button\" data-act=\"approve\" aria-label=\"同意何佳佳加入社群\">同意<\/button>\n          <\/span>\n        <\/li>\n      <\/ul>\n\n      <!-- 社群成员 -->\n      <h3 class=\"p-grouplab\" id=\"lab-members\">社群成员<span class=\"num\" id=\"cnt-members\">共111人<\/span><\/h3>\n      <ul class=\"p-members\" id=\"member-list\" aria-labelledby=\"lab-members\">\n        <li data-name=\"林*\">\n          <span class=\"c-avatar c-avatar--grey\" role=\"img\" aria-label=\"林*头像\"><\/span>\n          <span class=\"p-memb__body\">\n            <span class=\"p-memb__name\">林*<\/span>\n            <span class=\"p-memb__meta\">已参加8场活动<\/span>\n          <\/span>\n          <span class=\"p-memb__side\">\n            <span class=\"p-hotflag\">活跃成员<\/span>\n            <svg class=\"p-arrow\" width=\"14\" height=\"24\" viewBox=\"0 0 16 28\" fill=\"none\" aria-hidden=\"true\" focusable=\"false\"><path d=\"M3 3l10 11L3 25\" stroke=\"currentColor\" stroke-width=\"3.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><\/svg>\n          <\/span>\n        <\/li>\n        <li data-name=\"陈**\">\n          <span class=\"c-avatar c-avatar--orange\" role=\"img\" aria-label=\"陈**头像\"><\/span>\n          <span class=\"p-memb__body\">\n            <span class=\"p-memb__name\">陈**<\/span>\n            <span class=\"p-memb__meta\">已参加6场活动<\/span>\n          <\/span>\n          <span class=\"p-memb__side\">\n            <svg class=\"p-arrow\" width=\"14\" height=\"24\" viewBox=\"0 0 16 28\" fill=\"none\" aria-hidden=\"true\" focusable=\"false\"><path d=\"M3 3l10 11L3 25\" stroke=\"currentColor\" stroke-width=\"3.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><\/svg>\n          <\/span>\n        <\/li>\n        <li data-name=\"周**\">\n          <span class=\"c-avatar c-avatar--teal\" role=\"img\" aria-label=\"周**头像\"><\/span>\n          <span class=\"p-memb__body\">\n            <span class=\"p-memb__name\">周**<\/span>\n            <span class=\"p-memb__meta\">加入社群12天<\/span>\n          <\/span>\n          <span class=\"p-memb__side\">\n            <svg class=\"p-arrow\" width=\"14\" height=\"24\" viewBox=\"0 0 16 28\" fill=\"none\" aria-hidden=\"true\" focusable=\"false\"><path d=\"M3 3l10 11L3 25\" stroke=\"currentColor\" stroke-width=\"3.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><\/svg>\n          <\/span>\n        <\/li>\n        <li data-name=\"顾*\">\n          <span class=\"c-avatar c-avatar--purple\" role=\"img\" aria-label=\"顾*头像\"><\/span>\n          <span class=\"p-memb__body\">\n            <span class=\"p-memb__name\">顾*<\/span>\n            <span class=\"p-memb__meta\">已参加4场活动<\/span>\n          <\/span>\n          <span class=\"p-memb__side\">\n            <svg class=\"p-arrow\" width=\"14\" height=\"24\" viewBox=\"0 0 16 28\" fill=\"none\" aria-hidden=\"true\" focusable=\"false\"><path d=\"M3 3l10 11L3 25\" stroke=\"currentColor\" stroke-width=\"3.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><\/svg>\n          <\/span>\n        <\/li>\n        <li data-name=\"宋**\">\n          <span class=\"c-avatar c-avatar--blue\" role=\"img\" aria-label=\"宋**头像\"><\/span>\n          <span class=\"p-memb__body\">\n            <span class=\"p-memb__name\">宋**<\/span>\n            <span class=\"p-memb__meta\">已参加3场活动<\/span>\n          <\/span>\n          <span class=\"p-memb__side\">\n            <svg class=\"p-arrow\" width=\"14\" height=\"24\" viewBox=\"0 0 16 28\" fill=\"none\" aria-hidden=\"true\" focusable=\"false\"><path d=\"M3 3l10 11L3 25\" stroke=\"currentColor\" stroke-width=\"3.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><\/svg>\n          <\/span>\n        <\/li>\n        <li data-name=\"陆*\">\n          <span class=\"c-avatar c-avatar--grey\" role=\"img\" aria-label=\"陆*头像\"><\/span>\n          <span class=\"p-memb__body\">\n            <span class=\"p-memb__name\">陆*<\/span>\n            <span class=\"p-memb__meta\">已参加7场活动<\/span>\n          <\/span>\n          <span class=\"p-memb__side\">\n            <svg class=\"p-arrow\" width=\"14\" height=\"24\" viewBox=\"0 0 16 28\" fill=\"none\" aria-hidden=\"true\" focusable=\"false\"><path d=\"M3 3l10 11L3 25\" stroke=\"currentColor\" stroke-width=\"3.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><\/svg>\n          <\/span>\n        <\/li>\n      <\/ul>\n\n      <p class=\"p-footnote\">\n        <svg class=\"shield\" width=\"24\" height=\"28\" viewBox=\"0 0 24 28\" fill=\"none\" aria-hidden=\"true\" focusable=\"false\"><path d=\"M12 1.5l9.5 3.6v8.2c0 6.4-4 11-9.5 13.2C6.5 24.3 2.5 19.7 2.5 13.3V5.1L12 1.5z\" stroke=\"currentColor\" stroke-width=\"2.2\" stroke-linejoin=\"round\"/><path d=\"M8.5 13.5l2.6 2.6 4.8-5.2\" stroke=\"currentColor\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><\/svg>仅展示成员已公开的信息<br>继续下滑查看更多成员\n      <\/p>\n    <\/section>\n\n  <\/main>\n\n<\/div>\n\n<script>\n/* 成员列表页交互（原型演示，数据为静态占位）：\n   - 待审核成员：同意 → 插入「社群成员」最上方并更新人数；拒绝 → 仅移除；\n     待审清空后该区显示「暂无待审核成员」。\n   - 同意 / 拒绝的最终落库由后端完成，此处只维护页面演示状态。 */\n(function(){\n  var pendingList = document.getElementById('pending-list');\n  var memberList  = document.getElementById('member-list');\n  var cntTitle    = document.getElementById('cnt-title');\n  var cntPending  = document.getElementById('cnt-pending');\n  var cntMembers  = document.getElementById('cnt-members');\n  var labPending  = document.getElementById('lab-pending');\n\n  /* 成员总数为数字状态（列表区仅展示部分演示数据，不能用 DOM 行数当总数） */\n  var state = { pending: 3, members: 111 };\n\n  function goBack(){ __demoGo(\"p12\"); }\n  document.getElementById('btn-back').addEventListener('click', goBack);\n  document.getElementById('btn-close').addEventListener('click', goBack);\n\n  function refreshCounts(){\n    var domPending = pendingList.querySelectorAll('li[data-name]').length;\n    cntPending.textContent = '共' + domPending + '人';\n    cntMembers.textContent = '共' + state.members + '人';\n    cntTitle.textContent = (state.members + 1) + '人'; /* +1 为主理人 */\n    if (domPending === 0){\n      pendingList.innerHTML = '<li class=\"p-empty\" style=\"border-top:0\">暂无待审核成员<\/li>';\n      labPending.setAttribute('aria-disabled', 'true');\n    }\n  }\n\n  pendingList.addEventListener('click', function(e){\n    var btn = e.target.closest('button[data-act]');\n    if (!btn){ return; }\n    var li = btn.closest('li');\n    var name = li.getAttribute('data-name');\n    if (btn.getAttribute('data-act') === 'approve'){\n      state.members++;\n      /* 同意：插入社群成员最上方，初始文案「刚刚加入」 */\n      var row = document.createElement('li');\n      row.setAttribute('data-name', name);\n      row.innerHTML =\n        '<span class=\"c-avatar\" role=\"img\" aria-label=\"' + name + '头像\"><\/span>' +\n        '<span class=\"p-memb__body\">' +\n          '<span class=\"p-memb__name\">' + name + '<\/span>' +\n          '<span class=\"p-memb__meta\">刚刚加入<\/span>' +\n        '<\/span>' +\n        '<span class=\"p-memb__side\">' +\n          '<svg class=\"p-arrow\" width=\"14\" height=\"24\" viewBox=\"0 0 16 28\" fill=\"none\" aria-hidden=\"true\" focusable=\"false\"><path d=\"M3 3l10 11L3 25\" stroke=\"currentColor\" stroke-width=\"3.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><\/svg>' +\n        '<\/span>';\n      memberList.insertBefore(row, memberList.firstChild);\n    }\n    li.remove();\n    refreshCounts();\n  });\n})();\n<\/script>\n\n<!--\n================================================================\n本次修改点（依据：one蛇口组件系统.sketch）\n================================================================\n1.【新增页面】社群成员列表（主理人侧）：由 12 号页「群成员」快捷入口进入，\n   返回 / 关闭（右上 ×）均回到 12 号页。\n2.【版式】按参考截图做弹层式白卡：标题「社群成员 112人」+ 副标题 + 右上圆形关闭钮、\n   搜索成员输入框；主理人信息块已按要求删除（2026-10-28），分区直接从「待审核成员」开始。\n3.【待审核成员】位于主理人与社群成员之间：新申请置顶展示（姓名 + 申请时间），\n   行内直接提供「拒绝」（灰描边）/「同意」（品牌实心）按钮；\n   同意 → 插入社群成员最上方（文案「刚刚加入」）并同步更新标题/分区人数；\n   拒绝 → 仅移除；待审清空后显示「暂无待审核成员」。\n4.【社群成员】姓名脱敏 + 动态/活跃副文案 + 活跃成员绿标 + 跳转箭头；\n   底部固定隐私提示「仅展示成员已公开的信息 / 继续下滑查看更多成员」。\n5.【数据】成员与申请人均为静态模拟数据；名单 / 搜索过滤后续接入接口时替换。\n-->\n\n<script>\n(function(){\n  var ID=\"p13\";\n  var MAP={\"1.主理人中心.html\": \"p1\", \"11.主理人创建社群.html\": \"p11\", \"12.主理人管理社群可基于社群创建活动.html\": \"p12\", \"13.主理人社群成员列表.html\": \"p13\", \"2.申请成为主理人.html\": \"p2\", \"3-1.查看申请记录.html\": \"p31\", \"3.申请提交页面.html\": \"p3\", \"4.主理人发布活动-改版.html\": \"p4\", \"8.主理人查看活动-改版.html\": \"p8\", \"9.活动报名名单-改版.html\": \"p9\"};\n  function go(id){try{parent.postMessage({__demoNav:id},'*');}catch(e){}}\n  window.__demoGo=go;\n  window.__demoBlocked=function(f){alert('「'+f+'」未包含在本次合并的原型范围内');};\n  document.addEventListener('click',function(e){\n    var t=e.target;\n    var a=t&&t.closest?t.closest('a[href]'):null;\n    if(!a)return;\n    var h=a.getAttribute('href')||'';\n    if(!/\\.html(\\?|#|$)/.test(h))return;\n    e.preventDefault();e.stopPropagation();\n    if(MAP[h]){go(MAP[h]);}else{window.__demoBlocked(h);}\n  },true);\n  function allBtns(){return document.querySelectorAll('button,[role=\"button\"],a');}\n  function hookText(txt,id,delay,toast){\n    allBtns().forEach(function(b){\n      if(b.__dh)return;\n      if((b.textContent||'').replace(/\\s+/g,'').indexOf(txt)>-1){\n        b.__dh=1;\n        b.addEventListener('click',function(){setTimeout(function(){\n          if(toast){alert(toast);return;}\n          if(id)go(id);\n        },delay||0);});\n      }\n    });\n  }\n  function hookAria(prefix,id){\n    document.querySelectorAll('[aria-label]').forEach(function(b){\n      if(b.__dh)return;\n      if((b.getAttribute('aria-label')||'').indexOf(prefix)===0){\n        b.__dh=1;\n        b.addEventListener('click',function(){go(id);});\n      }\n    });\n  }\n  \n  var BACK={\"p11\": \"p1\", \"p12\": \"p1\", \"p13\": \"p12\", \"p2\": \"p1\", \"p3\": \"p2\", \"p31\": \"p3\", \"p4\": \"p1\", \"p8\": \"p1\", \"p9\": \"p8\"}[ID];\n  var bk=document.querySelector('.nsk-navbar__back,.c-navbar__back');\n  if(bk&&BACK){bk.addEventListener('click',function(e){e.stopPropagation();e.preventDefault();go(BACK);});}\n  /* 2x 设计板页面（社群系列）按画板宽度等比缩放适配容器 */\n  var BOARD=941;\n  if(BOARD){\n    (function(){\n      var st=document.createElement('style');\n      st.textContent='html{overflow-x:hidden!important}body{margin:0 auto!important;zoom:'+(430/BOARD).toFixed(4)+'}';\n      document.head.appendChild(st);\n      var lastW=-1;\n      function fit(){\n        var w=document.documentElement.clientWidth||window.innerWidth||0;\n        if(w>0&&w!==lastW){\n          lastW=w;\n          document.body.style.zoom=(w/BOARD).toFixed(4);\n        }\n      }\n      window.__demoFit=fit;\n      fit();\n      window.addEventListener('resize',fit);\n      window.addEventListener('load',fit);\n      if(window.ResizeObserver){try{new ResizeObserver(fit).observe(document.documentElement);}catch(e){}}\n      /* 轮询自愈：任何事件时机漏掉（如 iframe 隐藏期未量到宽度）都会在下一拍补上 */\n      setInterval(fit,200);\n    })();\n  }\n})();\n<\/script>\n<\/body>\n<\/html>\n"
  }
}
var ORDER=['p1','p2','p3','p31','p4','p8','p9','p11','p12','p13'];
var GROUPS=[
  {name:'身份认证链路',ids:['p1','p2','p3','p31']},
  {name:'活动经营链路',ids:['p4','p8','p9']},
  {name:'社群经营链路',ids:['p11','p12','p13']}
];
var frames={},current=null;
var box=document.getElementById('frames');
ORDER.forEach(function(id){
  var f=document.createElement('iframe');
  f.className='page-frame';
  f.setAttribute('title',PAGES[id].title);
  f.srcdoc=PAGES[id].html;
  box.appendChild(f);
  frames[id]=f;
});
function show(id,push){
  if(!PAGES[id]||current===id)return;
  if(current)frames[current].classList.remove('on');
  frames[id].classList.add('on');
  current=id;
  try{if(frames[id].contentWindow.__demoFit){frames[id].contentWindow.__demoFit();}}catch(e){}
  document.getElementById('cur').textContent=PAGES[id].title;
  renderToc();
  if(push!==false){try{history.pushState({id:id},'');}catch(e){}}
}
window.addEventListener('message',function(ev){
  var d=ev.data;
  if(d&&d.__demoNav){show(d.__demoNav);}
});
window.addEventListener('popstate',function(ev){
  show((ev.state&&ev.state.id)||'p1',false);
});
var toc=document.getElementById('toc'),mask=document.getElementById('mask');
function renderToc(){
  var h='',n=1;
  GROUPS.forEach(function(g){
    h+='<h2>'+g.name+'</h2>';
    g.ids.forEach(function(id){
      h+='<button class="item'+(id===current?' on':'')+'" data-id="'+id+'"><span class="no">'+(n++)+'</span>'+PAGES[id].title+'</button>';
    });
  });
  h+='<div class="tip"><b>走查提示</b><br>· 从「主理人中心」点击 发布活动 / 创建社群 / 活动卡片 / 社群卡片 直接进入对应页面<br>· 中心页顶部状态条可切换 未认证 / 审核中 等状态，体验「立即申请 → 申请记录」链路<br>· 各页返回键 / 提交按钮已串联跳转，浏览器返回键亦可回退</div>';
  toc.innerHTML=h;
}
toc.addEventListener('click',function(e){
  var b=e.target.closest('.item');
  if(!b)return;
  show(b.getAttribute('data-id'));
  closeToc();
});
function openToc(){toc.classList.add('on');mask.classList.add('on');}
function closeToc(){toc.classList.remove('on');mask.classList.remove('on');}
document.getElementById('toc-open').addEventListener('click',openToc);
mask.addEventListener('click',closeToc);
document.addEventListener('keydown',function(e){if(e.key==='Escape')closeToc();});
renderToc();
show('p1',false);
try{history.replaceState({id:'p1'},'');}catch(e){}
</script>
</body>
</html>
