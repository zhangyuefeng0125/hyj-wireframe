<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>客户端社群主页 · 加入社群</title>
<link rel="stylesheet" href="theme.css">
</head>
<body>
<div class="stage">
<div class="phone">

  <!-- ============ 底层：社群主页（遮罩下，滚动至底部） ============ -->
  <header>
    <div class="statusbar">
      <span>9:41</span>
      <span class="statusbar__icons">
        <svg width="17" height="11" viewBox="0 0 17 11" fill="currentColor"><rect x="0" y="7.5" width="3" height="3.5" rx="1"/><rect x="4.6" y="5.4" width="3" height="5.6" rx="1"/><rect x="9.2" y="3" width="3" height="8" rx="1"/><rect x="13.8" y="0" width="3" height="11" rx="1" opacity=".4"/></svg>
        <svg width="16" height="11" viewBox="0 0 16 11" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"><path d="M1 4.1a10 10 0 0 1 14 0"/><path d="M3.6 6.8a6.4 6.4 0 0 1 8.8 0"/><circle cx="8" cy="9.6" r=".9" fill="currentColor" stroke="none"/></svg>
        <svg width="25" height="12" viewBox="0 0 25 12" fill="none"><rect x=".6" y=".6" width="21" height="10.8" rx="3" stroke="currentColor" stroke-opacity=".45" stroke-width="1.1"/><rect x="2.2" y="2.2" width="16.6" height="7.6" rx="1.8" fill="currentColor"/><path d="M23.2 4.1v3.8c.9-.3 1.4-.9 1.4-1.9s-.5-1.6-1.4-1.9Z" fill="currentColor" fill-opacity=".45"/></svg>
      </span>
    </div>
    <nav class="navbar">
      <button class="navbar__back" aria-label="返回"><svg width="20" height="20" viewBox="0 0 20 20"><use href="#i-back"/></svg></button>
      <h1 class="navbar__title">社群主页</h1>
      <div class="capsule">
        <span class="capsule__dots"><i></i><i></i><i></i></span>
        <span class="capsule__div"></span>
        <span class="capsule__target"><svg width="18" height="18" viewBox="0 0 20 20" fill="none" stroke="#18191C" stroke-width="1.5"><circle cx="10" cy="10" r="7.6"/><circle cx="10" cy="10" r="3.4" fill="#18191C" stroke="none"/></svg></span>
      </div>
    </nav>
    <div class="hero" style="background-image:url('assets/hero.jpg')">
      <div class="hero__inner">
        <div class="hero__logo"><img src="assets/logo.jpg" alt="招商玺邻里社群"></div>
        <h2 class="hero__name">招商玺飞盘社<span class="badge-pro">Pro</span></h2>
        <p class="hero__sub">举办了12场活动</p>
      </div>
    </div>
  </header>

  <section class="info-row">
    <article class="info-card">
      <span class="avatar-host"><img src="assets/avatar-host.jpg" alt="谢广坤"><span class="avatar-host__badge"><svg viewBox="0 0 16 16" style="color:#fff"><use href="#i-check"/></svg></span></span>
      <div class="info-card__txt"><div class="info-card__label">主理人</div><div class="info-card__value">谢广坤</div></div>
    </article>
    <article class="info-card">
      <span class="info-card__stack"><img src="assets/mem1.jpg" alt=""><img src="assets/mem2.jpg" alt=""><img src="assets/mem3.jpg" alt=""></span>
      <div class="info-card__txt"><div class="info-card__label">成员</div><div class="info-card__value">112 位</div></div>
    </article>
  </section>

  <section class="panel">
    <div class="sec-head">
      <h3 class="sec-title">Club活动</h3>
      <div class="sec-actions">
        <button class="sec-btn"><svg viewBox="0 0 18 18"><use href="#i-search"/></svg>搜索</button>
        <button class="sec-btn"><svg viewBox="0 0 18 18"><use href="#i-calendar"/></svg>日历</button>
      </div>
    </div>
    <div class="date-row">
      <div class="date-pill date-pill--on"><span class="date-pill__w">全部</span></div>
      <div class="date-pill"><span class="date-pill__w">周一</span><span class="date-pill__d">13</span></div>
      <div class="date-pill"><span class="date-pill__w">周二</span><span class="date-pill__d">14</span></div>
      <div class="date-pill"><span class="date-pill__w">周三</span><span class="date-pill__d">15</span></div>
      <div class="date-pill"><span class="date-pill__w">周四</span><span class="date-pill__d">16</span></div>
      <div class="date-pill"><span class="date-pill__w">周五</span><span class="date-pill__d">17</span></div>
    </div>
    <div class="act-grid">
      <article class="act-card">
        <div class="act-card__media"><img src="assets/act1.jpg" alt="周一飞盘局"></div>
        <h4 class="act-card__title">周一飞盘局</h4>
        <p class="meta-row"><span><svg viewBox="0 0 18 18"><use href="#i-clock"/></svg>07.13 20:30</span><span><svg viewBox="0 0 18 18"><use href="#i-pin"/></svg>14.9km</span></p>
        <p class="meta-sub"><span><svg viewBox="0 0 18 18"><use href="#i-users"/></svg>6人已上车 · 100人想去</span></p>
      </article>
      <article class="act-card">
        <div class="act-card__media"><img src="assets/act2.jpg" alt="周四飞盘局"></div>
        <h4 class="act-card__title">周四飞盘局</h4>
        <p class="meta-row"><span><svg viewBox="0 0 18 18"><use href="#i-clock"/></svg>07.16 20:30</span><span><svg viewBox="0 0 18 18"><use href="#i-pin"/></svg>18.1km</span></p>
        <p class="meta-sub"><span><svg viewBox="0 0 18 18"><use href="#i-users"/></svg>2人已上车 · 28人想去</span></p>
      </article>
    </div>
  </section>

  <section style="padding:0 12px;"><h3 class="sec-title" style="margin-top:16px;">Club瞬间</h3></section>
  <div class="moment-grid">
    <div class="moment"><img src="assets/moment1.jpg" alt=""></div>
    <div class="moment"><img src="assets/moment2.jpg" alt=""></div>
    <div class="moment"><img src="assets/moment3.jpg" alt=""></div>
    <div class="moment"><img src="assets/moment4.jpg" alt=""></div>
    <div class="moment"><img src="assets/moment5.jpg" alt=""></div>
    <div class="moment"><img src="assets/moment6.jpg" alt=""></div>
    <div class="moment"><img src="assets/moment7.jpg" alt=""></div>
    <div class="moment"><img src="assets/moment8.jpg" alt=""></div>
    <div class="moment"><img src="assets/moment9.jpg" alt=""></div>
  </div>
  <a class="more-row" href="#" style="margin-bottom:6px;">全部瞬间<svg viewBox="0 0 14 14"><use href="#i-chev-right"/></svg></a>

  <div class="mask"></div>

  <!-- ============ 加入社群弹层 ============ -->
  <section class="sheet" role="dialog" aria-label="邀请你加入社群">
    <span class="sheet__grip"></span>
    <button class="sheet__close" aria-label="关闭"><svg viewBox="0 0 16 16"><use href="#i-close"/></svg></button>
    <div class="sheet__body">

      <h2 class="poster__invite" style="margin-top:18px;"><span class="q">&quot;</span>邀请你加入社群<span class="q">&quot;</span></h2>

      <div class="join-host">
        <span class="avatar-host">
          <img src="assets/avatar-host.jpg" alt="谢广坤">
          <span class="avatar-host__badge"><svg viewBox="0 0 16 16" style="color:#fff"><use href="#i-check"/></svg></span>
        </span>
        <div class="invite-host__info">
          <p class="invite-host__line"><span class="invite-host__k">主理人</span><span class="invite-host__v">谢广坤</span></p>
          <p class="invite-host__d">飞盘活动发起人 · 已组织12场活动</p>
        </div>
      </div>

      <div class="dashed-sep"></div>

      <h3 class="join-title">添加主理人微信</h3>
      <p class="join-sub">该社群加入方式为「申请审核」，添加后需主理人审核通过方可进入社群</p>

      <div class="join-qr"><img src="assets/qr-wechat.svg" alt="主理人微信二维码" style="width:126px;height:126px;"></div>
      <p class="join-qr-hint">长按识别二维码添加微信</p>

      <div class="join-actions">
        <button class="btn-outline"><svg viewBox="0 0 18 18"><use href="#i-download"/></svg>保存二维码</button>
        <button class="btn-primary"><svg width="17" height="17" viewBox="0 0 18 18" style="color:#fff"><use href="#i-copy"/></svg>复制微信号</button>
      </div>

      <p class="poster__from">来自招商玺飞盘社的邀请</p>
    </div>
  </section>

</div>
</div>

<script src="icons.js"></script>
<script>
  document.querySelector('.sheet__close').addEventListener('click', function(){
    location.href = '1.客户端社群主页.html';
  });
</script>
</body>
</html>
